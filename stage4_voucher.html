<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://pjagaulfivafamhhiveg.supabase.co https://cdn.jsdelivr.net;">
<title>매입매출전표 유형 구분 | 전산회계 1급</title>
<meta name="description" content="실제 기출 거래를 보고 매입매출전표 유형(과세·영세·면세·불공·카과 등)을 맞히는 연습">
<style>
  :root{
    --bg:#020810; --card:#0c1626; --card2:#11203a; --line:rgba(255,255,255,.08);
    --blue:#00f2ff; --purple:#b44fff; --green:#2ecc71; --red:#ff2d78; --gold:#ffd24a;
    --sale:#00f2ff; --buy:#ffab40;
    --txt:#eaf2ff; --dim:rgba(234,242,255,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       padding:0 0 40px; min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;}
  @media (min-width:701px){
    body{background:
      radial-gradient(ellipse 50% 40% at 12% 10%, rgba(0,242,255,0.07), transparent 60%),
      radial-gradient(ellipse 45% 35% at 90% 90%, rgba(255,171,64,0.06), transparent 55%),
      var(--bg);
      display:flex; flex-direction:column; justify-content:center;}
    .wrap{padding-top:16px;max-width:820px;width:100%;}
  }
  .top{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .back{background:var(--card);border:1px solid var(--line);color:var(--txt);
        border-radius:12px;padding:9px 13px;font-size:.92rem;text-decoration:none;flex:none;}
  h1{font-size:1.15rem;margin:0;}
  h1 .sub{display:block;font-size:.72rem;color:var(--dim);font-weight:500;margin-top:3px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .panel h2{font-size:.92rem;margin:0 0 12px;color:var(--blue);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1.5px solid var(--line);background:var(--card2);color:var(--txt);
        border-radius:20px;padding:8px 14px;font-size:.86rem;cursor:pointer;transition:.15s;}
  .chip.on{border-color:var(--blue);background:rgba(0,242,255,.14);color:var(--blue);}
  .chip .cnt{opacity:.5;font-size:.78rem;margin-left:4px;}
  .lens{display:flex;gap:8px;margin-top:10px;}
  .lens .chip{flex:1;text-align:center;}
  .cta{display:block;width:100%;border:none;border-radius:14px;padding:15px;
       font-size:1.05rem;font-weight:700;color:#021;cursor:pointer;
       background:linear-gradient(90deg,var(--blue),var(--green));margin-top:8px;}
  .cta:disabled{opacity:.45;}
  .mini{font-size:.78rem;color:var(--dim);margin-top:10px;line-height:1.5;}
  .legend{display:flex;gap:14px;font-size:.76rem;color:var(--dim);margin-top:12px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

  #quiz{display:none;}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--dim);margin-bottom:10px;}
  .hud b{color:var(--gold);}
  .progress-track{height:6px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;margin-bottom:14px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .3s;}

  .qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;}
  .qtag{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .cat-badge{font-family:ui-monospace,monospace;font-weight:700;font-size:.72rem;letter-spacing:.03em;
    padding:4px 9px;border-radius:6px;}
  .cat-badge.매출{background:rgba(0,242,255,.14);color:var(--sale);border:1px solid rgba(0,242,255,.3);}
  .cat-badge.매입{background:rgba(255,171,64,.14);color:var(--buy);border:1px solid rgba(255,171,64,.3);}
  .qsrc{font-size:.68rem;color:var(--dim);opacity:.6;}
  .qstem{font-size:1.06rem;line-height:1.65;word-break:keep-all;}

  .type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
  .tgroup{margin-bottom:14px;}
  .tgroup:last-child{margin-bottom:0;}
  .tgroup-label{font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--dim);margin-bottom:8px;
    display:flex;align-items:center;gap:6px;}
  .tgroup-label .dot{width:8px;height:8px;border-radius:50%;}
  .tgroup-label.매출 .dot{background:var(--sale);}
  .tgroup-label.매입 .dot{background:var(--buy);}

  .tbtn{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;
    padding:10px 6px;text-align:center;cursor:pointer;transition:.12s;color:var(--txt);}
  .tbtn .code{display:block;font-family:ui-monospace,monospace;font-weight:700;font-size:.92rem;}
  .tbtn .name{display:block;font-size:.74rem;color:var(--dim);margin-top:2px;}
  .tbtn:active{transform:scale(.96);}
  .tbtn[disabled]{cursor:default;}
  .tbtn.correct{border-color:var(--green);background:rgba(46,204,113,.18);}
  .tbtn.correct .name{color:var(--green);}
  .tbtn.wrong{border-color:var(--red);background:rgba(255,45,120,.18);}
  .tbtn.wrong .name{color:var(--red);}
  .tbtn.dim{opacity:.35;}

  .expl{margin-top:14px;padding:14px;border-radius:13px;background:rgba(0,242,255,.07);
        border:1px solid rgba(0,242,255,.22);font-size:.9rem;line-height:1.6;display:none;}
  .expl .verdict{font-weight:700;margin-bottom:6px;font-size:.98rem;}
  .expl .kw{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:7px;
    background:rgba(255,210,74,.14);color:var(--gold);font-size:.8rem;font-weight:700;}
  .next-wrap{margin-top:14px;display:none;}

  #result{display:none;text-align:center;}
  #result .em{font-size:3rem;display:block;margin:8px 0;}
  #result .score{font-size:2.4rem;color:var(--gold);font-weight:800;}
  #result .grade{font-size:1.1rem;margin:6px 0 2px;}
  .res-row{display:flex;justify-content:space-around;margin:18px 0;font-size:.9rem;}
  .res-row .v{font-size:1.4rem;font-weight:700;display:block;}
  .res-note{font-size:.82rem;color:var(--dim);margin-bottom:18px;}
  .btn-row{display:flex;gap:10px;}
  .btn-row a,.btn-row button{flex:1;border-radius:13px;padding:13px;font-size:.92rem;font-weight:600;
      border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;text-decoration:none;text-align:center;}
  .btn-row .primary{border:none;background:linear-gradient(90deg,var(--blue),var(--green));color:#021;}

  /* ── 게임 방법 튜토리얼 ── */
  .guide-btn{display:block;width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;
    font-size:.9rem;font-weight:600;color:var(--dim);background:var(--card2);cursor:pointer;margin-top:8px;text-align:center;}
  .tut{display:none;position:fixed;inset:0;z-index:9999;flex-direction:column;background:var(--bg);}
  .tut.show{display:flex;animation:tutPop .25s ease;}
  @keyframes tutPop{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
  .tut-top{display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;}
  .tut-top .tt-title{font-weight:800;font-size:1.05rem;color:#fff;}
  .tut-top .tt-badge{font-size:.8rem;font-weight:800;color:#fff;background:var(--red);border-radius:50px;padding:3px 12px;}
  .tut-top .tt-skip{margin-left:auto;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.75);
    border-radius:50px;padding:6px 14px;font-size:.8rem;cursor:pointer;}
  .tut-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:6px 16px 0;overflow-y:auto;}
  .tut-stage .qcard{width:100%;max-width:480px;}
  .tut-stage .tgroup{width:100%;max-width:480px;}
  .tut .tbtn.tut-target{position:relative;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,74,.35);animation:tutGlow 1s ease-in-out infinite;}
  @keyframes tutGlow{0%,100%{box-shadow:0 0 0 3px rgba(255,210,74,.35);}50%{box-shadow:0 0 0 7px rgba(255,210,74,.1);}}
  .tut .tbtn.tut-dim{opacity:.3;pointer-events:none;}
  .tut-bubble{background:rgba(0,0,0,.35);border-top:1px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom));}
  .tut-bubble-text{font-size:.98rem;line-height:1.6;color:#e0e6ed;word-break:keep-all;text-align:center;}
  .tut-bubble-text b{color:var(--blue);}
  .tut-hint{text-align:center;font-weight:800;color:var(--gold);font-size:.92rem;margin-top:8px;}
  .tut-next{display:block;width:100%;margin-top:14px;padding:15px;border-radius:14px;border:2px solid rgba(255,255,255,.3);
    background:transparent;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;}

  /* ── TOP 랭킹(결과화면) ── */
  .rank-title{font-size:.72rem;color:rgba(255,255,255,.35);letter-spacing:2px;margin:18px 0 8px;text-align:center;}
  #my-rank-badge{display:none;font-size:.82rem;color:var(--blue);background:rgba(0,242,255,.1);border:1px solid rgba(0,242,255,.3);
    border-radius:50px;padding:6px 16px;margin:0 auto 8px;text-align:center;max-width:max-content;}
  #rank-box{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;max-height:180px;overflow-y:auto;padding:4px 0;text-align:left;}
  .rr-row{display:grid;grid-template-columns:34px 1fr 70px;gap:6px;padding:8px 12px;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.05);align-items:center;}
  .rr-row:last-child{border-bottom:none;}
  .rr-row.me{background:rgba(0,242,255,.08);}
  .rr-num{color:rgba(255,255,255,.35);font-weight:700;}
  .rr-name{color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rr-score{color:var(--gold);text-align:right;font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index_lv1.html">←</a>
    <h1>🧾 매입매출전표 유형 구분 <span class="sub">전산회계 1급 실무 · 기출 거래 기반</span></h1>
  </div>

  <div id="home">
    <div class="panel">
      <h2>① 범위 선택</h2>
      <div class="chips" id="range-chips">
        <div class="chip on" data-range="ALL">전체</div>
        <div class="chip" data-range="매출">매출만</div>
        <div class="chip" data-range="매입">매입만</div>
      </div>
    </div>
    <div class="panel">
      <h2>② 문항 수</h2>
      <div class="lens" id="len-chips">
        <div class="chip on" data-len="10">10문항</div>
        <div class="chip" data-len="20">20문항</div>
        <div class="chip" data-len="0">전체</div>
      </div>
      <button class="cta" id="start-btn">▶ 시작</button>
      <button class="guide-btn" id="guide-btn">📖 게임 방법</button>
      <div class="mini" id="pool-info"></div>
      <div class="legend">
        <span><i style="background:var(--sale)"></i>매출유형(11~2x번)</span>
        <span><i style="background:var(--buy)"></i>매입유형(5x~6x번)</span>
      </div>
    </div>
  </div>

  <div id="quiz">
    <div class="hud">
      <span id="hud-prog">1 / 10</span>
      <span>점수 <b id="hud-score">0</b> · 연속 <b id="hud-combo">0</b></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <div id="quiz-body"></div>
  </div>

  <div id="result"></div>

  <!-- ── 인터랙티브 튜토리얼(게임 방법) ── -->
  <div id="tutorial" class="tut">
    <div class="tut-top">
      <span class="tt-title">📖 게임 방법</span>
      <span class="tt-badge" id="tut-badge">1/5</span>
      <button class="tt-skip" onclick="Tutorial.close()">건너뛰기</button>
    </div>
    <div class="tut-stage">
      <div class="qcard">
        <div class="qtag"><span class="cat-badge 매출">매출</span><span class="qsrc">예시 거래</span></div>
        <div class="qstem" id="tut-q-text"></div>
      </div>
      <div id="tut-parts"></div>
    </div>
    <div class="tut-bubble">
      <div class="tut-bubble-text" id="tut-text"></div>
      <div class="tut-hint" id="tut-hint" style="display:none"></div>
      <button class="tut-next" id="tut-next" onclick="Tutorial.next()">다음 ▶</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wrongnote.js"></script>
<script src="growth.js"></script>
<script>
(function(){ if(!(localStorage.getItem('hub_nickname')||'').trim()){ location.replace('login.html'); } })();

const GAME_ID='voucher_lv1';

/* 전표유형 전체 목록(버튼 그리드용) — 실제 시험에서 쓰는 코드 그대로 */
const SALE_TYPES = [
  ['11','과세'],['12','영세'],['13','면세'],['14','건별'],['16','수출'],['17','카과'],['22','현과'],
];
const BUY_TYPES = [
  ['51','과세'],['52','영세'],['53','면세'],['54','불공'],['55','수입'],['57','카과'],['61','현과'],['62','현면'],
];

let BANK=[], POOL=[], SEL_RANGE='ALL', SEL_LEN=10;

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function load(){
  try{
    const r=await fetch('voucher_bank_lv1.json');
    const d=await r.json();
    BANK=d.questions;
  }catch(e){ document.getElementById('pool-info').textContent='문제 데이터를 불러오지 못했습니다.'; return; }
  renderRangeChips();
  bindStart();
  updatePool();
}

function renderRangeChips(){
  const counts={매출:0,매입:0};
  BANK.forEach(q=>counts[q.category]=(counts[q.category]||0)+1);
  const box=document.getElementById('range-chips');
  box.innerHTML = `
    <div class="chip on" data-range="ALL">전체<span class="cnt">${BANK.length}</span></div>
    <div class="chip" data-range="매출">매출만<span class="cnt">${counts['매출']||0}</span></div>
    <div class="chip" data-range="매입">매입만<span class="cnt">${counts['매입']||0}</span></div>
  `;
  box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); SEL_RANGE=c.dataset.range; updatePool();
  });
  const lb=document.getElementById('len-chips');
  lb.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    lb.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); SEL_LEN=parseInt(c.dataset.len); updatePool();
  });
}

function poolFor(){
  if(SEL_RANGE==='ALL') return BANK.slice();
  return BANK.filter(q=>q.category===SEL_RANGE);
}
function updatePool(){
  POOL=poolFor();
  const n=SEL_LEN===0?POOL.length:Math.min(SEL_LEN,POOL.length);
  document.getElementById('pool-info').textContent=`선택 범위 ${POOL.length}문항 중 ${n}문항 출제 · 틀린 문제는 오답노트에 자동 저장돼요.`;
  document.getElementById('start-btn').disabled=POOL.length===0;
}
function bindStart(){
  document.getElementById('start-btn').onclick=startQuiz;
  document.getElementById('guide-btn').onclick=()=>Tutorial.start();
}

/* =========================================================================
 *  Tutorial — 실제 문제 하나(과세 세금계산서 발급)로 "거래 읽고 유형 버튼 탭"
 *  흐름을 미리 체험시키는 인터랙티브 미니 튜토리얼. game4_factory.html의
 *  Tutorial 엔진과 같은 톤(단계별 말풍선+타겟 하이라이트)이지만, 이 게임은
 *  칸이 하나(유형 버튼 1개 탭)뿐이라 game4의 차변/대변 2단계 로직은 걷어내고 단순화함.
 * ========================================================================= */
const TUT_QUIZ = { stem:'제품을 판매하고 전자세금계산서를 발급하였다.', code:'11' };
const TUT_STEPS = [
  { text:'실제 기출 거래를 읽고, 그 거래가 <b>어느 매입매출전표 유형</b>인지 버튼에서 골라보는 연습이에요.<br>거래 하나로 같이 해볼까요?', btn:'시작 ▶' },
  { text:'제품을 판매하면서 <b>전자세금계산서를 발급</b>했어요. 세금계산서를 발급한 <b>일반 과세매출</b>은 코드 <b>11.과세</b>예요.<br>아래에서 <b>11.과세</b> 버튼을 찾아 눌러보세요.', tap:'11', hint:'👆 빛나는 버튼을 탭!' },
  { text:'정답! 정답마다 <b>+100점</b>, 연속으로 맞히면 <b>콤보 보너스</b>가 붙어서 점수가 더 커져요.', glow:true, btn:'다음 ▶' },
  { text:'틀리면 정답과 해설이 바로 나오고, <b>오답노트</b>에 자동 저장돼서 나중에 다시 볼 수 있어요.', btn:'다음 ▶' },
  { text:'범위(전체/매출만/매입만)와 문항 수를 고르고 시작하면 돼요. 준비됐으면 시작해볼까요?', btn:'시작하기 ▶', finish:true },
];
const Tutorial = (function(){
  let step=0, locked=false, timer=null;
  function el(id){ return document.getElementById(id); }
  function targetBtn(){ return el('tut-parts').querySelector(`[data-code="${TUT_QUIZ.code}"]`); }

  function buildBoard(){
    locked=false;
    el('tut-q-text').textContent = TUT_QUIZ.stem;
    const wrap=el('tut-parts');
    wrap.innerHTML = typeGroupHtml(SALE_TYPES,'매출') + typeGroupHtml(BUY_TYPES,'매입');
    wrap.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('pointerdown', e=>{ e.preventDefault(); onTap(b.dataset.code,b); }));
  }

  function onTap(code, btn){
    const s=TUT_STEPS[step];
    if(locked || !s || !s.tap) return;
    if(code!==s.tap){
      locked=true;
      btn.classList.add('wrong');
      el('tut-text').innerHTML='앗, 그건 아니에요. 세금계산서를 발급한 과세매출은 <b>11.과세</b>예요.';
      el('tut-hint').style.display='block'; el('tut-hint').textContent='👆 다시 골라 보세요';
      timer=setTimeout(()=>{ timer=null; locked=false; btn.classList.remove('wrong'); render(); }, 1400);
      return;
    }
    locked=true;
    btn.classList.add('correct');
    el('tut-parts').querySelectorAll('.tbtn').forEach(b=>{ if(b!==btn) b.classList.add('tut-dim'); });
    timer=setTimeout(()=>{ timer=null; locked=false; go(step+1); }, 550);
  }

  function render(){
    const s=TUT_STEPS[step];
    el('tut-badge').textContent=(step+1)+'/'+TUT_STEPS.length;
    el('tut-text').innerHTML=s.text;
    el('tut-parts').querySelectorAll('.tbtn').forEach(b=>{
      b.classList.remove('tut-target','tut-dim','wrong');
      if(!b.classList.contains('correct')){
        if(s.tap) { if(b.dataset.code===s.tap) b.classList.add('tut-target'); else b.classList.add('tut-dim'); }
      }
    });
    const hint=el('tut-hint');
    if(s.hint){ hint.style.display='block'; hint.textContent=s.hint; } else hint.style.display='none';
    const btn=el('tut-next');
    if(s.btn){ btn.style.display='block'; btn.textContent=s.btn; } else btn.style.display='none';
  }

  function go(n){ step=n; if(step>=TUT_STEPS.length) return finish(); render(); }
  function nextBtn(){ if(TUT_STEPS[step].finish) return finish(); go(step+1); }
  function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }
  function start(){ clearTimer(); step=0; locked=false; buildBoard(); render(); el('tutorial').classList.add('show'); }
  function close(){ clearTimer(); locked=false; el('tutorial').classList.remove('show'); }
  function finish(){ close(); }
  return { start, close, next:nextBtn };
})();

let QUEUE=[], qi=0, score=0, combo=0, correctCnt=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startQuiz(){
  const pool=shuffle(poolFor());
  const n=SEL_LEN===0?pool.length:Math.min(SEL_LEN,pool.length);
  QUEUE=pool.slice(0,n);
  qi=0;score=0;combo=0;correctCnt=0;
  if(window.WrongNote) WrongNote.reset();
  document.getElementById('home').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  showQ();
}

function typeGroupHtml(list, cat){
  return `<div class="tgroup">
    <div class="tgroup-label ${cat}"><span class="dot"></span>${cat} 유형</div>
    <div class="type-grid">
      ${list.map(([code,name])=>`<button class="tbtn" data-code="${code}"><span class="code">${code}</span><span class="name">${esc(name)}</span></button>`).join('')}
    </div>
  </div>`;
}

function showQ(){
  const q=QUEUE[qi];
  document.getElementById('hud-prog').textContent=`${qi+1} / ${QUEUE.length}`;
  document.getElementById('hud-score').textContent=score.toLocaleString();
  document.getElementById('hud-combo').textContent=combo;
  document.getElementById('prog-fill').style.width=(qi/QUEUE.length*100)+'%';
  const html=`
    <div class="qcard">
      <div class="qtag"><span class="cat-badge ${q.category}">${q.category}</span><span class="qsrc">${esc(q.round)}회 기출 기반</span></div>
      <div class="qstem">${esc(q.stem)}</div>
    </div>
    ${typeGroupHtml(SALE_TYPES,'매출')}
    ${typeGroupHtml(BUY_TYPES,'매입')}
    <div class="expl" id="expl"></div>
    <div class="next-wrap" id="next-wrap"><button class="cta" id="next-btn">${qi+1>=QUEUE.length?'결과 보기 🏁':'다음 문제 →'}</button></div>
  `;
  document.getElementById('quiz-body').innerHTML=html;
  document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>pick(b.dataset.code,q));
}

function pick(code,q){
  document.querySelectorAll('.tbtn').forEach(b=>{
    b.disabled=true;
    if(b.dataset.code===q.type_code) b.classList.add('correct');
    else if(b.dataset.code===code) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const ok = code===q.type_code;
  const expl=document.getElementById('expl');
  expl.innerHTML = (ok
    ? `<div class="verdict" style="color:var(--green)">✓ 정답! ${esc(q.type_full)}</div>${esc(q.explain||'')}`
    : `<div class="verdict" style="color:var(--red)">✗ 오답 — 정답은 ${esc(q.type_full)}</div>${esc(q.explain||'')}`
  ) + (q.keyword?`<span class="kw">🔑 ${esc(q.keyword)}</span>`:'');
  if(ok){ combo++; correctCnt++; score+=100+(combo-1)*20; }
  else{
    combo=0;
    if(window.WrongNote) WrongNote.add({
      game:GAME_ID, key:q.id, q:q.stem,
      correct:q.type_full, wrong:(code||'(선택 안 함)'),
      type:q.category
    });
  }
  document.getElementById('hud-score').textContent=score.toLocaleString();
  document.getElementById('hud-combo').textContent=combo;
  expl.style.display='block';
  document.getElementById('next-wrap').style.display='block';
  document.getElementById('next-btn').onclick=()=>{ qi++; qi>=QUEUE.length?endQuiz():showQ(); };
  expl.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function grade(rate){
  if(rate>=0.9) return '👑 전표 마스터';
  if(rate>=0.75) return '🥇 합격 안정권';
  if(rate>=0.6) return '🥈 합격 가시권';
  if(rate>=0.4) return '🥉 분발 필요';
  return '📋 기초 다지기';
}

async function endQuiz(){
  if(window.WrongNote) await WrongNote.flush(GAME_ID);
  const rate=QUEUE.length?correctCnt/QUEUE.length:0;
  const g = grade(rate);
  if(window.Growth) Growth.record({game:GAME_ID, score:score, grade:g, combo:combo, correct:correctCnt});
  if(window.Growth) Growth.logPlay(GAME_ID);
  try{ await saveStageScore(score, g, correctCnt, QUEUE.length); }catch(e){}
  requestInterstitialIfNeeded(renderResult);
}

async function loadRanking(){
  const box=document.getElementById('rank-box');
  const db=supaClient();
  if(!db){ box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">랭킹을 불러올 수 없습니다</div>'; return; }
  const groupId=localStorage.getItem('hub_group_id')||null;
  const me=(localStorage.getItem('hub_nickname')||'').trim();
  try{
    let q=db.from('scores').select('name,score').eq('game_id',GAME_ID).order('score',{ascending:false}).limit(15);
    if(groupId) q=q.eq('group_id',groupId);
    const {data,error}=await q;

    const list=data||[];
    box.innerHTML = list.length
      ? list.map((r,i)=>{
          const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'위';
          return `<div class="rr-row${r.name===me?' me':''}"><span class="rr-num">${medal}</span><span class="rr-name">${esc(r.name)}</span><span class="rr-score">${(r.score||0).toLocaleString()}</span></div>`;

      : '<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">아직 기록이 없습니다</div>';
    if(me){
      const myRowQ = groupId ? db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).eq('group_id',groupId).maybeSingle()
                              : db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).maybeSingle();
      const {data:myRow}=await myRowQ;
      if(myRow && Number.isFinite(myRow.score)){
        let cq=db.from('scores').select('*',{count:'exact',head:true}).eq('game_id',GAME_ID).gt('score',myRow.score);
        if(groupId) cq=cq.eq('group_id',groupId);

const AD_GAME_COUNT_KEY='hub_ad_game_count';
const AD_INTERSTITIAL_EVERY=10;
function incrementGameCount(){
  const n=parseInt(localStorage.getItem(AD_GAME_COUNT_KEY)||'0')+1;
  localStorage.setItem(AD_GAME_COUNT_KEY,String(n)); return n;
}
function requestInterstitialIfNeeded(afterFn){
  if(window.AdBridge && typeof AdBridge.isAdsRemoved==='function' && AdBridge.isAdsRemoved()){ afterFn&&afterFn(); return; }
  window._adAfterFn=afterFn;
  const count=incrementGameCount();
  if(count%AD_INTERSTITIAL_EVERY===0 && window.AdBridge && typeof AdBridge.showInterstitial==='function'){
    AdBridge.showInterstitial();
  } else { afterFn&&afterFn(); }
}
function onInterstitialClosed(){ if(window._adAfterFn){ const f=window._adAfterFn; window._adAfterFn=null; f(); } }
