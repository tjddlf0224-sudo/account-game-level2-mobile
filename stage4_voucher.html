<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://pjagaulfivafamhhiveg.supabase.co https://cdn.jsdelivr.net;">
<title>전표의 눈 — 전산회계 1급 스테이지 3</title>
<meta name="description" content="실제 기출 거래를 보고 매입매출전표 유형(과세·영세·면세·불공·카과 등)을 맞히는 연습">
<style>
  /* 이 스테이지만의 색·질감 — "관인/전표(도장 찍힌 공식 문서)" 컨셉.
     다른 1급 스테이지(이론/배관의방/신고의문)가 전부 공유하는 차가운
     시안+마젠타 팔레트를 일부러 쓰지 않고, 따뜻한 잉크빛 배경 위에
     주칠(vermillion, 한국 관인 색) 강조를 얹었다. */
  :root{
    /* 앱 하단 광고 배너가 가릴 수 있는 최대 높이. JS(--ad-safe-h)가 안 걸려도
       이 값 덕분에 화면 맨 아래 버튼까지 닿는다(게임 5종과 같은 값, 2026-09-15). */
    --ad-reserve: 96px;
    --bg:#150e09; --card:#241811; --card2:#2f2116; --line:rgba(255,205,140,.14);
    --blue:#3d8f7a; --green:#5fbf6f; --red:#e34a36; --gold:#f2b134;
    --sale:#f2b134; --buy:#3d8f7a;
    --txt:#fbf1e6; --dim:rgba(251,241,230,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  
  /* 본문 글꼴은 전 게임 공통으로 Noto Sans KR 이 먼저다(2026-09-15).
     전엔 -apple-system 이 앞이라 **웹폰트를 불러놓고도 iOS 에선 애플 기본 글꼴**이
     나왔다 — 게임 5종·원가의 길과 글자 모양이 달라 보이던 이유다.
     시스템 글꼴은 뒤에 남겨 웹폰트가 늦거나 막혀도 한글이 깨지지 않게 한다. */
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       padding:0 0 40px; min-height:100vh;}
  /* 하단 여백은 padding 이 아니라 ::after 스페이서로 잡는다 — iOS WKWebView 가
     스크롤 컨테이너의 padding-bottom 을 스크롤 영역에 안 넣어 주는 경우가 있다
     (게임 5종·원가의 길에서 먼저 겪었다). 여긴 문서 스크롤이라 덜 위험하지만
     규칙을 같게 둔다. */
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 16px;}
  .wrap::after{content:'';display:block;width:100%;
    height:calc(env(safe-area-inset-bottom, 0px)
      + max(var(--ad-banner-h, 0px), var(--ad-safe-h, 0px), var(--ad-reserve)));}
  @media (min-width:701px){
    body{background:
      radial-gradient(ellipse 50% 40% at 12% 10%, rgba(61,143,122,0.09), transparent 60%),
      radial-gradient(ellipse 45% 35% at 90% 90%, rgba(242,177,52,0.07), transparent 55%),
      var(--bg);}
    .wrap{max-width:820px;width:100%;margin:0 auto;}
  }

  /* ── 헤더 — 2급 게임(game1~5)/자본의 제왕과 동일한 구조:
     로고 + 상시 HUD(시간/점수/연속) + 그만·홈 버튼, 화면 상단 고정 ── */
  header{display:flex;align-items:center;gap:10px;
    padding:max(10px,env(safe-area-inset-top)) 16px 10px;
    background:rgba(0,0,0,.28);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);}
  .logo{font-weight:800;font-size:1rem;color:var(--txt);flex-shrink:0;}
  .status-bar{display:flex;gap:10px;align-items:center;flex:1;justify-content:center;min-width:0;}
  .stat{display:flex;flex-direction:column;align-items:center;gap:0;flex-shrink:0;min-width:34px;}
  .stat-label{font-size:.6rem;color:var(--dim);letter-spacing:.06em;}
  .stat-value{font-family:ui-monospace,monospace;font-weight:800;font-size:1rem;color:var(--txt);line-height:1.2;}
  .header-btns{display:flex;gap:6px;flex-shrink:0;}
  .hdr-btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:50px;padding:0 13px;height:34px;font-size:.8rem;cursor:pointer;white-space:nowrap;}
  .hdr-btn:active{transform:scale(.94);}
  .hdr-sub{font-size:.72rem;color:var(--dim);margin:-4px 0 14px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .panel h2{font-size:.92rem;margin:0 0 12px;color:var(--blue);}
  .cta{display:block;width:100%;border:none;border-radius:14px;padding:15px;
       font-size:1.05rem;font-weight:700;color:#021;cursor:pointer;
       background:linear-gradient(90deg,var(--blue),var(--green));margin-top:8px;}
  .cta:disabled{opacity:.45;}
  .mini{font-size:.78rem;color:var(--dim);margin-top:10px;line-height:1.5;}
  .legend{display:flex;gap:14px;font-size:.76rem;color:var(--dim);margin-top:12px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

  /* ── 시작화면 규칙 카드(2급 game3/4 start-screen과 같은 톤) ── */
  .example-card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
  .example-card .ex-label{font-size:.72rem;color:var(--dim);letter-spacing:.1em;margin-bottom:6px;}
  .example-card .ex-stem{font-size:.94rem;line-height:1.55;word-break:keep-all;}
  .example-card .ex-ans{font-size:.82rem;color:var(--dim);margin-top:8px;}
  /* ── 시작화면(2급 게임과 같은 구성, 2026-09-15) ─────────────────── */
  .home-title{font-family:'Black Han Sans','Noto Sans KR',sans-serif;
    font-size:clamp(1.7rem,7vw,2.4rem);color:var(--gold);text-align:center;
    margin:8px 0 6px;text-shadow:0 0 18px rgba(255,214,0,.25);}
  .home-sub{font-size:.82rem;color:var(--dim);text-align:center;margin-bottom:18px;
    line-height:1.6;word-break:keep-all;}
  .start-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0 4px;}
  @media (min-width:520px){ .start-grid{grid-template-columns:1fr 1fr 1fr;} }
  .info-card{background:var(--card2);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;font-size:.8rem;color:var(--dim);line-height:1.65;}
  .info-card strong{display:block;color:var(--txt);font-size:.9rem;margin-bottom:5px;}
  /* 버튼 크기는 전 게임 공통 규칙에 맞춘다 — 제각각 크기를 쓰지 않는다 */
  .home-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  .pill-btn{display:block;width:100%;border:none;border-radius:50px;padding:15px;
    font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:1.05rem;
    cursor:pointer;color:#021;background:linear-gradient(90deg,var(--blue),var(--green));}
  .pill-btn:disabled{opacity:.45;}
  .pill-btn:active{transform:scale(.98);}
  .btn-hub{display:block;width:100%;border:1.5px solid var(--line);border-radius:50px;
    padding:14px;font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:1rem;
    color:var(--dim);background:var(--card2);cursor:pointer;}
  .btn-hub:active{transform:scale(.98);}

  .rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .rule-card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.84rem;line-height:1.6;}
  .rule-card strong{display:block;color:var(--txt);font-size:.88rem;margin-bottom:4px;}

  #quiz{display:none;}
  .timer-track{flex:1;max-width:90px;height:5px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;}
  .timer-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));transition:width 1s linear;}

  .qcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);
    border-radius:12px;padding:20px;margin-bottom:14px;}
  .qcard.qc-sale{border-left-color:var(--sale);}
  .qcard.qc-buy{border-left-color:var(--buy);}
  .tear-line{height:0;margin:-16px 0 14px;border-bottom:2px dashed rgba(255,205,140,.28);}
  .qtag{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .cat-badge{font-family:ui-monospace,monospace;font-weight:700;font-size:.72rem;letter-spacing:.03em;
    padding:4px 9px;border-radius:6px;}
  .cat-badge.매출{background:rgba(242,177,52,.14);color:var(--sale);border:1px solid rgba(242,177,52,.3);}
  .cat-badge.매입{background:rgba(61,143,122,.14);color:var(--buy);border:1px solid rgba(61,143,122,.3);}
  .qsrc{font-size:.68rem;color:var(--dim);opacity:.6;}
  .qstem{font-size:1.06rem;line-height:1.65;word-break:keep-all;}
  /* 힌트로 짚어 준 말 — 색을 바꾸고 은은하게 깜박인다 */
  .qstem mark.kw-hit{background:transparent;color:var(--gold);font-weight:800;
    padding:0 1px;border-radius:3px;animation:kwGlow 1.1s ease-in-out infinite;}
  @keyframes kwGlow{
    0%,100%{ text-shadow:0 0 0 rgba(242,177,52,0);   background:rgba(242,177,52,0); }
    50%    { text-shadow:0 0 10px rgba(242,177,52,.85); background:rgba(242,177,52,.16); }
  }
  @media (prefers-reduced-motion:reduce){ .qstem mark.kw-hit{animation:none;background:rgba(242,177,52,.16);} }
  .hint-btn{display:block;width:100%;margin-top:12px;padding:12px;
    border:1.5px dashed rgba(242,177,52,.5);border-radius:14px;background:rgba(242,177,52,.07);
    color:var(--gold);font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:.95rem;cursor:pointer;}
  .hint-btn:active{transform:scale(.98);}
  .hint-btn:disabled{opacity:.4;cursor:default;border-style:solid;}
  .hint-box{display:none;margin-top:10px;padding:13px 15px;border-radius:14px;
    background:rgba(242,177,52,.09);border:1px solid rgba(242,177,52,.3);
    font-size:.86rem;line-height:1.6;color:var(--txt);word-break:keep-all;}
  .hint-box.on{display:block;animation:hintIn .25s ease;}
  .hint-box b{color:var(--gold);margin-right:6px;}
  .rule-line{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(242,177,52,.08);border-left:3px solid var(--gold);font-size:.84rem;line-height:1.55;color:var(--txt);word-break:keep-all;}
  .rule-line b{color:var(--gold);}
  @keyframes hintIn{ from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }

  .type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
  .tgroup{margin-bottom:14px;}
  .tgroup:last-child{margin-bottom:0;}
  .tgroup-label{font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--dim);margin-bottom:8px;
    display:flex;align-items:center;gap:6px;}
  .tgroup-label .dot{width:8px;height:8px;border-radius:50%;}
  .tgroup-label.매출 .dot{background:var(--sale);}
  .tgroup-label.매입 .dot{background:var(--buy);}

  .tbtn{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;
    padding:10px 6px;text-align:center;cursor:pointer;transition:.12s;color:var(--txt);}
  .tbtn .code{display:block;font-family:ui-monospace,monospace;font-weight:700;font-size:.92rem;}
  .tbtn .name{display:block;font-size:.74rem;color:var(--dim);margin-top:2px;}
  .tbtn:active{transform:scale(.96);}
  .tbtn[disabled]{cursor:default;}
  .tbtn.correct{border-color:var(--green);background:rgba(95,191,111,.18);}
  .tbtn.correct .name{color:var(--green);}
  .tbtn.wrong{border-color:var(--red);background:rgba(227,74,54,.18);}
  .tbtn.wrong .name{color:var(--red);}
  .tbtn.dim{opacity:.35;}

  .expl{margin-top:14px;padding:14px;border-radius:13px;background:rgba(61,143,122,.09);
        border:1px solid rgba(61,143,122,.25);font-size:.9rem;line-height:1.6;display:none;}
  .expl .verdict{font-weight:700;margin-bottom:6px;font-size:.98rem;}
  .expl .kw{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:7px;
    background:rgba(242,177,52,.14);color:var(--gold);font-size:.8rem;font-weight:700;}
  .expl .continue-hint{margin-top:12px;font-size:.78rem;color:var(--dim);text-align:right;}
  #quiz-body.await-continue{cursor:pointer;}
  #result{display:none;text-align:center;}
  #result .result-title{font-size:1.3rem;font-weight:800;letter-spacing:.02em;color:var(--txt);}
  #result .grade{font-size:1.05rem;color:var(--dim);margin:6px 0 2px;}
  #result .score{font-size:2.4rem;color:var(--gold);font-weight:800;margin-top:4px;}
  .res-stats{margin:14px 0 4px;font-size:.9rem;color:var(--dim);}
  .res-stats b{font-weight:800;}
  .res-note{font-size:.82rem;color:var(--dim);margin:6px 0 18px;}
  /* 결과화면 버튼 — 2급 게임 5종의 BTNUNI 규격과 같게(2026-09-15, "UI 통일성 있어야 한다니까").
     한 줄에 하나씩, 폭 꽉 차게, 높이 52px, 알약 모양. 가로 2열이던 것을 세로로. */
  .btn-row{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px;}
  .btn-row a,.btn-row button{width:100%;box-sizing:border-box;min-height:52px;border-radius:50px;padding:13px 20px;
      font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:clamp(1rem,3.6vw,1.15rem);font-weight:600;
      display:flex;align-items:center;justify-content:center;gap:8px;
      border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;text-decoration:none;text-align:center;}
  .btn-row .primary{border:none;background:linear-gradient(90deg,var(--blue),var(--green));color:#021;}
  .review-link{display:block;margin-top:10px;font-size:.84rem;color:var(--gold);text-decoration:none;}

  /* ── 게임 방법 튜토리얼 ── */
  .guide-btn{display:block;width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;
    font-size:.9rem;font-weight:600;color:var(--dim);background:var(--card2);cursor:pointer;margin-top:8px;text-align:center;}
  .tut{display:none;position:fixed;inset:0;z-index:9999;flex-direction:column;background:var(--bg);}
  .tut.show{display:flex;animation:tutPop .25s ease;}
  @keyframes tutPop{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
  .tut-top{display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;}
  .tut-top .tt-title{font-weight:800;font-size:1.05rem;color:#fff;}
  .tut-top .tt-badge{font-size:.8rem;font-weight:800;color:#fff;background:var(--red);border-radius:50px;padding:3px 12px;}
  .tut-top .tt-skip{margin-left:auto;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.75);
    border-radius:50px;padding:6px 14px;font-size:.8rem;cursor:pointer;}
  .tut-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:6px 16px 0;overflow-y:auto;}
  .tut-stage .qcard{width:100%;max-width:480px;}
  .tut-stage .tgroup{width:100%;max-width:480px;}
  .tut .tbtn.tut-target{position:relative;border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,177,52,.35);animation:tutGlow 1s ease-in-out infinite;}
  @keyframes tutGlow{0%,100%{box-shadow:0 0 0 3px rgba(242,177,52,.35);}50%{box-shadow:0 0 0 7px rgba(242,177,52,.1);}}
  .tut .tbtn.tut-dim{opacity:.3;pointer-events:none;}
  .tut-bubble{background:rgba(0,0,0,.35);border-top:1px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom));}
  .tut-bubble-text{font-size:.98rem;line-height:1.6;color:#e0e6ed;word-break:keep-all;text-align:center;}
  .tut-bubble-text b{color:var(--blue);}
  .tut-hint{text-align:center;font-weight:800;color:var(--gold);font-size:.92rem;margin-top:8px;}
  .tut-next{display:block;width:100%;margin-top:14px;padding:15px;border-radius:14px;border:2px solid rgba(255,255,255,.3);
    background:transparent;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;}

  /* ── TOP 랭킹(결과화면) ── */
  .rank-title{font-size:.72rem;color:rgba(255,255,255,.35);letter-spacing:2px;margin:18px 0 8px;text-align:center;}
  #my-rank-badge{display:none;font-size:.82rem;color:var(--blue);background:rgba(61,143,122,.12);border:1px solid rgba(61,143,122,.35);
    border-radius:50px;padding:6px 16px;margin:18px auto 8px;   /* 위 18px: 버튼에 바짝 붙어 있던 것을 띄움(2026-09-15 제보) */
    text-align:center;max-width:max-content;}
  #rank-box{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;max-height:180px;overflow-y:auto;padding:4px 0;text-align:left;}
  .rr-row{display:grid;grid-template-columns:34px 1fr 70px;gap:6px;padding:8px 12px;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.05);align-items:center;}
  .rr-row:last-child{border-bottom:none;}
  .rr-row.me{background:rgba(61,143,122,.1);}
  .rr-num{color:rgba(255,255,255,.35);font-weight:700;}
  .rr-name{color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rr-score{color:var(--gold);text-align:right;font-weight:700;}

/*FONTUNI*/
/* ── 폰트 통일 (2026-09-14) ──
   제목·버튼 = Black Han Sans / 본문 = Noto Sans KR. 둘 다 OFL 이라 상업 배포에 제약이 없다.
   ⚠ Orbitron 은 **라틴 전용**이라 한글에 쓰면 시스템 폰트로 대체되고 자간만 벌어져
     "회계 플라이트"처럼 멋없게 나온다(사용자 지적). 숫자·영문 전용으로만 쓴다.
   Jua 는 게임마다 섞여 있어 걷어냈다. */
.gtitle, .logo, .ov-title, .overlay-title, h1, h2 { font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif !important; }
</style>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="logo">전표의 눈</div>
  <div class="status-bar">
    <div class="stat"><div class="stat-label">TIME</div><div class="stat-value" id="hud-time">120</div></div>
    <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
    <div class="stat"><div class="stat-label">점수</div><div class="stat-value" id="hud-score">0</div></div>
    <div class="stat"><div class="stat-label">연속</div><div class="stat-value" id="hud-combo">0</div></div>
  </div>
  <div class="header-btns">
    <button class="hdr-btn" onclick="quitGame()">그만</button>
    <button class="hdr-btn" onclick="exitGame()">홈</button>
  </div>
</header>
<div class="wrap">
  <div id="home">
    <!-- 2급 게임 시작화면과 같은 구성으로 맞췄다(2026-09-15, 사용자 요청 "너무 답답하네").

<script>
(function(){ if(!(localStorage.getItem('hub_nickname')||'').trim()){ location.replace('login.html'); } })();

const GAME_ID='voucher_lv1';

/* 전표유형 전체 목록(버튼 그리드용) — 실제 시험에서 쓰는 코드 그대로 */
const SALE_TYPES = [
  ['11','과세'],['12','영세'],['13','면세'],['14','건별'],['16','수출'],['17','카과'],['22','현과'],
];
const BUY_TYPES = [
  ['51','과세'],['52','영세'],['53','면세'],['54','불공'],['55','수입'],['57','카과'],['61','현과'],['62','현면'],
];

const TIME_LIMIT=120, TIME_MAX=180;
let BANK=[];

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function load(){
  try{
    const r=await fetch('voucher_bank_lv1.json');
    const d=await r.json();
    BANK=d.questions;
  }catch(e){
    /* pool-info 안내줄은 2026-09-15 에 없앴다(사용자 요청). 실패를 조용히 삼키면
       "시작이 안 눌린다"만 남으므로 확인창으로 알린다. */
    if (window.Ask) Ask.alert('문제 데이터를 불러오지 못했습니다.\n인터넷 연결을 확인하고 다시 들어와 주세요.');
    return;
  }
  document.getElementById('start-btn').disabled=BANK.length===0;
  bindStart();
}

function bindStart(){
  document.getElementById('start-btn').onclick=startQuiz;
  document.getElementById('guide-btn').onclick=()=>Tutorial.start();
}

/* ── 그만(중도 종료 → 지금까지 점수로 결과화면) / 홈(허브로 나가기) ── */
async function quitGame(){
  if(!isPlaying) return;
  if(await Ask.confirm('지금까지 점수로 결과를 볼까요? 남은 시간은 더 진행할 수 없어요.')) endQuiz();
}
async function exitGame(){
  if(isPlaying){
    if(!await Ask.confirm('허브로 나갈까요? 지금까지의 진행 상황은 저장되지 않습니다.')) return;
  }
  location.href='index_lv1.html';
}

/* =========================================================================
 *  Tutorial — 실제 문제 하나(과세 세금계산서 발급)로 "거래 읽고 유형 버튼 탭"
 *  흐름을 미리 체험시키는 인터랙티브 미니 튜토리얼. game4_factory.html의
 *  Tutorial 엔진과 같은 톤(단계별 말풍선+타겟 하이라이트)이지만, 이 게임은
 *  칸이 하나(유형 버튼 1개 탭)뿐이라 game4의 차변/대변 2단계 로직은 걷어내고 단순화함.
 * ========================================================================= */
const TUT_QUIZ = { stem:'제품을 판매하고 전자세금계산서를 발급하였다.', code:'11' };
const TUT_STEPS = [
  { text:'실제 기출 거래를 읽고, 그 거래가 <b>어느 매입매출전표 유형</b>인지 버튼에서 골라보는 연습이에요.<br>거래 하나로 같이 해볼까요?', btn:'시작 ▶' },
  { text:'제품을 판매하면서 <b>전자세금계산서를 발급</b>했어요. 세금계산서를 발급한 <b>일반 과세매출</b>은 코드 <b>11.과세</b>예요.<br>아래에서 <b>11.과세</b> 버튼을 찾아 눌러보세요.', tap:'11', hint:'빛나는 버튼을 탭하세요' },
  { text:'정답! 정답마다 <b>+100점</b>(콤보 가산)에 시간도 <b>+20초</b> 늘어나요. 오답이면 콤보가 끊기고 시간이 <b>-5초</b> 줄어요.', glow:true, btn:'다음 ▶' },
  { text:'틀리면 정답과 해설이 바로 나오고, <b>오답노트</b>에 자동 저장돼서 나중에 다시 볼 수 있어요.', btn:'다음 ▶' },
  { text:'제한 시간 2분 동안 문제가 끊임없이 이어져요. 시간이 다 될 때까지 최대한 많이 맞혀보세요!', btn:'시작하기 ▶', finish:true },
];
const Tutorial = (function(){
  let step=0, locked=false, timer=null;
  function el(id){ return document.getElementById(id); }
  function targetBtn(){ return el('tut-parts').querySelector(`[data-code="${TUT_QUIZ.code}"]`); }

  function buildBoard(){
    locked=false;
    el('tut-q-text').textContent = TUT_QUIZ.stem;
    const wrap=el('tut-parts');
    wrap.innerHTML = typeGroupHtml(SALE_TYPES,'매출') + typeGroupHtml(BUY_TYPES,'매입');
    wrap.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('pointerdown', e=>{ e.preventDefault(); onTap(b.dataset.code,b); }));
  }

  function onTap(code, btn){
    const s=TUT_STEPS[step];
    if(locked || !s || !s.tap) return;
    if(code!==s.tap){
      locked=true;
      btn.classList.add('wrong');
      el('tut-text').innerHTML='앗, 그건 아니에요. 세금계산서를 발급한 과세매출은 <b>11.과세</b>예요.';
      el('tut-hint').style.display='block'; el('tut-hint').textContent='다시 골라 보세요';
      timer=setTimeout(()=>{ timer=null; locked=false; btn.classList.remove('wrong'); render(); }, 1400);
      return;
    }
    locked=true;
    btn.classList.add('correct');
    el('tut-parts').querySelectorAll('.tbtn').forEach(b=>{ if(b!==btn) b.classList.add('tut-dim'); });
    timer=setTimeout(()=>{ timer=null; locked=false; go(step+1); }, 550);
  }

  function render(){
    const s=TUT_STEPS[step];
    el('tut-badge').textContent=(step+1)+'/'+TUT_STEPS.length;
    el('tut-text').innerHTML=s.text;
    el('tut-parts').querySelectorAll('.tbtn').forEach(b=>{
      b.classList.remove('tut-target','tut-dim','wrong');
      if(!b.classList.contains('correct')){
        if(s.tap) { if(b.dataset.code===s.tap) b.classList.add('tut-target'); else b.classList.add('tut-dim'); }
      }
    });
    const hint=el('tut-hint');
    if(s.hint){ hint.style.display='block'; hint.textContent=s.hint; } else hint.style.display='none';
    const btn=el('tut-next');
    if(s.btn){ btn.style.display='block'; btn.textContent=s.btn; } else btn.style.display='none';
  }

  function go(n){ step=n; if(step>=TUT_STEPS.length) return finish(); render(); }
  function nextBtn(){ if(TUT_STEPS[step].finish) return finish(); go(step+1); }
  function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }
  function start(){
    /* 게임 방법(튜토리얼) 중에도 배너를 내린다 — 실기기 제보(2026-09-15).
       닫을 때는 곧바로 되돌리지 않는다: finish() 는 close() 뒤에 게임을 시작하는데,
       거기서 show 를 해 버리면 게임 중에 배너가 다시 올라온다. 대신 시작화면으로
       돌아가는 경우만 되살리도록 startGame/startQuiz 쪽 hide 와 짝을 맞춰 뒀다. */
    if (typeof hideAdPlaceholder === 'function') hideAdPlaceholder(); clearTimer(); step=0; locked=false; buildBoard(); render(); el('tutorial').classList.add('show'); }
  function close(){
    if (typeof showAdPlaceholder === 'function') showAdPlaceholder(); clearTimer(); locked=false; el('tutorial').classList.remove('show'); }
  function finish(){ close(); }
  return { start, close, next:nextBtn };
})();

let curQ=null, prevId=null, score=0, combo=0, maxCombo=0, correctCnt=0, wrongCnt=0;
let timeLeft=TIME_LIMIT, timerInterval=null, isPlaying=false;

function drawQuestion(){
  let q;
  do{ q=BANK[Math.floor(Math.random()*BANK.length)]; }while(BANK.length>1 && q.id===prevId);
  prevId=q.id;
  return q;
}

function startQuiz(){
  /* 게임 중에는 배너를 내린다 — 다른 게임 5종과 같은 규칙(2026-09-15).
     실기기 제보: 자본의 제왕 게임방법·플레이 화면에 배너가 그대로 떠 있었다.
     hideAdPlaceholder/showAdPlaceholder 함수는 있는데 **아무도 안 불렀다.** */
  hideAdPlaceholder();
  score=0;combo=0;maxCombo=0;correctCnt=0;wrongCnt=0;timeLeft=TIME_LIMIT;prevId=null;
  if(window.WrongNote) WrongNote.reset();
  document.getElementById('home').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  isPlaying=true;
  updateTimeHud();
  clearInterval(timerInterval);
  timerInterval=setInterval(tick,1000);
  curQ=drawQuestion();
  showQ();
}

let awaitingContinue=false;
function tick(){
  if(!isPlaying || awaitingContinue) return;
  /* 화면이 가려져 있으면(전면광고·전화·홈버튼) 시간을 깎지 않는다.
     실기기 제보 2026-09-15: 신고의 문에서 전면광고가 덮은 채로 제한 시간이 흘러 죽었다.
     판단은 pausewatch.js 한 곳에서 한다 — WKWebView 는 visibilitychange 가 안 올 때가 있어
     Capacitor appStateChange 까지 같이 본다. */
  if (window.AMPause && AMPause.hidden()) return;
  timeLeft=Math.max(0,timeLeft-1);
  updateTimeHud();
  if(timeLeft<=0) endQuiz();
}

function updateTimeHud(){
  document.getElementById('hud-time').textContent=timeLeft;
  document.getElementById('timer-fill').style.width=Math.max(0,Math.min(100,timeLeft/TIME_LIMIT*100))+'%';
  document.getElementById('hud-score').textContent=score.toLocaleString();
  document.getElementById('hud-combo').textContent=combo;
}

function typeGroupHtml(list, cat){
  return `<div class="tgroup">
    <div class="tgroup-label ${cat}"><span class="dot"></span>${cat} 유형</div>
    <div class="type-grid">
      ${list.map(([code,name])=>`<button class="tbtn" data-code="${code}"><span class="code">${code}</span><span class="name">${esc(name)}</span></button>`).join('')}
    </div>
  </div>`;
}

function showQ(){
  const q=curQ;
  updateTimeHud();
  const html=`
    <div class="qcard qc-${q.category==='매출'?'sale':'buy'}">
      <div class="qtag"><span class="cat-badge ${q.category}">${q.category}</span><span class="qsrc">${esc(q.round)}회 기출 기반</span></div>
      <div class="qstem">${esc(q.stem)}</div>
    </div>
    <div class="tear-line"></div>
    ${typeGroupHtml(SALE_TYPES,'매출')}
    ${typeGroupHtml(BUY_TYPES,'매입')}
    <button class="hint-btn" id="hint-btn" type="button">💡 힌트 보기</button>
    <div class="hint-box" id="hint-box"></div>
    <div class="expl" id="expl"></div>
  `;
  document.getElementById('quiz-body').innerHTML=html;
  document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>pick(b.dataset.code,q));
  const hb=document.getElementById('hint-btn');
  if(hb) hb.onclick=()=>showHint(q);
}

/* 💡 힌트 — 지문에서 단서가 되는 말에 색을 입혀 반짝이게 하고, 아래 칸에 키워드를 적는다.
   문제 데이터의 keyword 는 "전자세금계산서 발급(일반 매출)" 처럼 요약이라 지문과 글자가
   딱 맞지 않는 경우가 많다. 그래서 괄호 안을 버리고 +·/ 로 쪼갠 뒤, 두 글자 이상이면서
   지문에 실제로 들어 있는 조각만 강조한다(142문항 중 128건 = 90% 가 이 방식으로 잡힌다).
   나머지 14건은 강조할 게 없으니 힌트 글만 보여 준다 — 그래도 쓸모가 있다. */
function hintPieces(kw){
  return String(kw||'').replace(/\(.*?\)/g,' ').split(/[+\u00b7,/]/)
    .join(' ').split(/\s+/).map(w=>w.trim()).filter(w=>w.length>=2);
}
/* 📌 "이런 단서면 이 유형" — 정답을 보여줄 때 함께 알려 주는 규칙(2026-09-15 사용자 요청:
   "계산서면 면세, 세금계산서면 과세 이런 거"). 142문항의 keyword 를 유형별로 세어 뽑았다. */
const TYPE_RULES = {
  '11':'전자세금계산서를 <b>발급</b>했다 → 과세 매출',
  '51':'전자세금계산서를 <b>받았다</b> → 과세 매입',
  '12':'구매확인서·내국신용장으로 <b>영세율</b>세금계산서를 발급 → 영세 매출',
  '52':'구매확인서·내국신용장으로 <b>영세율</b>세금계산서를 받음 → 영세 매입',
  '13':'세금계산서가 아니라 <b>계산서</b>를 발급(면세품·토지) → 면세 매출',
  '53':'세금계산서가 아니라 <b>계산서</b>를 받음(면세품·리스·교육) → 면세 매입',
  '14':'세금계산서도 카드도 현금영수증도 <b>없는</b> 과세 매출·간주공급 → 건별',
  '16':'해외로 <b>직수출</b>(세금계산서 없음) → 수출',
  '17':'<b>신용카드</b>로 결제받았다 → 카과(매출)',
  '57':'<b>신용카드</b>로 결제했다(과세 매입) → 카과(매입)',
  '22':'<b>현금영수증</b>을 발급했다 → 현과(매출)',
  '61':'<b>현금영수증</b>을 받았다(지출증빙) → 현과(매입)',
  '62':'현금영수증인데 <b>면세</b> 품목 → 현면',
  '54':'세금계산서는 받았지만 <b>접대비·비영업용승용차·토지·업무무관</b> → 불공(매입세액 공제 안 됨)',
  '55':'<b>세관</b>이 발급한 수입세금계산서 → 수입',
};
function ruleHtml(code){
  const r=TYPE_RULES[code]; if(!r) return '';
  return '<div class="rule-line">📌 <b>규칙</b> '+r+'</div>';
}

function showHint(q){
  const box=document.getElementById('hint-box'), btn=document.getElementById('hint-btn');
  if(!box || box.classList.contains('on')) return;         // 한 문제에 한 번이면 충분하다
  box.classList.add('on');
  if(btn) btn.disabled=true;
  box.innerHTML = q.keyword ? '<b>단서</b> '+esc(q.keyword)
                            : '<b>단서</b> 거래의 증빙과 과세 여부를 살펴보세요.';

  /* 지문에서 조각을 찾아 감싼다. 지문은 esc() 로 이스케이프된 HTML 이므로
     조각도 똑같이 esc 해서 비교해야 한다(& 가 든 지문 대비). */
  const stemEl=document.querySelector('.qstem');
  if(!stemEl) return;
  let html=stemEl.innerHTML;
  const seen={};
  hintPieces(q.keyword).forEach(function(w){
    const e=esc(w);
    if(seen[e] || html.indexOf(e)<0) return;
    seen[e]=1;
    html=html.split(e).join('<mark class="kw-hit">'+e+'</mark>');
  });
  stemEl.innerHTML=html;
}

function pick(code,q){
  if(!isPlaying || awaitingContinue) return;
  document.querySelectorAll('.tbtn').forEach(b=>{
    if(b.dataset.code===q.type_code) b.classList.add('correct');
    else if(b.dataset.code===code) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const ok = code===q.type_code;
  const expl=document.getElementById('expl');
  showHint(q);   // 정답 공개 때도 지문의 단서를 색·반짝임으로 짚어 준다(이미 눌렀으면 그대로)
  if(ok){
    combo++; correctCnt++; if(combo>maxCombo) maxCombo=combo;
    score+=100+(combo-1)*20;
    timeLeft=Math.min(TIME_MAX, timeLeft+20);
    expl.innerHTML=`<div class="verdict" style="color:var(--green)">정답! ${esc(q.type_full)}</div>${esc(q.explain||'')}`+ruleHtml(q.type_code)
      + (q.keyword?`<span class="kw">${esc(q.keyword)}</span>`:'');
  }else{
    combo=0; wrongCnt++;
    timeLeft=Math.max(0, timeLeft-5);
    expl.innerHTML=`<div class="verdict" style="color:var(--red)">오답 — 정답은 ${esc(q.type_full)}</div>${esc(q.explain||'')}`+ruleHtml(q.type_code)
      + (q.keyword?`<span class="kw">${esc(q.keyword)}</span>`:'');
    if(window.WrongNote) WrongNote.add({
      game:GAME_ID, key:q.id, q:q.stem,
      correct:q.type_full, wrong:(code||'(선택 안 함)'),
      type:q.category
    });
  }
  expl.innerHTML += `<div class="continue-hint">터치하면 다음 문제로</div>`;
  updateTimeHud();
  expl.style.display='block';
  awaitingContinue=true;
  const body=document.getElementById('quiz-body');
  body.classList.add('await-continue');
  setTimeout(()=>{ body.addEventListener('click', continueFromFeedback, {once:true}); }, 0);
}

function continueFromFeedback(){
  if(!awaitingContinue) return;
  awaitingContinue=false;
  document.getElementById('quiz-body').classList.remove('await-continue');
  if(!isPlaying) return;
  if(timeLeft<=0){ endQuiz(); return; }
  curQ=drawQuestion();
  showQ();
}

function grade(rate){
  if(rate>=0.9) return '전표 마스터';
  if(rate>=0.75) return '합격 안정권';
  if(rate>=0.6) return '합격 가시권';
  if(rate>=0.4) return '분발 필요';
  return '기초 다지기';
}

async function endQuiz(){
  if(!isPlaying) return;
  isPlaying=false;
  showAdPlaceholder();   // 결과화면에서는 다시 띄운다
  clearInterval(timerInterval);
  if(window.WrongNote) await WrongNote.flush(GAME_ID);
  const answered=correctCnt+wrongCnt;
  const rate=answered?correctCnt/answered:0;
  const g = grade(rate);
  if(window.Growth) Growth.record({game:GAME_ID, score:score, grade:g, combo:maxCombo, correct:correctCnt});
  if(window.Growth) Growth.logPlay(GAME_ID);
  try{ await saveStageScore(score, g, correctCnt, answered); }catch(e){}
  requestInterstitialIfNeeded(renderResult);
}

function supaClient(){
  if(_supaDb) return _supaDb;

async function saveStageScore(score, gradeStr, correct, total){
  try{
    localStorage.setItem(S4_SAVE_KEY, JSON.stringify({
      cleared:true, score, grade:gradeStr, correct, total, playedAt:new Date().toISOString()
    }));
  }catch(e){}
  const name=(localStorage.getItem('hub_nickname')||'').trim();
  if(!name) return;
  const groupId=localStorage.getItem('hub_group_id') || null;
  const today=new Date().toISOString().split('T')[0];
  const rpcParams={ p_game_id:GAME_ID, p_name:name, p_score:score, p_grade:gradeStr, p_combo:0, p_correct:correct, p_date:today };
  if(groupId) rpcParams.p_group_id=groupId;
  try{ if(window.Auth){ const uid=await Auth.currentUid(); if(uid) rpcParams.p_uid=uid; } }catch(e){}
  const db=supaClient();
  if(!db) return;
  try{ const {error}=await db.rpc('upsert_score', rpcParams); if(error) console.warn('voucher_lv1 점수 저장 실패:', error); }
  catch(e){ console.warn('voucher_lv1 점수 저장 예외:', e); }
}
function renderResult(){
  const total=correctCnt+wrongCnt, wrong=wrongCnt;
  const rate=total?correctCnt/total:0;
  document.getElementById('quiz').style.display='none';
  const box=document.getElementById('result');
  box.style.display='block';
  box.innerHTML=`
    <div class="result-title">전표 마감</div>
    <div class="grade">${grade(rate)}</div>
    <div class="score">${score.toLocaleString()}점</div>
    <div class="res-stats">정답 <b style="color:var(--green)">${correctCnt}</b>개 · 오답 <b style="color:var(--red)">${wrong}</b>개 · 최고 연속 <b style="color:var(--gold)">${maxCombo}</b>회</div>
    <div class="res-note">${wrong>0?`틀린 ${wrong}문제가 <b style="color:var(--gold)">오답노트</b>에 저장됐어요.`:'전부 맞혔어요. 완벽합니다.'}</div>
    <div class="btn-row">
      <button class="primary" onclick="location.reload()">↺ 다시 하기</button>
      <a href="index_lv1.html">🏠 메인으로 나가기</a>
    </div>
    ${wrong>0?'<a class="review-link" href="review.html">오답노트에서 다시 보기 →</a>':''}
    <div id="my-rank-badge"></div>
    <div class="rank-title">TOP 랭킹</div>
    <div id="rank-box"><div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">불러오는 중...</div></div>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
  loadRanking();
}

/* ── TOP 랭킹(stage1_cost.html ResultScreen.loadRanking 패턴 이식) ── */
async function loadRanking(){
  const box=document.getElementById('rank-box');
  const db=supaClient();
  if(!db){ box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">랭킹을 불러올 수 없습니다</div>'; return; }
  const groupId=localStorage.getItem('hub_group_id')||null;
  const me=(localStorage.getItem('hub_nickname')||'').trim();
  try{
    let q=db.from('scores').select('name,score').eq('game_id',GAME_ID).order('score',{ascending:false}).limit(15);
    if(groupId) q=q.eq('group_id',groupId);
    const {data,error}=await q;
    if(error) throw error;
    const list=data||[];
    box.innerHTML = list.length
      ? list.map((r,i)=>{
          const medal=(i+1)+'위';
          return `<div class="rr-row${r.name===me?' me':''}"><span class="rr-num">${medal}</span><span class="rr-name">${esc(r.name)}</span><span class="rr-score">${(r.score||0).toLocaleString()}</span></div>`;
        }).join('')
      : '<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">아직 기록이 없습니다</div>';
    if(me){
      const myRowQ = groupId ? db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).eq('group_id',groupId).maybeSingle()
                              : db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).maybeSingle();
      const {data:myRow}=await myRowQ;
      if(myRow && Number.isFinite(myRow.score)){
        let cq=db.from('scores').select('*',{count:'exact',head:true}).eq('game_id',GAME_ID).gt('score',myRow.score);
        if(groupId) cq=cq.eq('group_id',groupId);
        const {count}=await cq;
        const badge=document.getElementById('my-rank-badge');
        badge.textContent=`내 순위: ${((count||0)+1).toLocaleString()}위`;
        badge.style.display='block';
      }
    }
  }catch(e){
    box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">랭킹을 불러올 수 없습니다</div>';
  }
}

const AD_GAME_COUNT_KEY='hub_ad_game_count';
const AD_INTERSTITIAL_EVERY=10;
function incrementGameCount(){
  const n=parseInt(localStorage.getItem(AD_GAME_COUNT_KEY)||'0')+1;
  localStorage.setItem(AD_GAME_COUNT_KEY,String(n)); return n;
}
function requestInterstitialIfNeeded(afterFn){
  if(window.AdBridge && typeof AdBridge.isAdsRemoved==='function' && AdBridge.isAdsRemoved()){ afterFn&&afterFn(); return; }
  window._adAfterFn=afterFn;
  const count=incrementGameCount();
  if(count%AD_INTERSTITIAL_EVERY===0 && window.AdBridge && typeof AdBridge.showInterstitial==='function'){
    AdBridge.showInterstitial();
  } else { afterFn&&afterFn(); }
}
function onInterstitialClosed(){ if(window._adAfterFn){ const f=window._adAfterFn; window._adAfterFn=null; f(); } }
function onAdsRemoved(){}
function hideAdPlaceholder(){ if(window.AdBridge && typeof AdBridge.hide==='function') AdBridge.hide(); }
/* 짝이 없어서 결과화면에서 배너가 안 돌아왔다 — hide 만 있고 show 가 없었다(2026-09-15).
   게임 5종·stage3 에는 둘 다 있는데 여기 셋만 빠져 있었다. */
function showAdPlaceholder(){ if(window.AdBridge && typeof AdBridge.show==='function') AdBridge.show(); }
