<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050310">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>전산회계 1급 — 원가의 길</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cy:#00f2ff; --pk:#ff2d78; --gd:#ffd600; --gn:#00e676; --pu:#b44fff; --or:#ff9800;
  --bg:#050310;
  --border:rgba(255,255,255,0.10);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body{
  font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:#fff;
  min-height:100vh; min-height:100dvh;
  padding-bottom:calc(40px + var(--ad-banner-h,0px));
  background-image:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(180,79,255,0.10) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 85% 75%, rgba(255,152,0,0.07) 0%, transparent 55%);
}

/* ── 상단바(2급 허브 index.html의 .user-bar와 동일 패턴 — 통일감) ── */
.user-bar{
  position:sticky; top:0; z-index:200;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:rgba(5,3,16,0.88); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.ub-nick{ display:flex; align-items:center; gap:7px; flex:1; min-width:0; }
.ub-label{ font-family:'Orbitron',monospace; font-size:0.58rem; letter-spacing:2px; color:rgba(180,79,255,0.5); flex-shrink:0; }
.ub-name{ font-weight:700; font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:rgba(255,255,255,0.88); }
.ub-group{
  display:none; align-items:center; gap:6px; padding:4px 12px;
  background:rgba(180,79,255,0.09); border:1px solid rgba(180,79,255,0.22); border-radius:50px;
  font-size:0.75rem; color:rgba(180,79,255,0.85); white-space:nowrap;
  max-width:160px; overflow:hidden; text-overflow:ellipsis; flex-shrink:0;
}
.ub-group.show{ display:flex; }
.ub-group .ug-dot{ width:5px; height:5px; border-radius:50%; background:var(--pu); flex-shrink:0; animation:ubBlink 2s ease-in-out infinite; }
@keyframes ubBlink{ 0%,100%{opacity:1} 50%{opacity:0.3} }
.group-mode-btn{
  display:flex; align-items:center; gap:6px; padding:8px 16px;
  background:rgba(180,79,255,0.09); border:1px solid rgba(180,79,255,0.28); border-radius:50px;
  font-family:'Orbitron',monospace; font-size:0.62rem; letter-spacing:1.5px; color:var(--pu);
  cursor:pointer; text-decoration:none; transition:background .2s, border-color .2s, box-shadow .2s;
  white-space:nowrap; flex-shrink:0;
}
.group-mode-btn:active{ background:rgba(180,79,255,0.18); border-color:var(--pu); }
.graph-btn{
  position:relative; display:flex; align-items:center; justify-content:center;
  width:40px; height:40px; flex-shrink:0;
  background:rgba(0,242,255,0.09); border:1px solid rgba(0,242,255,0.28); border-radius:12px;
  color:var(--cy); text-decoration:none; transition:background .2s, border-color .2s;
  font-size:1.1rem; cursor:pointer;
}
.graph-btn:active{ background:rgba(0,242,255,0.18); border-color:var(--cy); }
.graph-btn svg{ display:block; }
.graph-btn .gdot{
  position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%;
  background:#2ecc71; border:1.5px solid var(--bg); display:none; box-shadow:0 0 6px rgba(46,204,113,0.85);
}
.graph-btn .gdot.show{ display:block; }
.hub-mute-btn.muted{ background:rgba(255,45,120,0.09); border-color:rgba(255,45,120,0.32); color:var(--pk); }

.wrap{ max-width:560px; margin:0 auto; padding:20px 18px 0; }

/* ── 스테이지 헤드 ── */
.hero{ text-align:center; margin-bottom:26px; }
.hero-badge{
  display:inline-block; font-family:'Orbitron',monospace; font-size:0.58rem; letter-spacing:3.5px;
  color:rgba(180,79,255,0.75); border:1px solid rgba(180,79,255,0.28);
  padding:5px 16px; border-radius:50px; margin-bottom:14px; background:rgba(180,79,255,0.06);
}
.hero-title{ font-family:'Black Han Sans',sans-serif; font-size:1.9rem; line-height:1.25; margin-bottom:8px; }
.hero-title .g{ background:linear-gradient(90deg,var(--pu),var(--or)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.hero-sub{ font-size:0.82rem; color:rgba(255,255,255,0.38); line-height:1.6; }

/* ── 진행 경로 ── */
.path-line{ display:flex; align-items:center; justify-content:center; gap:5px; margin-bottom:26px; flex-wrap:wrap; }
.path-step{ display:flex; align-items:center; gap:5px; font-size:0.7rem; color:rgba(255,255,255,0.3); white-space:nowrap; }
.path-step.active{ color:var(--pu); }
.path-dot{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.2); }
.path-step.active .path-dot{ background:var(--pu); box-shadow:0 0 8px var(--pu); }
.path-arrow{ width:16px; height:1px; background:rgba(255,255,255,0.15); }

/* ── 스테이지 노드맵(2급 허브 stagemap과 동일 패턴 — 징검다리 경로) ── */
.stagemap{ position:relative; max-width:300px; margin:0 auto 34px; aspect-ratio:340/620; }
.stagemap svg.trail{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.trail-dim{ fill:none; stroke:rgba(255,255,255,0.12); stroke-width:5; stroke-linecap:round; }
.trail-lit{ fill:none; stroke:var(--pu); stroke-width:5; stroke-linecap:round;
  filter:drop-shadow(0 0 5px var(--pu)); transition:stroke-dashoffset 1.4s ease .2s; }
.stagemap .nodes{ position:absolute; inset:0; }
.stage-node{
  position:absolute; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  text-decoration:none; width:118px;
}
.stage-node .disc{
  position:relative;
  width:64px; height:64px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:1.9rem; color:var(--node-color, var(--pu));
  background:rgba(255,255,255,0.04);
  border:2px solid var(--node-color, var(--pu));
  box-shadow:0 0 16px var(--node-glow, rgba(180,79,255,0.35));
  transition:transform 0.18s;
}
.stage-node:active .disc{ transform:scale(0.93); }
.stage-node.cur .disc{ animation:nodePulse 1.6s ease-in-out infinite; }
@keyframes nodePulse{
  0%,100%{ box-shadow:0 0 16px var(--node-glow, rgba(180,79,255,0.35)); }
  50%{ box-shadow:0 0 32px var(--node-glow, rgba(180,79,255,0.35)); }
}
.stage-node.lock .disc{
  color:rgba(255,255,255,0.3); border-color:rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.02); box-shadow:none; cursor:default;
}
.stage-node.lock{ pointer-events:none; }
.stage-node.lock .disc .ei{ opacity:0.35; }
.nm-badge{
  position:absolute; width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:#0b0e16; border:1.5px solid rgba(255,255,255,0.18);
}
.nm-badge svg{ width:13px; height:13px; }
.stage-node .lock-badge{ right:-3px; bottom:-3px; color:rgba(255,255,255,0.6); }
.stage-node .clear-badge{ right:-3px; top:-3px; color:#04240f; background:var(--gn); border-color:var(--gn); box-shadow:0 0 8px var(--gn); }
.stage-node .n-title{ font-family:'Black Han Sans',sans-serif; font-size:0.82rem; color:#fff; text-align:center; line-height:1.25; }
.stage-node.lock .n-title{ color:rgba(255,255,255,0.35); }
.stage-node .n-sub{ font-size:0.62rem; color:var(--node-color, var(--pu)); text-align:center; white-space:nowrap; min-height:1.1em; }
.stage-node.lock .n-sub{ color:rgba(255,255,255,0.3); }

/* ── 하단 계정 관리(2급 허브와 동일) ── */
.hub-footer{ text-align:center; padding-top:20px; border-top:1px solid var(--border); margin-top:30px; }
.logout-btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 24px; background:rgba(255,45,120,0.08);
  border:1px solid rgba(255,45,120,0.25); border-radius:50px;
  font-family:'Orbitron',monospace; font-size:0.64rem; letter-spacing:2px;
  color:rgba(255,45,120,0.7); cursor:pointer;
  transition:background .2s, border-color .2s, color .2s; margin:4px;
}
.logout-btn:active{ background:rgba(255,45,120,0.18); border-color:rgba(255,45,120,0.6); color:#ff2d78; }

/* ── 이론 객관식(2급 허브의 review-entry와 동일 패턴 — 스테이지 아님, 별도 진입점) ── */
.review-entry{
  display:flex; align-items:center; gap:14px; text-decoration:none;
  background:linear-gradient(100deg, rgba(180,79,255,.18), rgba(0,242,255,.12));
  border:1px solid rgba(0,242,255,.28); border-radius:18px;
  padding:16px 18px; margin-bottom:22px; color:#eaf2ff;
  transition:transform .15s;
}
.review-entry:active{ transform:scale(.985); }
.review-entry .re-icon{ font-size:1.7rem; flex:none; }
.review-entry .re-body{ flex:1; min-width:0; }
.review-entry .re-title{ font-weight:700; font-size:1.02rem; letter-spacing:-.2px; }
.review-entry .re-desc{ font-size:.78rem; color:rgba(234,242,255,.6); margin-top:3px; }
.review-entry .re-go{ font-size:1.1rem; color:#00f2ff; flex:none; }
.review-entry.locked{ opacity:0.5; pointer-events:none; }
.review-entry.locked .re-go{ color:rgba(255,255,255,0.4); font-size:1rem; }

/* ── 안내 박스 ── */
.notice{
  background:rgba(255,152,0,0.06); border:1px solid rgba(255,152,0,0.22);
  border-radius:16px; padding:15px 18px; font-size:0.78rem; line-height:1.7;
  color:rgba(255,255,255,0.62); margin-bottom:24px;
}
.notice b{ color:var(--or); }

@media (max-width:400px){
  .hero-title{ font-size:1.62rem; }
  .stagemap{ max-width:260px; }
}
/* 좁은 폰에서 상단바가 넘치지 않도록 */
@media (max-width:340px){
  .user-bar{ padding-left:10px; padding-right:10px; gap:5px; }
  .group-mode-btn{ font-size:0.58rem; padding:7px 12px; }
  .ub-group{ max-width:100px; font-size:0.68rem; }
}
</style>
</head>
<body>

<div class="user-bar" id="user-bar">
  <div class="ub-nick">
    <span class="ub-label">PLAYER</span>
    <span class="ub-name" id="ub-name">게스트</span>
  </div>
  <div class="ub-group" id="ub-group-el">
    <div class="ug-dot"></div>
    <span id="ub-group-name">—</span>
  </div>
  <a class="group-mode-btn" href="select_level.html" style="color:var(--or); border-color:rgba(255,152,0,0.3); background:rgba(255,152,0,0.07);">🔀 급수 변경</a>
  <a class="group-mode-btn" href="group.html">👥 그룹 모드</a>
  <button class="graph-btn hub-mute-btn" id="hub-mute-btn" onclick="toggleHubMute()" title="전체 음소거" aria-label="전체 음소거">🎵</button>
  <a class="graph-btn" href="growth.html" title="내 성장 그래프" aria-label="내 성장 그래프">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
      <polyline points="17 6 23 6 23 12"></polyline>
    </svg>
    <span class="gdot" id="growth-dot"></span>
  </a>
</div>

<div class="wrap">

  <div class="hero">
    <div class="hero-badge">LEVEL 1 · 원가회계</div>
    <div class="hero-title">전산회계 1급<br><span class="g">원가의 길</span></div>
    <div class="hero-sub">공장을 직접 걸어다니며<br>원재료가 제품이 되는 길을 따라갑니다</div>
  </div>

  <div class="path-line">
    <div class="path-step active"><div class="path-dot"></div>원재료</div>
    <div class="path-arrow"></div>
    <div class="path-step active"><div class="path-dot"></div>재공품</div>
    <div class="path-arrow"></div>
    <div class="path-step active"><div class="path-dot"></div>제품</div>
    <div class="path-arrow"></div>
    <div class="path-step"><div class="path-dot"></div>배분</div>
    <div class="path-arrow"></div>
    <div class="path-step"><div class="path-dot"></div>결산</div>
  </div>

  <div class="notice">
    <b>개발 중입니다.</b> 스테이지 1을 먼저 만들고 있어요.<br>
    이론 문제은행과 나머지 스테이지는 순차적으로 열립니다.
  </div>

  <!-- ── 이론 객관식: 2급처럼 스테이지가 아니라 별도 진입점(아직 미구현이라 잠금) ── -->
  <div class="review-entry theory-entry locked" title="준비 중">
    <div class="re-icon">📝</div>
    <div class="re-body">
      <div class="re-title">이론 객관식 (필기)</div>
      <div class="re-desc">1급 기출 27회차 기반 문제은행 · 준비 중</div>
    </div>
    <div class="re-go">🔒</div>
  </div>

  <!-- ── 스테이지 노드맵(2급 허브 stagemap과 동일 패턴, 게임 스테이지만) ── -->
  <div class="stagemap">
    <svg class="trail" viewBox="0 0 340 620" preserveAspectRatio="none" aria-hidden="true">
      <path class="trail-dim" d="M240,70 C240,180 100,160 100,290 C100,420 240,400 240,540"/>
      <path class="trail-lit" id="trail-lit" d="M240,70 C240,180 100,160 100,290 C100,420 240,400 240,540"/>
    </svg>
    <div class="nodes">
      <a class="stage-node cur" id="node-s1" href="stage1_cost.html" style="left:70%;top:11%; --node-color:var(--pu); --node-glow:rgba(180,79,255,0.4);">
        <div class="disc">🏭
          <span class="nm-badge clear-badge" title="클리어" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>
          </span>
        </div>
        <div class="n-title">STAGE 1<br>원가의 길</div>
        <div class="n-sub" id="sub-s1">자료 0/14</div>
      </a>
      <div class="stage-node lock" id="node-s2" style="left:30%;top:47%; --node-color:var(--or);">
        <div class="disc">⚖️<span class="nm-badge lock-badge" title="준비 중"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span></div>
        <div class="n-title">STAGE 2<br>배분의 방</div>
        <div class="n-sub">준비 중</div>
      </div>
      <a class="stage-node lock" id="node-s3" href="stage3_capital.html" style="left:70%;top:87%; --node-color:var(--cy); --node-glow:rgba(0,242,255,0.4);">
        <div class="disc">👑
          <span class="nm-badge lock-badge" title="스테이지1 클리어 필요">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </span>
          <span class="nm-badge clear-badge" title="클리어" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>
          </span>
        </div>
        <div class="n-title">STAGE 3<br>자본의 제왕</div>
        <div class="n-sub" id="sub-s3">스테이지1 클리어 필요</div>
      </a>
    </div>
  </div>

  <div class="hub-footer">
    <button class="logout-btn" onclick="changeNickname()">✏️ &nbsp;닉네임 변경</button>
    <button class="logout-btn" onclick="doLogout()">⏻ &nbsp;로그아웃</button>
  </div>
  <div class="hub-footer" id="delete-account-row" style="margin-top:6px;display:none;">
    <button class="logout-btn" onclick="doDeleteAccount()" style="color:var(--pk);border-color:rgba(255,45,120,0.3);">🗑️ &nbsp;회원 탈퇴</button>
  </div>
  <div class="hub-footer" style="margin-top:6px;">
    <button class="logout-btn" onclick="resetLv1Progress()" style="color:rgba(255,255,255,0.45);border-color:rgba(255,255,255,0.15);">🔄 &nbsp;데이터 초기화</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
/* 닉네임/그룹 표시 + 탈퇴 버튼 노출(2급 허브와 동일 로직 — 통일감) */
(function(){
  try{
    const n=(localStorage.getItem('hub_nickname')||'').trim();
    if(n) document.getElementById('ub-name').textContent=n;
    const gname=localStorage.getItem('hub_group_name');
    if(gname){
      document.getElementById('ub-group-name').textContent=gname;
      document.getElementById('ub-group-el').classList.add('show');
    }
    if(localStorage.getItem('hub_uid')){
      const row=document.getElementById('delete-account-row');
      if(row) row.style.display='block';
    }
  }catch(e){}
})();

/* 전역 음소거 토글(hub_muted) — 2급 허브와 동일 */
(function(){
  const btn=document.getElementById('hub-mute-btn');
  if(!btn) return;
  const isHubMuted=localStorage.getItem('hub_muted')==='true';
  btn.textContent=isHubMuted?'🔇':'🎵';
  btn.classList.toggle('muted', isHubMuted);
})();
function toggleHubMute(){
  const muted=localStorage.getItem('hub_muted')==='true';
  const next=!muted;
  localStorage.setItem('hub_muted', next);
  const btn=document.getElementById('hub-mute-btn');
  if(btn){ btn.textContent=next?'🔇':'🎵'; btn.classList.toggle('muted', next); }
}

/* 스테이지1 진행률 — 서류철 수집 개수(총 14) 기준, 노드맵 상태 반영 */
function renderStageMap(){
  const TOTAL_DOCS=14;
  let docs=0, cleared=false;
  try{
    const raw=localStorage.getItem('lv1_s1_progress');
    if(raw){ const s=JSON.parse(raw)||{};
      docs=Array.isArray(s.docs)?s.docs.length:0;
      cleared=!!s.cleared; }
  }catch(e){}
  const node=document.getElementById('node-s1'), sub=document.getElementById('sub-s1');
  const clearBadge=node.querySelector('.clear-badge');
  if(cleared){
    node.classList.remove('cur'); node.classList.add('done');
    clearBadge.style.display='flex';
    sub.textContent='클리어';
  } else {
    sub.textContent = docs>0 ? `자료 ${docs}/${TOTAL_DOCS}` : '도전!';
  }

  // 스테이지3(자본의 제왕) — 스테이지2(배분의 방)가 아직 없어서, 스테이지1 클리어로 바로 언락
  let s3Cleared=false, s3Score=0;
  try{
    const raw3=localStorage.getItem('lv1_s3_progress');
    if(raw3){ const s3=JSON.parse(raw3)||{}; s3Cleared=!!s3.cleared; s3Score=s3.score||0; }
  }catch(e){}
  const node3=document.getElementById('node-s3'), sub3=document.getElementById('sub-s3');
  if(node3){
    const lockBadge3=node3.querySelector('.lock-badge'), clearBadge3=node3.querySelector('.clear-badge');
    if(cleared){
      node3.classList.remove('lock');
      lockBadge3.style.display='none';
      if(s3Cleared){
        node3.classList.add('done');
        clearBadge3.style.display='flex';
        sub3.textContent=`클리어 · ${s3Score}점`;
      } else {
        node3.classList.add('cur');
        sub3.textContent='도전!';
      }
    } else {
      sub3.textContent='스테이지1 클리어 필요';
    }
  }

  const lit=document.getElementById('trail-lit');
  if(lit){
    const total=lit.getTotalLength();
    lit.style.strokeDasharray=total;
    // 3노드 경로 — 스테이지1 클리어로 절반(스테이지2 방향)까지, 스테이지3 클리어로 끝까지 밝혀짐
    const frac = cleared ? (s3Cleared ? 1 : 0.5) : 0;
    lit.style.strokeDashoffset = total*(1-frac);
  }
}

async function doLogout(){
  if(!confirm('로그아웃 하시겠습니까?\n닉네임과 그룹 정보가 초기화됩니다.')) return;
  if(window.Auth && Auth.socialAvailable()){ try{ await Auth.signOut(); }catch(e){} }
  localStorage.removeItem('hub_nickname');

  const base=location.pathname.replace(/[^/]*$/, '');

async function doDeleteAccount(){
  const btn=event && event.target ? event.target : null;
  const typed=prompt('정말 탈퇴하시겠어요?\n계정과 모든 기록이 영구히 삭제됩니다.\n\n계속하려면 아래에 "탈퇴"라고 입력해주세요.');
  if(typed===null) return;
  if(typed.trim()!=='탈퇴'){ alert('입력한 내용이 "탈퇴"와 일치하지 않아 취소했어요.'); return; }
  if(!window.Auth || !Auth.socialAvailable()) return;
  try{
    if(btn) btn.textContent='삭제 중...';
    await Auth.deleteAccount();
    alert('계정이 삭제됐어요. 그동안 함께해줘서 고마워요!');
    const base=location.pathname.replace(/[^/]*$/, '');
    window.location.replace(base+'login.html');
  }catch(e){
    alert('탈퇴에 실패했어요. 네트워크를 확인하고 다시 시도해주세요.');
    if(btn) btn.textContent='🗑️  회원 탈퇴';
  }
}

  const name=input.trim();
  if(name.length<2){ alert('2글자 이상 입력해주세요'); return; }
  if(name.length>12){ alert('12글자 이하로 입력해주세요'); return; }

  const db=_sbClient();
  if(db){

    }catch(e){}
  }
  if(db){
    try{
      const {data:renamed, error}=await db.rpc('rename_player', {p_old:oldName, p_new:name});
      if(error && error.code==='PGRST202'){
        const {error:e2}=await db.from('scores').update({name:name}).eq('name',oldName);
        if(e2) throw e2;
      } else if(error){ throw error; }
      else if(renamed!==true){ alert('⚠️ 서버에서 닉네임 변경이 거부되었어요. (이미 사용 중인 이름일 수 있어요)'); return; }

      return;
    }
  }
  if(window.WrongNote && WrongNote.rename){ try{ await WrongNote.rename(oldName,name); }catch(e){} }
  if(window.Growth && Growth.rename){ try{ await Growth.rename(oldName,name); }catch(e){} }
  localStorage.setItem('hub_nickname', name);
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.endsWith('_myName') && localStorage.getItem(k)===oldName) localStorage.setItem(k,name);
  }
  const el=document.getElementById('ub-name');

}
