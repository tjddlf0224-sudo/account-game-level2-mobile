<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 저장소가 막힌 환경(프라이빗 브라우징·사이트데이터 차단)에서도 게임이 돌아가게 한다.
         **반드시 다른 스크립트보다 먼저** 로드돼야 한다 — 2026-09-16 검토에서
         이게 없으면 게임 5종이 시작조차 안 되는 것을 확인했다. -->
    <script src="safestore.js?v=31"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- 웹 배포판 전용 배너 광고(Google AdSense) — 네이티브 앱은 AdMob 배너를 따로 씀, 게임 플레이 화면엔 조작 방해 방지로 안 넣고 허브 화면에만 삽입 -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7418287954060066" crossorigin="anonymous"></script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050310">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>전산회계 1급 — 원가의 길</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cy:#00f2ff; --pk:#ff2d78; --gd:#ffd600; --gn:#00e676; --pu:#b44fff; --or:#ff9800;
  --bg:#050310;
  --border:rgba(255,255,255,0.10);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body{
  font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:#fff;
  min-height:100vh; min-height:100dvh;
  /* 하단 여백은 --ad-banner-h(배너를 띄우려는 의사)와 --ad-safe-h(배너가 있을 수도 있는
     자리) 중 큰 값을 쓴다. 의사만 보면, 플러그인 프록시가 늦게 붙거나 이전 페이지에서 띄운
     배너가 남아 있을 때 여백이 0 이 돼 하단 버튼이 배너에 깔린 채 스크롤 여지도 없어진다
     (2026-09-14 전 화면 감사에서 그룹 43px·1급허브 10px·문의 5px 모자람 확인). */
  padding-bottom:calc(40px + max(var(--ad-banner-h,0px), var(--ad-safe-h,0px)));
  background-image:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(180,79,255,0.10) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 85% 75%, rgba(255,152,0,0.07) 0%, transparent 55%);
}

/* ── 상단바(2급 허브 index.html의 .user-bar와 동일 패턴 — 통일감) ── */
.user-bar{
  position:sticky; top:0; z-index:200;
  display:flex; align-items:center; gap:10px;
  /* ⚠ flex-wrap 금지 — 예전엔 wrap 이라 좁은 폰에서 ⚙️ 가 둘째 줄로 내려가
     헤더가 71px→110px 로 두 배가 됐다(2026-09-14 측정). 한 줄로 두고 아래
     @media(≤380px) 에서 간격·크기를 줄여 맞춘다. */
  flex-wrap:nowrap;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:rgba(5,3,16,0.88); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
  /* 닉네임은 학생 본인 이름이다 — 자리 경쟁에서 마지막까지 살아남아야 한다.
     예전엔 .ub-nick 만 flex:1 이고 나머지가 전부 flex-shrink:0 이라, 폭이 모자라면
     닉네임이 0 까지 찌그러져 통째로 사라졌다(390px 실측 3~19px). 그룹 칩이 먼저
     줄어들고(말줄임) 닉네임은 최소 44px 를 지킨다. */
.ub-nick{ display:flex; align-items:center; gap:7px; flex:1 1 auto; min-width:44px; overflow:hidden; }
.ub-label{ font-family:'Orbitron',monospace; font-size:0.58rem; letter-spacing:2px; color:rgba(180,79,255,0.5); flex-shrink:0; }
.ub-name{ font-weight:700; font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:rgba(255,255,255,0.88); }
.ub-group{
  display:none; align-items:center; gap:6px; padding:4px 12px;
  background:rgba(180,79,255,0.09); border:1px solid rgba(180,79,255,0.22); border-radius:50px;
  font-size:0.75rem; color:rgba(180,79,255,0.85); white-space:nowrap;
  max-width:160px; overflow:hidden; text-overflow:ellipsis;
  flex:0 1 auto; min-width:0;   /* 자리가 모자라면 닉네임보다 먼저 줄어든다 */
}
.ub-group.show{ display:flex; }
.ub-group .ug-dot{ width:5px; height:5px; border-radius:50%; background:var(--pu); flex-shrink:0; animation:ubBlink 2s ease-in-out infinite; }
@keyframes ubBlink{ 0%,100%{opacity:1} 50%{opacity:0.3} }
.group-mode-btn{
  display:flex; align-items:center; gap:6px; padding:8px 16px;
  background:rgba(180,79,255,0.09); border:1px solid rgba(180,79,255,0.28); border-radius:50px;
  font-family:'Orbitron',monospace; font-size:0.62rem; letter-spacing:1.5px; color:var(--pu);
  cursor:pointer; text-decoration:none; transition:background .2s, border-color .2s, box-shadow .2s;
  white-space:nowrap; flex-shrink:0;
}
.group-mode-btn:active{ background:rgba(180,79,255,0.18); border-color:var(--pu); }
.graph-btn{
  position:relative; display:flex; align-items:center; justify-content:center;
  width:40px; height:40px; flex-shrink:0;
  background:rgba(0,242,255,0.09); border:1px solid rgba(0,242,255,0.28); border-radius:12px;
  color:var(--cy); text-decoration:none; transition:background .2s, border-color .2s;
  font-size:1.1rem; cursor:pointer;
}
.graph-btn:active{ background:rgba(0,242,255,0.18); border-color:var(--cy); }
.graph-btn svg{ display:block; }
.graph-btn .gdot{
  position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%;
  background:#2ecc71; border:1.5px solid var(--bg); display:none; box-shadow:0 0 6px rgba(46,204,113,0.85);
}
.graph-btn .gdot.show{ display:block; }
.hub-mute-btn.muted{ background:rgba(255,45,120,0.09); border-color:rgba(255,45,120,0.32); color:var(--pk); }

.wrap{ max-width:560px; margin:0 auto; padding:20px 18px 0; }

/* ── D-day 카운터(2급 허브와 동일) ── */
.examday-box {
  max-width: 640px; margin: 0 auto 20px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 18px; padding: 16px 20px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.examday-box .ed-dday { font-family:'Orbitron',monospace; font-weight:900; font-size:1.5rem; color:var(--gd); letter-spacing:1px; flex-shrink:0; }
.examday-box .ed-body { flex:1; min-width:160px; display:flex; flex-direction:column; gap:6px; }
.examday-box .ed-date { font-size:0.78rem; color:rgba(255,255,255,0.45); }
.examday-box .ed-goal { display:flex; align-items:center; gap:8px; }
.examday-box .ed-goal-bar { flex:1; height:8px; border-radius:50px; background:rgba(255,255,255,0.08); overflow:hidden; }
.examday-box .ed-goal-fill { height:100%; border-radius:50px; background:linear-gradient(90deg,var(--cy),var(--gn)); transition:width .3s; width:0%; }
.examday-box .ed-goal-txt { font-size:0.74rem; color:rgba(255,255,255,0.55); white-space:nowrap; flex-shrink:0; }
.examday-box .ed-set-btn {
  flex-shrink:0; background:transparent; border:1px solid rgba(255,214,0,0.3); color:var(--gd);
  border-radius:50px; padding:8px 16px; font-family:'Orbitron',monospace; font-size:0.62rem;
  letter-spacing:1.5px; cursor:pointer; transition:background .2s, border-color .2s;
}
.examday-box .ed-set-btn:active, .examday-box .ed-set-btn:hover{ background:rgba(255,214,0,0.12); border-color:var(--gd); }
@media (max-width:600px){
  .examday-box{ padding:12px 14px; margin-bottom:16px; gap:10px; }
  .examday-box .ed-dday{ font-size:1.15rem; }
  .examday-box .ed-set-btn{ padding:7px 12px; font-size:0.56rem; }
}

/* ── 스테이지 노드맵(2급 허브 stagemap과 동일 패턴 — 징검다리 경로) ── */
.stagemap{ position:relative; max-width:300px; margin:0 auto 34px; aspect-ratio:340/1000; }
.stagemap svg.trail{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.trail-dim{ fill:none; stroke:rgba(255,255,255,0.12); stroke-width:5; stroke-linecap:round; }
.trail-lit{ fill:none; stroke:var(--pu); stroke-width:5; stroke-linecap:round;
  filter:drop-shadow(0 0 5px var(--pu)); transition:stroke-dashoffset 1.4s ease .2s; }
.stagemap .nodes{ position:absolute; inset:0; }
.stage-node{
  position:absolute; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  text-decoration:none; width:118px;
}
.stage-node .disc{
  position:relative;
  width:64px; height:64px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:1.9rem; color:var(--node-color, var(--pu));
  background:rgba(255,255,255,0.04);
  border:2px solid var(--node-color, var(--pu));
  box-shadow:0 0 16px var(--node-glow, rgba(180,79,255,0.35));
  transition:transform 0.18s;
}
.stage-node:active .disc{ transform:scale(0.93); }
.stage-node.cur .disc{ animation:nodePulse 1.6s ease-in-out infinite; }
@keyframes nodePulse{
  0%,100%{ box-shadow:0 0 16px var(--node-glow, rgba(180,79,255,0.35)); }
  50%{ box-shadow:0 0 32px var(--node-glow, rgba(180,79,255,0.35)); }
}
.stage-node.lock .disc{
  color:rgba(255,255,255,0.3); border-color:rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.02); box-shadow:none; cursor:default;
}
/* pointer-events:none이었던 걸 제거 — 잠긴 노드도 탭해서 "광고 보고 열기"(2급과 동일
   2탭 확인 패턴, onNodeClick)를 쓸 수 있어야 함. 실제 이동 차단은 onNodeClick 안의
   e.preventDefault()가 담당. */
.stage-node.lock .disc .ei{ opacity:0.35; }
.nm-badge{
  position:absolute; width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:#0b0e16; border:1.5px solid rgba(255,255,255,0.18);
}
.nm-badge svg{ width:13px; height:13px; }
.stage-node .lock-badge{ right:-3px; bottom:-3px; color:rgba(255,255,255,0.6); }
.stage-node .clear-badge{ right:-3px; top:-3px; color:#04240f; background:var(--gn); border-color:var(--gn); box-shadow:0 0 8px var(--gn); }
.stage-node .n-title{ font-family:'Black Han Sans',sans-serif; font-size:0.82rem; color:#fff; text-align:center; line-height:1.25; }
.stage-node.lock .n-title{ color:rgba(255,255,255,0.35); }
.stage-node .n-sub{ font-size:0.62rem; color:var(--node-color, var(--pu)); text-align:center; white-space:nowrap; min-height:1.1em; }
.stage-node.lock .n-sub{ color:rgba(255,255,255,0.3); }

/* ── 하단 계정 관리(2급 허브와 동일) ── */
.hub-footer{ text-align:center; padding-top:20px; border-top:1px solid var(--border); margin-top:30px; }
.logout-btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 24px; background:rgba(255,45,120,0.08);
  border:1px solid rgba(255,45,120,0.25); border-radius:50px;
  font-family:'Orbitron',monospace; font-size:0.64rem; letter-spacing:2px;
  color:rgba(255,45,120,0.7); cursor:pointer;
  transition:background .2s, border-color .2s, color .2s; margin:4px;
}
.logout-btn:active{ background:rgba(255,45,120,0.18); border-color:rgba(255,45,120,0.6); color:#ff2d78; }

/* ── 이론 객관식(2급 허브의 review-entry와 동일 패턴 — 스테이지 아님, 별도 진입점) ── */
.review-entry{
  display:flex; align-items:center; gap:14px; text-decoration:none;
  background:linear-gradient(100deg, rgba(180,79,255,.18), rgba(0,242,255,.12));
  border:1px solid rgba(0,242,255,.28); border-radius:18px;
  padding:16px 18px; margin-bottom:22px; color:#eaf2ff;
  transition:transform .15s;
}
.review-entry:active{ transform:scale(.985); }
.review-entry .re-icon{ font-size:1.7rem; flex:none; }
.review-entry .re-body{ flex:1; min-width:0; }
.review-entry .re-title{ font-weight:700; font-size:1.02rem; letter-spacing:-.2px; }
.review-entry .re-desc{ font-size:.78rem; color:rgba(234,242,255,.6); margin-top:3px; }
.review-entry .re-go{ font-size:1.1rem; color:#00f2ff; flex:none; }
.review-entry.locked{ opacity:0.5; pointer-events:none; }
.review-entry.locked .re-go{ color:rgba(255,255,255,0.4); font-size:1rem; }

@media (max-width:400px){
  .examday-box .ed-dday{ font-size:1.05rem; }
  .stagemap{ max-width:260px; }
}
/* 좁은 화면에선 장식용 'PLAYER' 라벨을 감춘다(2026-09-14, 사용자 선택).
   390px 에서 .ub-nick 이 flex:1 로 폭 0 까지 찌그러지는데 이 라벨은 flex-shrink:0 이라
   밖으로 삐져나와 옆 그룹 칩 위에 겹쳐 그려졌다. 정작 닉네임은 안 보이고 라벨만 보였다.
   버튼 글자는 하나도 안 건드린다 — 600px 이상에선 라벨도 그대로 보인다.
   (아래 340px 블록은 더 좁은 폰 전용이라 390px 에선 안 걸린다 — 그래서 따로 둔다) */
@media (max-width:600px){
  .ub-label{ display:none; }
}
/* 좁은 폰에서 상단바가 넘치지 않도록 */
@media (max-width:340px){
  .user-bar{ padding-left:10px; padding-right:10px; gap:5px; }
  .group-mode-btn{ font-size:0.58rem; padding:7px 12px; }
  .ub-group{ max-width:100px; font-size:0.68rem; }
}
/* ── 설정 패널(2026-09-14, 사용자 요청) ──
   상단바 맨 오른쪽 톱니바퀴에 모아 둔다: 배경음악 · 닉네임 변경 · 로그아웃 ·
   회원 탈퇴 · 데이터 초기화. 예전엔 음악만 상단바에 있고 나머지는 허브 맨 아래에
   흩어져 있어서, 스테이지 목록을 끝까지 내려야 로그아웃을 찾을 수 있었다. */
.set-ov{
  display:none; position:fixed; inset:0; z-index:9998;
  background:rgba(2,6,14,0.72); backdrop-filter:blur(6px);
  align-items:center; justify-content:center; padding:20px;
}
.set-ov.show{ display:flex; }
.set-box{
  width:min(340px,100%); max-height:86vh; overflow-y:auto;
  background:#121826; border:1px solid rgba(255,255,255,0.12); border-radius:18px;
  padding:16px 16px 14px; box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.set-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.set-title{ font-family:'Orbitron',monospace; font-size:0.72rem; letter-spacing:3px; color:rgba(255,255,255,0.55); }
.set-x{
  width:32px; height:32px; border-radius:9px; border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.7); font-size:0.9rem; cursor:pointer;
}
.set-who{
  display:flex; align-items:baseline; gap:8px; padding:8px 2px 12px;
  border-bottom:1px solid rgba(255,255,255,0.08); margin-bottom:10px;
}
.set-who-label{ font-family:'Orbitron',monospace; font-size:0.54rem; letter-spacing:2px; color:rgba(255,255,255,0.35); }
.set-who b{ font-size:0.98rem; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.set-item{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:13px 12px; margin-bottom:7px; min-height:48px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.10);
  border-radius:12px; color:#eaf0ff; font-family:inherit; font-size:0.9rem;
  text-align:left; cursor:pointer; transition:background .15s, border-color .15s;
}
.set-item:active{ background:rgba(255,255,255,0.12); }
.set-item .set-ico{ font-size:1.05rem; width:22px; text-align:center; flex-shrink:0; }
.set-item .set-label{ flex:1; min-width:0; }
.set-item.muted{ color:rgba(255,255,255,0.45); }
.set-item.danger{ color:#ff5b8a; border-color:rgba(255,45,120,0.28); }
.set-item.quiet{ color:rgba(255,255,255,0.45); border-color:rgba(255,255,255,0.10); }


@media (max-width: 380px) {
  .user-bar { gap: 6px; padding-left: 10px; padding-right: 10px; }
  .user-bar .ub-nick { min-width: 34px; overflow: hidden; }
  .user-bar .ub-group { max-width: 72px; font-size: 0.64rem; padding: 4px 8px; }
  .user-bar .group-mode-btn { padding: 7px 9px; font-size: 0.55rem; letter-spacing: 1px; }
  .user-bar .graph-btn { width: 36px; height: 36px; }
  .user-bar .stk-pill { height: 36px; padding: 0 7px; }
  .user-bar .stk-pill .stk-d { font-size: 0.7rem; }
}

/* ── 상단바 2줄 구조 (2026-09-14, 사용자 지시 "닉네임 아랫줄로, 아예 깔끔하게") ──
   한 줄에 7개(닉네임·그룹칩·급수·연속·👥·📈·⚙️)는 320~390px 에서 물리적으로 무리였다.
   좁힐수록 닉네임이 먼저 사라지고 그룹 칩은 점 하나만 남는 식으로 계속 무언가를 잃었다.
   윗줄=조작부(오른쪽 정렬), 아랫줄=누구인지. 이제 어느 폭에서도 아무것도 안 접는다. */
.user-bar { flex-direction: column; align-items: stretch; gap: 6px; }
/* 윗줄: 왼쪽에 그룹(아이콘+이름), 오른쪽에 나머지 조작부 */
.user-bar .ub-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.user-bar .ub-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
/* 그룹 아이콘과 이름을 한 덩어리 링크로 — 아랫줄 닉네임과 세로로 맞는다 */
.user-bar .ub-grouplink {
  display: flex; align-items: center; gap: 8px;
  flex: 0 1 auto; min-width: 0; text-decoration: none;
}
.user-bar .ub-grouplink .graph-btn { flex: 0 0 auto; }
.user-bar .ub-nick {
  display: flex; align-items: center; gap: 8px;
  flex: 0 0 auto; min-width: 0; overflow: hidden;
}
.user-bar .ub-name { font-size: 0.86rem; }
.user-bar .ub-group { max-width: none; flex: 0 1 auto; min-width: 0; padding: 3px 10px; font-size: 0.7rem; }

<script>
/* 닉네임/그룹 표시 + 탈퇴 버튼 노출(2급 허브와 동일 로직 — 통일감) */
(function(){

    if(n) document.getElementById('ub-name').textContent=n;
    const gname=localStorage.getItem('hub_group_name');
    if(gname){
      document.getElementById('ub-group-name').textContent=gname;
      document.getElementById('ub-group-el').classList.add('show');
    }
    // 탈퇴 버튼 노출 판정은 openSettings() 에서 한다(패널이 body 맨 끝이라 여기선 아직 없다)
  }catch(e){}
})();

/* 전역 음소거(hub_muted): 게임별 *_muted 키는 그대로 두고, 없을 때만 이 값을 참조한다.
   버튼이 상단바 아이콘에서 설정 패널의 글자 행으로 옮겨져서, 이모지만 갈아끼우던
   예전 방식(textContent 교체)으로는 라벨까지 지워진다 — 아이콘/라벨을 따로 갱신한다. */
function applyHubMuteUI() {
  const btn = document.getElementById('hub-mute-btn');
  if (!btn) return;
  const muted = localStorage.getItem('hub_muted') === 'true';
  btn.classList.toggle('muted', muted);
  const ico = btn.querySelector('.set-ico'), lab = btn.querySelector('.set-label');
  if (ico) ico.textContent = muted ? '🔇' : '🎵';
  if (lab) lab.textContent = muted ? '배경음악 꺼짐' : '배경음악 켜짐';
}

/* ── 설정 패널 열고 닫기 ── */
function openSettings() {
  const el = document.getElementById('set-nick');
  if (el) el.textContent = localStorage.getItem('hub_nickname') || '—';
  /* 회원 탈퇴는 소셜(Firebase) 계정일 때만 — 애플/구글 심사 요건상 "계정 생성"을
     제공하면 앱 내 탈퇴 경로도 반드시 있어야 한다.
     ⚠ 로그인 체크 IIFE 는 페이지 위쪽에서 돌고 이 패널은 body 맨 끝에 있어서,
        거기서 미리 켜 두면 요소가 아직 없어 조용히 실패한다(실제로 한 번 그랬다).
        열 때마다 판정하는 게 순서에 안 휘둘린다. */
  const del = document.getElementById('delete-account-row');
  if (del) del.style.display = localStorage.getItem('hub_uid') ? '' : 'none';
  applyHubMuteUI();
  document.getElementById('settings-ov').classList.add('show');
}
function closeSettings() {
  document.getElementById('settings-ov').classList.remove('show');
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSettings(); });
function toggleHubMute() {
  const next = localStorage.getItem('hub_muted') !== 'true';
  localStorage.setItem('hub_muted', String(next));
  /* ⚠ 게임마다 자체 🎵 버튼이 있고 그게 `<게임>_muted` 를 쓴다. 게임은 그 키가 있으면
     그걸 우선 보고, 없을 때만 hub_muted 를 본다. 그래서 여기서 hub_muted 만 바꾸면
     **한 번이라도 게임 안에서 음소거한 게임은 영영 못 켠다** — 설정엔 '배경음악 켜짐'
     인데 소리는 안 나는 상태가 된다(2026-09-14 제보). 전역 토글은 말 그대로 전역이어야
     하므로, 개별 설정을 지워서 모든 게임이 이 값을 따르게 한다. */
  try {
    Object.keys(localStorage)
      .filter(k => /_muted$/.test(k) && k !== 'hub_muted')
      .forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  applyHubMuteUI();
}
applyHubMuteUI();


/* 스테이지1 진행률 — 서류철 수집 개수(총 14) 기준, 노드맵 상태 반영 */

  const TOTAL_DOCS=14;

  try{
    const raw=localStorage.getItem('lv1_s1_progress');

  }catch(e){}
  const node=document.getElementById('node-s1'), sub=document.getElementById('sub-s1');
  const clearBadge=node.querySelector('.clear-badge');
  if(cleared){
    node.classList.remove('cur'); node.classList.add('done');
    clearBadge.style.display='flex';
    sub.textContent='클리어';
  } else {
    node.classList.remove('done'); node.classList.add('cur');
    clearBadge.style.display='none';
    sub.textContent = docs>0 ? `자료 ${docs}/${TOTAL_DOCS}` : '도전!';
  }

  // 스테이지3(자본의 제왕) — 스테이지2(배분의 방)가 아직 없어서, 스테이지1 클리어로 바로 언락
  let s3Cleared=false, s3Score=0;
  try{
    const raw3=localStorage.getItem('lv1_s3_progress');
    if(raw3){ const s3=JSON.parse(raw3)||{}; s3Cleared=!!s3.cleared; s3Score=s3.score||0; }
  }catch(e){}
  const adUnlockS3 = localStorage.getItem('hub_adunlock_s3')==='1';
  const node3=document.getElementById('node-s3'), sub3=document.getElementById('sub-s3');
  if(node3){
    const lockBadge3=node3.querySelector('.lock-badge'), clearBadge3=node3.querySelector('.clear-badge');
    if(cleared || adUnlockS3){
      node3.classList.remove('lock');
      lockBadge3.style.display='none';
      if(s3Cleared){
        node3.classList.add('done');
        clearBadge3.style.display='flex';
        sub3.textContent=`클리어 · ${s3Score}점`;
      } else {
        node3.classList.remove('done'); node3.classList.add('cur');
        clearBadge3.style.display='none';
        sub3.textContent='도전!';

    } else {
      sub3.textContent='스테이지1 클리어 필요';

  // 스테이지3(전표의 눈) — 스테이지2(자본의 제왕) 클리어로 순차 언락(진짜 3단계 시퀀스가 됨)
  let s4Cleared=false, s4Score=0;

  }catch(e){}
  const adUnlockS4 = localStorage.getItem('hub_adunlock_s4')==='1';
  const node4=document.getElementById('node-s4'), sub4=document.getElementById('sub-s4');
  if(node4){
    const lockBadge4=node4.querySelector('.lock-badge'), clearBadge4=node4.querySelector('.clear-badge');
    if(s3Cleared || adUnlockS4){
      node4.classList.remove('lock');
      lockBadge4.style.display='none';
      if(s4Cleared){
        node4.classList.add('done');
        clearBadge4.style.display='flex';
        sub4.textContent=`클리어 · ${s4Score}점`;
      } else {
        node4.classList.remove('done'); node4.classList.add('cur');
        clearBadge4.style.display='none';
        sub4.textContent='도전!';
      }
    } else {
      sub4.textContent='스테이지2 클리어 필요';
    }
  }

  // 스테이지4(신고의 문) — 스테이지3(전표의 눈) 클리어로 순차 언락
  let s5Cleared=false, s5Score=0;
  try{
    const raw5=localStorage.getItem('lv1_s5_progress');
    if(raw5){ const s5=JSON.parse(raw5)||{}; s5Cleared=!!s5.cleared; s5Score=s5.score||0; }
  }catch(e){}
  const adUnlockS5 = localStorage.getItem('hub_adunlock_s5')==='1';
  const node5=document.getElementById('node-s5'), sub5=document.getElementById('sub-s5');
  if(node5){
    const lockBadge5=node5.querySelector('.lock-badge'), clearBadge5=node5.querySelector('.clear-badge');
    if(s4Cleared || adUnlockS5){
      node5.classList.remove('lock');
      lockBadge5.style.display='none';
      if(s5Cleared){
        node5.classList.add('done');
        clearBadge5.style.display='flex';
        sub5.textContent=`클리어 · ${s5Score}점`;
      } else {
        node5.classList.remove('done'); node5.classList.add('cur');
        clearBadge5.style.display='none';
        sub5.textContent='도전!';

    } else {
      sub5.textContent='스테이지3 클리어 필요';
    }
  }

  // 스테이지5(배관의 방) — 스테이지4(신고의 문) 클리어로 순차 언락
  let s6Cleared=false, s6Score=0;
  try{
    const raw6=localStorage.getItem('lv1_s6_progress');
    if(raw6){ const s6=JSON.parse(raw6)||{}; s6Cleared=!!s6.cleared; s6Score=s6.score||0; }
  }catch(e){}
  const adUnlockS6 = localStorage.getItem('hub_adunlock_s6')==='1';
  const node6=document.getElementById('node-s6'), sub6=document.getElementById('sub-s6');
  if(node6){
    const lockBadge6=node6.querySelector('.lock-badge'), clearBadge6=node6.querySelector('.clear-badge');

        node6.classList.add('done');
        clearBadge6.style.display='flex';

      } else {

  const lit=document.getElementById('trail-lit');

    const total=lit.getTotalLength();
    lit.style.strokeDasharray=total;
    // 5노드(4구간) 경로 — 스테이지1 클리어로 1/4, 스테이지2로 2/4, 스테이지3으로 3/4, 스테이지4로 끝까지
    const frac = !cleared ? 0 : !s3Cleared ? 1/4 : !s4Cleared ? 2/4 : !s5Cleared ? 3/4 : 1;
    lit.style.strokeDashoffset = total*(1-frac);
  }
}

// ── 잠긴 노드 클릭 → 광고 시청으로 즉시 해제 (2급 index.html과 완전히 동일한 규칙 —
//    지금까지 1급 허브엔 이 기능 자체가 이식이 안 돼 있어서 스테이지가 순차 클리어
//    전엔 절대 안 열렸음. Android WebView는 confirm()이 무동작이라 2-스텝 탭 확인을 쓴다:
//    한 번 탭하면 안내만 뜨고, 그 상태에서 한 번 더 탭해야 실제로 광고가 뜬다.) ──
function onNodeClick(e, gid) {
  const el = document.getElementById('node-' + gid);
  if (!el || !el.classList.contains('lock')) return true;
  e.preventDefault();
  if (el.dataset.armed === '1') {
    el.dataset.armed = '';
    if (el._armTimer) clearTimeout(el._armTimer);
    el.querySelector('.n-sub').textContent = '';
    unlockStage(gid);
  } else {
    el.dataset.armed = '1';
    el.querySelector('.n-sub').textContent = '한 번 더 탭하면 광고 보고 열기';
    el._armTimer = setTimeout(() => {
      el.dataset.armed = '';
      el.querySelector('.n-sub').textContent = '';
    }, 2800);
  }
  return false;
}
window._unlockTarget = null;
function unlockStage(gid) {
  if (!window.AdBridge || typeof AdBridge.showRewarded !== 'function') {
    // 웹 배포판 등 광고 SDK 자체가 없는 환경 — 광고 실패와 동일하게 그냥 열어준다
    localStorage.setItem('hub_adunlock_' + gid, '1');
    renderStageMap();
    return;
  }
  window._unlockTarget = gid;
  AdBridge.showRewarded();
}
// Kotlin/Swift → JS 콜백 (게임 화면들과 동일한 이름 규약)
function onRewardGranted() {

/* 전 스테이지(1~5) 진행 데이터 초기화 — 계정/닉네임은 그대로 두고 서류철·클리어·점수 기록만 지운다.
   ⚠️ 스테이지1만 지우던 버그(스테이지3~6 파일이 나중에 추가됐는데 여긴 안 늘려놨었음) 수정 —
   사용자 지적 + "2급은 초기화해도 게임이 안 잠긴다, 1급도 그래야 한다"는 결정에 따라, 리셋 직전에
   열려있던 스테이지는 진행기록(점수·클리어)만 지우고 잠그지는 않는다(ad-unlock 플래그로 접근성 보존). */
async function resetLv1Progress(){
  if(!await Ask.confirm('전 스테이지(1~5)의 진행 상황(서류철·클리어·점수 기록)을 전부 초기화할까요?\n닉네임과 계정 정보는 그대로 유지되고, 이미 열려있던 스테이지는 계속 플레이할 수 있어요.')) return;
  const clearedOf = key => { try{ return !!JSON.parse(localStorage.getItem(key)||'{}').cleared; }catch(e){ return false; } };
  const s1Cleared = clearedOf('lv1_s1_progress');
  const s3Cleared = clearedOf('lv1_s3_progress');
  const s4Cleared = clearedOf('lv1_s4_progress');
  const s5Cleared = clearedOf('lv1_s5_progress');
  // 순차 언락 조건(renderStageMap과 동일 로직)으로 "리셋 직전 시점에 실제로 열려 있었는지" 판정
  if(s1Cleared || localStorage.getItem('hub_adunlock_s3')==='1') localStorage.setItem('hub_adunlock_s3','1');
  if(s3Cleared || localStorage.getItem('hub_adunlock_s4')==='1') localStorage.setItem('hub_adunlock_s4','1');
  if(s4Cleared || localStorage.getItem('hub_adunlock_s5')==='1') localStorage.setItem('hub_adunlock_s5','1');
  if(s5Cleared || localStorage.getItem('hub_adunlock_s6')==='1') localStorage.setItem('hub_adunlock_s6','1');
  ['lv1_s1_progress','lv1_s3_progress','lv1_s4_progress','lv1_s5_progress','lv1_s6_progress']
    .forEach(k=>localStorage.removeItem(k));
  renderStageMap();
  await Ask.alert('✅ 초기화됐어요. 점수·클리어 기록은 지워지고, 이미 열려있던 스테이지는 계속 플레이할 수 있습니다.');
}

<script>
/* 성장 그래프 버튼: 기록 있으면 초록 점(2급 허브와 동일 — growth.js 로드 후 실행) */
(async function(){

// ── 시험 D-day 카운터(2급 허브와 동일 — localStorage 'hub_examdate' 공유) ──
const DAILY_GOAL_PLAYS = 3;
function fmtExamDate(d){ return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }
async function todayPlayCount(){
  try{
    if(!window.Growth || !Growth.series) return 0;
    const data=await Growth.series();
    if(!data) return 0;
    const startOfDay=new Date(); startOfDay.setHours(0,0,0,0);
    let cnt=0;
    Object.keys(data).forEach(g=>{ (data[g]||[]).forEach(p=>{ if((p.ts||0)>=startOfDay.getTime()) cnt++; }); });
    return cnt;
  }catch(e){ return 0; }
}
async function renderExamDay(){
  const box=document.getElementById('examday-box');
  if(!box) return;
  const saved=localStorage.getItem('hub_examdate');
  const ddayEl=document.getElementById('ed-dday'), dateEl=document.getElementById('ed-date'), setBtn=document.getElementById('ed-set-btn');
  box.style.display='flex';
  if(saved){
    const target=new Date(saved+'T00:00:00');
    if(!isNaN(target.getTime())){
      const today=new Date(); today.setHours(0,0,0,0);
      const diffDays=Math.round((target.getTime()-today.getTime())/86400000);
      ddayEl.textContent = diffDays>0 ? ('D-'+diffDays) : (diffDays===0 ? 'D-DAY' : 'D+'+Math.abs(diffDays));
      dateEl.textContent = '시험일 '+fmtExamDate(target);
      setBtn.textContent = '✏️ 변경';
    } else {
      ddayEl.textContent='D-?'; dateEl.textContent='시험일 미설정'; setBtn.textContent='📅 시험일 설정';
    }
  } else {
    ddayEl.textContent='D-?'; dateEl.textContent='시험일을 설정하고 목표를 관리해보세요'; setBtn.textContent='📅 시험일 설정';
  }
  const played=await todayPlayCount();
  const goalFill=document.getElementById('ed-goal-fill'), goalTxt=document.getElementById('ed-goal-txt');
  const pct=Math.min(100, Math.round((played/DAILY_GOAL_PLAYS)*100));
  if(goalFill) goalFill.style.width=pct+'%';
  if(goalTxt) goalTxt.textContent=(played>=DAILY_GOAL_PLAYS?'🎉 ':'')+'오늘 '+played+'/'+DAILY_GOAL_PLAYS+'판';
}
async function setExamDate(){
  const cur=localStorage.getItem('hub_examdate')||'';
  const input=await Ask.prompt('전산회계 1급 시험일을 입력하세요 (예: 2026-08-15)', cur);
  if(input===null) return;
  const v=input.trim();
  if(!v){ localStorage.removeItem('hub_examdate'); renderExamDay(); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v) || isNaN(new Date(v+'T00:00:00').getTime())){ await Ask.alert('날짜 형식이 올바르지 않아요. 예: 2026-08-15'); return; }
  localStorage.setItem('hub_examdate', v);
  renderExamDay();
}
renderExamDay();
</script>
