<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020810">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>그룹 모드 — 전산회계 2급</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --cy: #00f2ff;
  --pk: #ff2d78;
  --gd: #ffd600;
  --gn: #00e676;
  --pu: #b44fff;
  --bg: #020810;
  --panel: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; min-height: 100%; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: white;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse 60% 40% at 15% 20%, rgba(0,242,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 85% 80%, rgba(180,79,255,0.06) 0%, transparent 55%);
}
#starfield { position:fixed; inset:0; z-index:0; pointer-events:none; }

/* ── 헤더 ── */
.top-bar {
  position: relative; z-index: 10;
  display: flex; align-items: center;
  padding: calc(18px + env(safe-area-inset-top)) 24px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  background: rgba(2,8,16,0.7);
  backdrop-filter: blur(12px);
}
.back-btn {
  display: flex; align-items: center; gap: 7px;
  background: none; border: none;
  color: rgba(255,255,255,0.5);
  font-family: 'Orbitron', monospace;
  font-size: 0.68rem; letter-spacing: 2px;
  cursor: pointer; padding: 8px 0;
  transition: color 0.2s;
  text-decoration: none;
}
.back-btn:hover { color: var(--cy); }
.back-btn svg { width:16px; height:16px; flex-shrink:0; }
.top-title {
  flex: 1; text-align: center;
  font-family: 'Orbitron', monospace;
  font-size: 0.88rem; letter-spacing: 3px;
  color: rgba(255,255,255,0.7);
}
.top-spacer { width: 80px; }

/* ── 메인 영역 ── */
.page-wrap {
  position: relative; z-index: 1;
  max-width: 640px;
  margin: 0 auto;
  padding: 36px 24px calc(60px + var(--ad-banner-h, 0px));
}

/* 내 닉네임 표시 */
.my-nick-bar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 32px;
  padding: 14px 18px;
  background: rgba(0,242,255,0.05);
  border: 1px solid rgba(0,242,255,0.12);
  border-radius: 12px;
}
.my-nick-bar .label {
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem; letter-spacing: 2px;
  color: rgba(0,242,255,0.5);
}
.my-nick-bar .nick {
  font-weight: 700; font-size: 1rem;
  color: rgba(255,255,255,0.9);
}
.my-nick-bar .no-nick {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.3);
}
.my-nick-bar a {
  margin-left: auto;
  font-size: 0.75rem;
  color: var(--cy);
  text-decoration: none;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.my-nick-bar a:hover { opacity: 1; }

/* 현재 소속 그룹 배너 */
.current-group-bar {
  display: none;
  align-items: center; gap: 12px;
  margin-bottom: 28px;
  padding: 16px 20px;
  background: rgba(180,79,255,0.08);
  border: 1px solid rgba(180,79,255,0.25);
  border-radius: 14px;
  animation: fadeIn 0.3s ease;
}
.current-group-bar.show { display: flex; }
.current-group-bar .cg-icon { font-size: 1.4rem; }
.current-group-bar .cg-info { flex: 1; }
.current-group-bar .cg-label {
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem; letter-spacing: 2px;
  color: rgba(180,79,255,0.6); margin-bottom: 3px;
}
.current-group-bar .cg-name { font-weight: 700; font-size: 1rem; }
.current-group-bar .cg-leave {
  background: none; border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px; padding: 6px 12px;
  color: rgba(255,255,255,0.4); font-size: 0.75rem;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.current-group-bar .cg-leave:hover { border-color: var(--pk); color: var(--pk); }
.current-group-bar .cg-hof {
  background: rgba(255,214,0,0.1); border: 1px solid rgba(255,214,0,0.35);
  border-radius: 8px; padding: 6px 12px;
  color: var(--gd); font-size: 0.75rem; font-weight: 700;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.current-group-bar .cg-hof:hover { background: rgba(255,214,0,0.18); }

/* 그룹 명예의 전당 */
.hof-overlay {
  display: none; position: fixed; inset: 0; z-index: 300;
  background: rgba(2,8,16,0.92); backdrop-filter: blur(10px);
  align-items: flex-start; justify-content: center;
  padding: max(20px, env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  overflow-y: auto;
}
.hof-overlay.show { display: flex; }
.hof-panel {
  width: 100%; max-width: 480px;
  background: rgba(10,12,20,0.98); border: 1px solid var(--border);
  border-radius: 18px; padding: 18px; margin: auto;
}
.hof-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.hof-title { font-family: 'Black Han Sans'; font-size: 1.1rem; color: var(--gd); }
.hof-close {
  background: rgba(255,255,255,0.06); border: none; color: rgba(255,255,255,0.6);
  width: 30px; height: 30px; border-radius: 50%; font-size: 0.9rem; cursor: pointer;
}
.hof-mode-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.hof-mode-tab {
  flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  color: rgba(255,255,255,0.6); font-size: 0.82rem; font-weight: 700; padding: 10px; border-radius: 10px;
  cursor: pointer; transition: all 0.2s;
}
.hof-mode-tab.active { background: rgba(255,214,0,0.12); border-color: var(--gd); color: var(--gd); }
.hof-level-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
.hof-level-tab {
  flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  color: rgba(255,255,255,0.45); font-size: 0.78rem; font-weight: 700; padding: 8px; border-radius: 10px;
  cursor: pointer; transition: all 0.2s;
}
.hof-level-tab.lv2.active { background: rgba(0,242,255,0.12); border-color: var(--cy); color: var(--cy); }
.hof-level-tab.lv1.active { background: rgba(180,79,255,0.12); border-color: var(--pu); color: var(--pu); }
.hof-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
.hof-tab {
  flex-shrink: 0; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  color: rgba(255,255,255,0.6); font-size: 0.78rem; padding: 8px 14px; border-radius: 20px;
  cursor: pointer; white-space: nowrap; transition: all 0.2s;
}
.hof-tab.active { background: rgba(0,242,255,0.12); border-color: var(--cy); color: var(--cy); font-weight: 700; }
.hof-body { min-height: 120px; }
.hof-row {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px;
  padding: 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.05);
}
.hof-row:last-child { border-bottom: none; }
.hof-row.hof-me { background: rgba(0,242,255,0.07); border-radius: 10px; }
.hof-num { font-size: 0.85rem; color: rgba(255,255,255,0.35); text-align: center; }
.hof-num.top { font-size: 1.2rem; }
.hof-name { font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hof-score { color: var(--gd); font-weight: 700; font-size: 0.9rem; text-align: right; }
.hof-empty { text-align: center; padding: 30px 0; color: rgba(255,255,255,0.3); font-size: 0.9rem; }
.cross-row {
  display: grid; grid-template-columns: 44px 1fr auto auto; align-items: center; gap: 10px;
  padding: 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.05);
}
.cross-row:last-child { border-bottom: none; }
.cross-row.cross-me { background: rgba(180,79,255,0.1); border-radius: 10px; }
.cross-name { font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cross-count { font-size: 0.7rem; color: rgba(255,255,255,0.35); text-align: right; }
.cross-avg { color: var(--gd); font-weight: 700; font-size: 0.9rem; text-align: right; }

/* 섹션 탭 */
.mode-tabs {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 12px; margin-bottom: 32px;
}
.mode-tab {
  padding: 20px 16px;
  background: var(--panel);
  border: 1.5px solid var(--border);
  border-radius: 18px;
  cursor: pointer;
  transition: all 0.22s;
  text-align: center;
}
.mode-tab:hover { border-color: rgba(255,255,255,0.25); transform: translateY(-2px); }
.mode-tab.active.create { border-color: var(--gn); background: rgba(0,230,118,0.07); }
.mode-tab.active.join   { border-color: var(--cy); background: rgba(0,242,255,0.07); }
.mode-tab .tab-icon { font-size: 2rem; margin-bottom: 8px; }
.mode-tab .tab-name {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 1.1rem; margin-bottom: 4px;
}
.mode-tab.active.create .tab-name { color: var(--gn); }
.mode-tab.active.join   .tab-name { color: var(--cy); }
.mode-tab .tab-desc { font-size: 0.78rem; color: rgba(255,255,255,0.35); }

/* 패널 */
.panel { display: none; animation: fadeInUp 0.3s ease; }
.panel.active { display: block; }
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(14px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes fadeIn {
  from { opacity:0; } to { opacity:1; }
}

/* ── 그룹 생성 패널 ── */
.create-card {
  background: rgba(0,230,118,0.04);
  border: 1px solid rgba(0,230,118,0.12);
  border-radius: 20px;
  padding: 28px 26px;
}
.field-label {
  font-family: 'Orbitron', monospace;
  font-size: 0.62rem; letter-spacing: 3px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 10px; display: block;
}
.text-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 14px 18px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 1rem; font-weight: 700;
  color: #fff; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  margin-bottom: 20px;
  -webkit-appearance: none;
}
.text-input::placeholder { color: rgba(255,255,255,0.2); font-weight: 400; }
.text-input:focus { border-color: var(--gn); box-shadow: 0 0 0 3px rgba(0,230,118,0.12); }

.create-btn {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, var(--gn), #00b894);
  border: none; border-radius: 12px;
  font-family: 'Black Han Sans', sans-serif;
  font-size: 1.1rem; color: #000;
  cursor: pointer; transition: opacity 0.2s, transform 0.15s;
  min-height: 52px;
}
.create-btn:hover::before { opacity: 1; }
.create-btn:active { transform: scale(0.98); }
.create-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* 생성 완료 결과 */
.create-result {
  display: none;
  margin-top: 20px;
  padding: 22px;
  background: rgba(0,230,118,0.08);
  border: 1px solid rgba(0,230,118,0.25);
  border-radius: 14px;
  text-align: center;
  animation: fadeIn 0.3s ease;
}
.create-result.show { display: block; }
.create-result .result-label {
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem; letter-spacing: 3px;
  color: rgba(0,230,118,0.6); margin-bottom: 10px;
}
.create-result .result-code {
  font-family: 'Orbitron', monospace;
  font-size: 2.2rem; font-weight: 900;
  color: var(--gn); letter-spacing: 6px;
  margin-bottom: 8px;
}
.create-result .result-name {
  font-size: 1rem; color: rgba(255,255,255,0.7);
  margin-bottom: 14px;
}
.create-result .result-hint {
  font-size: 0.78rem;
  color: rgba(255,255,255,0.35);
  line-height: 1.6;
}
.copy-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 14px;
  padding: 9px 20px;
  background: rgba(0,230,118,0.12);
  border: 1px solid rgba(0,230,118,0.3);
  border-radius: 50px;
  font-size: 0.82rem; color: var(--gn);
  cursor: pointer; transition: all 0.2s;
}
.copy-btn:hover { background: rgba(0,230,118,0.2); }

/* ── 그룹 참여 패널 ── */
.join-card {
  background: rgba(0,242,255,0.03);
  border: 1px solid rgba(0,242,255,0.10);
  border-radius: 20px;
  padding: 24px 22px;
}

/* 검색창 */
.search-wrap {
  position: relative; margin-bottom: 16px;
}
.search-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  color: rgba(0,242,255,0.4); font-size: 1rem; pointer-events: none;
}
.search-input {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(0,242,255,0.18);
  border-radius: 12px;
  padding: 14px 18px 14px 44px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.95rem; color: #fff;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
}
.search-input::placeholder { color: rgba(255,255,255,0.2); }
.search-input:focus {
  border-color: var(--cy);
  box-shadow: 0 0 0 3px rgba(0,242,255,0.10);
}

/* 명예의 전당 등 로딩 스피너(공용) */
.spinner {
  width: 28px; height: 28px;
  border: 2px solid rgba(0,242,255,0.15);
  border-top-color: var(--cy);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 참여 버튼 */
.join-btn {
  width: 100%; padding: 16px; margin-top: 16px;
  background: linear-gradient(135deg, var(--cy), #0099aa);
  border: none; border-radius: 12px;
  font-family: 'Black Han Sans', sans-serif;
  font-size: 1.1rem; color: #000;
  cursor: pointer; transition: opacity 0.2s, transform 0.15s;
  min-height: 52px; display: none;
}
.join-btn.show { display: block; }
.join-btn:active { transform: scale(0.98); }
.join-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* 에러/상태 메시지 */
.status-msg {
  margin-top: 14px; padding: 12px 16px;
  border-radius: 10px; font-size: 0.82rem;
  display: none;
  animation: fadeIn 0.2s ease;
}
.status-msg.show { display: block; }
.status-msg.err { background: rgba(255,45,120,0.1); border: 1px solid rgba(255,45,120,0.25); color: var(--pk); }
.status-msg.ok  { background: rgba(0,230,118,0.1);  border: 1px solid rgba(0,230,118,0.25);  color: var(--gn); }

.admin-link-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 20px; padding: 14px;
  background: rgba(0,242,255,0.05);
  border: 1px dashed rgba(0,242,255,0.2);
  border-radius: 12px;
  font-size: 0.85rem; color: rgba(0,242,255,0.6);
  text-decoration: none; transition: all 0.2s;
}
.admin-link-btn:hover { background: rgba(0,242,255,0.1); border-color: rgba(0,242,255,0.4); color: var(--cy); }

@media (max-width: 480px) {
  .page-wrap { padding: 24px 16px calc(48px + var(--ad-banner-h, 0px)); }
  .top-bar { padding: calc(14px + env(safe-area-inset-top)) 16px; }
  .mode-tab { padding: 16px 12px; }
  .mode-tab .tab-icon { font-size: 1.6rem; }
  .create-card, .join-card { padding: 20px 16px; }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<!-- 상단 바 -->
<div class="top-bar">
  <a class="back-btn" href="javascript:history.back()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    BACK
  </a>
  <div class="top-title">GROUP MODE</div>
  <div class="top-spacer"></div>
</div>

<div class="page-wrap">

  <!-- 내 닉네임 표시 -->
  <div class="my-nick-bar">
    <div class="label">MY NICK</div>
    <div class="nick" id="my-nick-display">—</div>
    <a href="login.html" id="nick-change-link" style="display:none">변경 →</a>
  </div>

  <!-- 현재 소속 그룹 -->
  <div class="current-group-bar" id="current-group-bar">
    <div class="cg-icon">👥</div>
    <div class="cg-info">
      <div class="cg-label">CURRENT GROUP</div>
      <div class="cg-name" id="current-group-name">—</div>
    </div>
    <button class="cg-hof" onclick="openHallOfFame()">🏆 명예의 전당</button>
    <button class="cg-leave" onclick="leaveGroup()">나가기</button>
  </div>

  <!-- 그룹 명예의 전당 -->
  <div class="hof-overlay" id="hof-overlay">
    <div class="hof-panel">
      <div class="hof-header">
        <div class="hof-title">🏆 명예의 전당</div>
        <button class="hof-close" onclick="closeHallOfFame()">✕</button>
      </div>
      <div class="hof-level-tabs">
        <button class="hof-level-tab lv2 active" id="hof-level-lv2" onclick="switchHofLevel('lv2')">🟢 2급</button>
        <button class="hof-level-tab lv1" id="hof-level-lv1" onclick="switchHofLevel('lv1')">🟣 1급</button>
      </div>
      <div class="hof-mode-tabs">
        <button class="hof-mode-tab active" id="hof-mode-group" onclick="switchHofMode('group')">👤 우리 그룹 랭킹</button>
        <button class="hof-mode-tab" id="hof-mode-cross" onclick="switchHofMode('cross')">⚔️ 그룹 대항전</button>
      </div>
      <div class="hof-tabs" id="hof-tabs"></div>
      <div class="hof-body" id="hof-body"></div>
    </div>
  </div>

  <!-- 모드 선택 탭 -->
  <div class="mode-tabs">
    <div class="mode-tab create" id="tab-create" onclick="switchTab('create')">
      <div class="tab-icon">➕</div>
      <div class="tab-name">그룹 생성</div>
      <div class="tab-desc">교수자 · 새 그룹 만들기</div>
    </div>
    <div class="mode-tab join" id="tab-join" onclick="switchTab('join')">
      <div class="tab-icon">🔍</div>
      <div class="tab-name">그룹 참여</div>
      <div class="tab-desc">학생 · 참여 코드로 입장</div>
    </div>
  </div>

  <!-- ── 그룹 생성 패널 ── -->
  <div class="panel" id="panel-create">
    <div class="create-card">
      <label class="field-label" for="group-name-input">그룹명</label>
      <input
        class="text-input"
        type="text"
        id="group-name-input"
        placeholder="예: 2반 1조, 방과후반A"
        maxlength="20"
        autocomplete="off"
      >

      <label class="field-label" for="teacher-name-input">교수자 이름 (선택)</label>
      <input
        class="text-input"
        type="text"
        id="teacher-name-input"
        placeholder="예: 김선생님"
        maxlength="15"
        autocomplete="off"
        style="margin-bottom:16px;"
      >

      <label class="field-label" for="join-code-input">참여 코드 (선택)</label>
      <input
        class="text-input"
        type="text"
        id="join-code-input"
        placeholder="예: 2026, 1교시 — 비워두면 자동 생성된 코드 사용"
        maxlength="12"
        autocomplete="off"
        style="margin-bottom:0; text-transform:uppercase;"
      >
      <div style="font-size:0.75rem;color:rgba(255,255,255,0.3);margin-bottom:16px;padding-left:4px;margin-top:6px;">

<script>

const SUPABASE_URL = "https://pjagaulfivafamhhiveg.supabase.co";
const SUPABASE_KEY = "sb_publishable_yck2tAKApEjVSJOJMVSXuQ_AGaNatuI";

/* ═══════════════════════════════════════

const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
const isMobile = window.innerWidth <= 600;
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
function mkStar() {
  return { x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    r: Math.random()*1.4+0.2, v: Math.random()*0.3+0.05,
    o: Math.random()*0.6+0.2,
    c: Math.random()>0.88?'#00f2ff':Math.random()>0.75?'#b44fff':'#ffffff' };
}
function initStars() { stars = Array.from({length: isMobile?80:160}, mkStar); }
function animStars() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s => {
    s.y+=s.v; if(s.y>canvas.height){s.y=-2;s.x=Math.random()*canvas.width;}
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=s.c;ctx.globalAlpha=s.o;ctx.fill();ctx.globalAlpha=1;
  });
  requestAnimationFrame(animStars);
}
resize();initStars();animStars();
window.addEventListener('resize',()=>{resize();initStars();});

function switchTab(mode) {

/* ═══════════════════════════════════════
   그룹 생성
═══════════════════════════════════════ */
function genCode() {
  // 6자리 영숫자 코드 (헷갈리는 문자 제외)
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:6}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
}

async function createGroup() {
  const groupName = document.getElementById('group-name-input').value.trim();
  const teacherName = document.getElementById('teacher-name-input').value.trim()
    || localStorage.getItem('hub_nickname') || '교수자';
  const teacherPass = document.getElementById('teacher-pass-input').value.trim();
  const joinCode = document.getElementById('join-code-input').value.trim().toUpperCase();

  if (!groupName) { showStatus('create-status', '그룹명을 입력해주세요', 'err'); return; }
  if (groupName.length < 2) { showStatus('create-status', '2글자 이상 입력해주세요', 'err'); return; }
  if (!teacherPass) { showStatus('create-status', '대시보드 비밀번호를 설정해주세요', 'err'); return; }
  if (teacherPass.length < 4) { showStatus('create-status', '비밀번호는 4자 이상으로 설정해주세요', 'err'); return; }
  if (joinCode && joinCode.length < 2) { showStatus('create-status', '참여 코드는 2글자 이상으로 설정해주세요', 'err'); return; }

  const btn = document.getElementById('create-btn');
  btn.disabled = true; btn.textContent = '생성 중...';

  try {
    const code = genCode();
    // 서버 저장 RPC 우선 — 비밀번호는 서버에서 해시로만 저장
    // (supabase_security_migration.sql 적용 후)
    let { error } = await db.rpc('create_group', {
      p_id: code,
      p_name: groupName,
      p_teacher_name: teacherName,
      p_pass: teacherPass,
      p_join_code: joinCode || null
    });
    if (error && error.code === 'PGRST202') {
      // 폴백: 마이그레이션 이전 DB(RPC 없음) — 기존 직접 insert
      ({ error } = await db.from('groups').insert({
        id: code,
        name: groupName,
        teacher_name: teacherName,
        teacher_pass: teacherPass,
        member_count: 0,
        join_code: joinCode || null
      }));
    }

    if (error) {
      if (error.code === '23505') {
        // 참여 코드를 직접 지정했는데 이미 쓰이고 있는 경우 — 재시도해도 소용없으니 다른 코드를 안내
        if (error.message && error.message.includes('join code taken')) {
          btn.disabled = false; btn.textContent = '✨ 그룹 생성하기';
          showStatus('create-status', '이미 사용 중인 참여 코드예요. 다른 코드를 입력해주세요.', 'err'); return;
        }
        // 내부 그룹ID 충돌(6자리 랜덤) — 재시도하면 해결됨
        btn.disabled = false; btn.textContent = '✨ 그룹 생성하기';
        showStatus('create-status', '잠시 후 다시 시도해주세요', 'err'); return;
      }
      throw error;
    }

    // 생성 성공 — 자동으로 이 그룹에 참여
    localStorage.setItem('hub_group_id', code);
    localStorage.setItem('hub_group_name', groupName);
    document.getElementById('current-group-name').textContent = groupName;
    document.getElementById('current-group-bar').classList.add('show');

    // 결과 표시 — 참여 코드를 지정했으면 그 코드를, 아니면 자동생성된 내부 코드를 보여준다
    const shownCode = joinCode || code;
    document.getElementById('result-code').textContent = shownCode;
    document.getElementById('result-name').textContent = `"${groupName}" · ${teacherName}`;
    document.getElementById('create-result').classList.add('show');
    showStatus('create-status', '✓ 그룹이 생성되었습니다! 코드를 학생들에게 공유하세요.', 'ok');
    window._createdCode = shownCode;

  } catch(e) {
    showStatus('create-status', '오류가 발생했습니다. 다시 시도해주세요.', 'err');
    console.error(e);
  } finally {
    btn.disabled = false; btn.textContent = '✨ 그룹 생성하기';
  }
}

function copyCode() {
  const code = window._createdCode;
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✓ 복사 완료!';
    setTimeout(() => btn.textContent = '📋 코드 복사', 2000);
  }).catch(() => {
    // 클립보드 API 미지원 대비
    alert('그룹 코드: ' + code);
  });
}

/* ═══════════════════════════════════════
   그룹 참여 — 코드 입력 방식
   ⚠️ 예전엔 전체 그룹 목록(이름·교수자명·인원수)을 누구나 훑어보고 아무거나
   클릭해서 참여할 수 있었음(사용자 지적: "아무나 아무 그룹이나 들어가서
   하지 못하게 해줘") — 목록 자체를 없애고, 교수자에게 직접 전달받은 코드를
   정확히 입력해야만(groups.id 그대로가 코드) 참여되도록 변경.
═══════════════════════════════════════ */
async function joinGroup() {
  const codeEl = document.getElementById('code-input');
  const code = codeEl.value.trim().toUpperCase();
  if (!code) { showStatus('join-status', '참여 코드를 입력해주세요.', 'err'); return; }
  const nick = localStorage.getItem('hub_nickname');
  if (!nick) {
    showStatus('join-status', '먼저 닉네임을 설정해주세요.', 'err');
    return;
  }

  const btn = document.getElementById('join-btn');
  btn.disabled = true; btn.textContent = '참여 중...';

  try {
    // 참여코드(join_code)로 우선 조회 — 아직 참여코드를 설정 안 한
    // 예전 그룹은 기존 그룹ID로도 들어올 수 있게 폴백 유지
    let { data } = await db.from('groups').select('id,name').eq('join_code', code).maybeSingle();
    if (!data) {
      ({ data } = await db.from('groups').select('id,name').eq('id', code).maybeSingle());
    }
    if (!data) throw new Error('그룹을 찾을 수 없습니다');

    localStorage.setItem('hub_group_id', data.id);
    localStorage.setItem('hub_group_name', data.name);

    document.getElementById('current-group-name').textContent = data.name;
    document.getElementById('current-group-bar').classList.add('show');

    showStatus('join-status', `✓ "${escapeHTML(data.name)}" 그룹에 참여했습니다! 게임을 시작하세요.`, 'ok');
    codeEl.value = '';

    // 2초 후 허브로 이동
    setTimeout(() => { window.location.href = 'index.html'; }, 1800);

  } catch(e) {
    showStatus('join-status', '코드가 일치하는 그룹을 찾을 수 없습니다. 다시 확인해주세요.', 'err');
  } finally {
    btn.disabled = false; btn.textContent = '👥 참여하기';
  }
}

function leaveGroup() {
  // Android WebView는 confirm()이 무동작(항상 false) → 2-스텝 버튼으로 확인
  var lbtn = event && event.target ? event.target : null;
  if (lbtn && lbtn.dataset && lbtn.dataset.armed !== '1') {
    lbtn.dataset.armed = '1';
    var origText = lbtn.textContent;
    lbtn.textContent = '한 번 더 누르면 나가기';
    setTimeout(function(){ if(lbtn.isConnected){ lbtn.dataset.armed=''; lbtn.textContent=origText; } }, 2500);
    return;
  }
  if (lbtn && lbtn.dataset) lbtn.dataset.armed = '';
  localStorage.removeItem('hub_group_id');
  localStorage.removeItem('hub_group_name');
  document.getElementById('current-group-bar').classList.remove('show');
  document.getElementById('code-input').value = '';
}

/* ═══════════════════════════════════════
   그룹 명예의 전당
═══════════════════════════════════════ */
const HOF_GAMES_LV2 = [
  { id: 'acid',    name: '계정과목 산성비',   icon: '☁️' },
  { id: 'memory',  name: '기억의 전당',       icon: '🧩' },
  { id: 'debit',   name: '차변대변',          icon: '⚡' },
  { id: 'factory', name: '결산분개 공장',     icon: '🏭' },
  { id: 'flight',  name: '회계 플라이트',     icon: '🛩' },
];
const HOF_GAMES_LV1 = [
  { id: 'cost_lv1',    name: '원가의 길',   icon: '🏭' },
  { id: 'capital_lv1', name: '자본의 제왕', icon: '👑' },
  { id: 'voucher_lv1', name: '전표의 눈',   icon: '📋' },
  { id: 'vat_lv1',     name: '신고의 문',   icon: '🧾' },
];
function currentHofGames() { return hofLevel === 'lv1' ? HOF_GAMES_LV1 : HOF_GAMES_LV2; }

let hofLevel = 'lv2';
let hofCurrentGame = 'acid';
let hofMode = 'group';

function openHallOfFame() {
  const gid = localStorage.getItem('hub_group_id');
  if (!gid) return;
  document.getElementById('hof-overlay').classList.add('show');
  // 접속한 급수 허브(index.html/index_lv1.html)에 맞춰 기본 탭 선택
  hofLevel = localStorage.getItem('hub_level') === 'lv1' ? 'lv1' : 'lv2';
  hofCurrentGame = currentHofGames()[0].id;
  document.getElementById('hof-level-lv2').classList.toggle('active', hofLevel === 'lv2');
  document.getElementById('hof-level-lv1').classList.toggle('active', hofLevel === 'lv1');
  switchHofMode('group');
}
function closeHallOfFame() {
  document.getElementById('hof-overlay').classList.remove('show');
}
function switchHofLevel(level) {
  hofLevel = level;
  hofCurrentGame = currentHofGames()[0].id;
  document.getElementById('hof-level-lv2').classList.toggle('active', level === 'lv2');
  document.getElementById('hof-level-lv1').classList.toggle('active', level === 'lv1');
  if (hofMode === 'group') {
    renderHofTabs();
    loadHofRanking(hofCurrentGame);
  } else {
    loadCrossGroupRanking();
  }
}
function switchHofMode(mode) {
  hofMode = mode;
  document.getElementById('hof-mode-group').classList.toggle('active', mode === 'group');
  document.getElementById('hof-mode-cross').classList.toggle('active', mode === 'cross');
  if (mode === 'group') {
    document.getElementById('hof-tabs').style.display = 'flex';
    renderHofTabs();
    loadHofRanking(hofCurrentGame);
  } else {
    document.getElementById('hof-tabs').style.display = 'none';
    loadCrossGroupRanking();
  }
}
function renderHofTabs() {
  document.getElementById('hof-tabs').innerHTML = currentHofGames().map(g =>
    `<button class="hof-tab ${g.id === hofCurrentGame ? 'active' : ''}" onclick="switchHofGame('${g.id}')">${g.icon} ${g.name}</button>`
  ).join('');
}
function switchHofGame(gameId) {
  hofCurrentGame = gameId;
  renderHofTabs();
  loadHofRanking(gameId);
}
async function loadHofRanking(gameId) {
  const body = document.getElementById('hof-body');
  body.innerHTML = '<div class="hof-empty"><div class="spinner"></div></div>';
  const gid = localStorage.getItem('hub_group_id');
  try {
    const { data, error } = await db
      .from('scores')
      .select('name,score,grade')
      .eq('game_id', gameId)
      .eq('group_id', gid)
      .order('score', { ascending: false })
      .limit(15);
    if (error) throw error;
    renderHofList(data || []);
  } catch (e) {
    body.innerHTML = '<div class="hof-empty">랭킹을 불러오지 못했어요</div>';
  }
}
function renderHofList(list) {
  const body = document.getElementById('hof-body');
  if (!list.length) { body.innerHTML = '<div class="hof-empty">아직 이 게임의 그룹 기록이 없습니다</div>'; return; }
  const me = (localStorage.getItem('hub_nickname') || '').trim();
  body.innerHTML = list.map((r, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '위';
    return `<div class="hof-row ${escapeHTML(r.name) === escapeHTML(me) ? 'hof-me' : ''}">
      <div class="hof-num ${i < 3 ? 'top' : ''}">${medal}</div>
      <div class="hof-name">${escapeHTML(r.name)}</div>
      <div class="hof-score">${(r.score || 0).toLocaleString()}</div>
    </div>`;
  }).join('');
}

/* ── 그룹 대항전: 학생 1인당 평균 점수(전 게임 합산) ── */
async function loadCrossGroupRanking() {
  const body = document.getElementById('hof-body');
  body.innerHTML = '<div class="hof-empty"><div class="spinner"></div></div>';
  try {
    const levelGameIds = currentHofGames().map(g => g.id);
    const [{ data: scoreRows, error: scoreErr }, { data: groupRows, error: groupErr }] = await Promise.all([
      db.from('scores').select('group_id,name,score').not('group_id', 'is', null).in('game_id', levelGameIds),
      db.from('groups').select('id,name'),
    ]);
    if (scoreErr) throw scoreErr;
    if (groupErr) throw groupErr;

    const groupNameMap = {};
    (groupRows || []).forEach(g => { groupNameMap[g.id] = g.name; });

    // group_id -> { name -> totalScore }
    const perGroupStudents = {};
    (scoreRows || []).forEach(r => {
      if (!perGroupStudents[r.group_id]) perGroupStudents[r.group_id] = {};
      perGroupStudents[r.group_id][r.name] = (perGroupStudents[r.group_id][r.name] || 0) + (r.score || 0);
    });

    const ranked = Object.entries(perGroupStudents).map(([gid, students]) => {
      const names = Object.keys(students);
      const total = names.reduce((s, n) => s + students[n], 0);
      return {
        gid,
        name: groupNameMap[gid] || gid,
        studentCount: names.length,
        avgPerStudent: names.length ? total / names.length : 0,
      };
    }).filter(g => g.studentCount > 0)
      .sort((a, b) => b.avgPerStudent - a.avgPerStudent);

    renderCrossGroupList(ranked);
  } catch (e) {
    body.innerHTML = '<div class="hof-empty">랭킹을 불러오지 못했어요</div>';
  }
}
function renderCrossGroupList(ranked) {
  const body = document.getElementById('hof-body');
  if (!ranked.length) { body.innerHTML = '<div class="hof-empty">아직 그룹 기록이 없습니다</div>'; return; }
  const myGid = localStorage.getItem('hub_group_id');
  body.innerHTML = ranked.map((g, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '위';
    return `<div class="cross-row ${g.gid === myGid ? 'cross-me' : ''}">
      <div class="hof-num ${i < 3 ? 'top' : ''}">${medal}</div>
      <div class="cross-name">${escapeHTML(g.name)}</div>
      <div class="cross-count">${g.studentCount}명</div>
      <div class="cross-avg">${Math.round(g.avgPerStudent).toLocaleString()}</div>
    </div>`;
  }).join('');
}

function showStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status-msg show ' + type;
}
function escapeHTML(s) {
  if (!s) return '';
  return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
