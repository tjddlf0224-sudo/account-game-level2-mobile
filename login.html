<head>
    <!-- 저장소가 막힌 환경(프라이빗 브라우징·사이트데이터 차단)에서도 게임이 돌아가게 한다.
         **반드시 다른 스크립트보다 먼저** 로드돼야 한다 — 2026-09-16 검토에서
         이게 없으면 게임 5종이 시작조차 안 되는 것을 확인했다. -->
    <script src="safestore.js?v=54"></script>
    <script>
    /* 웹은 로그인 화면을 건너뛴다(2026-09-22) — safestore.js 가 이미 자동 닉네임을 채웠다.
       예전 링크·즐겨찾기·로그아웃으로 여기 와도 바로 허브로 간다. 앱(네이티브)은 구글/애플 로그인 때문에 그대로 둔다. */
    (function(){ try{
      var C = window.Capacitor; if (C && C.isNativePlatform && C.isNativePlatform()) return;
      // 닉네임이 실제로 있을 때만 — 자동 이름 저장이 어떤 이유로 실패하면 허브↔로그인이 무한히 서로를 부른다
      // (그땐 예전처럼 이 로그인 화면을 그대로 보여 준다)
      if (!(localStorage.getItem('hub_nickname') || '').trim()) return;
      location.replace(localStorage.getItem('hub_level') === 'lv1' ? 'index_lv1.html' : 'index.html');
    }catch(e){} })();
    </script>

/* ── 시스템 큰글자모드 대응 ──
 * 평소엔 body를 overflow:hidden + 세로중앙정렬로 고정해도 카드가 화면에 다 들어오지만,
 * OS 글자크기 접근성 설정이 켜지면 rem 기준값이 커져 카드 높이가 화면을 넘는데
 * 스크롤이 막혀있어 아래쪽(시작 버튼 등)에 닿을 수 없었다. JS가 감지해 붙이는
 * .large-font-mode 클래스가 있을 때만 스크롤 가능한 레이아웃으로 전환한다
 * (기본 디자인·레이아웃은 그대로, 이 클래스가 없으면 위 규칙 전혀 영향 없음). */
html.large-font-mode body {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  align-items: flex-start;
  padding-top: max(28px, env(safe-area-inset-top));
  padding-bottom: calc(28px + var(--ad-banner-h, 0px));
}
html.large-font-mode .login-wrap {
  margin: auto;
}

<script>
/* 시스템 큰글자모드 감지 — 1rem이 기본 16px보다 눈에 띄게 크면(안드로이드 글자크기
 * 접근성 설정 등) 켜진 것으로 보고 <html>에 large-font-mode 클래스를 붙인다.
 * 화면이 그려지기 전에(첫 콘텐츠보다 먼저) 실행해 깜빡임 없이 적용한다. */
(function () {
  try {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;height:0;width:0;font-size:1rem;';
    document.documentElement.appendChild(probe);
    var px = parseFloat(getComputedStyle(probe).fontSize) || 16;
    document.documentElement.removeChild(probe);
    if (px / 16 > 1.15) document.documentElement.classList.add('large-font-mode');
  } catch (e) {}
})();
</script>

<script>
/* ── 별 배경 ── */
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
const isMobile = window.innerWidth <= 600;
const STAR_COUNT = isMobile ? 80 : 160;
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
function mkStar() {
  return {
    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
    r: Math.random() * 1.4 + 0.2, v: Math.random() * 0.3 + 0.05,
    o: Math.random() * 0.6 + 0.2,
    c: Math.random() > 0.88 ? '#00f2ff' : Math.random() > 0.75 ? '#b44fff' : '#ffffff'
  };
}
function initStars() { stars = Array.from({length: STAR_COUNT}, mkStar); }
function animStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    s.y += s.v;
    if (s.y > canvas.height) { s.y = -2; s.x = Math.random() * canvas.width; }
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.c; ctx.globalAlpha = s.o; ctx.fill(); ctx.globalAlpha = 1;
  });
  requestAnimationFrame(animStars);
}
resize(); initStars(); animStars();
window.addEventListener('resize', () => { resize(); initStars(); });

/* ── 로그인 로직 ── */
const input = document.getElementById('nickname');
const errMsg = document.getElementById('err-msg');

/* 로그인 후 이동할 곳 — 마지막에 고른 급수가 있으면 그 허브로 바로,
   없으면(=처음 오는 사람) 급수 선택 화면으로. 선택 화면에서 hub_level을 심는다. */
function afterLoginHref(){
  try{
    const lv = localStorage.getItem('hub_level');
    if(lv === 'lv1') return 'index_lv1.html';
    if(lv === 'lv2') return 'index.html';
  }catch(e){}
  return 'select_level.html';
}

// 이미 저장된 닉네임이 있으면 채워넣기
// 자동 닉네임 생성
function genNickname() {
  const adjs = ['빠른','날쌘','용감한','현명한','영리한','멋진','강한','날렵한','꼼꼼한','침착한'];
  const nouns = ['호랑이','독수리','사자','늑대','팬더','여우','매','치타','용','phoenix'];
  const adj = adjs[Math.floor(Math.random() * adjs.length)];
  const noun = nouns[Math.floor(Math.random() * nouns.length)];
  const num = Math.floor(Math.random() * 90) + 10;
  return adj + noun + num;
}

window.addEventListener('DOMContentLoaded', () => {

/* Apple 공식 버튼 이미지 — 폭·높이는 실제 버튼(Google 버튼)에 맞춰 요청(Apple 허용 폭 130~375·높이 30~64, 모서리 50% 알약형 = Google 버튼과 같게) */
function officialAppleButton() {
  const btn = document.getElementById('apple-btn');
  const g = document.getElementById('google-btn');
  const w = Math.max(130, Math.min(375, Math.round(btn.offsetWidth || 320)));
  const h = Math.max(30, Math.min(64, Math.round((g && g.offsetHeight) || 50)));
  const img = new Image();
  img.alt = 'Apple로 계속하기';
  const giveUp = setTimeout(() => btn.classList.remove('waiting'), 4000);   // 못 받으면 로고 없이 글자만
  img.onload = () => { clearTimeout(giveUp); btn.textContent = ''; btn.style.height = h + 'px'; btn.appendChild(img); btn.classList.add('official'); btn.classList.remove('waiting'); };
  img.onerror = () => { clearTimeout(giveUp); btn.classList.remove('waiting'); };
  img.src = 'https://appleid.cdn-apple.com/appleid/button?type=continue&color=white&border=false&border_radius=50'
          + '&height=' + h + '&width=' + w + '&scale=3&locale=ko_KR';
}

/* ── 소셜 로그인 (Google / Apple) ──
 * 이미 등록된 uid면 바로 허브로, 처음 온 uid면 닉네임 확정 단계로 이어간다
 * (기존 닉네임 입력창을 그대로 재사용 — window._pendingAuth 로 상태만 표시). */
window._pendingAuth = null;
async function socialLogin(kind) {
  const gBtn = document.getElementById('google-btn');
  const aBtn = document.getElementById('apple-btn');
  gBtn.disabled = true; aBtn.disabled = true;
  errMsg.classList.remove('show');
  try {
    const res = await Auth.signIn(kind);               // { uid, email, provider }
    const player = await Auth.loadPlayer(res.uid);      // 이전에 가입한 적 있으면 {name,avatar,group_id}
    if (player && player.name) {
      Auth.applyLocal(res.uid, player.name, player.avatar);
      window.location.href = afterLoginHref();
      return;
    }
    // 처음 로그인 — 닉네임을 정해야 함. 기존 입력창을 그대로 사용.
    window._pendingAuth = { uid: res.uid, provider: res.provider };
    document.getElementById('pending-auth-hint').classList.add('show');
    if (input.dataset.autoGenerated === 'true') { input.select(); }
    input.focus();
  } catch (e) {
    showErr('로그인에 실패했어요. 다시 시도해주세요.');
  } finally {
    gBtn.disabled = false; aBtn.disabled = false;
  }
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
  errMsg.classList.remove('show');
});
input.addEventListener('input', () => {
  errMsg.classList.remove('show');
  // 경고 뜬 뒤 이름을 바꾸면 이전 이름에 대한 중복검사 면제를 초기화
  window._claimedName = null;
  document.getElementById('start-btn').textContent = '🚀 훈련 시작';
});
// 첫 글자 입력 시 자동 생성 닉네임 즉시 대체
input.addEventListener('keydown', e => {
  if (input.dataset.autoGenerated === 'true') {
    const ignore = ['Enter','Tab','Shift','Control','Alt','Meta','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','CapsLock'];
    if (!ignore.includes(e.key)) {
      input.value = '';
      delete input.dataset.autoGenerated;
    }
  }
}, true);
input.addEventListener('focus', () => {
  if (input.dataset.autoGenerated === 'true') {
    input.select(); // 포커스 시 전체 선택 — 바로 덮어쓰기 가능
  }
});

function showErr(msg) {
  errMsg.textContent = msg;
  errMsg.classList.add('show');
  input.focus();
}
