<script>
// 로그인 체크
(function(){ if(!(localStorage.getItem('hub_nickname')||'').trim()){ location.replace('login.html'); } })();

const GAME_ID='theory_lv1';
const TOPIC_ORDER=['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11'];
let BANK=[], META=null, POOL=[], SEL_TOPIC='ALL', SEL_LEN=10;

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// 문제 본문(문두) 뒤에 이어지는 자료/보기를 항상 줄바꿈으로 분리해 가독성 향상
function fmtStem(s){
  let e=esc(s);
  // "~지 않은/않는"류(옳지·적절하지·타당하지·해당하지·맞지 않은/않는 등)를
  // 한 번에 강조 — 앞부분(옳지 등)은 그대로 두고 부정 어미만 굵게+밑줄.
  e=e.replace(/(\S*?지)\s+(않은|않는)/g,(m0,pre,neg)=>`${pre} <b><u>${neg}</u></b>`);
  e=e.replace(/아닌(?=\s*것은)/g,'<b><u>아닌</u></b>');
  e=e.replace(/틀린(?=\s*것)/g,'<b><u>틀린</u></b>');
  e=e.replace(/잘못된(?=\s*것)/g,'<b><u>잘못된</u></b>');

  const qm=e.indexOf('?');
  if(qm<0 || qm===e.length-1) return splitBulletsOnly(e);
  const head=e.slice(0,qm+1);
  const tail=e.slice(qm+1).trim();
  if(!tail) return head;
  const lines=splitTailLines(tail);
  if(!lines.length) return head;
  return head + lines.map(l=>`<span class="data">${l}</span>`).join('');
}

function splitBulletsOnly(e){
  const b=bulletChar(e);
  if(!b) return e;
  const idx=e.indexOf(b);
  const head=e.slice(0,idx).trim();
  const items=e.slice(idx).split(b).map(x=>x.trim()).filter(Boolean);
  return head + items.map(it=>`<span class="data">· ${it}</span>`).join('');
}

function bulletChar(s){
  if(s.indexOf('ㆍ')>=0) return 'ㆍ';
  if(s.indexOf('⦁')>=0) return '⦁';
  return null;
}

function splitTailLines(tail){
  const b=bulletChar(tail);
  if(b){
    const idx=tail.indexOf(b);
    const pre=tail.slice(0,idx).trim();
    const items=tail.slice(idx).split(b).map(x=>x.trim()).filter(Boolean).map(it=>'· '+it);
    return pre?[pre,...items]:items;
  }
  if(/\(차\)/.test(tail) && /\(대\)/.test(tail)){
    const di=tail.lastIndexOf('(대)');
    const a=tail.slice(0,di).trim(), c=tail.slice(di).trim();
    if(a && c) return [a,c];
  }
  // ⚠️ 분리 정규식에 (?:^|\s) 경계를 안 넣으면 "회수하다." 같은 평범한 문장까지
  //    "다."를 목록 마커로 오인식해서 문장을 잘라먹는다(감지용 정규식과 분리용
  //    정규식이 서로 달라서 생긴 버그, 실사용자 리포트로 발견). 두 정규식을 통일.
  let m=tail.match(/(?:^|\s)[가나다라마바사아자차]\.\s?/g);
  if(m && m.length>=2) return splitByMarker(tail, /(?:^|\s)([가나다라마바사아자차])\.\s?/g);
  m=tail.match(/(?:^|\s)[ㄱㄴㄷㄹㅁㅂㅅㅇ]\.\s?/g);
  if(m && m.length>=2) return splitByMarker(tail, /(?:^|\s)([ㄱㄴㄷㄹㅁㅂㅅㅇ])\.\s?/g);
  const colons=(tail.match(/：/g)||[]).length;
  if(colons>=2){
    const parts=tail.split(/\s+(?=[^\s：]{1,12}：)/).map(x=>x.trim()).filter(Boolean);
    if(parts.length>=2) return parts;
  }
  return [tail];
}
function splitByMarker(tail, re){
  const parts=tail.split(re);
  const out=[];
  const pre=(parts[0]||'').trim();
  if(pre) out.push(pre);
  for(let i=1;i<parts.length;i+=2){
    const marker=parts[i], text=(parts[i+1]||'').trim();
    if(text) out.push(`${marker}. ${text}`);
  }
  return out.length?out:[tail];
}

function ledgerHtml(t){
  const side = rows => {
    const hasDate = rows.some(r=>r.date);
    return rows.map(r => `<div class="ledger-row">${hasDate?`<span class="lr-date">${esc(r.date||'')}</span>`:''}<span class="lr-label">${esc(r.label)}</span><span class="lr-amt">${esc(r.amount)}</span></div>`).join('');
  };
  return `<div class="ledger">
    <div class="ledger-title">${esc(t.title||'')}</div>
    <div class="ledger-body">
      <div class="ledger-side left">${side(t.left)}</div>
      <div class="ledger-side right">${side(t.right)}</div>
    </div>
    ${(t.leftTotal||t.rightTotal)?`<div class="ledger-total"><span>${esc(t.leftTotal)}</span><span>${esc(t.rightTotal)}</span></div>`:''}
  </div>`;
}

function trialBalanceHtml(t){
  const noRef = !!t.noRef;
  const rows = t.rows.map(r => `<tr><td class="num">${esc(r.debit||'')}</td>${noRef?'':`<td>${esc(r.ref||'')}</td>`}<td>${esc(r.name)}</td><td class="num">${esc(r.credit||'')}</td></tr>`).join('');
  return `<div class="tbal">
    <div class="tbal-head"><div class="tbal-title">${esc(t.title||'')}</div><div class="tbal-meta">${esc(t.meta||'')}</div></div>
    <table>
      <thead><tr><th>차변</th>${noRef?'':`<th>${esc(t.refLabel||'원면')}</th>`}<th>계정과목</th><th>대변</th></tr></thead>
      <tbody>${rows}<tr class="total"><td class="num">${esc(t.debitTotal)}</td>${noRef?'':'<td></td>'}<td></td><td class="num">${esc(t.creditTotal)}</td></tr></tbody>
    </table>
  </div>`;
}

function simpleTableHtml(t){
  const headRow = t.headers.map(h=>`<th>${esc(h)}</th>`).join('');
  const bodyRows = t.rows.map(r=>`<tr>${r.map(c=>`<td class="num">${esc(c)}</td>`).join('')}</tr>`).join('');
  return `<div class="tbal">
    ${t.title?`<div class="tbal-head"><div class="tbal-title">${esc(t.title)}</div></div>`:''}
    <table><thead><tr>${headRow}</tr></thead><tbody>${bodyRows}</tbody></table>
  </div>`;
}

function receiptHtml(t){
  const rows=t.rows.map(r=>{
    const cells=r.cells.map(c=>`<div class="rcpt-cell"><span class="rcpt-l">${esc(c.l)}</span><span class="rcpt-v">${esc(c.v)}</span></div>`).join('');
    return `<div class="rcpt-row${r.divider?' rcpt-div':''}${r.big?' rcpt-big':''}">${cells}</div>`;
  }).join('');
  return `<div class="receipt">
    ${t.notice?`<div class="rcpt-notice">${esc(t.notice)}</div>`:''}
    <div class="rcpt-title">${esc(t.title||'현금영수증')}</div>
    <div class="rcpt-body">${rows}</div>
    ${t.footer?`<div class="rcpt-footer">${esc(t.footer)}</div>`:''}
  </div>`;
}

async function load(){
  try{
    const r=await fetch('theory_bank_lv1.json');
    const d=await r.json();
    BANK=d.questions; META=d.meta;
  }catch(e){ document.getElementById('pool-info').textContent='문제 데이터를 불러오지 못했습니다.'; return; }
  renderTopics();
  bindStart();
  updatePool();
}

function renderTopics(){
  const box=document.getElementById('topic-chips');
  const counts={}; BANK.forEach(q=>counts[q.topic]=(counts[q.topic]||0)+1);
  const calcN=BANK.filter(q=>q.format.includes('계산')).length;
  let html=`<div class="chip on" data-topic="ALL">전체<span class="cnt">${BANK.length}</span></div>`;
  TOPIC_ORDER.forEach(t=>{
    html+=`<div class="chip" data-topic="${t}">${esc(META.topics[t])}<span class="cnt">${counts[t]||0}</span></div>`;
  });
  html+=`<div class="chip" data-topic="CALC">🧮 계산형<span class="cnt">${calcN}</span></div>`;
  box.innerHTML=html;
  box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); SEL_TOPIC=c.dataset.topic; updatePool();
  });
  const lb=document.getElementById('len-chips');
  lb.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    lb.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); SEL_LEN=parseInt(c.dataset.len); updatePool();
  });
}

function poolFor(){
  if(SEL_TOPIC==='ALL') return BANK.slice();
  if(SEL_TOPIC==='CALC') return BANK.filter(q=>q.format.includes('계산'));
  return BANK.filter(q=>q.topic===SEL_TOPIC);
}
function updatePool(){
  POOL=poolFor();
  const n=SEL_LEN===0?POOL.length:Math.min(SEL_LEN,POOL.length);
  document.getElementById('pool-info').textContent=`선택 범위 ${POOL.length}문항 중 ${n}문항 출제 · 틀린 문제는 오답노트에 자동 저장돼요.`;
  document.getElementById('start-btn').disabled=POOL.length===0;
}

function bindStart(){
  document.getElementById('start-btn').onclick=startQuiz;
  if(window.StepMode) StepMode.mount({ game: STEP_GAME, host: document.getElementById('step-host'), sub: '선택한 주제로', onStart: startTheoryStep });
}

/* ── 차근차근 모드(2026-09-24 개편, docs/차근차근모드_기획.md) ──
   성일님: "기존 게임에서 차근차근 한 단계씩. 갑자기 다른 창이 나오면 어떻게 해."
   → **같은 퀴즈 화면**(문제 카드·보기 버튼)을 그대로 쓰고, 보기 아래 힌트 줄만 붙인다.
     힌트 ① 틀린 보기 하나 지우고 왜 틀렸는지 ② 쉬운 개념 설명 ③ 정답 짚기
     틀려도 정답을 바로 보여 주지 않는다 — 고른 보기가 왜 틀렸는지 보여 주고 다시 고르게.
     시간 제한·점수 없음. 기록은 StepMode.session(전용 테이블·이 기기 오답노트)만. */
const STEP_GAME = (typeof GAME_ID !== 'undefined') ? GAME_ID : 'theory';
let STEPQ = null;
function startTheoryStep() {
  if (!window.StepMode || !BANK.length) return;
  const S = StepMode.session(STEP_GAME);
  STEPQ = { S, again: {}, hint: 0 };
  const n = SEL_LEN === 0 ? 20 : SEL_LEN;
  QUEUE = S.pick(poolFor(), n, q => q.id);
  qi = 0; score = 0; combo = 0; correctCnt = 0;
  document.body.classList.add('step-mode');
  document.getElementById('home').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  showQ();
}
/* 오답 해설에 정답이 적혀 있는 문항이 있다("올바른 계산 결과인 180,000원과 다릅니다").
   다시 고르는 단계에선 정답을 가린다 — 정답 보기 글자(와 '원'을 뗀 숫자)를 ? 로. */
function maskAns(t, q) {
  let out = String(t || '');
  const a = String(q.options[q.answer - 1] || '').trim();
  [a, a.replace(/원$/, '')].filter(x => x.length >= 2).forEach(x => { out = out.split(x).join('?'); });
  return out;
}
function stepDecorate(q) {
  STEPQ.hint = 0;
  STEPQ.S.begin(q.id);
  document.getElementById('hud-prog').textContent = `🐢 차근차근 ${qi + 1} / ${QUEUE.length}`;
  document.getElementById('expl').insertAdjacentHTML('beforebegin', '<div class="sq-hints" id="sq-hints"></div>');
  stepHints(q);
}
function stepHints(q) {
  const box = document.getElementById('sq-hints'); if (!box) return;
  const d = q.deepDive || {}, wr = d.wrongReasons || {};
  let h = '';
  if (STEPQ.hint >= 1 && STEPQ.elim != null) h += `<div class="sq-hint"><b>💡 ${STEPQ.elim}번은 아니에요.</b>${rd(maskAns(wr[String(STEPQ.elim)] || '', q), 1)}</div>`;
  if (STEPQ.hint >= 2 && d.conceptExplain) h += `<div class="sq-hint"><b>💡 ${esc(d.concept || '핵심 개념')}</b>${rd(d.conceptExplain, 2)}</div>`;
  if (STEPQ.hint >= 3) h += `<div class="sq-hint"><b>💡 정답에 노란 테두리를 쳤어요.</b></div>`;
  if (STEPQ.hint < 3 && !STEPQ.done) h += `<button class="sq-hbtn" type="button" id="sq-hbtn">${STEPQ.hint < 2 ? '💡 힌트 ' + (STEPQ.hint + 1) + ' 보기' : '👀 정답 짚어 주기'}</button>`;
  box.innerHTML = h;
  const b = document.getElementById('sq-hbtn');
  if (b) b.onclick = () => stepHint(q);
}
function stepHint(q) {
  STEPQ.hint++;
  STEPQ.S.hint(STEPQ.hint);
  const wr = (q.deepDive || {}).wrongReasons || {};
  if (STEPQ.hint === 1) {   // 아직 안 지운·안 고른 오답 중 이유가 있는 것 하나를 지운다
    const cand = [...document.querySelectorAll('.choice')].map(b => +b.dataset.i).filter(i => i !== q.answer && !document.querySelector(`.choice[data-i="${i}"]`).disabled);
    const withWhy = cand.filter(i => wr[String(i)]);
    const pickI = (withWhy.length ? withWhy : cand)[0];
    if (pickI != null) { STEPQ.elim = pickI; const b = document.querySelector(`.choice[data-i="${pickI}"]`); b.disabled = true; b.classList.add('elim'); }
  }
  if (STEPQ.hint === 3) { const b = document.querySelector(`.choice[data-i="${q.answer}"]`); if (b) b.classList.add('step-glow'); }
  stepHints(q);
}
function stepPick(choice, q) {
  const btn = document.querySelector(`.choice[data-i="${choice}"]`);
  const expl = document.getElementById('expl');
  const d = q.deepDive || {}, wr = d.wrongReasons || {};
  if (choice !== q.answer) {
    STEPQ.S.wrong();
    btn.classList.add('wrong'); btn.disabled = true;
    expl.innerHTML = `<div class="verdict" style="color:var(--red)">✗ ${choice}번은 아니에요</div>` +
      rd(maskAns(wr[String(choice)] || '이 보기는 문제에서 묻는 내용과 맞지 않아요.', q), 2) +
      `<div class="sq-again">다른 보기를 골라 봐요. 막히면 힌트!</div>`;
    expl.style.display = 'block';
    expl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  STEPQ.done = true;
  document.querySelectorAll('.choice').forEach(b => { b.disabled = true; b.classList.remove('step-glow'); });
  btn.classList.add('correct');
  const clean = STEPQ.S.done(q.id, { label: d.concept || q.topicName, q: q.stem, correct: q.answerText, type: q.topicName });
  if (!clean && !STEPQ.again[q.id]) { STEPQ.again[q.id] = 1; QUEUE.splice(Math.min(QUEUE.length, qi + 4), 0, q); }
  expl.innerHTML = `<div class="verdict" style="color:var(--green)">✓ 맞았어요!</div>${rd(d.whyCorrect || q.explanation || '', 2)}` + deepDiveHtml(q);
  const dd = document.getElementById('dd-toggle'); if (dd) dd.onclick = () => toggleDeepDive(q);
  expl.style.display = 'block';
  stepHints(q);
  const last = qi + 1 >= QUEUE.length;
  const nb = document.getElementById('next-btn');
  nb.textContent = last ? '결과 보기 🏁' : '다음 문제 →';
  document.getElementById('next-wrap').style.display = 'block';
  nb.onclick = () => { qi++; STEPQ.done = false; STEPQ.elim = null; qi >= QUEUE.length ? stepEnd() : showQ(); };
  expl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function stepEnd() {
  const S = STEPQ.S;
  S.finish(true);
  const L = S.learned(), A = S.again();
  const list = arr => arr.slice(0, 5).map(x => '· ' + esc(x)).join('<br>');
  document.getElementById('quiz').style.display = 'none';
  const box = document.getElementById('result');
  box.style.display = 'block';
  box.innerHTML = `<span class="em">🐢</span>
    <div class="grade">차근차근 끝!</div>
    <div class="res-note" style="text-align:left;line-height:1.8">🌱 오늘 익힌 것 <b>${L.length}</b>개${L.length ? '<br>' + list(L) : ''}
      ${A.length ? `<br><br>🔁 다시 볼 것 <b>${A.length}</b>개<br>${list(A)}<br><span style="opacity:.7">내 오답노트에서 다시 볼 수 있어요.</span>` : ''}</div>
    <div class="btn-row">
      <button class="primary" id="sq-again">한 번 더</button>
      <a href="${location.pathname.split('/').pop()}">주제 고르기 →</a>
    </div>`;
  document.getElementById('sq-again').onclick = () => { STEPQ = null; startTheoryStep(); };
  STEPQ = null;
  document.body.classList.remove('step-mode');
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── 퀴즈 진행 ──
let QUEUE=[], qi=0, score=0, combo=0, correctCnt=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startQuiz(){
  const pool=shuffle(poolFor());
  const n=SEL_LEN===0?pool.length:Math.min(SEL_LEN,pool.length);
  QUEUE=pool.slice(0,n);
  qi=0;score=0;combo=0;correctCnt=0;
  if(window.WrongNote) WrongNote.reset();
  document.getElementById('home').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  showQ();
}

function tAccountHtml(v){
  return `<span class="t-acc">
    <span class="t-acc-label">${esc(v.account)}</span>
    <span class="t-acc-line"></span>
    <span class="t-acc-body">
      <span class="t-acc-side debit">${v.side==='debit'?esc(v.amount):''}</span>
      <span class="t-acc-side credit">${v.side==='credit'?esc(v.amount):''}</span>
    </span>
  </span>`;
}

function showQ(){
  const q=QUEUE[qi];
  document.getElementById('hud-prog').textContent=`${qi+1} / ${QUEUE.length}`;
  document.getElementById('hud-score').textContent=score.toLocaleString();
  document.getElementById('hud-combo').textContent=combo;
  document.getElementById('prog-fill').style.width=(qi/QUEUE.length*100)+'%';
  const fmt=q.format&&q.format.length?`<span class="fmt">${q.format.map(esc).join('·')}</span>`:'';
  let html=`<div class="qcard">
    <div class="qtag">${esc(q.topicName)}${fmt}</div>
    <div class="qstem">${fmtStem(q.stem)}</div>
    ${q.stemTAccount ? ledgerHtml(q.stemTAccount) : ''}
    ${q.stemTAccounts ? `<div class="ledger-group">${q.stemTAccounts.map(ledgerHtml).join('')}</div>` : ''}
    ${q.stemTrialBalance ? trialBalanceHtml(q.stemTrialBalance) : ''}
    ${q.stemTable ? simpleTableHtml(q.stemTable) : ''}
    ${q.stemReceipt ? receiptHtml(q.stemReceipt) : ''}`;
  q.options.forEach((o,i)=>{
    const body = q.optionsVisual && q.optionsVisual[i] ? tAccountHtml(q.optionsVisual[i]) : `<span>${esc(o)}</span>`;
    html+=`<button class="choice${q.optionsVisual?' has-visual':''}" data-i="${i+1}"><span class="no">${i+1}</span>${body}</button>`;
  });
  html+=`<div class="expl" id="expl"></div>
    <div class="next-wrap" id="next-wrap"><button class="cta" id="next-btn">${qi+1>=QUEUE.length?'결과 보기 🏁':'다음 문제 →'}</button></div>
    ${q.source?`<div class="qsrc">${esc(q.source)}</div>`:''}
  </div>`;
  document.getElementById('quiz-body').innerHTML=html;
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(parseInt(b.dataset.i),q));
  if(STEPQ) stepDecorate(q);
}

function pick(choice,q){
  if(STEPQ) return stepPick(choice,q);   // 차근차근 모드: 틀려도 정답을 바로 안 보여 주고 다시 고르게
  document.querySelectorAll('.choice').forEach(b=>{
    b.disabled=true;
    const i=parseInt(b.dataset.i);
    if(i===q.answer) b.classList.add('correct');
    else if(i===choice) b.classList.add('wrong');
  });
  const ok=choice===q.answer;
  if(window.Growth) Growth.logTopicAttempt({game:GAME_ID, topic:q.topicName, correct:ok});
  const expl=document.getElementById('expl');
  const verdictHtml = ok
    ? `<div class="verdict" style="color:var(--green)">✓ 정답!</div>${rd(q.explanation,2)}`
    : `<div class="verdict" style="color:var(--red)">✗ 오답 — 정답은 ${q.answer}번</div>${rd(q.explanation,2)}`;
  expl.innerHTML = verdictHtml + deepDiveHtml(q);
  if(ok){
    combo++; correctCnt++;
    score+=100+(combo-1)*20;
  }else{
    combo=0;
    if(window.WrongNote) WrongNote.add({
      game:GAME_ID, key:q.id, q:q.stem,
      correct:q.answerText, wrong:q.options[choice-1]||'',
      type:q.topicName
    });
  }
  const dd=document.getElementById('dd-toggle');
  if(dd) dd.onclick=()=>toggleDeepDive(q);
  document.getElementById('hud-score').textContent=score.toLocaleString();
  document.getElementById('hud-combo').textContent=combo;
  expl.style.display='block';
  document.getElementById('next-wrap').style.display='block';
  document.getElementById('next-btn').onclick=()=>{ qi++; qi>=QUEUE.length?endQuiz():showQ(); };
  expl.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// 긴 해설은 문장마다 줄을 나누고 앞 몇 문장만 먼저 보여 준다(readable.js, 2026-09-23 가독성 요청)
function rd(t,keep){ return window.Readable ? Readable.html(t||'',{keep:keep}) : esc(t||''); }

function deepDiveHtml(q){
  if(!q.deepDive) return '';
  return `<button class="dd-btn" id="dd-toggle">🔍 자세한 개념 알아보기</button>
    <div class="dd-panel" id="dd-panel" style="display:none"></div>`;
}

function toggleDeepDive(q){
  const panel=document.getElementById('dd-panel');
  const btn=document.getElementById('dd-toggle');
  if(!panel) return;
  const opening = panel.style.display==='none';
  if(opening && !panel.dataset.built){
    const d=q.deepDive;
    const wrongList = q.options.map((o,i)=>{
      const idx=i+1;
      if(idx===q.answer) return '';
      const reason = d.wrongReasons && d.wrongReasons[String(idx)];
      if(!reason) return '';
      return `<div class="dd-wrong"><div class="dd-wrong-opt"><span class="dd-wrong-no">${idx}번</span> ${esc(o)}</div>${rd(reason,0)}</div>`;
    }).join('');
    panel.innerHTML = `
      <div class="dd-block"><div class="dd-label">📌 핵심 개념</div><div class="dd-text">${esc(d.concept||'')}</div></div>
      <div class="dd-block"><div class="dd-label">💡 쉬운 설명</div><div class="dd-text">${rd(d.conceptExplain,2)}</div></div>
      <div class="dd-block"><div class="dd-label">✅ 정답 해설</div><div class="dd-text">${rd(d.whyCorrect,2)}</div></div>
      ${wrongList?`<div class="dd-block"><div class="dd-label">❌ 오답 해설</div>${wrongList}</div>`:''}
    `;
    panel.dataset.built='1';
  }
  panel.style.display = opening ? 'block' : 'none';
  btn.textContent = opening ? '🔍 개념 설명 접기' : '🔍 자세한 개념 알아보기';
  if(opening) panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function grade(rate){
  if(rate>=0.9) return '👑 회계 마스터';
  if(rate>=0.75) return '🥇 합격 안정권';
  if(rate>=0.6) return '🥈 합격 가시권';
  if(rate>=0.4) return '🥉 분발 필요';
  return '📋 기초 다지기';
}

async function endQuiz(){
  if(window.WrongNote) await WrongNote.flush(GAME_ID);
  // 성장 그래프용 — 이번 판 결과를 이력에 기록 (다른 게임들과 동일)
  const rate=QUEUE.length?correctCnt/QUEUE.length:0;
  if(window.Growth) Growth.record({game:GAME_ID, score:score, grade:grade(rate), combo:combo, correct:correctCnt});
  // 다른 게임들과 동일하게 N판마다 전면광고 후 결과 표시
  requestInterstitialIfNeeded(renderResult);
}
function renderResult(){
  const total=QUEUE.length, wrong=total-correctCnt;
  const rate=total?correctCnt/total:0;
  document.getElementById('quiz').style.display='none';
  const box=document.getElementById('result');
  box.style.display='block';
  box.innerHTML=`
    <span class="em">${rate>=0.6?'🎉':'💪'}</span>
    <div class="score">${score.toLocaleString()}점</div>
    <div class="grade">${grade(rate)}</div>
    <div class="res-row">
      <div>정답률<span class="v" style="color:var(--blue)">${Math.round(rate*100)}%</span></div>
      <div>맞힘<span class="v" style="color:var(--green)">${correctCnt}</span></div>
      <div>틀림<span class="v" style="color:var(--red)">${wrong}</span></div>
    </div>
    <div class="res-note">${wrong>0?`틀린 ${wrong}문제가 <b style="color:var(--gold)">오답노트</b>에 저장됐어요.`:'전부 맞혔어요! 완벽합니다 👏'}</div>
    <div class="btn-row">
      <button class="primary" onclick="location.reload()">다시 풀기</button>
      ${wrong>0?'<a href="review.html">오답노트 →</a>':'<a href="index_lv1.html">메인 →</a>'}
    </div>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

// ── 광고(전면) — 다른 게임들과 공유 카운터, N판마다 표시 ──
const AD_GAME_COUNT_KEY='hub_ad_game_count';
const AD_INTERSTITIAL_EVERY=10;
function incrementGameCount(){
  const n=parseInt(localStorage.getItem(AD_GAME_COUNT_KEY)||'0')+1;
  localStorage.setItem(AD_GAME_COUNT_KEY,String(n)); return n;
}
function requestInterstitialIfNeeded(afterFn){
  if(window.AdBridge && typeof AdBridge.isAdsRemoved==='function' && AdBridge.isAdsRemoved()){ afterFn&&afterFn(); return; }
  window._adAfterFn=afterFn;
  const count=incrementGameCount();
  if(count%AD_INTERSTITIAL_EVERY===0 && window.AdBridge && typeof AdBridge.showInterstitial==='function'){
    AdBridge.showInterstitial(); // 닫히면 onInterstitialClosed()에서 afterFn 실행
  } else {
    /* 광고를 안 띄우고 그냥 넘어가는 길. 예약해 둔 함수를 **반드시 지우고** 부른다 —
       안 지우면 다음에 뒤늦은 광고 닫힘 신호가 왔을 때 지난 함수가 한 번 더 불린다
       (결과화면에서 난데없이 화면이 넘어가는 증상, 2026-09-16 정리). */
    window._adAfterFn = null;
    afterFn && afterFn();
  }
}
function onInterstitialClosed(){ if(window._adAfterFn){ const f=window._adAfterFn; window._adAfterFn=null; f(); } }
function onAdsRemoved(){}
function hideAdPlaceholder(){ if(window.AdBridge && typeof AdBridge.hide==='function') AdBridge.hide(); }

load();
</script>
