<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 저장소가 막힌 환경(프라이빗 브라우징·사이트데이터 차단)에서도 게임이 돌아가게 한다.
         **반드시 다른 스크립트보다 먼저** 로드돼야 한다 — 2026-09-16 검토에서
         이게 없으면 게임 5종이 시작조차 안 되는 것을 확인했다. -->
    <script src="safestore.js?v=27"></script>
<meta charset="utf-8">
<!-- viewport-fit=cover 가 있어야 env(safe-area-inset-*) 이 실제 값을 준다.
     이게 빠져서 제목이 노치에 가렸다(2026-09-16 제보). -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>팀전 결과 — 전산회계 오락실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="emoji-icons.js?v=27"></script>
<script src="teamscore.js?v=27"></script>
<style>
/* 수업이 끝난 뒤 교사가 보고 상을 주는 화면. 전광판과 달리 **읽고 판단하는** 화면이라
   글자를 키우기보다 정보를 촘촘하게 놓는다. 인쇄해서 게시할 수도 있어야 한다. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--cy:#00f2ff;--pk:#ff2d78;--gd:#ffd600;--gn:#00e676;--bg:#020810;--line:rgba(255,255,255,.09)}
body{background:var(--bg);color:#eaf2ff;font-family:'Noto Sans KR',sans-serif;
  /* 노치·홈바를 피한다. 앱에서 제목이 노치에 가려 안 보였다(2026-09-16 제보).
     '돌아가기' 버튼도 이 자리를 쓰므로 그만큼 더 내려 준다. */
  padding:calc(28px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right))
          calc(60px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left));
  max-width:1100px;margin:0 auto;line-height:1.5}
h1{font-family:'Black Han Sans',sans-serif;font-size:1.9rem}
h1 .cls{color:var(--cy)}
.meta{color:rgba(255,255,255,.4);font-size:.84rem;margin:6px 0 22px}
h2{font-family:'Orbitron',monospace;font-size:.68rem;letter-spacing:3px;
  color:rgba(255,255,255,.4);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2 .sub{font-family:'Noto Sans KR',sans-serif;letter-spacing:0;font-weight:400;
  font-size:.72rem;color:rgba(255,255,255,.28)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card.win{background:linear-gradient(135deg,rgba(255,214,0,.16),rgba(255,214,0,.03));border-color:rgba(255,214,0,.5)}
.card.gwin{background:linear-gradient(135deg,rgba(0,230,118,.14),rgba(0,230,118,.03));border-color:rgba(0,230,118,.45)}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.ch b{font-size:1.05rem}
.ch .v{font-family:'Orbitron',monospace;font-weight:900;font-size:1.5rem;color:var(--cy)}
.card.win .ch .v{color:var(--gd)} .card.gwin .ch .v{color:var(--gn)}
.mem{display:flex;justify-content:space-between;font-size:.82rem;
  padding:4px 0;border-top:1px solid rgba(255,255,255,.06)}
.mem span:last-child{font-family:'Orbitron',monospace;color:rgba(255,255,255,.55)}
.mem .up{color:var(--gn)}
/* 좁은 화면에서는 표를 욱여넣지 말고 옆으로 밀어 보게 한다.
   '기록' 칸이 길어서 이름·모둠 칸이 '안/민/서' 처럼 한 글자씩 접혔다(2026-09-16 제보). */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  /* 아직 더 밀 게 남았다는 걸 오른쪽 끝 그림자로 알려 준다 */
  background:linear-gradient(90deg,var(--bg) 30%,transparent),
             linear-gradient(90deg,transparent,var(--bg) 70%) right,
             radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.5),transparent),
             radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.5),transparent) right;
  background-repeat:no-repeat;background-size:36px 100%,36px 100%,14px 100%,14px 100%;
  background-attachment:local,local,scroll,scroll}
.tscroll::-webkit-scrollbar{height:8px}
.tscroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px}

table{width:100%;border-collapse:collapse;font-size:.85rem}
/* 이름·모둠·점수는 절대 접히지 않는다. '기록'만 여러 줄로 늘어난다. */
th,td{white-space:nowrap}
td.rec,th.rec{white-space:normal;min-width:15em}
td.who{font-weight:700}
td.team{color:rgba(255,255,255,.55)}
@media(max-width:760px){
  table{min-width:640px}          /* 이보다 좁으면 옆으로 민다 */
  td.rec,th.rec{min-width:17em}
}
th{text-align:left;font-family:'Orbitron',monospace;font-size:.58rem;letter-spacing:2px;
  color:rgba(255,255,255,.25);padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid rgba(255,255,255,.05)}
td.n{font-family:'Orbitron',monospace;text-align:right}
tr.top td{background:rgba(255,214,0,.06)}
.gain{color:var(--gn);font-weight:700}
/* 게임별 이번 세션 1등 — 기록 칸에서 그 항목만 금색 알약으로 띄운다(2026-09-16 요청).
   같은 칸의 나머지 기록은 원래대로 흐린 글씨라, 굳이 크게 하지 않아도 눈에 먼저 들어온다. */
.bestrec{display:inline-block;background:rgba(255,214,0,.16);border:1px solid rgba(255,214,0,.45);
  color:#ffd24a;font-weight:700;border-radius:999px;padding:1px 8px;margin:1px 0;
  white-space:nowrap;letter-spacing:.2px}
.bestrec .crown{margin-right:3px;opacity:.9}
.recsep{color:rgba(255,255,255,.25);margin:0 2px}
.zero{color:rgba(255,255,255,.2)}
.note{margin-top:26px;font-size:.78rem;color:rgba(255,255,255,.35);line-height:1.9;
  border-top:1px solid var(--line);padding-top:14px}
.err{padding:60px 20px;text-align:center;color:rgba(255,255,255,.45);line-height:2}
.bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.bar a,.bar button{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#eaf0ff;
  border-radius:9px;padding:7px 13px;font-size:.8rem;text-decoration:none;cursor:pointer;font-family:inherit}
@media print{
  body{background:#fff;color:#111;max-width:none}
  .card,table,th,td{border-color:#ccc}
  .bar{display:none}
  .card{background:#fafafa}
  h1 .cls,.ch .v{color:#111}
}
</style>
</head>
<body>
<div id="root" style="display:none">
  <div class="bar">
    <a href="#" id="b-board">전광판 보기 ↗</a>
    <button onclick="print()">인쇄 / PDF</button>
  </div>
  <h1><span class="cls" id="h-cls">—</span> 팀전 결과</h1>
  <div class="meta" id="h-meta"></div>

  <h2>팀 순위 <span class="sub">팀원 평균</span></h2>
  <div class="cards" id="teams"></div>

  <h2>성장 순위 <span class="sub">자기 이전 최고점 대비 오른 만큼 — 하위권이 유리한 판</span></h2>
  <div class="cards" id="grow"></div>

  <h2>개인 전체</h2>
  <div class="tscroll">
    <table>
      <thead><tr><th>#</th><th>이름</th><th>모둠</th><th style="text-align:right">점수</th>
        <th style="text-align:right">성장</th><th class="rec">기록</th></tr></thead>
      <tbody id="solo"></tbody>
    </table>
  </div>

  <div class="note" id="note"></div>
</div>
<div class="err" id="err">불러오는 중…</div>

<script>
/* result.html?s=<세션코드> — 수업 뒤 교사가 보고 상을 주는 화면.
   점수 계산은 teamscore.js 를 그대로 쓴다(전광판과 같은 식이어야 한다). */
const db = supabase.createClient(
  "https://pjagaulfivafamhhiveg.supabase.co",
  "sb_publishable_yck2tAKApEjVSJOJMVSXuQ_AGaNatuI");
const GAME_NAME = {acid:'산성비',memory:'기억의 전당',debit:'차변대변',factory:'분개 공장',
  flight:'결산 비행',theory:'이론',cost_lv1:'원가의 길',capital_lv1:'자본',
  voucher_lv1:'전표',vat_lv1:'부가세',alloc_lv1:'배분',theory_lv1:'이론(1급)'};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SID = new URLSearchParams(location.search).get('s');

(async function(){
  const fail = m => { document.getElementById('err').innerHTML = m; };
  if(!SID){ fail('세션 코드가 없습니다.'); return; }

  const [s,m] = await Promise.all([
    db.from('team_session').select('*').eq('id',SID).maybeSingle(),
    db.from('team_member').select('student_name,team_no').eq('session_id',SID)
  ]);
  if(s.error || !s.data){ fail('세션을 찾을 수 없습니다.<br><small>'+esc(SID)+'</small>'); return; }
  const SES=s.data, MEMBERS=m.data||[];
  if(!MEMBERS.length){ fail('이 세션에 배정된 학생이 없습니다.'); return; }

  const alias = await TeamScore.loadAlias(db, SES.group_id);
  const base  = await TeamScore.loadBaseline(db, SES, MEMBERS, alias);

  /* ── 3초마다 자동 갱신 (2026-09-16 사용자 요청: "결과 보기도 3초마다 자동 갱신되게 해줘")
     세션 정보·별칭·기준선은 세션 내내 안 바뀌므로 위에서 **한 번만** 읽는다.
     매번 다시 읽는 것은 점수 기록과 '세션이 끝났는지' 둘뿐이다 — 전광판과 같은 방식.
     ⚠ 이미 끝난 세션을 열어 본 것이면 더 볼 것이 없으므로 타이머를 걸지 않는다. */
  async function fetchRows(){
    let q = db.from('score_history').select('user_name,game_id,score,played_at')
      .eq('group_id',SES.group_id).gte('played_at',SES.started_at).limit(20000);
    if(SES.ended_at) q = q.lte('played_at', SES.ended_at);
    return q;
  }

  function render(rows){
  const R = TeamScore.compute({session:SES, members:MEMBERS, rows:rows||[], baseline:base, alias});

  document.getElementById('err').style.display='none';
  document.getElementById('root').style.display='block';
  document.getElementById('h-cls').textContent = SES.class_label || '전체';
  document.getElementById('b-board').href = 'board.html?s='+encodeURIComponent(SID);

  const games = (SES.game_ids&&SES.game_ids.length) ? SES.game_ids.map(g=>GAME_NAME[g]||g).join(' · ') : '전체 게임';
  const st = new Date(SES.started_at), en = SES.ended_at ? new Date(SES.ended_at) : null;
  const mins = Math.round(((en||new Date()) - st)/60000);
  document.getElementById('h-meta').textContent =
    games + ' · ' + st.toLocaleString('ko-KR') + ' · ' + mins + '분' +
    (en ? '' : ' (진행 중 · 3초마다 자동 갱신)') + ' · 세션 ' + SID;

  const card = (t,i,key,cls) =>
    '<div class="card'+(i===0?' '+cls:'')+'">'+
      '<div class="ch"><b>'+(i+1)+'. '+esc(t.name)+'</b>'+
        '<span class="v">'+(key==='grow'?'+':'')+t.score.toLocaleString()+'</span></div>'+
      t.members.map(x=>'<div class="mem"><span>'+esc(x.name)+'</span>'+
        '<span class="'+(key==='grow'&&x.grow>0?'up':'')+'">'+
        (key==='grow'?('+'+x.grow):x.score.toLocaleString())+'</span></div>').join('')+
    '</div>';

  document.getElementById('teams').innerHTML = R.teams.map((t,i)=>card(t,i,'score','win')).join('');
  document.getElementById('grow').innerHTML  = R.growTeams.map((t,i)=>card(t,i,'grow','gwin')).join('');

  /* 게임마다 이번 세션 최고점을 먼저 구한다 — 동점이면 그 학생들 모두가 1등이다. */
  const bestOf = {};
  R.byScore.forEach(p => Object.keys(p.best).forEach(g => {
    if (bestOf[g] == null || p.best[g] > bestOf[g]) bestOf[g] = p.best[g];
  }));

  document.getElementById('solo').innerHTML = R.byScore.map((x,i)=>{
    const rec = Object.keys(x.best).map(g=>{
      const label = (GAME_NAME[g]||g) + ' ' + x.best[g].toLocaleString();
      // 그 게임의 1등이면 금색 알약. 0점은 1등으로 치지 않는다(아무도 안 한 게임)
      return (bestOf[g] > 0 && x.best[g] === bestOf[g])
        ? '<span class="bestrec"><span class="crown">👑</span>' + esc(label) + '</span>'
        : esc(label);
    }).join('<span class="recsep">·</span>');
    return '<tr'+(i<3?' class="top"':'')+'><td class="n">'+(i+1)+'</td>'+
      '<td class="who">'+esc(x.name)+'</td>'+
      '<td class="team">'+x.team+'모둠</td><td class="n">'+x.score.toLocaleString()+'</td>'+
      '<td class="n '+(x.grow>0?'gain':'zero')+'">'+(x.grow>0?'+'+x.grow:'—')+'</td>'+
      '<td class="rec" style="color:rgba(255,255,255,.4);font-size:.78rem;line-height:1.9">'+
        (rec||'기록 없음')+'</td></tr>';
  }).join('');

  const gTop = R.byGrow[0], played = R.solo.filter(x=>Object.keys(x.best).length).length;
  document.getElementById('note').innerHTML =
    '· 참여 <b>'+played+'</b>/'+MEMBERS.length+'명' +
    (gTop && gTop.grow>0 ? ' · 가장 많이 오른 학생 <b>'+esc(gTop.name)+'</b> (+'+gTop.grow+')' : '') +
    '<br>· 팀 점수는 <b>팀원 평균</b>입니다. 참여하지 않은 학생은 0점으로 들어가므로 전원이 해야 팀이 오릅니다.' +
    '<br>· 성장 점수는 <b>자기 이전 최고점 대비 몇 % 올랐는지</b>입니다(게임당 최대 +'+TeamScore.GROW_CAP+
      '). 이미 최고점이 높은 학생은 오르기 어렵고, 그만큼 하위권이 유리한 판입니다.' +
    (R.multi ? '<br>· 게임이 여럿이라 점수는 <b>게임마다 그 시간 1등 대비 %</b>로 환산해 합산했습니다.' : '');
  }

  let timer = null;
  async function tick(){
    try{
      // 교사가 대시보드에서 세션을 끝낼 수 있다 — 끝났으면 그 시각까지만 집계하고 타이머를 멈춘다
      const sRes = await db.from('team_session').select('ended_at').eq('id',SID).maybeSingle();
      if(sRes.data && sRes.data.ended_at && !SES.ended_at){
        SES.ended_at = sRes.data.ended_at;
        if(timer){ clearInterval(timer); timer = null; }
      }
      const h = await fetchRows();
      if(h.error) return;            // 네트워크가 잠깐 끊겨도 화면은 그대로 둔다
      render(h.data||[]);
    }catch(e){ /* 같은 이유로 조용히 넘긴다 */ }
  }

  const first = await fetchRows();
  render(first.data||[]);
  if(!SES.ended_at) timer = setInterval(tick, 3000);
})();
</script>
<script>
/* 앱에서 열렸으면 되돌아가기 버튼을 띄운다(2026-09-16).
   브라우저는 새 탭이라 필요 없고, 앱은 같은 창에서 이동하므로 길을 터 줘야 한다.
   이미 상단 버튼 줄(.bar)이 있으면 **그 줄 안에** 넣는다 — 따로 띄웠더니
   '전광판 보기' 위에 포개졌다(제보 스크린샷). */
(function(){
  function inApp(){
    try{ if(window.Capacitor && typeof Capacitor.isNativePlatform==='function')
           return Capacitor.isNativePlatform(); }catch(e){}
    return /^(capacitor|ionic|file):/.test(location.protocol);
  }
  if(!inApp() || history.length <= 1) return;
  var b=document.createElement('button');
  b.textContent='← 돌아가기';
  b.setAttribute('aria-label','교수자 대시보드로 돌아가기');
  b.onclick=function(){ history.back(); };

  var bar=document.querySelector('.bar');
  if(bar){ bar.insertBefore(b, bar.firstChild); return; }   // 줄 안에 끼우면 스타일도 따라온다

  b.style.cssText='position:fixed;left:calc(10px + env(safe-area-inset-left));'+
    'top:calc(10px + env(safe-area-inset-top));z-index:99999;'+
    'padding:9px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.25);'+
    'background:rgba(10,14,22,.88);color:#fff;font-size:.85rem;font-weight:700;'+
    'cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)';
  document.body.appendChild(b);
})();
</script>
</body>
</html>
