<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>팀전 전광판 — 전산회계 오락실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── 교실 전자칠판 전용. 멀리서 보는 화면이라 글자를 크게, 정보를 적게. ──
   순위 '숫자'가 바뀌는 건 아무도 안 본다. **행이 자리를 바꾸며 미끄러져야**
   역전이 보이고 경쟁심이 생긴다 → FLIP 애니메이션. */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cy:#00f2ff; --pk:#ff2d78; --gd:#ffd600; --gn:#00e676;
  --bg:#020810; --line:rgba(255,255,255,.09);
}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(0,242,255,.10), transparent 60%),
    radial-gradient(900px 500px at 105% 110%, rgba(255,45,120,.09), transparent 60%),
    var(--bg);
  color:#eaf2ff; font-family:'Noto Sans KR',sans-serif; overflow:hidden;
  display:flex; flex-direction:column; padding:2.2vmin 2.6vmin;
}
/* ── 머리줄 ── */
.hd{display:flex;align-items:baseline;gap:1.4vw;flex-wrap:wrap;margin-bottom:1.6vmin}
.hd h1{font-family:'Black Han Sans',sans-serif;font-size:4.2vmin;letter-spacing:.5px}
.hd .cls{color:var(--cy);}
.hd .games{font-size:1.7vmin;color:rgba(255,255,255,.45)}
.hd .clock{margin-left:auto;font-family:'Orbitron',monospace;font-weight:900;
  font-size:3.4vmin;color:var(--gd);letter-spacing:1px}
.hd .clock.done{color:var(--pk)}

/* ── 본문 2단: 팀(넓게) / 개인(좁게) ── */
.wrap{flex:1;display:grid;grid-template-columns:1.5fr 1fr;gap:2.2vmin;min-height:0}
.rightcol{display:grid;grid-template-rows:1fr 1fr;gap:1.8vmin;min-height:0}
.col{display:flex;flex-direction:column;min-height:0}
.col h2{font-family:'Orbitron',monospace;font-size:1.5vmin;letter-spacing:3px;
  color:rgba(255,255,255,.4);margin-bottom:1.1vmin}
.list{position:relative;flex:1;min-height:0;overflow:hidden}

/* 행은 absolute + transform 으로 옮긴다(그래야 자리바꿈이 미끄러진다) */
.row{position:absolute;left:0;right:0;display:flex;align-items:center;gap:1.4vmin;
  border-radius:1.4vmin;padding:0 1.6vmin;
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  transition:transform .75s cubic-bezier(.22,1,.36,1), background .4s, border-color .4s;
  will-change:transform}
.row .rk{font-family:'Orbitron',monospace;font-weight:900;color:rgba(255,255,255,.35);
  width:3.2vmin;text-align:center;flex:none}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.row .sc{font-family:'Orbitron',monospace;font-weight:900;color:var(--cy);flex:none}
.row .mv{flex:none;width:3.4vmin;text-align:center;font-size:1.5vmin;font-weight:900;opacity:0}
.row .mv.up{color:var(--gn);opacity:1}
.row .mv.dn{color:rgba(255,255,255,.25);opacity:1}

/* 팀 행 — 크게 */
#teams .row{height:11.5vmin;font-size:3.4vmin}
#teams .row .sc{font-size:3.8vmin}
#teams .row .mem{font-size:1.5vmin;color:rgba(255,255,255,.4);font-weight:400;
  margin-top:.4vmin;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#teams .row .nmwrap{flex:1;min-width:0}
#teams .row.r1{background:linear-gradient(90deg,rgba(255,214,0,.18),rgba(255,214,0,.04));
  border-color:rgba(255,214,0,.5)}
#teams .row.r1 .rk,#teams .row.r1 .sc{color:var(--gd)}
#teams .row.r2{background:rgba(255,255,255,.08)}
/* 역전한 순간 잠깐 빛난다 */
@keyframes pop{0%{box-shadow:0 0 0 0 rgba(0,230,118,.55)}100%{box-shadow:0 0 0 2.4vmin rgba(0,230,118,0)}}
.row.jump{animation:pop .9s ease-out}

/* 개인 행 — 작게 */
#solo .row{height:5vmin;font-size:1.9vmin}
#solo .row .sc{font-size:2.1vmin}
#solo .row .tag{font-size:1.3vmin;color:rgba(255,255,255,.3);flex:none}

.foot{margin-top:1.4vmin;display:flex;align-items:center;gap:1.6vw;
  font-size:1.6vmin;color:rgba(255,255,255,.4)}
.foot b{color:var(--gd)}
.err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:2.4vmin;color:rgba(255,255,255,.5);padding:6vmin;line-height:1.9}
#grow .row{height:7.4vmin;font-size:2.3vmin}
#grow .row .sc{font-size:2.5vmin;color:var(--gn)}
#grow .row.r1{background:linear-gradient(90deg,rgba(0,230,118,.16),rgba(0,230,118,.03));
  border-color:rgba(0,230,118,.45)}
#grow .row.r1 .rk,#grow .row.r1 .sc{color:var(--gn)}
.col h2 .sub{font-family:'Noto Sans KR',sans-serif;letter-spacing:0;font-weight:400;
  color:rgba(255,255,255,.28);margin-left:.8vw}
@media (max-width:900px){ .wrap{grid-template-columns:1fr} .rightcol{display:none} }
@media (prefers-reduced-motion:reduce){ .row{transition:none} .row.jump{animation:none} }
</style>
</head>
<body>
<div id="root" style="display:none;flex:1;flex-direction:column;min-height:0">
  <div class="hd">
    <h1><span class="cls" id="h-cls">—</span> 팀전</h1>
    <div class="games" id="h-games"></div>
    <div class="clock" id="h-clock">0:00</div>
  </div>
  <div class="wrap">
    <div class="col"><h2>TEAM RANKING</h2><div class="list" id="teams"></div></div>
    <div class="rightcol">
      <div class="col"><h2>성장 랭킹 <span class="sub">자기 최고점 대비 오른 만큼</span></h2>
        <div class="list" id="grow"></div></div>
      <div class="col"><h2>개인 <span class="sub" id="solo-sub"></span></h2>
        <div class="list" id="solo"></div></div>
    </div>
  </div>
  <div class="foot">
    <span>🔴 <b>신기록이 나오면 꼭 저장</b>해야 점수가 들어갑니다</span>
    <span id="f-rule"></span>
    <span style="margin-left:auto" id="f-code"></span>
  </div>
</div>
<div class="err" id="err">불러오는 중…</div>

<script>
/* ============================================================
 *  board.html — 팀전 전광판 (교실 전자칠판)
 *  기획: 팀전_기획.md 2장 ② · 6장
 *
 *  ⚠ 로그인이 없다. 세션 코드만 알면 열린다(교실 화면 하나 띄우는 용도).
 *    쓰기는 일절 안 하고 **읽기만** 한다.
 *
 *  세션 점수 = 그 시간에 세운 최고점
 *    · 게임 1개  → 그 게임 최고점 그대로
 *    · 여러 개    → 게임마다 "그 게임 세션 1등 대비 %" 로 환산해 합산
 *  팀 점수 = 팀원 평균 (결석·미참여는 0점으로 세어야 팀이 정직해진다)
 *
 *  갱신은 3초 폴링. 이 프로젝트는 Realtime 을 한 군데도 안 써서, 새로 붙이면
 *  실패 지점만 는다. 폴링하는 화면은 교실 앞 이 한 대뿐이라 부하도 없다.
 * ============================================================ */
const SUPABASE_URL = "https://pjagaulfivafamhhiveg.supabase.co";
const SUPABASE_KEY = "sb_publishable_yck2tAKApEjVSJOJMVSXuQ_AGaNatuI";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const GAME_NAME = {
  acid:'계정과목 산성비', memory:'기억의 전당', debit:'차변대변', factory:'분개 공장',
  flight:'결산 비행', theory:'이론 객관식', cost_lv1:'원가의 길', capital_lv1:'자본',
  voucher_lv1:'전표', vat_lv1:'부가세', alloc_lv1:'배분', theory_lv1:'이론(1급)'
};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SID = new URLSearchParams(location.search).get('s');

let SES=null, MEMBERS=[], BASE={}, ALIAS={}, prevRank={teams:{},grow:{},solo:{}};

/* DB에 찍힌 이름 → 실제 학생.
   ⚠ 학생이 닉네임을 바꾸면 기록이 다른 이름으로 쌓인다(임형순은 '김군호휴지털이범',
     박가인은 '가인'으로 저장했다). roster.alias_of 로 되돌리지 않으면 그 학생들이
     전광판에서 통째로 0점으로 나온다 — 실제로 8/26 기록에서 걸렸다. */
function real(n){ return ALIAS[n] || n; }

function fail(msg){ document.getElementById('err').innerHTML=msg; document.getElementById('err').style.display='flex'; }

async function init(){
  if(!SID){ fail('세션 코드가 없습니다.<br>교수자 대시보드에서 “세션 시작”을 눌러 열어 주세요.'); return; }
  const [s,m] = await Promise.all([
    db.from('team_session').select('*').eq('id',SID).maybeSingle(),
    db.from('team_member').select('student_name,team_no').eq('session_id',SID)
  ]);
  if(s.error || !s.data){ fail('세션을 찾을 수 없습니다. 코드를 확인해 주세요.<br><small>'+esc(SID)+'</small>'); return; }
  SES=s.data; MEMBERS=m.data||[];
  if(!MEMBERS.length){ fail('이 세션에 배정된 학생이 없습니다.'); return; }

  const ros = await db.from('roster').select('name,alias_of').eq('group_id', SES.group_id);
  if(ros.data) ros.data.forEach(r=>{ if(r.alias_of) ALIAS[r.name]=r.alias_of; });

  await loadBaseline();

  document.getElementById('err').style.display='none';
  document.getElementById('root').style.display='flex';
  document.getElementById('h-cls').textContent = SES.class_label || '전체';
  const gs = SES.game_ids && SES.game_ids.length ? SES.game_ids : null;
  document.getElementById('h-games').textContent =
    gs ? gs.map(g=>GAME_NAME[g]||g).join(' · ') : '전체 게임';
  document.getElementById('f-rule').textContent =
    (gs && gs.length>1) ? '여러 게임 — 게임마다 1등 대비 %로 환산해 합산' : '';
  document.getElementById('f-code').textContent = '세션 ' + SID;

  tick(); setInterval(tick, 3000); setInterval(clock, 1000); clock();
}

/* 세션 '시작 전'까지의 게임별 최고점. 성장 랭킹의 기준선이라 수업 중에는 변하지
   않으므로 처음에 한 번만 읽는다.
   ⚠ scores 테이블을 쓰면 안 된다 — upsert_score 가 수업 중에도 최댓값을 갱신해서
     이미 오늘 점수가 섞여 있다. 반드시 score_history 의 '시작 이전' 것만 본다. */
async function loadBaseline(){
  // 별칭으로 남은 기록도 가져와야 하므로 이름으로 거르지 않고 그룹 전체를 읽는다
  const { data, error } = await db.from('score_history')
    .select('user_name,game_id,score')
    .eq('group_id', SES.group_id).lt('played_at', SES.started_at).limit(20000);
  if(error || !data) return;
  const inS = {}; MEMBERS.forEach(m=>inS[m.student_name]=1);
  data.forEach(r=>{
    const n = real(r.user_name); if(!inS[n]) return;
    const v=parseInt(r.score,10); if(!isFinite(v)) return;
    (BASE[n]=BASE[n]||{});
    if(!(r.game_id in BASE[n]) || v>BASE[n][r.game_id]) BASE[n][r.game_id]=v;
  });
}

/* 성장 점수 — 게임마다 **자기 이전 최고점 대비 몇 % 올랐나**.
   절대 증가분으로 재면 잘하는 학생이 또 이긴다(10만→11만 = +1만 vs 100→200 = +100).
   비율로 재야 "자기 수준에서 노력한 만큼"이 되어 하위권도 1등을 노릴 수 있다.
   · 처음 기록하는 게임은 100 점(첫 도전) — 0 으로 나눌 수 없고, 새 게임에 도전한 것도
     성장이다. 다만 안 하던 게임을 찍어서 무한정 벌지 못하게 상한과 같은 값으로 둔다.
   · 게임당 100 상한 — 점수를 두 배로 올리면 만점. 상한이 없으면 아주 낮은 기준선
     하나가 순위를 통째로 뒤집는다(예: 100→5,000 이면 +4,900%). */
const GROW_CAP = 100;
function growthOf(name, sessionBest){
  const base = BASE[name] || {};
  let g = 0;
  Object.keys(sessionBest).forEach(gid=>{
    const now = sessionBest[gid], was = base[gid] || 0;
    if(was <= 0) g += GROW_CAP;
    else if(now > was) g += Math.min(GROW_CAP, 100*(now-was)/was);
  });
  return Math.round(g);
}

function clock(){
  if(!SES) return;
  const end = SES.ended_at ? new Date(SES.ended_at) : new Date();
  const sec = Math.max(0, Math.floor((end - new Date(SES.started_at))/1000));
  const el = document.getElementById('h-clock');
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), ss=sec%60;
  el.textContent = (h ? h+':'+String(m).padStart(2,'0') : String(m))
                 + ':' + String(ss).padStart(2,'0');
  el.classList.toggle('done', !!SES.ended_at);
}

async function tick(){
  try{
    // 세션이 끝났는지도 같이 본다(교사가 대시보드에서 종료할 수 있다)
    const [hRes, sRes] = await Promise.all([
      db.from('score_history').select('user_name,game_id,score,played_at')
        .eq('group_id', SES.group_id).gte('played_at', SES.started_at)
        .order('played_at',{ascending:false}).limit(3000),
      db.from('team_session').select('ended_at').eq('id',SID).maybeSingle()
    ]);
    if(sRes.data) SES.ended_at = sRes.data.ended_at;
    if(hRes.error) return;
    render(hRes.data||[]);
  }catch(e){ /* 네트워크가 잠깐 끊겨도 화면은 그대로 둔다 */ }
}

function render(rows){
  const games = SES.game_ids && SES.game_ids.length ? SES.game_ids : null;
  const inSession = {}; MEMBERS.forEach(m=>inSession[m.student_name]=m.team_no);

  // ① 학생×게임 — 세션 중 최고점
  const best = {};
  rows.forEach(r=>{
    r = { ...r, user_name: real(r.user_name) };
    if(!(r.user_name in inSession)) return;
    if(games && games.indexOf(r.game_id)<0) return;
    if(SES.ended_at && new Date(r.played_at) > new Date(SES.ended_at)) return;
    const v = parseInt(r.score,10); if(!isFinite(v)) return;
    (best[r.user_name] = best[r.user_name] || {});
    if(!(r.game_id in best[r.user_name]) || v > best[r.user_name][r.game_id]) best[r.user_name][r.game_id]=v;
  });

  // ② 게임별 그 세션 1등 (여러 게임일 때 환산 기준)
  const top = {};
  Object.keys(best).forEach(n=>Object.keys(best[n]).forEach(g=>{
    if(!(g in top) || best[n][g]>top[g]) top[g]=best[n][g];
  }));

  const multi = !games || games.length>1;
  const solo = MEMBERS.map(m=>{
    const b = best[m.student_name] || {};
    let sc = 0;
    if(multi){                       // 게임마다 1등 대비 % 합산
      Object.keys(b).forEach(g=>{ if(top[g]>0) sc += 100*b[g]/top[g]; });
      sc = Math.round(sc);
    }else{                           // 게임 하나면 실제 점수 그대로
      sc = b[games[0]] || 0;
    }
    return { name:m.student_name, team:m.team_no, score:sc, grow:growthOf(m.student_name,b) };
  });

  const byScore = solo.slice().sort((a,b)=>b.score-a.score || a.name.localeCompare(b.name,'ko'));
  const byGrow  = solo.slice().sort((a,b)=>b.grow -a.grow  || a.name.localeCompare(b.name,'ko'));

  // ③ 팀 = 팀원 평균 (미참여 0점 포함 — 그래야 전원이 해야 팀이 오른다)
  const byTeam = {};
  solo.forEach(x=>{ (byTeam[x.team]=byTeam[x.team]||[]).push(x); });
  const names = SES.team_names || {};
  function teamRank(key){
    return Object.keys(byTeam).map(t=>{
      const list = byTeam[t];
      const sum = list.reduce((x,m)=>x+m[key],0);
      return { no:+t, name: names[t] || (t+'모둠'), score: Math.round(sum/list.length),
               mem: list.slice().sort((a,b)=>b[key]-a[key]).map(m=>m.name).join(' · ') };
    }).sort((a,b)=>b.score-a.score || a.no-b.no);
  }

  paint('teams', teamRank('score').map((t,i)=>({
    key:'t'+t.no, sc:t.score.toLocaleString(),
    html:'<div class="nmwrap"><div class="nm">'+esc(t.name)+'</div>'+
         '<div class="mem">'+esc(t.mem)+'</div></div>'
  })), 11.5, 1.1);

  paint('grow', teamRank('grow').map((t,i)=>({
    key:'g'+t.no, sc:'+'+t.score,
    html:'<div class="nm">'+esc(t.name)+'</div>'
  })), 7.4, .9);

  paint('solo', byScore.slice(0,6).map((x,i)=>({
    key:'s'+x.name, sc:x.score.toLocaleString(),
    html:'<div class="nm">'+esc(x.name)+'</div><div class="tag">'+x.team+'모둠</div>'
  })), 5, .8);

  // 성장 1등은 따로 알려 준다 — 하위권 학생이 이름을 볼 자리
  const gTop = byGrow[0];
  document.getElementById('solo-sub').textContent =
    (gTop && gTop.grow>0) ? '성장 1등 ' + gTop.name + ' +' + gTop.grow : '';
}

/* 행을 지우고 다시 그리면 애니메이션이 안 붙는다. 키로 재사용하고 transform 만 옮긴다. */
function paint(hostId, items, hVmin, gapVmin){
  const host = document.getElementById(hostId);
  const unit = Math.min(innerWidth, innerHeight)/100;
  const step = (hVmin+gapVmin)*unit;
  const seen = {};
  const prev = prevRank[hostId] || (prevRank[hostId]={});

  items.forEach((it,i)=>{
    seen[it.key]=1;
    let el = host.querySelector('[data-k="'+CSS.escape(it.key)+'"]');
    if(!el){
      el = document.createElement('div');
      el.className='row'; el.dataset.k=it.key;
      el.style.transform='translateY('+(i*step)+'px)';
      host.appendChild(el);
    }
    const was = prev[it.key];
    const moved = was!=null && was>i;                 // 순위가 올랐다
    el.innerHTML = '<div class="rk">'+(i+1)+'</div>'+it.html+
                   '<div class="mv '+(was==null?'':(was>i?'up':(was<i?'dn':'')))+'">'+
                   (was==null?'':(was>i?'▲':(was<i?'▼':'')))+'</div>'+
                   '<div class="sc">'+it.sc+'</div>';
    el.style.transform='translateY('+(i*step)+'px)';
    el.classList.toggle('r1', i===0);
    el.classList.toggle('r2', i===1);
    if(moved){ el.classList.remove('jump'); void el.offsetWidth; el.classList.add('jump'); }
    prev[it.key]=i;
  });
  // 사라진 행 제거
  Array.prototype.forEach.call(host.children, el=>{
    if(!seen[el.dataset.k]) el.remove();
  });
}

addEventListener('resize', ()=>{ prevRank={teams:{},solo:{}}; tick(); });
init();
</script>
</body>
</html>
