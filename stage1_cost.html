const Sheet = {
  placed:{}, sel:null, wrong:0, onDone:null, phase:'place',

  open(cb){
    this.onDone=cb; this.placed={}; this.sel=null; this.wrong=0; this.phase='place';
    World.paused=true;
    document.getElementById('sheet-overlay').classList.add('show');
    document.getElementById('sh-done').classList.remove('show');
    this.renderBuckets();
    this.render();
  },

  sum(bucketId){
    return SHEET_CARDS.reduce((s,c)=>
      (this.placed[c.id]===bucketId ? s + c.val*c.sign : s), 0);
  },
  /* 재공품은 Ⅴ(가산)·Ⅶ(차감)로 따로 보여줘야 해서 부호별로 뽑는다 */
  wipBy(sign){
    return SHEET_CARDS.reduce((s,c)=>
      (this.placed[c.id]==='wip' && c.sign===sign ? s + c.val : s), 0);
  },

  render(){
    const mat=this.sum('mat'), lab=this.sum('lab'), exp=this.sum('exp');
    const total=mat+lab+exp;
    const wipStart=this.wipBy(+1), wipEnd=this.wipBy(-1);
    const subtotal=total+wipStart;
    const cogm=subtotal-wipEnd;

    const won=(n)=> n.toLocaleString('ko-KR')+'원';
    const rows=[
      { rn:'Ⅰ', nm:'재료비',          v:mat,   sub:'기초원재료 + 당기매입 − 기말원재료 + 간접재료비' },
      { rn:'Ⅱ', nm:'노무비',          v:lab,   sub:'직접노무비 + 간접노무비' },
      { rn:'Ⅲ', nm:'경비',            v:exp,   sub:'감가상각비 + 기타경비 + 보조부문 배분액' },
      { rn:'Ⅳ', nm:'당기총제조비용',   v:total, cls:'sum', sub:'Ⅰ + Ⅱ + Ⅲ' },
      { rn:'Ⅴ', nm:'기초재공품재고액', v:wipStart },
      { rn:'Ⅵ', nm:'합계',            v:subtotal, cls:'sum', sub:'Ⅳ + Ⅴ' },
      { rn:'Ⅶ', nm:'기말재공품재고액', v:wipEnd, minus:true },
      { rn:'Ⅷ', nm:'당기제품제조원가', v:cogm, cls:'final', sub:'Ⅵ − Ⅶ' },
    ];
    const box=document.getElementById('sh-rows');
    box.innerHTML='';
    rows.forEach(r=>{
      const el=document.createElement('div');
      el.className='sh-row'+(r.cls?' '+r.cls:'');
      el.innerHTML=`<span class="sh-rn">${r.rn}</span>`+
                   `<span class="sh-nm">${r.nm}</span>`+
                   `<span class="sh-vl">${r.minus&&r.v?'(−) ':''}${won(r.v)}</span>`;
      box.appendChild(el);
      if(r.sub){
        const s=document.createElement('div');
        s.className='sh-sub'; s.textContent=r.sub;
        box.appendChild(s);
      }
    });

    // 남은 카드
    const cards=document.getElementById('sh-cards');
    cards.innerHTML='';
    const left=SHEET_CARDS.filter(c=>!this.placed[c.id]);
    left.forEach(c=>{
      const b=document.createElement('button');
      b.className='sh-card'+(this.sel===c.id?' sel':'');
      b.innerHTML=`${c.name}<br><span class="cv">${c.val.toLocaleString('ko-KR')}원</span>`+
                  (c.sign<0?' <span class="cminus">(차감 항목)</span>':'');
      b.addEventListener('click',()=>this.pick(c.id));
      cards.appendChild(b);
    });

    document.getElementById('sh-hint').textContent =
      left.length ? `자료 카드를 고른 뒤, 들어갈 칸을 누르세요 (남은 카드 ${left.length}장)`
                  : '모든 자료를 배치했습니다. 명세서를 제출하세요.';
    document.getElementById('sh-done').classList.toggle('show', left.length===0);
    this.syncBuckets();
  },

  renderBuckets(){
    const box=document.getElementById('sh-buckets');
    box.innerHTML='';
    BUCKETS.forEach(b=>{
      const el=document.createElement('button');
      el.className='sh-bk'+(b.trash?' trash':'');
      el.textContent=b.label;
      el.dataset.bk=b.id;
      el.addEventListener('click',()=>this.place(b.id));
      box.appendChild(el);
    });
  },
  syncBuckets(){
    const on=!!this.sel;
    document.querySelectorAll('#sh-buckets .sh-bk').forEach(el=>{
      if(on) el.removeAttribute('disabled'); else el.setAttribute('disabled','');
    });
  },

  pick(id){
    this.sel = (this.sel===id) ? null : id;
    this.render();
  },

  place(bucketId){
    if(!this.sel) return;
    const card=SHEET_CARDS.find(c=>c.id===this.sel);
    const fb=document.getElementById('sh-fb');
    if(card.bucket===bucketId){
      this.placed[card.id]=bucketId;
      this.sel=null;
      fb.className='sh-fb good show';
      fb.textContent = card.trap
        ? `✅ 한서준: 그래, 그건 빼는 게 맞아. ${card.why}`
        : `✅ 한서준: 맞아. ${card.why}`;
    } else {
      this.wrong++;
      fb.className='sh-fb bad show';
      fb.textContent = `❌ 한서준: 거기 아니야. ${card.why}`;
    }
    this.render();
  },

  finish(){
    const cogm=this.sum('mat')+this.sum('lab')+this.sum('exp')+this.wipBy(+1)-this.wipBy(-1);
    // 점수: 기본 100 − 명세서 오배치당 5점 − NPC 퀴즈 오답 1회당 2점(최저 30).
    // 명세서만 잘 맞추고 그 전 14명 대화 중 퀴즈를 계속 틀려도 만점이 나오던 걸 보완.
    const quizWrong=Stage.state.quizWrong||0;
    const score=Math.max(30, 100-this.wrong*5-quizWrong*2);
    Stage.state.cleared=true;
    Stage.state.score=score;
    Stage.state.cogm=cogm;
    Stage.state.sheetWrong=this.wrong;
    Stage.save();
    document.getElementById('sheet-overlay').classList.remove('show');
    try{ saveStageScore(score, this.wrong, quizWrong); }catch(e){}
    const cb=this.onDone; this.onDone=null;
    if(cb) cb({cogm, wrong:this.wrong, score});
  },
};
document.getElementById('sh-done').addEventListener('click',()=>Sheet.finish());

/* =========================================================================
 *  P6 — Supabase 연동(game_id:'cost_lv1'). 2급 게임(game1_acid.html 등)과
 *  동일 패턴: scores(최고점 1행)는 upsert_score RPC, score_history(매 판
 *  누적, 성장그래프용)는 Growth.record()가 별도로 처리 — growth.js가 함.
 * ========================================================================= */
const SUPA_URL='https://pjagaulfivafamhhiveg.supabase.co';
const SUPA_KEY='sb_publishable_yck2tAKApEjVSJOJMVSXuQ_AGaNatuI';
const GAME_ID='cost_lv1';
let _supaDb=null;
function supaClient(){
  if(_supaDb) return _supaDb;
  try{ if(window.supabase && supabase.createClient) _supaDb=supabase.createClient(SUPA_URL, SUPA_KEY); }catch(e){}
  return _supaDb;
}
function gradeForStageScore(score){
  if(score>=100) return '👑 완벽한 신입';
  if(score>=90)  return '🥇 우수';
  if(score>=70)  return '🥈 합격';
  return '🥉 재도전 권장';
}
async function saveStageScore(score, wrong, quizWrong, partial){
  const name=(localStorage.getItem('hub_nickname')||'').trim();
  if(!name) return;                          // 로그인 안 된 상태(로컬 테스트 등)면 스킵
  const correct=Math.max(0, SHEET_CARDS.length-wrong);
  const grade= partial ? '🚪 중도 이탈' : gradeForStageScore(score);
  const groupId=localStorage.getItem('hub_group_id') || null;
  const today=new Date().toISOString().split('T')[0];
  const rpcParams={ p_game_id:GAME_ID, p_name:name, p_score:score, p_grade:grade, p_combo:0, p_correct:correct, p_date:today };
  if(groupId) rpcParams.p_group_id=groupId;
  try{ if(window.Auth){ const uid=await Auth.currentUid(); if(uid) rpcParams.p_uid=uid; } }catch(e){}
  // 성장 그래프용 매 판 이력 — rpc 성패와 무관하게 항상 시도
  if(window.Growth) Growth.record({ game:GAME_ID, name, score, grade, combo:0, correct });
  const db=supaClient();
  if(!db) return;
  try{ const {error}=await db.rpc('upsert_score', rpcParams); if(error) console.warn('cost_lv1 점수 저장 실패:', error); }
  catch(e){ console.warn('cost_lv1 점수 저장 예외:', e); }
}
function escHtml(s){ return String(s==null?'':s).replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

/* =========================================================================
 *  ResultScreen — 한서준 엔딩 대화 완료 시 표시되는 게임 클리어 화면.
 *  등급·점수·수집 통계 + Supabase TOP 랭킹·내 순위 + 다시 도전/허브로.
 * ========================================================================= */
const ResultScreen = {
  show(){
    const s=Stage.state;
    document.getElementById('result-grade').textContent = gradeForStageScore(s.score||0);
    document.getElementById('result-score').textContent = (s.score||0)+'점';
    document.getElementById('rs-docs').textContent = s.docs.length+'/'+TOTAL_DOCS;
    document.getElementById('rs-quizwrong').textContent = s.quizWrong||0;
    document.getElementById('rs-sheetwrong').textContent = s.sheetWrong||0;
    document.getElementById('result-my-rank').style.display='none';
    document.getElementById('result-overlay').classList.add('show');
    World.paused = true;
    this.loadRanking();
  },

  async loadRanking(){
    const box=document.getElementById('result-rankbox');
    const db=supaClient();
    if(!db){ box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,0.3);font-size:0.8rem;text-align:center;">랭킹을 불러올 수 없습니다</div>'; return; }
    const groupId=localStorage.getItem('hub_group_id')||null;
    const me=(localStorage.getItem('hub_nickname')||'').trim();
    try{
      let q=db.from('scores').select('name,score').eq('game_id',GAME_ID).order('score',{ascending:false}).limit(15);
      if(groupId) q=q.eq('group_id',groupId);
      const {data,error}=await q;
      if(error) throw error;
      const list=data||[];
      if(!list.length){
        box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,0.3);font-size:0.8rem;text-align:center;">아직 기록이 없습니다</div>';
      } else {
        box.innerHTML=list.map((r,i)=>{
          const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'위';
          return `<div class="rr-row${r.name===me?' me':''}"><span class="rr-num">${medal}</span><span class="rr-name">${escHtml(r.name)}</span><span class="rr-score">${(r.score||0).toLocaleString()}</span></div>`;
        }).join('');
      }
      // 내 순위(랭킹 등록 이후이므로 내 최고점 기준으로 계산)
      if(me){
        const countQ0=db.from('scores').select('*',{count:'exact',head:true}).eq('game_id',GAME_ID).eq('name',me);
        const myRowQ = groupId ? db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).eq('group_id',groupId).maybeSingle()
                                : db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).maybeSingle();
        const {data:myRow}=await myRowQ;
        if(myRow && Number.isFinite(myRow.score)){
          let cq=db.from('scores').select('*',{count:'exact',head:true}).eq('game_id',GAME_ID).gt('score',myRow.score);
          if(groupId) cq=cq.eq('group_id',groupId);
          const {count}=await cq;
          const myRank=(count||0)+1;
          const badge=document.getElementById('result-my-rank');
          badge.textContent = `🎯 내 순위: ${myRank.toLocaleString()}위`;
          badge.style.display='block';
        }
      }
    }catch(e){
      box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,0.3);font-size:0.8rem;text-align:center;">랭킹을 불러올 수 없습니다</div>';
    }
  },

  restart(){
    if(!confirm('처음부터 다시 도전할까요? 지금까지의 진행 상황이 초기화됩니다.')) return;
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    location.reload();
  },

  exit(){
    document.getElementById('result-overlay').classList.remove('show');
    try{ unlockOrientation(); }catch(e){}
    location.href='index_lv1.html';
  },
};

/* =========================================================================
 *  광고 시스템 — 2급 게임(game4_factory.html 등)과 동일 패턴.
 *  window.AdBridge 자체가 없어 항상 즉시 afterFn()으로 열린다(웹은 원래도 이랬음).
 * ========================================================================= */
const AD_GAME_COUNT_KEY='hub_ad_game_count';
const AD_INTERSTITIAL_EVERY=10; // N번마다 전면 광고
function incrementGameCount(){
  const n=(parseInt(localStorage.getItem(AD_GAME_COUNT_KEY)||'0'))+1;
  localStorage.setItem(AD_GAME_COUNT_KEY, String(n));
  return n;
}
// 게임 종료(결과 화면 진입) 시 호출 — 광고 닫히면 onInterstitialClosed()가 네이티브에서 호출됨
function requestInterstitialIfNeeded(afterFn){
  if(window.AdBridge && typeof AdBridge.isAdsRemoved==='function' && AdBridge.isAdsRemoved()){ afterFn&&afterFn(); return; }
  window._adAfterFn=afterFn;
  const count=incrementGameCount();
  if(count%AD_INTERSTITIAL_EVERY===0 && window.AdBridge){
    AdBridge.showInterstitial();
    // onInterstitialClosed()에서 afterFn 실행 — 광고 로드 실패 시에도 브리지 쪽에서 콜백을 호출하므로 그냥 열리게 됨
  } else {
    afterFn&&afterFn();
  }
}
function onAdsRemoved(){}
function onInterstitialClosed(){ if(window._adAfterFn){ const f=window._adAfterFn; window._adAfterFn=null; f(); } }
// 스테이지1 "첫 클리어" 전용 — 공유 카운터(10번에 한 번)와 별개로 무조건 광고 시도(있으면).
// 재도전(랭킹 갱신)할 때마다 뜨면 짜증나므로 딱 한 번, 첫 클리어에서만 사용.
const S1_FIRST_AD_KEY='lv1_s1_first_ad_shown';
function showInterstitialAlways(afterFn){
  if(window.AdBridge && typeof AdBridge.isAdsRemoved==='function' && AdBridge.isAdsRemoved()){ afterFn&&afterFn(); return; }
  if(window.AdBridge){
    window._adAfterFn=afterFn;
    AdBridge.showInterstitial();
  } else {
    afterFn&&afterFn();
  }
}
/* 안드로이드 WebView 광고 배너 (기존 화면들과 동일 시그니처) */
function hideAdPlaceholder(){ if(window.AdBridge) AdBridge.hide(); }
function showAdPlaceholder(){ if(window.AdBridge) AdBridge.show(); }
