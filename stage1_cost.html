<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a12">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>원가의 길 — 전산회계 1급 스테이지 1</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="growth.js"></script>
<style>
:root{
  --cy:#00f2ff; --pu:#b44fff; --or:#ff9800; --gd:#ffd600; --gn:#00e676; --pk:#ff2d78;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
   -webkit-user-select:none; user-select:none; }
html,body{ width:100%; height:100%; overflow:hidden; background:#0a0a12; }
body{ font-family:'Noto Sans KR',sans-serif; color:#fff; position:relative; touch-action:none; }

/* 이 스테이지는 가로모드 전용 — 보카바리스타 탐험모드와 동일한 방식(회전 트릭).
   기기가 세로면 #rotator를 90도 돌려서 가로처럼 보이게 한다(iOS 웹은 기기회전 강제 불가). */
#rotator{ position:fixed; top:0; left:0; width:100%; height:100%; }

#game{ position:absolute; inset:0; display:block; }

/* ── 상단 HUD ── */
#hud{
  position:absolute; top:0; left:0; width:100%;
  box-sizing:border-box;            /* ★ game5 버그(패딩이 100% 밖으로 넘침) 예방 */
  z-index:20; display:flex; align-items:center; gap:8px;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));
  pointer-events:none;
  background:linear-gradient(to bottom, rgba(5,3,16,0.82) 0%, transparent 100%);
}
.hud-zone{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.hud-zone .zl{ font-family:'Orbitron',monospace; font-size:0.52rem; letter-spacing:2px; color:rgba(180,79,255,0.75); }
.hud-zone .zn{ font-family:'Black Han Sans',sans-serif; font-size:1rem; line-height:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hud-sp{ flex:1; min-width:4px; }
.hud-btns{ display:flex; gap:5px; pointer-events:auto; flex-shrink:0; }
.hbtn{
  height:38px; padding:0 12px; border-radius:50px; cursor:pointer; white-space:nowrap;
  display:flex; align-items:center; gap:5px;
  background:rgba(255,255,255,0.10); border:1.5px solid rgba(255,255,255,0.28);
  color:#fff; font-family:'Black Han Sans',sans-serif; font-size:0.8rem;
}
.hbtn:active{ transform:scale(0.95); }
.hbtn .n{ font-family:'Orbitron',monospace; font-size:0.72rem; color:var(--gd); }

/* ── 구역 진입 배너 ── */
#zone-banner{
  position:absolute; top:34%; left:50%; transform:translate(-50%,-50%) scale(0.9);
  z-index:30; pointer-events:none; text-align:center;
  opacity:0; transition:opacity .35s ease, transform .35s ease;
}
#zone-banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
#zone-banner .zb-name{
  font-family:'Black Han Sans',sans-serif; font-size:2rem; letter-spacing:2px;
  text-shadow:0 0 24px rgba(180,79,255,0.85), 0 2px 6px rgba(0,0,0,0.9);
}
#zone-banner .zb-acct{
  margin-top:8px; display:inline-block; padding:5px 16px; border-radius:50px;
  font-family:'Orbitron',monospace; font-size:0.7rem; letter-spacing:2px;
  background:rgba(180,79,255,0.16); border:1px solid rgba(180,79,255,0.5); color:#e9d5ff;
}

/* ── P5: 연출 이벤트(§4-6) — 자동 재생 배너 ── */
#event-banner{
  position:absolute; top:16%; left:50%; transform:translate(-50%,-14px);
  z-index:32; pointer-events:none; text-align:center; max-width:88%;
  opacity:0; transition:opacity .4s ease, transform .4s ease;
}
#event-banner.show{ opacity:1; transform:translate(-50%,0); }
#event-banner .eb-inner{
  display:inline-flex; align-items:center; gap:10px;
  background:rgba(5,3,16,0.88); border:1px solid rgba(255,214,0,0.4);
  padding:10px 20px; border-radius:50px;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
#event-banner .eb-icon{ font-size:1.4rem; }
#event-banner .eb-txt{ font-family:'Black Han Sans',sans-serif; font-size:0.9rem; color:#fff; white-space:nowrap; }

/* 12/31 마감 암전 */
#yearend-dim{
  position:absolute; inset:0; z-index:31; pointer-events:none;
  background:#000; opacity:0; transition:opacity 1.1s ease;
}
#yearend-dim.show{ opacity:0.72; }

/* 본선 완주 셀레브레이션 */
#recap-overlay{
  position:absolute; inset:0; z-index:33; display:none;
  align-items:center; justify-content:center;
  background:rgba(3,2,8,0.72); backdrop-filter:blur(2px);
}
#recap-overlay.show{ display:flex; }
#recap-card{
  text-align:center; padding:26px 30px; border-radius:20px;
  background:linear-gradient(180deg, rgba(20,16,34,0.98), rgba(8,6,16,0.99));
  border:1px solid rgba(0,230,118,0.4); box-shadow:0 0 40px rgba(0,230,118,0.15);
  animation:recapPop .5s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes recapPop{ from{ transform:scale(0.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
#recap-title{ font-family:'Black Han Sans',sans-serif; font-size:1.3rem; color:var(--gn); margin-bottom:14px; }
.recap-flow{ display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:center; }
.recap-box{
  padding:10px 14px; border-radius:12px; background:rgba(0,230,118,0.1);
  border:1px solid rgba(0,230,118,0.4); font-family:'Orbitron',monospace; font-size:0.72rem; color:#a3f7c5;
}
.recap-arrow{ color:rgba(255,255,255,0.4); font-size:1.1rem; }
#recap-sub{ font-size:0.78rem; color:rgba(255,255,255,0.55); line-height:1.6; margin-bottom:16px; }
#recap-close{
  padding:10px 28px; border-radius:50px; cursor:pointer;
  background:rgba(0,230,118,0.18); border:1px solid rgba(0,230,118,0.5);
  color:#fff; font-family:'Black Han Sans',sans-serif; font-size:0.86rem;
}
#recap-close:active{ transform:scale(0.96); }

/* 게임 클리어 결과 화면(등급·점수·랭킹) */
#result-overlay{ z-index:70; }
#result-panel{
  width:100%; max-width:480px; margin:0 auto; max-height:100%; overflow-y:auto;
  padding:26px 22px calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(20,16,34,0.98), rgba(8,6,16,0.99));
  border:1px solid rgba(255,214,0,0.4); border-radius:20px;
  box-shadow:0 0 50px rgba(255,214,0,0.12);
  text-align:center;
  scrollbar-width:none; -ms-overflow-style:none;
}
#result-panel::-webkit-scrollbar{ display:none; width:0; }
#result-title{ font-family:'Black Han Sans',sans-serif; font-size:1.5rem; color:var(--gd); margin-bottom:8px; text-shadow:0 0 20px rgba(255,214,0,0.3); }
#result-grade{ font-family:'Black Han Sans',sans-serif; font-size:1rem; color:#fff; padding:6px 18px; border:1px solid var(--gd); border-radius:50px; background:rgba(255,214,0,0.1); display:inline-block; margin-bottom:14px; }
#result-score{ font-family:'Black Han Sans',sans-serif; font-size:2.4rem; color:#fff; margin-bottom:12px; }
.result-stats{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:10px 12px; font-size:0.72rem; color:rgba(255,255,255,0.55); margin-bottom:16px; }
.result-stats b{ color:#fff; }
#result-my-rank{ display:none; font-family:'Black Han Sans',sans-serif; font-size:0.86rem; color:var(--cy); background:rgba(0,242,255,0.1); border:1px solid rgba(0,242,255,0.3); border-radius:50px; padding:6px 16px; margin-bottom:12px; }
.result-ranklabel{ font-family:'Black Han Sans',sans-serif; font-size:0.76rem; color:rgba(255,255,255,0.3); letter-spacing:2px; margin-bottom:8px; }
#result-rankbox{ width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:12px; max-height:170px; overflow-y:auto; padding:4px 0; margin-bottom:18px; text-align:left; }
#result-rankbox::-webkit-scrollbar{ display:none; width:0; }
.rr-row{ display:grid; grid-template-columns:30px 1fr 60px; gap:6px; padding:8px 12px; font-size:0.78rem; border-bottom:1px solid rgba(255,255,255,0.05); align-items:center; }
.rr-row:last-child{ border-bottom:none; }
.rr-row.me{ background:rgba(0,242,255,0.08); }
.rr-num{ color:rgba(255,255,255,0.3); font-weight:bold; }
.rr-name{ color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rr-score{ color:var(--gd); text-align:right; font-weight:bold; }
.result-btns{ display:flex; gap:10px; }
.result-btn{ flex:1; padding:13px; border-radius:50px; font-family:'Black Han Sans',sans-serif; font-size:0.88rem; cursor:pointer; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.06); color:#fff; }
.result-btn.primary{ background:rgba(255,214,0,0.18); border-color:rgba(255,214,0,0.5); }
.result-btn:active{ transform:scale(0.96); }

/* ── 조이스틱 ── */
#stick-zone{
  position:absolute; left:0; bottom:0; width:46%; height:46%;
  z-index:15; touch-action:none;
}
#stick-base{
  position:absolute; left:max(26px,env(safe-area-inset-left)); bottom:calc(26px + var(--ad-banner-h,0px));
  width:118px; height:118px; border-radius:50%;
  background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.16);
}
#stick-knob{
  position:absolute; left:0; bottom:0; width:56px; height:56px; border-radius:50%;
  background:rgba(180,79,255,0.55); border:2px solid rgba(255,255,255,0.5);
  box-shadow:0 0 18px rgba(180,79,255,0.5);
  transform:translate(31px,-31px);
}

/* ── 상호작용 버튼 ── */
#act-btn{
  position:absolute; right:max(26px,env(safe-area-inset-right));
  bottom:calc(40px + var(--ad-banner-h,0px));
  z-index:16; width:96px; height:96px; border-radius:50%; cursor:pointer;
  background:radial-gradient(circle at 35% 30%, rgba(180,79,255,0.95), rgba(120,40,190,0.95));
  border:3px solid rgba(255,255,255,0.55); color:#fff;
  font-family:'Black Han Sans',sans-serif; font-size:1.02rem; line-height:1.25;
  box-shadow:0 0 26px rgba(180,79,255,0.55);
  display:none; align-items:center; justify-content:center; text-align:center;
  animation:actPulse 1.5s ease-in-out infinite;
}
#act-btn.show{ display:flex; }
#act-btn:active{ transform:scale(0.94); }
@keyframes actPulse{
  0%,100%{ box-shadow:0 0 22px rgba(180,79,255,0.45); }
  50%{ box-shadow:0 0 40px rgba(180,79,255,0.8); }
}

/* ── 미니맵 ── */
#minimap-box{
  position:absolute; right:max(12px,env(safe-area-inset-right));
  top:calc(58px + env(safe-area-inset-top));
  z-index:18; pointer-events:none;
  border:1px solid rgba(255,255,255,0.22); border-radius:8px; overflow:hidden;
  background:rgba(5,3,16,0.72); padding:3px;
}
#minimap{ display:block; image-rendering:pixelated; width:124px; height:44px; }

/* ── 하단 힌트 ── */
#hint{
  position:absolute; left:50%; bottom:calc(14px + var(--ad-banner-h,0px)); transform:translateX(-50%);
  z-index:14; pointer-events:none; font-size:0.72rem; color:rgba(255,255,255,0.35);
  background:rgba(5,3,16,0.6); padding:5px 14px; border-radius:50px; white-space:nowrap;
  transition:opacity .4s;
}
#hint.hide{ opacity:0; }

/* 좁은 폰 대응 — 오늘 game4/5에서 겪은 헤더 넘침 예방 */
@media (max-width:340px){
  #hud{ gap:5px; padding-left:8px; padding-right:8px; }
  .hbtn{ height:34px; padding:0 9px; font-size:0.72rem; }
  .hud-zone .zn{ font-size:0.88rem; }
  #minimap{ width:96px; height:34px; }
  #act-btn{ width:84px; height:84px; font-size:0.92rem; }
  #stick-base{ width:104px; height:104px; }
}

/* =========================================================================
 *  P3 — 대화 · 퀴즈 · 서류철 UI
 * ========================================================================= */
/* ⚠️ 이 오버레이들은 #rotator(회전 트릭) 안에 있다. vh/dvh 단위는 회전된
   로컬 좌표계가 아니라 실제(회전 전) 뷰포트를 기준으로 계산되므로, 세로로
   든 상태(=콘텐츠가 회전된 상태)에서 크기가 어긋난다. 반드시 max-height:100%
   (부모 .ov의 실제 로컬 박스 기준)만 쓸 것 — vh 금지. */
.ov{
  position:absolute; inset:0; z-index:60; display:none;
  align-items:flex-end; justify-content:center;
  background:rgba(3,2,8,0.55); backdrop-filter:blur(2px);
  touch-action:none; -webkit-user-select:none; user-select:none;
}
.ov.show{ display:flex; }
.ov.center{ align-items:center; }

/* ── 대화 패널 ── */
/* 스크롤은 살리되 스크롤바는 숨김(대화·퀴즈·서류철·명세서 패널 전부) */
#dlg-panel, #quiz-panel, #docs-panel, .sh-rows, .sh-cards{
  scrollbar-width:none; -ms-overflow-style:none;
}
#dlg-panel::-webkit-scrollbar, #quiz-panel::-webkit-scrollbar,
#docs-panel::-webkit-scrollbar, .sh-rows::-webkit-scrollbar, .sh-cards::-webkit-scrollbar{
  display:none; width:0; height:0;
}

#dlg-panel{
  width:100%; max-width:640px; margin:0 auto;
  max-height:100%; overflow-y:auto;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(18,14,32,0.98), rgba(8,6,16,0.99));
  border-top:2px solid rgba(180,79,255,0.4);
  box-shadow:0 -8px 30px rgba(0,0,0,0.6);
}
.dlg-top{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.dlg-portrait{
  width:46px; height:46px; border-radius:50%; flex-shrink:0;
  border:2px solid rgba(255,255,255,0.4);
  display:flex; align-items:center; justify-content:center;
  font-family:'Black Han Sans',sans-serif; font-size:1.1rem; color:#1a1a24;
}
.dlg-name{ font-family:'Black Han Sans',sans-serif; font-size:1.05rem; color:var(--cy); }
.dlg-tag{ font-family:'Orbitron',monospace; font-size:0.56rem; letter-spacing:1.5px; color:rgba(255,255,255,0.35); }
.dlg-visual{
  margin:2px 0 10px; padding:10px 8px; border-radius:12px;
  background:rgba(255,255,255,0.04); border:1px solid rgba(180,79,255,0.3);
}
.dlg-visual svg{ display:block; width:100%; height:auto; }
.dlg-box{
  min-height:88px; font-size:1.12rem; line-height:1.6; color:#f0f0f5;
  padding:2px 2px 14px; white-space:pre-wrap;
}
.dlg-box.player{ color:var(--gd); }
.dlg-box.narrator{ color:rgba(255,255,255,0.55); font-style:italic; text-align:center; }
.dlg-next{
  display:flex; align-items:center; justify-content:flex-end; gap:6px;
  height:42px; border-radius:12px; cursor:pointer;
  background:rgba(180,79,255,0.16); border:1px solid rgba(180,79,255,0.4);
  color:#fff; font-family:'Black Han Sans',sans-serif; font-size:0.9rem;
  padding:0 16px;
}
.dlg-next:active{ transform:scale(0.97); }
.dlg-next .arrow{ animation:dlgArrow 1.1s ease-in-out infinite; }
@keyframes dlgArrow{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(4px); } }

/* ── 퀴즈 패널 ── */
#quiz-panel{
  width:100%; max-width:640px; margin:0 auto;
  max-height:100%; overflow-y:auto;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(18,14,32,0.98), rgba(8,6,16,0.99));
  border-top:2px solid rgba(255,214,0,0.4);
  box-shadow:0 -8px 30px rgba(0,0,0,0.6);
}
.quiz-tag{ font-family:'Orbitron',monospace; font-size:0.6rem; letter-spacing:2px; color:var(--gd); margin-bottom:8px; }
.quiz-body{ display:flex; gap:14px; align-items:stretch; }
.quiz-main{ flex:1; min-width:0; }
.quiz-visual{
  flex:0 0 38%; max-width:210px;
  padding:8px 6px; border-radius:12px;
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,214,0,0.3);
  display:flex; align-items:center;
}
.quiz-visual svg{ width:100%; height:auto; display:block; }
.quiz-q{ font-size:1.05rem; line-height:1.6; margin-bottom:12px; color:#fff; }
.quiz-table{ width:100%; border-collapse:collapse; margin-bottom:12px; font-size:0.78rem; }
.quiz-table th,.quiz-table td{ border:1px solid rgba(255,255,255,0.18); padding:6px 8px; text-align:center; }
.quiz-table th{ background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.7); }
.quiz-opts{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
.quiz-opt{
  text-align:left; padding:11px 14px; border-radius:12px; cursor:pointer;
  background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.18);
  color:#f0f0f5; font-size:0.86rem; line-height:1.4;
  font-family:'Noto Sans KR',sans-serif;
}
.quiz-opt:active{ transform:scale(0.985); }
.quiz-opt.wrong{ border-color:rgba(255,45,120,0.7); background:rgba(255,45,120,0.12); }
.quiz-opt.right{ border-color:rgba(0,230,118,0.7); background:rgba(0,230,118,0.14); }
.quiz-fb{ font-size:0.85rem; line-height:1.6; padding:10px 12px; border-radius:10px; margin-bottom:10px; display:none; }
.quiz-fb.show{ display:block; }
.quiz-fb.wrong{ background:rgba(255,45,120,0.1); border:1px solid rgba(255,45,120,0.35); color:#ffb3cb; }
.quiz-fb.right{ background:rgba(0,230,118,0.1); border:1px solid rgba(0,230,118,0.35); color:#a3f7c5; }
.quiz-next{
  display:none; align-items:center; justify-content:center; gap:6px;
  height:44px; border-radius:12px; cursor:pointer; width:100%;
  background:rgba(0,230,118,0.18); border:1px solid rgba(0,230,118,0.5);
  color:#fff; font-family:'Black Han Sans',sans-serif; font-size:0.92rem;
}
.quiz-next.show{ display:flex; }
.quiz-next:active{ transform:scale(0.97); }

/* ── 자료 획득 토스트 ── */
#doc-toast{
  position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(0.85);
  z-index:70; pointer-events:none; text-align:center; opacity:0;
  transition:opacity .3s ease, transform .3s ease;
}
#doc-toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
#doc-toast .dt-icon{ font-size:2.6rem; margin-bottom:6px; }
#doc-toast .dt-name{
  font-family:'Black Han Sans',sans-serif; font-size:1.1rem;
  background:rgba(5,3,16,0.85); border:1px solid rgba(255,214,0,0.5); color:var(--gd);
  padding:8px 20px; border-radius:50px; white-space:nowrap;
}

/* ── 서류철 모달 ── */
#docs-panel{
  width:92%; max-width:480px; max-height:100%; overflow-y:auto;
  padding:18px; border-radius:20px;
  background:linear-gradient(180deg, rgba(18,14,32,0.98), rgba(8,6,16,0.99));
  border:1px solid rgba(180,79,255,0.35);
}
.docs-head{ display:flex; align-items:center; margin-bottom:14px; }
.docs-title{ font-family:'Black Han Sans',sans-serif; font-size:1.15rem; }
.docs-count{ font-family:'Orbitron',monospace; font-size:0.8rem; color:var(--gd); margin-left:auto; }
.docs-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:9px; margin-bottom:14px; }
.doc-slot{
  aspect-ratio:1; border-radius:12px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px; padding:6px; text-align:center;
  border:1.5px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.03);
}
.doc-slot.got{ border-color:rgba(180,79,255,0.5); background:rgba(180,79,255,0.1); }
.doc-slot .di{ font-size:1.4rem; opacity:0.35; }
.doc-slot.got .di{ opacity:1; }
.doc-slot .dn{ font-size:0.58rem; line-height:1.3; color:rgba(255,255,255,0.35); }
.doc-slot.got .dn{ color:rgba(255,255,255,0.8); }
.docs-close{
  width:100%; height:44px; border-radius:12px; cursor:pointer;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2);
  color:#fff; font-family:'Black Han Sans',sans-serif; font-size:0.9rem;
}
.docs-close:active{ transform:scale(0.98); }

/* =========================================================================
 *  P5 — 제조원가명세서 최종 미니게임 (§5-2)
 * ========================================================================= */
#sheet-overlay{ align-items:stretch; }
#sheet-panel{
  width:100%; display:flex; gap:10px; padding:8px 10px;
  padding-top:max(8px,env(safe-area-inset-top));
  padding-bottom:max(8px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(16,13,28,0.99), rgba(8,6,16,1));
  overflow:hidden;
}
/* ── 왼쪽: 명세서 ── */
.sh-left{ flex:1.05; min-width:0; display:flex; flex-direction:column; }
.sh-title{
  font-family:'Black Han Sans',sans-serif; font-size:0.95rem; text-align:center;
  padding:4px 0 6px; border-bottom:2px solid rgba(180,79,255,0.45); margin-bottom:4px; flex-shrink:0;
}
.sh-rows{ flex:1; overflow-y:auto; font-size:0.72rem; }
.sh-row{
  display:flex; align-items:center; gap:5px; padding:4px 6px; border-radius:7px;
  border:1px solid transparent; min-height:26px;
}
.sh-row.sum{ background:rgba(180,79,255,0.10); border-color:rgba(180,79,255,0.3); }
.sh-row.final{ background:rgba(0,230,118,0.12); border-color:rgba(0,230,118,0.45); }
.sh-rn{ width:16px; color:rgba(255,255,255,0.4); font-family:'Orbitron',monospace; font-size:0.6rem; flex-shrink:0; }
.sh-nm{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:rgba(255,255,255,0.85); }
.sh-vl{ font-family:'Orbitron',monospace; font-size:0.72rem; color:var(--gd); white-space:nowrap; }
.sh-row.final .sh-vl{ color:var(--gn); font-size:0.8rem; }
.sh-sub{ font-size:0.6rem; color:rgba(255,255,255,0.32); padding:1px 6px 3px 22px; line-height:1.35; }
/* ── 오른쪽: 카드 + 분류 버튼 ── */
.sh-right{ flex:1; min-width:0; display:flex; flex-direction:column; }
.sh-hint{ font-size:0.66rem; color:rgba(255,255,255,0.45); text-align:center; margin-bottom:5px; flex-shrink:0; line-height:1.4; }
.sh-cards{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:5px; }
.sh-card{
  padding:7px 9px; border-radius:9px; cursor:pointer; text-align:left;
  background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.2);
  color:#f0f0f5; font-family:'Noto Sans KR',sans-serif; font-size:0.7rem; line-height:1.3;
}
.sh-card:active{ transform:scale(0.98); }
.sh-card.sel{ border-color:var(--gd); background:rgba(255,214,0,0.16); }
.sh-card .cv{ font-family:'Orbitron',monospace; font-size:0.68rem; color:var(--cy); }
.sh-card .cminus{ color:var(--pk); font-size:0.62rem; }
.sh-buckets{ display:grid; grid-template-columns:repeat(2,1fr); gap:5px; margin-top:6px; flex-shrink:0; }
.sh-bk{
  padding:8px 4px; border-radius:9px; cursor:pointer; text-align:center;
  background:rgba(180,79,255,0.14); border:1.5px solid rgba(180,79,255,0.4);
  color:#fff; font-family:'Black Han Sans',sans-serif; font-size:0.72rem; line-height:1.2;
}
.sh-bk:active{ transform:scale(0.97); }
.sh-bk.trash{ background:rgba(255,45,120,0.12); border-color:rgba(255,45,120,0.4); }
.sh-bk[disabled]{ opacity:0.3; pointer-events:none; }
.sh-fb{
  font-size:0.68rem; line-height:1.45; padding:7px 9px; border-radius:8px;
  margin-top:6px; flex-shrink:0; display:none;
}
.sh-fb.show{ display:block; }
.sh-fb.bad{ background:rgba(255,45,120,0.12); border:1px solid rgba(255,45,120,0.4); color:#ffb3cb; }
.sh-fb.good{ background:rgba(0,230,118,0.12); border:1px solid rgba(0,230,118,0.4); color:#a3f7c5; }
.sh-done{
  margin-top:6px; height:40px; border-radius:10px; cursor:pointer; width:100%; flex-shrink:0;
  background:rgba(0,230,118,0.2); border:1px solid rgba(0,230,118,0.55);
  color:#fff; font-family:'Black Han Sans',sans-serif; font-size:0.84rem;
  display:none; align-items:center; justify-content:center;
}
.sh-done.show{ display:flex; }
.sh-done:active{ transform:scale(0.98); }

@media (max-width:700px){
  .sh-rows{ font-size:0.66rem; }
  .sh-card{ font-size:0.65rem; padding:6px 7px; }
  .sh-bk{ font-size:0.66rem; padding:7px 3px; }
  .sh-title{ font-size:0.86rem; }
}
</style>

<script>
/* =========================================================================
 *  스테이지1 「원가의 길」 — 맵 엔진 (P1)
 *  보카바리스타 explore.html의 World(걷기·카메라·충돌)를 발췌·단순화.
 *  절차적 생성/전투/채집은 전부 제외 — 이 스테이지는 손으로 설계한 고정맵이다.
 *  에셋은 아직 임시 도형(P2에서 확정, P4에서 제미나이 아트로 교체).
 * ========================================================================= */

/* ── 화면 방향 — 보카바리스타 탐험모드와 동일한 3단 방어 패턴 ──────
   1) 네이티브 플러그인(@capacitor/screen-orientation) 2) 표준 웹 API
   3) CSS 회전 트릭(#rotator, 항상 동작 — iOS 웹은 기기회전 강제 불가) */
async function lockLandscape(){
  try{ const P=window.Capacitor&&window.Capacitor.Plugins; if(P&&P.ScreenOrientation) await P.ScreenOrientation.lock({orientation:'landscape'}); }catch(e){}
  try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){}
}
async function unlockOrientation(){
  try{ const P=window.Capacitor&&window.Capacitor.Plugins; if(P&&P.ScreenOrientation) await P.ScreenOrientation.lock({orientation:'portrait'}); }catch(e){}
  try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
}
function applyOrientation(){
  const rot=document.getElementById('rotator'); if(!rot) return;
  const portrait = window.innerHeight > window.innerWidth;
  if(portrait){
    document.body.classList.add('rot');
    rot.style.width  = window.innerHeight+'px';
    rot.style.height = window.innerWidth+'px';
    rot.style.transformOrigin = 'top left';
    rot.style.transform = 'rotate(90deg) translateY(-'+window.innerWidth+'px)';
  } else {
    document.body.classList.remove('rot');
    rot.style.width=''; rot.style.height=''; rot.style.transform=''; rot.style.transformOrigin='';
  }
  // ⚠️ 최상위 const로 선언된 World는 window에 안 붙는다(window.World === undefined).
  //    예전엔 window.World로 체크해서 resize가 아예 안 돌았고, 캔버스가 기본 300×150로
  //    남아 화면 구석에만 그려지는 버그가 있었다. 직접 참조로 고정할 것.
  if(typeof World!=='undefined' && World.resize){
    World.resize();
    if(World.drawMinimap) World.drawMinimap();
  }
}

/* ── 타일 종류 ─────────────────────────────────────────────

const WT = 62, HT = 22;

/* ── 맵 생성: 전부 벽으로 채운 뒤 구역·통로를 파낸다 ────────── */
function buildMap(){
  const g = [];
  for(let y=0;y<HT;y++){ g[y]=new Uint8Array(WT); g[y].fill(T.WALL); }

  const carve=(x0,y0,x1,y1,t)=>{
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++)
      if(y>=0&&y<HT&&x>=0&&x<WT) g[y][x]=t;
  };

  // 구역 바닥
  ZONES.forEach(z=>carve(z.x0,z.y0,z.x1,z.y1,z.floor));

  // 라인 구역: 위쪽 A라인 / 아래쪽 B라인 컨베이어 띠
  carve(27,8,45,8,  T.LINE_A);   // A라인(주문제작)
  carve(27,13,45,13,T.LINE_B);   // B라인(대량생산)

  // 보조부문동: 오른쪽 절반은 보일러실
  carve(40,16,44,21,T.BOILER);

  // ── 가로 본선 연결통로 (구역 사이 벽을 뚫는다) ──
  carve(25,10,25,13, T.FLOOR);   // 원재료창고 ↔ 라인
  carve(47,10,47,13, T.FLOOR);   // 라인 ↔ 제품창고

  // ── 세로 계단 (기획서: x 38 부근 한 곳으로 관통) ──
  carve(37,6,39,7,   T.STAIR);   // 라인 → 북쪽 공장사무실
  carve(37,15,39,16, T.STAIR);   // 라인 → 남쪽 보조부문동

  return g;
}

/* =========================================================================
 *  P4 — 절차적 타일 텍스처 (제미나이 없이 코드로 확정, 사용자 검증 완료)
 *  128px 오프스크린 캔버스에 한 번만 그려서 재사용 — 매 프레임 재생성 안 함.
 * ========================================================================= */
function trand(a,b){ return a+Math.random()*(b-a); }
function texCanvas(){ const c=document.createElement('canvas'); c.width=128; c.height=128; return c; }

function drawConcrete(ctx,w,h){
  ctx.fillStyle='#4a4a52'; ctx.fillRect(0,0,w,h);
  for(let i=0;i<6;i++){
    const x=trand(0,w), y=trand(0,h), r=trand(20,50);
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    const shade=trand(-14,14);
    g.addColorStop(0,`rgba(${74+shade},${74+shade},${82+shade},0.35)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  for(let i=0;i<900;i++){
    const x=trand(0,w), y=trand(0,h), shade=trand(-22,22);
    ctx.fillStyle=`rgba(${74+shade},${74+shade},${82+shade},${trand(0.15,0.5)})`;
    ctx.fillRect(x,y,1,1);
  }
  ctx.strokeStyle='rgba(20,20,24,0.35)'; ctx.lineWidth=1;
  for(let i=0;i<2;i++){
    ctx.beginPath();
    let x=trand(0,w), y=trand(0,h);
    ctx.moveTo(x,y);
    for(let s=0;s<4;s++){ x+=trand(-18,18); y+=trand(-18,18); ctx.lineTo(x,y); }
    ctx.stroke();
  }
}
function drawOfficeCarpet(ctx,w,h){
  ctx.fillStyle='#2a3142'; ctx.fillRect(0,0,w,h);
  for(let i=0;i<10;i++){
    const x=trand(0,w), y=trand(0,h), r=trand(16,34);
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    const shade=trand(-8,8);
    g.addColorStop(0,`rgba(${42+shade},${49+shade},${66+shade},0.4)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  for(let i=0;i<1400;i++){
    const x=trand(0,w), y=trand(0,h);
    ctx.fillStyle=`rgba(255,255,255,${trand(0.02,0.09)})`;
    ctx.fillRect(x,y,1,1);
  }
  ctx.strokeStyle='rgba(0,0,0,0.10)'; ctx.lineWidth=1; ctx.strokeRect(0.5,0.5,w-1,h-1);
}
function drawWarehouseEpoxy(ctx,w,h){
  ctx.fillStyle='#7a6a4f'; ctx.fillRect(0,0,w,h);
  for(let i=0;i<4;i++){
    const x=trand(0,w), y=trand(0,h), r=trand(30,55);
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(255,255,255,0.14)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  for(let i=0;i<350;i++){
    const x=trand(0,w), y=trand(0,h);
    ctx.fillStyle=`rgba(255,255,255,${trand(0.02,0.08)})`;
    ctx.fillRect(x,y,1,1);
  }
}
function drawKitchenTile(ctx,w,h){
  ctx.fillStyle='#c9cdd2'; ctx.fillRect(0,0,w,h);
  const step=32;
  ctx.strokeStyle='rgba(120,125,132,0.6)'; ctx.lineWidth=2;
  for(let x=0;x<=w;x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for(let y=0;y<=h;y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  for(let i=0;i<300;i++){
    const x=trand(0,w), y=trand(0,h);
    ctx.fillStyle=`rgba(0,0,0,${trand(0.01,0.05)})`;
    ctx.fillRect(x,y,1,1);
  }
}
function drawFactoryWall(ctx,w,h){
  ctx.fillStyle='#3a3d44'; ctx.fillRect(0,0,w,h);
  const step=32;
  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=2;
  for(let x=0;x<=w;x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  ctx.fillStyle='rgba(200,200,210,0.5)';
  for(let x=step/2;x<w;x+=step){
    ctx.beginPath(); ctx.arc(x,8,2,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x,h-8,2,0,7); ctx.fill();
  }
  for(let i=0;i<200;i++){
    const x=trand(0,w), y=trand(0,h);
    ctx.fillStyle=`rgba(255,255,255,${trand(0.02,0.05)})`;
    ctx.fillRect(x,y,1,1);
  }
}
function drawBelt(ctx,w,h){
  ctx.fillStyle='#16161a'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=3;
  for(let i=-h;i<w+h;i+=14){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+h,h); ctx.stroke(); }
  for(let i=0;i<200;i++){
    const x=trand(0,w), y=trand(0,h);
    ctx.fillStyle=`rgba(255,255,255,${trand(0.01,0.04)})`;
    ctx.fillRect(x,y,1,1);
  }
}

const TEX = (()=>{
  const mk=(fn)=>{ const c=texCanvas(); fn(c.getContext('2d'),128,128); return c; };
  const concrete=mk(drawConcrete), belt=mk(drawBelt);
  return {
    [T.FLOOR]:  concrete,
    [T.BOILER]: concrete,          // 보일러실도 공장 콘크리트 바닥 재사용(별도 생성 안 함)
    [T.OFFICE]: mk(drawOfficeCarpet),
    [T.WARE]:   mk(drawWarehouseEpoxy),
    [T.MESS]:   mk(drawKitchenTile),
    [T.LINE_A]: belt,   // 제미나이 이미지 로드 전 폴백(아래 LINE_IMG)
    [T.LINE_B]: belt,
    [T.WALL]:   mk(drawFactoryWall),

/* ── P4: 제미나이 생성 라인 이미지 — B라인(대량생산 컨베이어)만 레일처럼 반복 타일링 ──
   이미지를 라인 전체 폭에 억지로 늘려 붙이면(구 방식) 정사각형/가로로 짧은 원본이
   심하게 찌그러진다. 대신 이미지 높이를 타일 높이(TS)에 맞추고, 그 비율 그대로의
   폭을 한 "묶음"으로 삼아 라인을 따라 반복(타일링)한다 — 의자가 여러 개 자연스럽게
   이어붙은 것처럼 보임. A라인(장인의 수작업 라인)은 레일이 아니므로 OBJECTS의
   단일 큰 스프라이트로 따로 배치한다(아래 workbench 항목 참고). */
const LINE_X0=27, LINE_X1=45;
function makeLineImg(src){
  const img=new Image(); img.ready=false;
  img.onload=()=>{ img.ready=true; };
  img.onerror=()=>{ console.warn('라인 이미지 로드 실패(폴백 유지):', src); };
  img.src=src;
  return img;
}
const LINE_IMG_B = makeLineImg('lv1/tiles/line_b_conveyor.webp');
function drawLineSlice(ctx, img, x, sx, sy, tw){
  const aspect = img.width / img.height;         // 원본 비율(찌그러뜨리지 않고 그대로 유지)
  const unitPx = tw * aspect;                     // 한 묶음을 타일 높이에 맞췄을 때의 폭
  const worldPx = (x - LINE_X0) * tw;             // 라인 시작점부터의 누적 픽셀 위치
  const pos = ((worldPx % unitPx) + unitPx) % unitPx;
  const sxImg = (pos / unitPx) * img.width;
  let swImg = (tw / unitPx) * img.width;
  if(sxImg + swImg > img.width) swImg = Math.max(1, img.width - sxImg); // 묶음 경계에서만 살짝 클램프
  ctx.drawImage(img, sxImg, 0, swImg, img.height, sx, sy, tw, tw);
}

/* =========================================================================
 *  P4 — NPC·플레이어 canvas 도형 캐릭터 (제미나이 없이 코드로 확정)
 *  참고: 사용자가 제공한 비서교과 수행평가 게임(원+사각형 조합) 방식을
 *  그대로 채택 — 원(머리)+사각형(몸)에 NPC별 머리스타일·소품 하나씩만
 *  더해 구분한다. 맵 스프라이트/대화 초상화 양쪽에 같은 함수를 재사용.
 * ========================================================================= */
const LOOK = {
  n_han:   { skin:'#ffe0b2', hair:'#3e2723', hairStyle:'short',     outfit:'#4dd0e1', accessory:'coffee' },
  n_truck: { skin:'#ffcc80', hair:'#5d4037', hairStyle:'short',     outfit:'#ff9800', accessory:'cap' },
  n_go:    { skin:'#ffe0b2', hair:'#424242', hairStyle:'short',     outfit:'#9ccc65', accessory:'glasses' },
  n_oh:    { skin:'#ffe0b2', hair:'#6d4c41', hairStyle:'ponytail',  outfit:'#ffd54f', accessory:'none' },
  n_jung:  { skin:'#ffcc80', hair:'#616161', hairStyle:'headband',  outfit:'#a1887f', accessory:'none' },
  n_lee:   { skin:'#ffe0b2', hair:'#4e342e', hairStyle:'ponytail',  outfit:'#4fc3f7', accessory:'none' },
  n_seo:   { skin:'#ffe0b2', hair:'#757575', hairStyle:'short',     outfit:'#90a4ae', accessory:'tie' },
  n_ma:    { skin:'#ffcc80', hair:'#37474f', hairStyle:'short',     outfit:'#7986cb', accessory:'goggles' },
  n_mi:    { skin:'#ffe0b2', hair:'#4a148c', hairStyle:'bun',       outfit:'#ce93d8', accessory:'cardigan' },
  n_wan:   { skin:'#ffe0b2', hair:'#212121', hairStyle:'short',     outfit:'#80cbc4', accessory:'glasses' },
  n_truck2:{ skin:'#ffcc80', hair:'#5d4037', hairStyle:'short',     outfit:'#ff9800', accessory:'cap' },
  n_soon:  { skin:'#ffe0b2', hair:'#795548', hairStyle:'headscarf', outfit:'#f48fb1', accessory:'apron' },
  n_steam: { skin:'#ffcc80', hair:'#3e2723', hairStyle:'short',     outfit:'#ffab91', accessory:'goggles' },
  n_bae:   { skin:'#ffe0b2', hair:'#212121', hairStyle:'short',     outfit:'#81d4fa', accessory:'glasses' },
  n_gyul:  { skin:'#ffcc80', hair:'#424242', hairStyle:'short',     outfit:'#ffe082', accessory:'tie' },
};
const PLAYER_LOOK = { skin:'#ffe0b2', hair:'#3e2723', hairStyle:'short', outfit:'#e8eaf6', accessory:'none' };

function drawHair(ctx,cx,cy,r,color,style){
  ctx.fillStyle=color;
  if(style==='short'){
    ctx.beginPath(); ctx.arc(cx,cy,r*1.04,Math.PI,0); ctx.fill();
  } else if(style==='ponytail'){
    ctx.beginPath(); ctx.arc(cx,cy,r*1.04,Math.PI,0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+r*0.95,cy+r*0.3,r*0.22,r*0.5,0.5,0,7); ctx.fill();
  } else if(style==='bun'){
    ctx.beginPath(); ctx.arc(cx,cy,r*1.04,Math.PI,0); ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy-r*1.05,r*0.28,0,7); ctx.fill();
  } else if(style==='headband'){
    ctx.beginPath(); ctx.arc(cx,cy,r*1.04,Math.PI,0); ctx.fill();
    ctx.fillStyle='#e53935';
    ctx.fillRect(cx-r*1.05,cy-r*0.15,r*2.1,r*0.22);
  } else if(style==='headscarf'){
    ctx.beginPath(); ctx.arc(cx,cy,r*1.1,Math.PI*1.02,Math.PI*1.98); ctx.fill();
    ctx.fillStyle='#ef9a9a';
    ctx.beginPath(); ctx.arc(cx,cy-r*0.15,r*1.12,Math.PI,0); ctx.fill();
  }
}
function drawAccessory(ctx,cx,cy,s,type,look){
  if(type==='coffee'){
    ctx.fillStyle='#fff';
    ctx.fillRect(cx+s*0.32,cy+s*0.5,s*0.22,s*0.26);
    ctx.fillStyle='#4e342e'; ctx.fillRect(cx+s*0.34,cy+s*0.52,s*0.18,s*0.08);
  } else if(type==='cap'){
    ctx.fillStyle=look.outfit;
    ctx.beginPath(); ctx.arc(cx,cy-s*0.14,s*0.46,Math.PI*1.05,Math.PI*1.95); ctx.fill();
    ctx.fillRect(cx-s*0.05,cy-s*0.58,s*0.5,s*0.12);
  } else if(type==='glasses'){
    ctx.strokeStyle='#37474f'; ctx.lineWidth=Math.max(1,s*0.035);
    ctx.beginPath(); ctx.arc(cx-s*0.14,cy-s*0.08,s*0.13,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+s*0.14,cy-s*0.08,s*0.13,0,7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-s*0.02,cy-s*0.08); ctx.lineTo(cx+s*0.02,cy-s*0.08); ctx.stroke();
  } else if(type==='goggles'){
    ctx.fillStyle='rgba(160,220,255,0.55)'; ctx.strokeStyle='#455a64'; ctx.lineWidth=Math.max(1,s*0.045);
    ctx.beginPath(); ctx.ellipse(cx,cy-s*0.08,s*0.32,s*0.15,0,0,7); ctx.fill(); ctx.stroke();
  } else if(type==='tie'){
    ctx.fillStyle='#c62828';
    ctx.beginPath(); ctx.moveTo(cx-s*0.06,cy+s*0.18); ctx.lineTo(cx+s*0.06,cy+s*0.18); ctx.lineTo(cx,cy+s*0.6); ctx.closePath(); ctx.fill();
  } else if(type==='cardigan'){
    ctx.fillStyle='rgba(255,255,255,0.28)';
    ctx.fillRect(cx-s*0.52,cy+s*0.16,s*0.18,s*0.82);
    ctx.fillRect(cx+s*0.34,cy+s*0.16,s*0.18,s*0.82);
  } else if(type==='apron'){
    ctx.fillStyle='#fdf6e3';
    ctx.fillRect(cx-s*0.3,cy+s*0.28,s*0.6,s*0.7);
  }
}
/* size(s)=머리 반지름 기준 스케일. shadow는 맵 스프라이트에서만 켠다(초상화는 배경 위라 불필요). */
function drawCharacter(ctx, cx, cy, s, look, opts){
  opts = opts||{};
  if(opts.shadow){
    ctx.fillStyle='rgba(0,0,0,0.32)';
    ctx.beginPath(); ctx.ellipse(cx,cy+s*0.98,s*0.55,s*0.18,0,0,7); ctx.fill();
  }
  // 몸(어깨~가슴)
  ctx.fillStyle=look.outfit;
  ctx.beginPath();
  ctx.roundRect(cx-s*0.5, cy+s*0.18, s*1.0, s*0.88, s*0.2);
  ctx.fill();
  ctx.lineWidth=Math.max(1,s*0.05); ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.stroke();
  // 목~머리
  const hy=cy-s*0.08;
  ctx.fillStyle=look.skin;
  ctx.beginPath(); ctx.arc(cx,hy,s*0.44,0,7); ctx.fill();
  ctx.lineWidth=Math.max(1,s*0.04); ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.stroke();
  // 머리카락(눈보다 먼저 — 헤어라인이 정확히 중심선이라 눈은 그 아래에 그린다)
  drawHair(ctx,cx,hy,s*0.44,look.hair,look.hairStyle);
  // 눈(헤어라인 아래 얼굴 하단부)
  if(opts.dir!=='back'){
    ctx.fillStyle='#2b2b3a';
    const ex = opts.dir==='side' ? (opts.facing||1)*s*0.1 : 0;
    if(opts.dir==='side'){
      ctx.beginPath(); ctx.arc(cx+ex,hy+s*0.1,s*0.07,0,7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(cx-s*0.16,hy+s*0.1,s*0.07,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+s*0.16,hy+s*0.1,s*0.07,0,7); ctx.fill();
    }
  }
  // 소품
  if(look.accessory && look.accessory!=='none') drawAccessory(ctx,cx,cy,s,look.accessory,look);
}

/* ── 대화 초상화 프리렌더(96px, NPC_DATA에 data URL 주입) ── */
let PLAYER_PORTRAIT_IMG = '';
(function(){
  const size=160;
  const render=(look)=>{
    const c=document.createElement('canvas'); c.width=size; c.height=size;
    const pctx=c.getContext('2d');
    const g=pctx.createLinearGradient(0,0,0,size);
    g.addColorStop(0,'#3a4050'); g.addColorStop(1,'#232733');
    pctx.fillStyle=g; pctx.fillRect(0,0,size,size);
    drawCharacter(pctx, size/2, size*0.62, size*0.5, look, {shadow:false, dir:'front'});
    return c.toDataURL('image/png');
  };
  for(const key in NPC_DATA){
    const npcId = key.replace(/_intro$|_end$/,'');
    const look = LOOK[npcId];
    if(!look) continue;
    NPC_DATA[key].portraitImg = render(look);
  }
  PLAYER_PORTRAIT_IMG = render(PLAYER_LOOK);
})();

/* ── 구역 판정 ── */
function zoneAt(x,y){
  for(const z of ZONES){
    if(x>=z.x0&&x<=z.x1&&y>=z.y0&&y<=z.y1) return z;
  }
  return null;
}

/* =========================================================================
 *  World — 걷기 · 카메라 · 충돌
 * ========================================================================= */
const World = {
  cv:null, ctx:null, dpr:1, viewW:0, viewH:0, TS:40,
  px:39, py:4,                 // 플레이어 시작 — 공장 사무실, 한서준(39,1) 앞. 겹치지 않게 띄운다.
  dir:'front', facing:1, moving:false, walkT:0, bob:0,
  keys:{}, stick:{active:false,dx:0,dy:0,cx:0,cy:0,id:null},
  raf:null, _lastTs:0,
  curZone:null, nearNpc:null,
  paused:false,

  init(){
    // 나갔다가 다시 들어오면 마지막으로 있던 자리에서 시작(없으면 기본 스폰 위치 그대로)
    if(Number.isFinite(Stage.state.px) && Number.isFinite(Stage.state.py)){
      this.px = Stage.state.px; this.py = Stage.state.py;
    }
    this.cv=document.getElementById('game');
    this.ctx=this.cv.getContext('2d');
    applyOrientation();   // 최초 1회 — 세로로 들고 있으면 즉시 회전(내부에서 resize()도 호출)
    window.addEventListener('resize',()=>applyOrientation());
    window.addEventListener('orientationchange',()=>setTimeout(applyOrientation,80));
    window.addEventListener('keydown',e=>this.onKey(e));
    window.addEventListener('keyup',e=>this.onKeyUp(e));
    this.bindStick();
    this.initMinimap();
    this.checkZone(true);
    this.loop(0);
  },

  /* #rotator가 세로일 때 90도 회전되므로, 실제 표시 폭/높이는
     window.innerWidth/innerHeight를 서로 바꾼 값이다(applyOrientation과 동일 기준). */
  resize(){
    const portrait = window.innerHeight > window.innerWidth;
    const w = portrait ? window.innerHeight : window.innerWidth;
    const h = portrait ? window.innerWidth  : window.innerHeight;
    this.dpr=Math.min(window.devicePixelRatio||1,2);
    this.cv.width=Math.floor(w*this.dpr); this.cv.height=Math.floor(h*this.dpr);
    this.cv.style.width=w+'px'; this.cv.style.height=h+'px';
    this.viewW=w; this.viewH=h;
    // 화면에 가로 ~13타일. 단, 세로 월드(HT타일)가 화면보다 작아지면
    // 위아래에 빈 공간이 생기므로 세로를 꽉 채우는 크기를 하한으로 둔다.
    const byWidth = w/13;
    const fillH   = h/HT;               // 세로를 정확히 채우는 타일 크기
    this.TS = Math.max(34, Math.round(Math.max(byWidth, fillH)));
  },

  /* ── 충돌 ──
     타일 단위 판정. Math.round만 쓰면 경계 타일의 절반까지 파고들어
     맵 밖으로 빠져나가므로(초기 버그), 아래 canStand가 몸 반지름(R)을
     함께 검사한다. */
  isBarrier(x,y){
    if(x<0||y<0||x>=WT||y>=HT) return true;
    if(MAP[y][x]===T.WALL) return true;
    // NPC는 통과 불가(대화 대상이므로 몸으로 막는다)
    for(const n of NPCS){ if(n.x===x&&n.y===y) return true; }
    return false;
  },
  /* 중심(cx,cy)에 몸 반지름 R을 두고, 닿는 타일이 전부 걸을 수 있는지 */
  canStand(cx,cy){
    const R=0.34;
    const x0=Math.round(cx-R), x1=Math.round(cx+R);
    const y0=Math.round(cy-R), y1=Math.round(cy+R);
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
      if(this.isBarrier(x,y)) return false;
    }
    return true;
  },

  /* ── 입력: 키보드 ── */
  onKey(e){
    if(this.paused) return;
    const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'};
    const k=m[e.key]; if(k){ this.keys[k]=1; e.preventDefault(); }
    if(e.key===' '||e.key==='Enter'){ Stage.interact(); e.preventDefault(); }
  },
  onKeyUp(e){
    const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'};
    const k=m[e.key]; if(k) this.keys[k]=0;
  },

  /* ── 입력: 조이스틱 ── */
  bindStick(){
    const zone=document.getElementById('stick-zone');
    const base=document.getElementById('stick-base'), knob=document.getElementById('stick-knob');
    const R=52, self=this;
    const setKnob=(dx,dy)=>{ knob.style.transform=`translate(${31+dx}px, ${-31+dy}px)`; };
    const reset=()=>{ self.stick.active=false; self.stick.dx=0; self.stick.dy=0; setKnob(0,0); };
    function move(e){
      let dx=e.clientX-self.stick.cx, dy=e.clientY-self.stick.cy;
      // 화면이 세로라 #rotator가 90도 회전된 상태면, 실제 터치는 화면(회전 전) 좌표계라
      // 캔버스 내부(회전된) 좌표계로 변환해줘야 방향이 맞다(보카바리스타와 동일 보정).
      if(document.body.classList.contains('rot')){ const t=dx; dx=dy; dy=-t; }
      const d=Math.hypot(dx,dy)||1;
      if(d>R){ dx=dx/d*R; dy=dy/d*R; }
      self.stick.dx=dx/R; self.stick.dy=dy/R; setKnob(dx,dy);
    }
    zone.addEventListener('pointerdown',e=>{ e.preventDefault();
      const b=base.getBoundingClientRect();
      self.stick.active=true; self.stick.id=e.pointerId;
      self.stick.cx=b.left+b.width/2; self.stick.cy=b.top+b.height/2;
      move(e); zone.setPointerCapture(e.pointerId); });
    zone.addEventListener('pointermove',e=>{ if(self.stick.active&&e.pointerId===self.stick.id) move(e); });
    zone.addEventListener('pointerup',  e=>{ if(e.pointerId===self.stick.id) reset(); });
    zone.addEventListener('pointercancel',reset);
    reset();
  },

  /* ── 갱신 ── */
  update(f){
    if(this.paused){ this.moving=false; return; }
    let vx=this.stick.dx, vy=this.stick.dy;
    if(this.keys.l)vx-=1; if(this.keys.r)vx+=1; if(this.keys.u)vy-=1; if(this.keys.d)vy+=1;
    const mag=Math.hypot(vx,vy);
    this.moving = mag>0.18;
    if(this.moving){
      this.walkT=(this.walkT||0)+0.28*f;
      vx/=Math.max(1,mag); vy/=Math.max(1,mag);
      if(Math.abs(vx)>0.2) this.facing = vx<0?-1:1;
      if(Math.abs(vy) > Math.abs(vx)+0.15) this.dir = vy<0?'back':'front';
      else if(Math.abs(vx)>0.2) this.dir='side';
      const SPD=0.058*f;
      const nx=this.px+vx*SPD, ny=this.py+vy*SPD;
      // 축별로 따로 검사 → 벽에 스치며 미끄러짐
      if(this.canStand(nx, this.py)) this.px=nx;
      if(this.canStand(this.px, ny)) this.py=ny;
      this.checkZone(false);
      this._miniDirty=true;
    }
    this.checkNpc();
  },

  /* ── 구역 진입 감지 → 배너 ── */
  checkZone(force){
    const z=zoneAt(Math.round(this.px), Math.round(this.py));
    if(!z) return;
    if(force || !this.curZone || z.id!==this.curZone.id){
      this.curZone=z;
      document.getElementById('zone-name').textContent=z.name;
      this.showBanner(z);
      // ── P5 연출 이벤트: 구역 최초 진입 ──
      if(z.id==='raw')  EventFX.fire('ev_truck_in',    '🚚', '원재료가 하역장에 도착했습니다');
      if(z.id==='line') EventFX.fire('ev_line_start',  '⚙️', '컨베이어가 가동을 시작합니다');
      if(z.id==='fin')  EventFX.fire('ev_product_stack','📦','완제품이 팔레트에 쌓이고 있습니다');
    }
    // 라인 중앙(재공품 강조) — 라인 구역에서 중앙선을 넘는 순간 1회
    if(z.id==='line' && this.px>=36) EventFX.fire('ev_wip_glow','✨','라인 위 반제품 = 재공품');
  },
  _bannerT:null,
  showBanner(z){
    const el=document.getElementById('zone-banner');
    document.getElementById('zb-name').textContent=z.name;
    const acct=document.getElementById('zb-acct');
    if(z.acct){ acct.textContent=z.acct; acct.style.display='inline-block'; }
    else acct.style.display='none';
    el.classList.add('show');
    clearTimeout(this._bannerT);
    this._bannerT=setTimeout(()=>el.classList.remove('show'),1600);
  },

  /* ── 근처 NPC 감지 → 상호작용 버튼 ── */
  checkNpc(){
    let found=null, best=1e9;
    const px=this.px, py=this.py;
    for(const n of NPCS){
      const d=Math.hypot(n.x-px, n.y-py);
      if(d<1.65 && d<best){ best=d; found=n; }
    }
    if(found!==this.nearNpc){
      this.nearNpc=found;
      const btn=document.getElementById('act-btn');
      if(found){ document.getElementById('act-label').innerHTML=found.name.split(' ')[0]+'<br>대화'; btn.classList.add('show'); }
      else btn.classList.remove('show');
    }
  },

  /* ── 루프 ── */
  loop(ts){
    this.raf=requestAnimationFrame(t=>this.loop(t));
    const now=ts||(performance.now?performance.now():0);
    let dt=this._lastTs ? (now-this._lastTs)/1000 : 1/60;
    this._lastTs=now;
    if(dt>0.05) dt=0.05;
    const f=dt*60;
    this.update(f); this.bob+=0.1*f; this.render();
    if(this._miniDirty){ this.drawMinimap(); this._miniDirty=false; }
  },

  /* ── 렌더 ── */
  render(){
    const ctx=this.ctx, TS=this.TS, dpr=this.dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#07060d'; ctx.fillRect(0,0,this.viewW,this.viewH);

    // 카메라 — 플레이어 중앙 고정 + 월드 경계 클램프
    const halfW=this.viewW/2, halfH=this.viewH/2;
    let camX=this.px*TS-halfW+TS/2, camY=this.py*TS-halfH+TS/2;
    const worldW=WT*TS, worldH=HT*TS;
    camX = worldW<=this.viewW ? (worldW-this.viewW)/2 : Math.max(0,Math.min(camX,worldW-this.viewW));
    camY = worldH<=this.viewH ? (worldH-this.viewH)/2 : Math.max(0,Math.min(camY,worldH-this.viewH));

    const x0=Math.max(0,Math.floor(camX/TS)-1), x1=Math.min(WT-1,Math.ceil((camX+this.viewW)/TS)+1);
    const y0=Math.max(0,Math.floor(camY/TS)-1), y1=Math.min(HT-1,Math.ceil((camY+this.viewH)/TS)+1);

    // ── 바닥 타일 (P4: 6종 절차적 텍스처 — §"6종은 코드로 확정" — 계단만 색+선) ──
    const COL={ [T.STAIR]:'#584a6a' };
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
      const t=MAP[y][x];
      const sx=Math.round(x*TS-camX), sy=Math.round(y*TS-camY);
      // A라인(장인의 수작업 라인)은 컨베이어가 아니라 작업대 하나를 크게 배치한 공간이라
      // 레일 이미지/흐르는 화살표를 쓰지 않고 은은한 워시만 깔아 구역감만 준다.
      let usedLineImg=false;
      if(t===T.LINE_B && LINE_IMG_B.ready){ drawLineSlice(ctx,LINE_IMG_B,x,sx,sy,TS+1); usedLineImg=true; }
      else{
        const tex=TEX[t];
        if(tex) ctx.drawImage(tex,sx,sy,TS+1,TS+1);
        else{ ctx.fillStyle=COL[t]||'#222'; ctx.fillRect(sx,sy,TS+1,TS+1); }
      }
      if(t!==T.WALL){
        ctx.strokeStyle='rgba(255,255,255,0.045)'; ctx.lineWidth=1;
        ctx.strokeRect(sx+0.5,sy+0.5,TS,TS);
      }
      // 라인 A/B 색 구분(A라인은 항상 워시만, B라인은 제미나이 그림 로드 전 폴백일 때만)
      if(t===T.LINE_A || (!usedLineImg && t===T.LINE_B)){
        ctx.fillStyle = t===T.LINE_A ? 'rgba(255,193,7,0.07)' : 'rgba(0,242,255,0.07)';
        ctx.fillRect(sx,sy,TS+1,TS+1);
      }
      // 컨베이어 방향 표시(흐르는 화살표) — B라인(레일)에만. A라인은 작업대라 흐름이 없다.
      if(t===T.LINE_B){
        const ph=(this.bob*0.5+x*0.35)%1;
        ctx.fillStyle='rgba(0,242,255,0.45)';
        ctx.beginPath();
        const ax=sx+ph*TS, ay=sy+TS/2;
        ctx.moveTo(ax,ay-TS*0.16); ctx.lineTo(ax+TS*0.2,ay); ctx.lineTo(ax,ay+TS*0.16);
        ctx.closePath(); ctx.fill();
      }
      // 보조부문동(구내식당·보일러실)은 지하라는 느낌이 들도록 전체적으로 살짝 어둡게
      if(t===T.MESS||t===T.BOILER){
        ctx.fillStyle='rgba(0,0,0,0.22)';
        ctx.fillRect(sx,sy,TS+1,TS+1);
      }
      // 계단 표시 — 남쪽(보조부문동 방면)은 내려갈수록 어두워지는 그라데이션+좌우 벽 그림자로
      // "구멍 속으로 꺼지는" 느낌을, 북쪽(공장 사무실 방면)은 반대로 은은하게 밝아지는 톤을 준다.
      if(t===T.STAIR){
        const goingDown = y>=15, goingUp = y<=7;
        if(goingDown){
          const depth=(y-15);
          const grad=ctx.createLinearGradient(sx,sy,sx,sy+TS);
          grad.addColorStop(0, `rgba(8,4,16,${0.18+depth*0.22})`);
          grad.addColorStop(1, `rgba(3,1,8,${0.38+depth*0.3})`);
          ctx.fillStyle=grad; ctx.fillRect(sx,sy,TS+1,TS+1);
          ctx.fillStyle='rgba(0,0,0,0.35)';
          ctx.fillRect(sx,sy,TS*0.12,TS+1);
          ctx.fillRect(sx+TS*0.88,sy,TS*0.12,TS+1);
        } else if(goingUp){
          const grad=ctx.createLinearGradient(sx,sy,sx,sy+TS);
          grad.addColorStop(0,'rgba(255,255,255,0.06)');
          grad.addColorStop(1,'rgba(255,255,255,0)');
          ctx.fillStyle=grad; ctx.fillRect(sx,sy,TS+1,TS+1);
        }
        ctx.strokeStyle = goingDown ? 'rgba(190,160,255,0.4)' : 'rgba(255,255,255,0.28)';
        ctx.lineWidth=2;
        for(let i=1;i<=3;i++){
          const yy=sy+TS*i/4;
          const inset = goingDown ? TS*0.05*i : 0; // 내려갈수록 폭이 좁아 보이는 원근감
          ctx.beginPath(); ctx.moveTo(sx+TS*0.18+inset,yy); ctx.lineTo(sx+TS*0.82-inset,yy); ctx.stroke();
        }
      }
      // 구역 연결통로(문) 문턱 — 밋밋한 바닥과 구분되는 금속 플레이트 느낌(대각선 해치)
      for(const d of DOORS){
        if(x===d.x && y>=d.y0 && y<=d.y1){
          ctx.fillStyle='rgba(255,214,0,0.05)';
          ctx.fillRect(sx,sy,TS+1,TS+1);
          ctx.strokeStyle='rgba(255,214,0,0.22)'; ctx.lineWidth=1;
          for(let i=-1;i<=1;i++){
            const off=i*TS*0.33;
            ctx.beginPath();
            ctx.moveTo(sx+TS*0.08+off, sy+TS*0.92);
            ctx.lineTo(sx+TS*0.42+off, sy+TS*0.08);
            ctx.stroke();
          }
        }
      }
    }

    // ── 문틀 — 통로 시작/끝에 프레임 바를 걸쳐 그려 "벽 틈"이 아니라 "문"처럼 보이게 ──
    for(const d of DOORS){
      const dsx=d.x*TS-camX;
      if(dsx<-TS||dsx>this.viewW+TS) continue;
      const topSy=d.y0*TS-camY, botSy=(d.y1+1)*TS-camY;
      ctx.fillStyle='rgba(20,16,30,0.6)';
      ctx.fillRect(dsx-TS*0.06, topSy-TS*0.16, TS+TS*0.12, TS*0.16);
      ctx.fillRect(dsx-TS*0.06, botSy, TS+TS*0.12, TS*0.16);
      ctx.strokeStyle='rgba(255,214,0,0.4)'; ctx.lineWidth=1.5;
      ctx.strokeRect(dsx-TS*0.06, topSy-TS*0.16, TS+TS*0.12, TS*0.16);
      ctx.strokeRect(dsx-TS*0.06, botSy, TS+TS*0.12, TS*0.16);
    }

    // ── 배치 오브젝트(P2 이모지 + P4 제미나이 아트) ──
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const o of OBJECTS){
      if(o.x<x0-1||o.x>x1+1||o.y<y0-1||o.y>y1+1) continue;
      const cx=o.x*TS-camX+TS/2, cy=o.y*TS-camY+TS/2;
      if(o._img && o._img.ready){
        const w=TS*(o.scale||1.6);
        ctx.drawImage(o._img, cx-w/2, cy-w*0.62, w, w);
      } else if(o.icon){
        ctx.font=`${Math.round(TS*0.56)}px sans-serif`;
        ctx.fillText(o.icon, cx, cy-TS*0.06);
      }
    }
    // ── 경계 팻말: 방향 화살표 대신, 매달린 안내판(포스트+명패) 모양으로 ──
    for(const s of SIGNS){
      if(s.x<x0-1||s.x>x1+1||s.y<y0-1||s.y>y1+1) continue;
      const cx=s.x*TS-camX+TS/2, cy=s.y*TS-camY+TS/2;
      ctx.font=`700 ${Math.round(TS*0.19)}px 'Noto Sans KR', sans-serif`;
      const padX=14, plateW=ctx.measureText(s.label).width+padX*2, plateH=TS*0.26;
      const px=cx-plateW/2, py=cy-plateH/2;
      // 지지대(포스트): 명패 위에서 바닥 쪽으로 짧게
      ctx.strokeStyle='rgba(200,190,175,0.4)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(cx,py-TS*0.16); ctx.lineTo(cx,py); ctx.stroke();
      ctx.fillStyle='rgba(200,190,175,0.5)';
      ctx.beginPath(); ctx.arc(cx,py-TS*0.16,2.2,0,Math.PI*2); ctx.fill();
      // 명패 본체(나무 질감 톤 + 금색 테두리)
      ctx.fillStyle='rgba(38,28,20,0.88)';
      ctx.strokeStyle='rgba(255,214,0,0.45)'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.roundRect(px,py,plateW,plateH,5); ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(255,236,190,0.92)';
      ctx.fillText(s.label, cx, cy+1);
    }
    ctx.restore();

    // ── 구역 라벨(바닥에 은은하게) ──
    ctx.save();
    ctx.font=`700 ${Math.round(TS*0.42)}px 'Black Han Sans', sans-serif`;
    ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,0.055)';
    for(const z of ZONES){
      const cx=(z.x0+z.x1)/2*TS-camX+TS/2, cy=(z.y0+z.y1)/2*TS-camY+TS/2;
      if(cx<-200||cx>this.viewW+200) continue;
      ctx.fillText(z.name, cx, cy);
    }
    ctx.restore();

    // ── NPC (P4: canvas 도형 캐릭터) ──
    for(const n of NPCS){
      if(n.x<x0-1||n.x>x1+1||n.y<y0-1||n.y>y1+1) continue;
      const cx=n.x*TS-camX+TS/2, cy=n.y*TS-camY+TS/2;
      const look=LOOK[n.id];
      if(look) drawCharacter(ctx,cx,cy,TS*0.38,look,{shadow:false,dir:'front'});
      else {
        ctx.fillStyle=n.color;
        ctx.beginPath(); ctx.arc(cx,cy,TS*0.32,0,7); ctx.fill();
      }
      // 근처면 이름표 + 느낌표
      if(this.nearNpc && this.nearNpc.id===n.id){
        ctx.save();
        ctx.font=`700 ${Math.round(TS*0.3)}px 'Noto Sans KR', sans-serif`;
        ctx.textAlign='center';
        const label=n.name, w=ctx.measureText(label).width+14;
        ctx.fillStyle='rgba(5,3,16,0.85)';
        ctx.fillRect(cx-w/2, cy-TS*0.92, w, TS*0.4);
        ctx.fillStyle='#fff'; ctx.fillText(label, cx, cy-TS*0.62);
        ctx.restore();
      } else {
        // 대화 가능 표시 — 한서준 대리와 첫 대화 끝내기 전엔 다른 NPC 위엔 안 띄우고(어차피 안내
        // 멘트뿐), 이 NPC와 이미 대화(+퀴즈)를 다 끝낸 뒤에는 더 이상 "할 얘기 있음"이 아니므로 끔.
        const dkey = n.id==='n_han' ? (Stage.state.docs.length>=TOTAL_DOCS?'n_han_end':'n_han_intro') : n.id;
        const canTalk = n.id==='n_han' || Stage.state.metNpc['n_han_intro'];
        if(canTalk && !Stage.state.metNpc[dkey]){
          ctx.fillStyle='rgba(255,214,0,'+(0.55+0.35*Math.sin(this.bob*2))+')';
          ctx.font=`700 ${Math.round(TS*0.42)}px 'Black Han Sans', sans-serif`;
          ctx.textAlign='center';
          ctx.fillText('!', cx, cy-TS*0.42);
        }
      }
    }

    // ── 플레이어 (P4: canvas 도형 캐릭터 + 보행 흔들림) ──
    {
      const cx=this.px*TS-camX+TS/2, cy=this.py*TS-camY+TS/2;
      const swing=this.moving ? Math.sin(this.walkT)*TS*0.06 : 0;
      ctx.save();
      ctx.translate(cx,cy+swing);
      drawCharacter(ctx,0,0,TS*0.38,PLAYER_LOOK,{shadow:false,dir:this.dir,facing:this.facing});
      ctx.restore();
    }
  },

  /* ── 미니맵 ── */
  initMinimap(){
    const cv=document.getElementById('minimap');
    cv.width=WT; cv.height=HT;
    this._mmctx=cv.getContext('2d');
    this.drawMinimap();
  },
  drawMinimap(){
    const c=this._mmctx; if(!c) return;
    c.clearRect(0,0,WT,HT);
    for(let y=0;y<HT;y++) for(let x=0;x<WT;x++){
      const t=MAP[y][x];
      if(t===T.WALL) continue;
      c.fillStyle = (t===T.STAIR) ? '#b44fff'
                  : (t===T.LINE_A||t===T.LINE_B) ? '#6b7a8a'
                  : '#49505c';
      c.fillRect(x,y,1,1);
    }
    // NPC
    c.fillStyle='#ffd600';
    for(const n of NPCS) c.fillRect(n.x,n.y,1,1);
    // 플레이어
    c.fillStyle='#fff';
    c.fillRect(Math.round(this.px),Math.round(this.py),1,1);
  },
};

/* =========================================================================
 *  Stage — 진행 상태(서류철) / 상호작용 진입점
 * ========================================================================= */
const SAVE_KEY='lv1_s1_progress';
const TOTAL_DOCS=14;

const Stage = {
  state:{ docs:[], docData:{}, metNpc:{}, quizOk:{}, cleared:false, score:0, quizWrong:0 },

  load(){
    try{ const r=localStorage.getItem(SAVE_KEY); if(r) Object.assign(this.state, JSON.parse(r)||{}); }catch(e){}
    if(!Array.isArray(this.state.docs)) this.state.docs=[];
    if(!this.state.docData) this.state.docData={};
    if(!this.state.metNpc) this.state.metNpc={};
    if(!this.state.eventsFired) this.state.eventsFired={};
    if(!Number.isFinite(this.state.quizWrong)) this.state.quizWrong=0;
    this.refresh();
  },
  save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(this.state)); }catch(e){} },
  refresh(){ document.getElementById('doc-count').textContent=this.state.docs.length+'/'+TOTAL_DOCS; },

  interact(){
    if(document.querySelector('.ov.show')) return;   // 대화/퀴즈/서류철 열려있으면 무시
    const n=World.nearNpc; if(!n) return;
    Dialog.open(n.id);
  },

  openDocs(){
    if(document.querySelector('.ov.show')) return;
    DocsUI.open();
  },

  exit(){
    if(confirm('허브로 나갈까요? 진행 상황은 저장됩니다.')){
      if(!this.state.cleared) this.saveProgressScore();
      this.savePosition();
      try{ unlockOrientation(); }catch(e){}
      location.href='index_lv1.html';
    }
  },

  /* 중도 이탈 시 부분 점수 — 그때까지 모은 서류 개수 비율에서 NPC 퀴즈 오답을 감점.
     Stage.state.cleared는 건드리지 않으므로 허브 진행률 표시는 그대로 "미완주"로 남는다. */
  saveProgressScore(){
    const pct = Math.round((this.state.docs.length/TOTAL_DOCS)*100);
    const quizWrong = this.state.quizWrong||0;
    const score = Math.max(0, pct - quizWrong*2);
    try{ saveStageScore(score, 0, quizWrong, true); }catch(e){}
  },

  /* 나갔다가 다시 들어와도 있던 자리에서 이어서 시작하도록 플레이어 좌표 저장 */
  savePosition(){
    this.state.px = World.px;
    this.state.py = World.py;
    this.save();
  },
};

/* =========================================================================
 *  P5 — 연출 이벤트(§4-6) — 대화 아님, 조건 충족 시 1회 자동 재생
 *  8종: ev_truck_in/ev_line_start/ev_wip_glow/ev_yearend/ev_product_stack/
 *       ev_flow_recap/ev_support_join/ev_oh_rain
 * ========================================================================= */
const EventFX = {
  _t:null,
  /* once=true면 Stage.state.eventsFired에 기록해 스테이지당 1회만 재생 */
  fire(id, icon, text, once=true){
    if(once){
      if(Stage.state.eventsFired[id]) return;
      Stage.state.eventsFired[id]=true;
      Stage.save();
    }
    const el=document.getElementById('event-banner');
    document.getElementById('eb-icon').textContent=icon;
    document.getElementById('eb-txt').textContent=text;
    el.classList.add('show');
    clearTimeout(this._t);
    this._t=setTimeout(()=>el.classList.remove('show'), 2400);
  },
  /* 12/31 마감(ev_yearend) — 정미완 대사 중 특정 비트에서 화면 암전 on/off */
  yearendDim(on){
    document.getElementById('yearend-dim').classList.toggle('show', !!on);
  },
  /* 본선 완주(ev_flow_recap) — 한완성 완료 시 1회 */
  recap(){
    if(Stage.state.eventsFired.ev_flow_recap) return;
    Stage.state.eventsFired.ev_flow_recap=true; Stage.save();
    World.paused=true;
    document.getElementById('recap-overlay').classList.add('show');
  },
};
document.getElementById('recap-close').addEventListener('click', ()=>{
  document.getElementById('recap-overlay').classList.remove('show');
  World.paused=false;
});

/* =========================================================================
 *  Toast — 자료 획득 알림
 * ========================================================================= */
const Toast = {
  _t:null,
  show(doc){
    const el=document.getElementById('doc-toast');
    el.querySelector('.dt-icon').textContent = doc.icon || '📄';
    document.getElementById('dt-name').textContent = '「'+doc.name+'」 획득!';
    el.classList.add('show');
    clearTimeout(this._t);
    this._t=setTimeout(()=>el.classList.remove('show'), 1800);
  },
};

/* ── 퀴즈용 T계정 — 실제 문제 속 숫자를 그대로 채워 넣은 동적 SVG(값 하나는 '?') ── */
function fmtWon(n){ return Number(n).toLocaleString('ko-KR')+'원'; }
function taccountBox(x, y, item){
  const w=76, h=32;
  const unknown = !!item.unknown;
  const fill = unknown ? 'rgba(255,45,120,0.12)' : 'rgba(0,242,255,0.14)';
  const stroke = unknown ? '#ff2d78' : '#00f2ff';
  const dash = unknown ? ' stroke-dasharray="4 3"' : '';
  const cx = x + w/2;
  let out = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="1.3"${dash}/>`;
  out += `<text x="${cx}" y="${y+13}" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="7.5" fill="#fff">${item.label}</text>`;
  if(unknown){
    out += `<text x="${cx}" y="${y+27}" text-anchor="middle" font-family="'Black Han Sans',sans-serif" font-size="14" fill="#ff2d78">?</text>`;
  } else {
    out += `<text x="${cx}" y="${y+26}" text-anchor="middle" font-family="Orbitron,monospace" font-size="8.5" fill="#fff">${fmtWon(item.val)}</text>`;
  }
  return out;
}
function taccountQuizSVG(title, leftItems, rightItems){
  const rowH=32, rowGap=6, startY=44, leftX=18, rightX=106;
  let boxes='';
  leftItems.forEach((it,i)=>{ boxes+=taccountBox(leftX, startY+i*(rowH+rowGap), it); });
  rightItems.forEach((it,i)=>{ boxes+=taccountBox(rightX, startY+i*(rowH+rowGap), it); });
  const rows=Math.max(leftItems.length, rightItems.length);
  const lineBottom = startY + rows*(rowH+rowGap) - rowGap + 4;
  const bottomY = lineBottom + 14;
  const vbH = bottomY + 10;
  return `<svg viewBox="0 0 200 ${vbH}" xmlns="http://www.w3.org/2000/svg">`+
    `<text x="100" y="14" text-anchor="middle" font-family="'Black Han Sans',sans-serif" font-size="12" fill="#fff">${title}</text>`+
    `<line x1="100" y1="22" x2="100" y2="${lineBottom}" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>`+
    `<line x1="14" y1="22" x2="186" y2="22" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>`+
    `<text x="57" y="34" text-anchor="middle" font-family="Orbitron,monospace" font-size="8" letter-spacing="0.5" fill="#00f2ff">왼쪽 · 들어온 것</text>`+
    `<text x="143" y="34" text-anchor="middle" font-family="Orbitron,monospace" font-size="8" letter-spacing="0.5" fill="#ffd600">오른쪽 · 나간 것</text>`+
    boxes+
    `<text x="100" y="${bottomY}" text-anchor="middle" font-family="'Noto Sans KR',sans-serif" font-size="8.5" fill="rgba(255,255,255,0.55)">왼쪽 합계 = 오른쪽 합계</text>`+
    `</svg>`;
}

/* =========================================================================
 *  Dialog — 대화 진행(비트 순차 표시) → 퀴즈 또는 즉시 완료
 * ========================================================================= */
const Dialog = {
  queue:[], idx:0, npcKey:null, npcDef:null, _repeatMode:false,

  open(npcMapId){
    let key = npcMapId;
    if(npcMapId==='n_han'){
      key = (Stage.state.docs.length >= TOTAL_DOCS) ? 'n_han_end' : 'n_han_intro';
    } else if(!Stage.state.metNpc['n_han_intro']){
      // 한서준 대리와 첫 대화를 끝내기 전엔 다른 NPC는 전부 안내 멘트만.
      key = 'n_blocked';
    }
    const def = NPC_DATA[key];
    if(!def) return;
    this.npcKey = key; this.npcDef = def;
    this._sawYearend = false;
    World.paused = true;

    if(Stage.state.metNpc[key]){
      this._repeatMode = true;
      this.queue = [{who:'npc', t:def.repeat}];
    } else {
      this._repeatMode = false;
      // 복사본 — 미니게임 결과 대사를 런타임에 끼워넣으므로 NPC_DATA 원본을 건드리면 안 된다
      this.queue = def.beats.slice();
    }
    this.idx = 0;
    document.getElementById('dlg-overlay').classList.add('show');
    this.render();
  },

  render(){
    const b = this.queue[this.idx];
    const nameEl=document.getElementById('dlg-name');
    const portrait=document.getElementById('dlg-portrait');
    const tagEl=document.getElementById('dlg-tag');
    const textEl=document.getElementById('dlg-text');
    textEl.className = 'dlg-box' + (b.who==='player' ? ' player' : b.who==='narrator' ? ' narrator' : '');
    if(b.who==='player'){
      nameEl.textContent='나'; tagEl.textContent='PLAYER';
      portrait.textContent=''; portrait.style.background=`center/cover url(${PLAYER_PORTRAIT_IMG})`;
    } else if(b.who==='narrator'){
      nameEl.textContent=''; tagEl.textContent='';
      portrait.textContent=''; portrait.style.background='transparent';
    } else {
      nameEl.textContent=this.npcDef.name; tagEl.textContent='STAGE 1';
      const img=this.npcDef.portraitImg;
      portrait.textContent = img ? '' : this.npcDef.icon;
      portrait.style.background = img ? `center/cover url(${img})` : '#cfd8dc';
    }
    textEl.textContent=b.t;

    const visualEl=document.getElementById('dlg-visual');
    if(b.visual && DialogVisuals[b.visual]){
      visualEl.innerHTML = DialogVisuals[b.visual];
      visualEl.style.display='block';
    } else {
      visualEl.style.display='none';
    }

    // ── P5 연출 이벤트: ev_yearend — 정미완 12/31 컷신 구간만 화면 암전 ──
    if(this.npcKey==='n_mi'){
      if(b.who==='narrator'){ EventFX.yearendDim(true); this._sawYearend=true; }
      else if(this._sawYearend){ EventFX.yearendDim(false); this._sawYearend=false; }
    }
  },

  next(){
    this.idx++;
    if(this.idx >= this.queue.length){
      document.getElementById('dlg-overlay').classList.remove('show');
      if(this._sawYearend){ EventFX.yearendDim(false); this._sawYearend=false; } // 안전망
      if(this._repeatMode){ this._repeatMode=false; World.paused=false; return; }
      const def=this.npcDef;
      if(def.quiz && def.quiz.length) Quiz.start(this.npcKey, def);
      else this.complete(this.npcKey, def);
      return;
    }
    const b=this.queue[this.idx];
    if(b && b.who==='action'){ this.runAction(b); return; }
    this.render();
  },

  /* 대사 도중 미니게임 진입 → 끝나면 결과 대사를 끼워넣고 이어서 재생 */
  runAction(b){
    document.getElementById('dlg-overlay').classList.remove('show');
    if(b.act!=='sheet'){ this.next(); return; }
    Sheet.open((res)=>{
      const lines=[
        {who:'npc', t:`당기제품제조원가 ${res.cogm.toLocaleString('ko-KR')}원. …맞췄네.`},
        res.wrong===0
          ? {who:'npc', t:'게다가 한 번도 안 틀렸어. 영업부 급여랑 출하 운임 안 넣은 거, 그거 넣는 신입이 열에 아홉이야.'}
          : {who:'npc', t:'몇 번 헤맸지만 결국 다 골라냈네. 처음엔 다 그래. 중요한 건 왜 빠지는지 알게 된 거고.'},
      ];
      this.queue = this.queue.slice(0,this.idx+1).concat(lines, this.queue.slice(this.idx+1));
      document.getElementById('dlg-overlay').classList.add('show');
      this.next();
    });
  },

  complete(key, def){
    Stage.state.metNpc[key] = true;
    if(def.doc){
      if(!Stage.state.docs.includes(def.doc.id)) Stage.state.docs.push(def.doc.id);
      Stage.state.docData[def.doc.id] = def.doc;
      Toast.show(def.doc);
    }
    Stage.save(); Stage.refresh();
    World.paused = false;
    // 한서준 오프닝(공장 사무실) 완료 → 원재료 창고로 순간이동해서 본편 시작.
    // 복귀(엔딩)는 라인→북쪽 계단으로 도보 이동이라 여긴 관여 안 함.
    if(key==='n_han_intro'){
      World.px=11; World.py=11;
      World.checkZone(true);
      World._miniDirty=true;
    }
    // ── P5 연출 이벤트: 구역 클리어 ──
    const docs=Stage.state.docs;
    if(def.doc && def.doc.id==='doc_product') EventFX.recap();                          // ev_flow_recap: 본선 완주(제품창고)
    if(docs.includes('doc_meal') && docs.includes('doc_power'))
      EventFX.fire('ev_support_join','⬆️','보조부문 원가가 라인으로 올라갑니다');          // ev_support_join
    if(docs.includes('doc_oh_rate') && docs.includes('doc_signoff'))
      EventFX.fire('ev_oh_rain','⬇️','제조간접비가 라인으로 배분됩니다');                 // ev_oh_rain
    // ── 한서준 엔딩 대화까지 전부 끝났으면 게임 클리어 화면 ──
    // 첫 클리어는 무조건 광고(있으면) 후 표시, 그 이후 재도전(랭킹 갱신용)은
    // 매번 광고를 띄우면 짜증날 수 있어 2급과 동일하게 전체 스테이지 공유
    // 카운터로 10번에 한 번만(requestInterstitialIfNeeded).
    if(key==='n_han_end'){
      const firstClear = !localStorage.getItem(S1_FIRST_AD_KEY);
      if(firstClear){
        localStorage.setItem(S1_FIRST_AD_KEY,'1');
        showInterstitialAlways(()=>ResultScreen.show());
      } else {
        requestInterstitialIfNeeded(()=>ResultScreen.show());
      }
    }
  },
};
document.getElementById('dlg-panel').addEventListener('click', ()=>Dialog.next());

/* =========================================================================
 *  Quiz — 확인 퀴즈(1~2문항, 표 지원, 오답 재시도)
 * ========================================================================= */
const Quiz = {
  list:[], idx:0, npcKey:null, def:null, answered:false,

  start(npcKey, def){
    this.npcKey=npcKey; this.def=def; this.list=def.quiz; this.idx=0;
    document.getElementById('quiz-overlay').classList.add('show');
    this.render();
  },

  render(){
    this.answered=false;
    const q=this.list[this.idx];
    document.getElementById('quiz-tag').textContent =
      '확인 퀴즈' + (this.list.length>1 ? ' '+(this.idx+1)+'/'+this.list.length : '');
    document.getElementById('quiz-q').textContent=q.q;

    const vEl=document.getElementById('quiz-visual');
    if(q.taccount){
      vEl.innerHTML = taccountQuizSVG(q.taccount.title, q.taccount.left, q.taccount.right);
      vEl.style.display='flex';
    } else {
      vEl.style.display='none';
    }

    const tw=document.getElementById('quiz-table-wrap');
    tw.innerHTML='';
    if(q.table){
      const t=document.createElement('table'); t.className='quiz-table';
      const thead=document.createElement('tr');
      q.table.head.forEach(h=>{ const th=document.createElement('th'); th.textContent=h; thead.appendChild(th); });
      t.appendChild(thead);
      q.table.rows.forEach(r=>{
        const tr=document.createElement('tr');
        r.forEach(c=>{ const td=document.createElement('td'); td.textContent=c; tr.appendChild(td); });
        t.appendChild(tr);
      });
      tw.appendChild(t);
    }

    const opts=document.getElementById('quiz-opts');
    opts.innerHTML='';
    q.opts.forEach((optText,i)=>{
      const b=document.createElement('button');
      b.className='quiz-opt'; b.textContent=(i+1)+'. '+optText;
      b.addEventListener('click', ()=>this.pick(i));
      opts.appendChild(b);
    });
    const fb=document.getElementById('quiz-fb'); fb.className='quiz-fb'; fb.textContent='';
    document.getElementById('quiz-next').classList.remove('show');
  },

  pick(i){
    if(this.answered) return;
    const q=this.list[this.idx];
    const optEls=document.querySelectorAll('#quiz-opts .quiz-opt');
    const fb=document.getElementById('quiz-fb');
    if(i===q.answer){
      this.answered=true;
      optEls[i].classList.add('right');
      optEls.forEach(o=>o.style.pointerEvents='none');
      fb.className='quiz-fb right show'; fb.textContent='✅ '+q.ok;
      document.getElementById('quiz-next').classList.add('show');
    } else {
      optEls[i].classList.add('wrong');
      optEls[i].style.pointerEvents='none';
      fb.className='quiz-fb wrong show'; fb.textContent='❌ '+q.hint;
      // 최종 채점 기준에 반영되는 오답 카운트(§ 게임클리어 스코어링)
      Stage.state.quizWrong = (Stage.state.quizWrong||0) + 1;
      Stage.save();
    }
  },

  next(){
    this.idx++;
    if(this.idx >= this.list.length){
      document.getElementById('quiz-overlay').classList.remove('show');
      Dialog.complete(this.npcKey, this.def);
      return;
    }
    this.render();
  },
};
document.getElementById('quiz-next').addEventListener('click', ()=>Quiz.next());

 *  P5 — 제조원가명세서 최종 미니게임 (기획서 §5-2)
 *  카드를 재료비/노무비/경비/재공품 칸에 분류해 넣고, 판관비 함정 3장은

const BUCKETS = [
  { id:'mat',   label:'Ⅰ 재료비' },
  { id:'lab',   label:'Ⅱ 노무비' },
  { id:'exp',   label:'Ⅲ 경비' },
  { id:'wip',   label:'Ⅴ·Ⅶ 재공품' },
  { id:'sga',   label:'✕ 판매관리비', trash:true },
];

/* sign: +1 가산 / -1 차감. bucket: 정답 칸. why: 오배치 시 한서준의 설명 */
const SHEET_CARDS = [
  { id:'c1',  name:'기초 원재료 재고액',   val:200000,   sign:+1, bucket:'mat',
    why:'창고에 원래 있던 재료도 이번 달에 쓸 수 있는 재료야. 재료비 칸이지.' },
  { id:'c2',  name:'당기 원재료 매입액',   val:4200000,  sign:+1, bucket:'mat',
    why:'이번 달에 사온 재료. 당연히 재료비다.' },
  { id:'c3',  name:'기말 원재료 재고액',   val:300000,   sign:-1, bucket:'mat',
    why:'아직 창고에 남아 있는 건 안 쓴 거야. 재료비에서 빼야지.' },
  { id:'c4',  name:'간접재료비(소모품)',   val:180000,   sign:+1, bucket:'mat',
    why:'오지람 주임이 말했지? 간접재료비도 재료비야. 경비 아니고.' },
  { id:'c5',  name:'직접노무비',           val:2600000,  sign:+1, bucket:'lab',
    why:'제품을 직접 만든 사람 인건비. 노무비 칸이다.' },
  { id:'c6',  name:'간접노무비(감독자 급여)', val:1100000, sign:+1, bucket:'lab',
    why:'서성일 반장 급여. 간접이어도 공장 사람 인건비니까 노무비야.' },
  { id:'c7',  name:'공장 기계 감가상각비', val:1000000,  sign:+1, bucket:'exp',
    why:'재료도 인건비도 아니지. 공장 설비가 닳은 값이니 제조경비다.' },

  { id:'c9',  name:'식당부문 배분액',      val:600000,   sign:+1, bucket:'exp',
    why:'보조부문 원가는 라인으로 올라와서 제조원가가 돼. 경비로 잡는다.' },
  { id:'c10', name:'동력부문 배분액',      val:800000,   sign:+1, bucket:'exp',
    why:'보일러실 몫도 결국 의자에 붙어. 경비 칸이다.' },
  { id:'c11', name:'기초 재공품 재고액',   val:500000,   sign:+1, bucket:'wip',
    why:'지난달에 만들다 만 것. 당기총제조비용에 더해서 합계를 낸다.' },
  { id:'c12', name:'기말 재공품 재고액',   val:800000,   sign:-1, bucket:'wip',

  { id:'t1',  name:'본사 영업부 급여',     val:1500000,  sign:+1, bucket:'sga', trap:true,
    why:'본사 영업부는 공장이 아니야. 판매비와관리비지 제조원가가 아니다.' },
  { id:'t2',  name:'본사 건물 감가상각비', val:400000,   sign:+1, bucket:'sga', trap:true,
    why:'같은 감가상각비라도 공장 것만 제조경비야. 본사 건물은 판관비.' },
