<script>
// 로그인 체크
(function(){
  var nick = (localStorage.getItem('hub_nickname')||'').trim();
  if(!nick){ location.replace('login.html'); return; }
  document.getElementById('who').textContent = nick + "'s Missed Questions";
})();

var ITEMS = [];
var _openGroups = {};   // { gameKey: true } — 펼쳐진 게임 그룹(재렌더돼도 유지)

function toggleGroup(g){
  _openGroups[g] = !_openGroups[g];
  var title = document.querySelector('.grp-title[onclick="toggleGroup(\''+g+'\')"]');
  var body = document.getElementById('grp-'+g);
  if (title) title.classList.toggle('open', _openGroups[g]);
  if (body) body.classList.toggle('open', _openGroups[g]);
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* 문제 본문(q)은 게임이 만든 강조 태그를 포함한다: <b class="target-account">계정과목</b>, <br>.
   그런데 오답노트는 Supabase(wrong_answers)에서도 읽어오고 그 테이블은 anon insert 가 열려 있어서,
   q_text 에 임의 HTML 이 들어올 수 있다 → 그대로 innerHTML 하면 저장형 XSS 가 된다.
   그래서 "전부 이스케이프한 뒤 알려진 강조 태그만 되살리는" 화이트리스트 방식으로 처리한다.
   (허용 목록에 없는 태그·속성은 전부 문자로 남아 실행되지 않는다) */
function safeQ(s){
  return esc(s)
    .replace(/&lt;b class=&quot;target-account&quot;&gt;/g, '<b class="target-account">')
    .replace(/&lt;b&gt;/g, '<b>')
    .replace(/&lt;\/b&gt;/g, '</b>')
    .replace(/&lt;br\s*\/?&gt;/g, '<br>');
}

/* onclick="fn('...')" 안에 넣을 문자열 — JS 이스케이프를 먼저 하고 HTML 이스케이프를 나중에 한다.
   (순서를 뒤집으면 esc 가 만든 &#39; 를 HTML 파서가 ' 로 되돌려 JS 문자열이 깨진다) */
function jsAttr(s){ return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }

function gameName(g){ return (WrongNote.GAME_NAMES[g]||g); }
// game_id 는 wrong_answers(anon insert 열림)에서 오는 값이라 임의 문자열이 들어올 수 있다.
// onclick/id 속성에 그대로 넣으면 속성 브레이크아웃 XSS 가 되므로, DOM 용 키는 영숫자/밑줄로만 정규화한다.
// (표시 텍스트는 esc(gameName())로 별도 처리되고, 목록은 본인 오답만 보여주지만 user_name 이 인증값이 아니라
//  공격자가 피해자 닉네임으로 행을 심을 수 있어 교차 사용자 저장형 XSS 가 가능 → 반드시 막는다)
function domKey(g){ return String(g==null?'':g).replace(/[^a-z0-9_]/gi,'_'); }

async function load(){
  ITEMS = await WrongNote.list();
  render();
}

function render(){
  var box = document.getElementById('content');
  if(!ITEMS.length){
    box.innerHTML = bossPanel() + '<div class="empty"><span class="em">🎉</span>'+
      'No wrong answers saved.<br>Questions you miss in games collect here automatically.</div>';
    return;
  }
  var s = WrongNote.summarize(ITEMS);

  // 약점 패널 (게임별 + 유형별 빈도 막대)
  var maxG = Math.max.apply(null, Object.values(s.byGame));
  var gameBars = Object.keys(s.byGame).sort(function(a,b){return s.byGame[b]-s.byGame[a];})
    .map(function(g){ return bar(gameName(g), s.byGame[g], maxG); }).join('');

  var typeKeys = Object.keys(s.byType).sort(function(a,b){return s.byType[b]-s.byType[a];}).slice(0,8);
  var maxT = typeKeys.length ? Math.max.apply(null, typeKeys.map(function(t){return s.byType[t];})) : 1;
  var typeBars = typeKeys.map(function(t){ return bar(t, s.byType[t], maxT); }).join('');

  var html = bossPanel() +
    '<div class="panel">'+
      '<div class="bigstat"><b>'+s.total+'</b> wrong answer'+(s.total===1?'':'s')+' · '+ITEMS.length+' question'+(ITEMS.length===1?'':'s')+'</div>'+
      '<button class="cta" onclick="startQuiz()">▶ Retry Missed Questions</button>'+
    '</div>'+
    '<div class="panel"><h2>🎯 Weak Spots by Game</h2>'+gameBars+'</div>'+
    (typeBars ? '<div class="panel"><h2>🔍 Weak Spots by Type</h2>'+typeBars+'</div>' : '');

  // 게임별 목록 — 문제 많은(약한) 게임이 위로, 접기/펼치기
  var byGame = {};
  ITEMS.forEach(function(r){ (byGame[r.game]=byGame[r.game]||[]).push(r); });
  Object.keys(byGame).sort(function(a,b){ return byGame[b].length - byGame[a].length; }).forEach(function(g){
    var dk = domKey(g);
    var isOpen = _openGroups[dk];
    html += '<div class="grp-title'+(isOpen?' open':'')+'" onclick="toggleGroup(\''+dk+'\')">'+
              '<span>'+esc(gameName(g))+' · '+byGame[g].length+' question'+(byGame[g].length===1?'':'s')+'</span>'+
              '<span class="chev">▸</span>'+
            '</div>'+
            '<div class="grp-body'+(isOpen?' open':'')+'" id="grp-'+dk+'">';
    byGame[g].forEach(function(r){
      html +=
        '<div class="item">'+
          '<div class="q">'+safeQ(r.q)+'</div>'+
          '<div class="meta">'+
            '<span class="pill ok">Correct: '+esc(r.correct)+'</span>'+
            (r.wrong ? '<span class="pill no">Your answer: '+esc(r.wrong)+'</span>' : '')+
            (r.count>1 ? '<span class="pill cnt">'+r.count+'x</span>' : '')+
          '</div>'+
        '</div>';
    });
    html += '</div>';
  });

  html += '<span class="clear-link" onclick="wipe()">Clear All Review Notes</span>';
  box.innerHTML = html;
}

/* 숨은 보스 '감사관' 띠 — 정복 수·정복률, 열리면 도전 버튼 */
function bossPanel(){
  if(!window.Boss) return '';
  var st = Boss.state(ITEMS.length), C = Boss.CONFIG;
  var pct = Math.round(st.rate*100), need = Math.round(C.RATE*100);
  if(!st.open){
    return '<div class="boss"><h2>The Auditor Is Coming to Check Your Books</h2>'+
      '<p>Retry and master the questions you missed, and a hidden opponent will appear.</p>'+
      '<div class="gauge"><span class="'+(st.n>=C.NEED?'done':'')+'">Mastered '+Math.min(st.n,C.NEED)+'/'+C.NEED+'</span>'+
      '<span class="'+(pct>=need?'done':'')+'">Mastery '+pct+'%/'+need+'%</span></div></div>';
  }
  return '<div class="boss open"><h2>The Auditor Has Arrived!</h2>'+
    '<p>Face a year-end audit made from your own missed questions. Get '+C.WIN+' of '+C.QN+' right to pass. You have '+C.LIVES+' chances.</p>'+
    (st.won ? '<div class="title">Title · '+esc(st.title)+(st.best?' · Best '+st.best+'/'+C.QN:'')+'</div>' : '')+
    '<button class="cta" onclick="startBoss()">Take the Audit</button></div>';
}

function bar(label, val, max){
  var pct = max>0 ? Math.round(val/max*100) : 0;
  return '<div class="bar-row"><div class="bar-label">'+esc(label)+'</div>'+
         '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
         '<div class="bar-num">'+val+'</div></div>';
}

async function wipe(){
  // Android WebView는 confirm()이 무동작(항상 false) → 2-스텝 버튼으로 확인
  var link = document.querySelector('.clear-link');
  if (link && link.dataset.armed !== '1') {
    link.dataset.armed = '1';
    link.textContent = '⚠️ Tap again to clear everything (cannot be undone)';
    link.style.color = '#ff2d78';
    setTimeout(function(){
      if (!link.isConnected) return;
      link.dataset.armed = '';
      link.textContent = 'Clear All Review Notes';
      link.style.color = '';
    }, 4000);
    return;
  }
  await WrongNote.clearAll();
  await load();
}

var QUEUE=[], qi=0, solved=0;

var _doneLogged = false;
function startQuiz(){
    if (window.DayLog) DayLog.hit('act', 'review', 'start');   // 시작 횟수(끝까지 한 판은 Growth.logPlay → 'finish')
  QUEUE = ITEMS.slice();
  // 섞기
  for(var i=QUEUE.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=QUEUE[i];QUEUE[i]=QUEUE[j];QUEUE[j]=t; }
  qi=0; solved=0; _doneLogged=false;
  document.getElementById('home').style.display='none';
  document.getElementById('quiz').style.display='block';
  showQ();
}

function exitQuiz(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('home').style.display='block';
  load();
}

function showQ(){
  var prog = document.getElementById('quiz-progress');
  var body = document.getElementById('quiz-body');
  if(qi >= QUEUE.length){
    // 끝까지 푼 판 — 분석에 '다시 풀기 시작 28·끝 0'으로 보이던 것(2026-10-13 분석팀). 판수(play_events)엔 안 넣고 하루 합계만.
    if (window.DayLog && !_doneLogged) { _doneLogged = true; DayLog.hit('act', 'review', 'finish'); }
    prog.textContent='';
    body.innerHTML = '<div class="quiz-card quiz-done"><span class="em">🏁</span>'+
      '<div style="font-size:1.1rem;margin-bottom:6px;">Review complete!</div>'+
      '<div style="color:var(--dim);font-size:.9rem;">You got '+solved+' right and cleared '+(solved===1?'it':'them')+' from Review Notes.</div>'+
      '<button class="cta" style="margin-top:20px;" onclick="exitQuiz()">Back to Review Notes</button></div>';
    return;
  }
  var r = QUEUE[qi];
  prog.textContent = (qi+1)+' / '+QUEUE.length;

  if(r.wrong){
    // 2지선다: 정답 vs 내가 고른 오답
    var opts = Math.random()<0.5 ? [r.correct, r.wrong] : [r.wrong, r.correct];
    body.innerHTML =
      '<div class="quiz-card">'+
        '<div class="quiz-tag">'+esc(gameName(r.game))+(r.type?' · '+esc(r.type):'')+'</div>'+
        '<div class="quiz-q">'+safeQ(r.q)+'</div>'+
        '<button class="choice" data-v="'+esc(opts[0])+'">'+esc(opts[0])+'</button>'+
        '<button class="choice" data-v="'+esc(opts[1])+'">'+esc(opts[1])+'</button>'+
        '<div class="quiz-next"><button class="cta" onclick="nextQ()">Next →</button></div>'+
      '</div>';
    var btns = body.querySelectorAll('.choice');
    btns.forEach(function(b){ b.onclick = function(){ pick(b, r, btns); }; });
  } else {
    // 플래시카드(메모리 등): 뜻 보여주고 외웠으면 완료
    body.innerHTML =
      '<div class="quiz-card flashcard">'+
        '<div class="quiz-tag">'+esc(gameName(r.game))+(r.type?' · '+esc(r.type):'')+'</div>'+
        '<div class="quiz-q">'+safeQ(r.q)+'</div>'+
        '<button class="choice" onclick="this.nextElementSibling.style.display=\'block\';this.style.display=\'none\'">👀 Show Answer</button>'+
        '<div class="reveal">'+esc(r.correct)+'</div>'+
        '<div class="quiz-foot">'+
          '<button class="keep" onclick="nextQ()">Still Unsure</button>'+
          '<button onclick="solveCard(\''+jsAttr(r.game)+'\',\''+jsAttr(r.key)+'\')">Got It ✓</button>'+
        '</div>'+
      '</div>';
  }
}

async function pick(btn, r, btns){
  btns.forEach(function(b){ b.disabled=true; });
  var chosen = btn.getAttribute('data-v');
  if(chosen === String(r.correct)){
    btn.classList.add('correct');
    solved++;
    if (window.Boss) Boss.conquer(r);           // 정복 기록(숨은 보스 '감사관' 열기용)
    await WrongNote.resolve(r.game, r.key);   // 맞히면 오답노트에서 제거
  } else {
    btn.classList.add('wrong');
    btns.forEach(function(b){ if(b.getAttribute('data-v')===String(r.correct)) b.classList.add('correct'); });
  }
  document.querySelector('.quiz-next').style.display='block';
}

async function solveCard(game, key){
  solved++;
  if (window.Boss) { var _r = QUEUE.find(function(x){ return x.game===game && String(x.key)===String(key); }); if (_r) Boss.conquer(_r); }
  await WrongNote.resolve(game, key);
  nextQ();
}

function nextQ(){ qi++; showQ(); }

/* ───────── 숨은 보스 '감사관' 모드(오답노트 화면 안) ───────── */
var BQ = [], bi = 0, bOk = 0, bLives = 0;
function startBoss(){
  if(!window.Boss) return;
  BQ = Boss.build(ITEMS); bi = 0; bOk = 0; bLives = Boss.CONFIG.LIVES;
  if(!BQ.length) return;
  if (window.DayLog) DayLog.hit('act', 'boss', 'start');
  document.getElementById('home').style.display='none';
  document.getElementById('quiz').style.display='block';
  showBoss();
}
function showBoss(){
  var prog = document.getElementById('quiz-progress'), body = document.getElementById('quiz-body');
  if(bi >= BQ.length || bLives <= 0){ return endBoss(); }
  var q = BQ[bi];
  prog.textContent = '';
  body.innerHTML =
    '<div class="quiz-card">'+
      '<div class="boss-hud"><span>Auditor · '+(bi+1)+' / '+BQ.length+'</span><span>Correct <b>'+bOk+'</b> · Chances Left <b>'+bLives+'</b></span></div>'+
      '<div class="quiz-tag">'+esc(gameName(q.game))+(q.type?' · '+esc(q.type):'')+'</div>'+
      '<div class="quiz-q">'+safeQ(q.q)+'</div>'+
      q.options.map(function(o){ return '<button class="choice" data-v="'+esc(o)+'">'+esc(o)+'</button>'; }).join('')+
      '<div class="quiz-next"><button class="cta" onclick="bi++;showBoss()">Next →</button></div>'+
    '</div>';
  var btns = body.querySelectorAll('.choice');
  btns.forEach(function(b){ b.onclick = function(){
    btns.forEach(function(x){ x.disabled = true; });
    if(b.getAttribute('data-v') === q.correct){ b.classList.add('correct'); bOk++; }
    else { b.classList.add('wrong'); bLives--; btns.forEach(function(x){ if(x.getAttribute('data-v')===q.correct) x.classList.add('correct'); }); }
    document.querySelector('.quiz-next').style.display='block';
  }; });
}
function endBoss(){
  var C = Boss.CONFIG, res = Boss.finish(bOk, BQ.length), body = document.getElementById('quiz-body');
  if (window.DayLog) DayLog.hit('act', 'boss', res.win ? 'win' : 'lose');
  document.getElementById('quiz-progress').textContent = '';
  body.innerHTML = res.win
    ? '<div class="quiz-card quiz-done"><div style="font-size:1.15rem;margin-bottom:8px;">Audit Passed!</div>'+
      '<div style="color:var(--gold);margin-bottom:6px;">Title \u2018'+esc(res.title)+'\u2019 '+(res.firstWin?'earned':'kept')+'</div>'+
      '<div style="color:var(--dim);font-size:.9rem;">'+bOk+' of '+BQ.length+' correct · Best '+res.best+'</div>'+
      '<button class="cta" style="margin-top:20px;" onclick="exitQuiz()">Back to Review Notes</button></div>'
    : '<div class="quiz-card quiz-done"><div style="font-size:1.1rem;margin-bottom:8px;">Audit findings: '+(C.LIVES - Math.max(0,bLives))+'...</div>'+
      '<div style="color:var(--dim);font-size:.9rem;">'+bOk+' correct ('+C.WIN+' needed). Master a few more Review Notes, then come back.</div>'+
      '<button class="cta" style="margin-top:20px;" onclick="startBoss()">Try Again</button>'+
      '<button class="keep" style="margin-top:10px;display:block;width:100%;" onclick="exitQuiz()">Back to Review Notes</button></div>';
}

load();
</script>
