<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://pjagaulfivafamhhiveg.supabase.co https://cdn.jsdelivr.net;">
<!-- 저장소가 막힌 환경(프라이빗 브라우징·사이트데이터 차단)에서도 게임이 돌아가게 한다.
     **반드시 다른 스크립트보다 먼저** 로드돼야 한다 — 2026-09-16 검토에서
     이게 없으면 게임 5종이 시작조차 안 되는 것을 확인했다. -->
<script src="safestore.js?v=21"></script>
<title>배관의 방(보조부문원가 배분) | 전산회계 1급</title>
<meta name="description" content="파이프 밸브를 잠그고 열며 직접배분법·단계배분법·상호배분법의 차이를 몸으로 익히는 연습">
<style>
  :root{
    /* 앱 하단 광고 배너가 가릴 수 있는 최대 높이 — 게임 5종·전표의 눈과 같은 값(2026-09-15).
       시작화면이 길어지면서 맨 아래 버튼이 배너에 가렸다(layout 테스트 34px). */
    --ad-reserve: 96px;
    --bg:#020810; --card:#0c1626; --card2:#11203a; --line:rgba(255,255,255,.08);
    --blue:#00f2ff; --purple:#b44fff; --green:#2ecc71; --red:#ff2d78; --gold:#ffd24a;
    --pipe-on:#00f2ff; --pipe-off:#3a4658;
    --txt:#eaf2ff; --dim:rgba(234,242,255,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  
  /* 본문 글꼴은 전 게임 공통으로 Noto Sans KR 이 먼저다(2026-09-15).
     전엔 -apple-system 이 앞이라 **웹폰트를 불러놓고도 iOS 에선 애플 기본 글꼴**이
     나왔다 — 게임 5종·원가의 길과 글자 모양이 달라 보이던 이유다.
     시스템 글꼴은 뒤에 남겨 웹폰트가 늦거나 막혀도 한글이 깨지지 않게 한다. */
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       padding:0 0 40px; min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;}
  /* 하단 여백은 padding 이 아니라 ::after 스페이서로 — iOS WKWebView 가 padding-bottom 을
     스크롤 영역에 안 넣어 주는 경우가 있다(게임 5종에서 먼저 겪음). */
  .wrap::after{content:'';display:block;width:100%;
    height:calc(env(safe-area-inset-bottom, 0px) + max(var(--ad-banner-h, 0px), var(--ad-safe-h, 0px), var(--ad-reserve)));}
  @media (min-width:701px){
    body{background:
      radial-gradient(ellipse 50% 40% at 12% 10%, rgba(180,79,255,0.07), transparent 60%),
      radial-gradient(ellipse 45% 35% at 90% 90%, rgba(0,242,255,0.06), transparent 55%),
      var(--bg);
      display:flex; flex-direction:column; justify-content:center;}
    .wrap{padding-top:16px;max-width:820px;width:100%;}
  }
  .top{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .back{background:var(--card);border:1px solid var(--line);color:var(--txt);
        border-radius:12px;padding:9px 13px;font-size:.92rem;text-decoration:none;flex:none;}
  h1{font-size:1.15rem;margin:0;}
  h1 .sub{display:block;font-size:.72rem;color:var(--dim);font-weight:500;margin-top:3px;}

  .example-card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
  .example-card .ex-label{font-size:.72rem;color:var(--dim);letter-spacing:.1em;margin-bottom:6px;}
  .example-card .ex-stem{font-size:.94rem;line-height:1.55;word-break:keep-all;}
  .example-card .ex-ans{font-size:.82rem;color:var(--dim);margin-top:8px;}
  /* ── 시작화면(2급 게임과 같은 구성, 2026-09-15 UI 통일) ─────────────────── */
  .home-title{font-family:'Black Han Sans','Noto Sans KR',sans-serif;
    font-size:clamp(1.7rem,7vw,2.4rem);color:var(--gold);text-align:center;
    margin:8px 0 6px;text-shadow:0 0 18px rgba(255,214,0,.25);}
  .home-sub{font-size:.82rem;color:var(--dim);text-align:center;margin-bottom:18px;line-height:1.6;word-break:keep-all;}
  .start-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0 4px;}
  @media (min-width:520px){ .start-grid{grid-template-columns:1fr 1fr 1fr;} }
  .info-card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:.8rem;color:var(--dim);line-height:1.65;}
  .info-card strong{display:block;color:var(--txt);font-size:.9rem;margin-bottom:5px;}
  .home-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  /* 시작화면에서는 상단 바를 감춘다 — 아직 시작도 안 했는데 TIME·'그만' 이 보이고,
     상단 바 이름과 본문 큰 제목이 같은 이름을 두 번 보여 줬다(2026-09-16 UI 통일).
     2급 게임 5종은 시작화면이 전체를 덮어 원래 이렇게 보인다.
     '다시 하기' 는 location.reload() 라 이 상태가 저절로 되돌아온다. */
  body.home-mode .top { display: none; }

  .pill-btn{display:block;width:100%;border:none;border-radius:50px;padding:15px;min-height:52px;
    font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:1.05rem;cursor:pointer;color:#021;
    background:linear-gradient(90deg,var(--blue),var(--green));}
  .pill-btn:disabled{opacity:.45;} .pill-btn:active{transform:scale(.98);}
  .btn-hub{display:block;width:100%;border:1.5px solid var(--line);border-radius:50px;padding:14px;min-height:52px;
    font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:1rem;color:var(--dim);background:var(--card2);cursor:pointer;}
  .btn-hub:active{transform:scale(.98);}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .panel h2{font-size:.92rem;margin:0 0 10px;color:var(--blue);}
  .panel p{font-size:.88rem;line-height:1.65;color:var(--dim);margin:0 0 8px;}
  .cta{display:block;width:100%;border:none;border-radius:14px;padding:15px;
       font-size:1.05rem;font-weight:700;color:#021;cursor:pointer;
       background:linear-gradient(90deg,var(--blue),var(--purple));margin-top:8px;}
  .cta:disabled{opacity:.45;}
  .guide-btn{display:block;width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;
    font-size:.9rem;font-weight:600;color:var(--dim);background:var(--card2);cursor:pointer;margin-top:8px;text-align:center;}

  #quiz{display:none;}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--dim);margin-bottom:10px;}
  .hud b{color:var(--gold);}
  .progress-track{height:6px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;margin-bottom:14px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .3s;}

  .round-badge{display:inline-block;font-family:ui-monospace,monospace;font-weight:700;font-size:.7rem;
    letter-spacing:.03em;padding:4px 10px;border-radius:6px;background:rgba(180,79,255,.15);color:var(--purple);
    border:1px solid rgba(180,79,255,.3);margin-bottom:10px;}
  .round-title{font-size:1.02rem;font-weight:700;margin-bottom:6px;}
  .round-desc{font-size:.86rem;color:var(--dim);line-height:1.6;margin-bottom:14px;word-break:keep-all;}

  /* ── 배관도(SVG) ─────────────────────────────────────────────────────
     2026-09-15 사용자 지적: "칸 크기가 다르니까 헷갈려. 동력부 내에서 수선부,
     절단부, 조립부 모두 똑같아야지. (…) 상자와 상자를 연결하는 파이프를 만들어서
     그걸 잠그거나 여는 식의 ui를 만들어야 이쁘지. 다시 기획해봐."

     전에는 밸브가 .pipe-row{flex-wrap} 안의 카드 3장이라, 폭이 좁으면 2장+1장으로
     접혀서 세 번째만 가로로 길어졌다("칸 크기가 다르다"). "파이프"라면서 실제
     그림은 왼쪽 점선 세로줄 하나뿐이라 어디서 어디로 흐르는지도 안 보였다.

     이제 **상자도 파이프도 SVG 한 장** 안에 있다. viewBox 가 통째로 늘어나므로
     화면 폭이 어떻든 네 상자는 **항상 같은 크기**고 접히지 않는다. 밸브는
     파이프 한가운데 놓인 동그란 손잡이다. 설계는 docs/배관의_방_재기획.md 참고. */
  .plant{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:12px 10px;margin-bottom:14px;}
  .plant svg{display:block;width:100%;height:auto;}

  .dept-box{fill:var(--card2);stroke:var(--line);stroke-width:1.2;}
  .dept-box.support{stroke:rgba(180,79,255,.45);}
  .dept-box.making{stroke:rgba(46,204,113,.4);}
  .dept-name{fill:var(--txt);font-size:13px;font-weight:700;text-anchor:middle;
    font-family:'Black Han Sans','Noto Sans KR',sans-serif;}
  .dept-amt{fill:var(--gold);font-size:11.5px;text-anchor:middle;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;}
  .dept-amt.zero{fill:rgba(255,255,255,.25);}
  .dept-amt.up{fill:var(--green);}

  /* 파이프는 두 겹이다: 굵은 몸통(.pipe) 위에 흐르는 점선(.flow) */
  .pipe{fill:none;stroke:var(--pipe-off);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;
    transition:stroke .25s;}
  .pipe.on{stroke:rgba(0,242,255,.22);}
  .pipe.off{stroke:rgba(255,255,255,.10);stroke-dasharray:4 7;stroke-width:4;}
  .flow{fill:none;stroke:var(--pipe-on);stroke-width:3.2;stroke-linecap:round;
    stroke-dasharray:5 13;animation:pipeFlow 1.1s linear infinite;}
  @keyframes pipeFlow{ to{ stroke-dashoffset:-18; } }
  .flow.hidden{display:none;}

  /* 흐름 방향 화살표 — 동력부→수선부와 수선부→동력부를 눈으로 구분하게 한다 */
  .arrow{transition:fill .25s;}
  .arrow.on{fill:var(--pipe-on);}
  .arrow.off{fill:rgba(255,255,255,.18);}

  .pct-label{fill:var(--dim);font-size:9.5px;text-anchor:middle;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .pct-label.on{fill:var(--blue);}
  .pct-label.off{fill:rgba(255,255,255,.28);}

  /* 밸브 — 전부 같은 지름. 손가락이 닿는 투명 원(.vhit)을 따로 둬 44px 을 확보한다.
     360px 화면에서 SVG 가 약 0.85 배로 줄므로 viewBox 지름 52 가 실제 44px 이다.
     밸브끼리 이 원이 겹치면 옆 것이 눌리므로 (vx,vy) 를 최소 52 이상 떼어 놓았다. */
  .valve-g{cursor:pointer;}
  .valve-g.fixed{cursor:default;}
  .vhit{fill:transparent;}
  .vbody{fill:var(--card);stroke:var(--pipe-off);stroke-width:2;transition:stroke .2s,fill .2s;}
  .valve-g.open .vbody{stroke:var(--pipe-on);fill:rgba(0,242,255,.12);}
  .valve-g.closed .vbody{stroke:var(--red);fill:rgba(255,45,120,.10);}
  .valve-g.fixed .vbody{stroke:rgba(46,204,113,.5);fill:rgba(46,204,113,.08);}
  /* 손잡이: 열리면 파이프와 나란히(0°), 잠그면 90° 돌아간다 */
  .vhandle{stroke:var(--pipe-on);stroke-width:3;stroke-linecap:round;
    transition:transform .3s cubic-bezier(.4,1.4,.5,1);transform-box:fill-box;transform-origin:center;}
  .valve-g.closed .vhandle{stroke:var(--red);transform:rotate(90deg);}
  .vlock{fill:rgba(46,204,113,.75);font-size:11px;text-anchor:middle;}
  .valve-g.shake{animation:vShake .4s;}
  @keyframes vShake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)}
                     75%{transform:translateX(3px)} }

  .hint-box{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,210,74,.08);
    border:1px solid rgba(255,210,74,.25);font-size:.84rem;color:var(--gold);line-height:1.55;display:none;}
  .hint-box.show{display:block;}
  .ok-box{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(46,204,113,.1);
    border:1px solid rgba(46,204,113,.3);font-size:.86rem;color:var(--green);line-height:1.55;display:none;font-weight:700;}
  .ok-box.show{display:block;}

  .ref-box{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:rgba(0,242,255,.06);
    border:1px solid rgba(0,242,255,.22);font-size:.82rem;color:#dff;line-height:1.7;}
  .ref-box b{color:var(--cy,#00f2ff);}

  .qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;}
  .qstem{font-size:1.0rem;line-height:1.7;word-break:keep-all;margin-bottom:14px;white-space:pre-line;}
  /* 식에 들어가는 빈칸 네모 */
  .qstem .blank{display:inline-block;min-width:2.2em;text-align:center;border-bottom:2px solid var(--gold);color:var(--gold);}
  .opt-grid{display:grid;gap:9px;}
  .opt{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;
    text-align:left;cursor:pointer;transition:.12s;color:var(--txt);font-size:.92rem;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.65;white-space:pre-line;}
  .opt:active{transform:scale(.98);}
  .opt[disabled]{cursor:default;}
  .opt.correct{border-color:var(--green);background:rgba(46,204,113,.18);}
  .opt.wrong{border-color:var(--red);background:rgba(255,45,120,.18);}
  .opt.dim{opacity:.35;}

  .expl{margin-top:14px;padding:14px;border-radius:13px;background:rgba(0,242,255,.07);
        border:1px solid rgba(0,242,255,.22);font-size:.88rem;line-height:1.6;display:none;}
  .expl .verdict{font-weight:700;margin-bottom:6px;font-size:.96rem;}
  .next-wrap{margin-top:14px;}

  #result{display:none;text-align:center;}
  #result .em{font-size:3rem;display:block;margin:8px 0;}
  #result .score{font-size:2.4rem;color:var(--gold);font-weight:800;}
  #result .grade{font-size:1.1rem;margin:6px 0 2px;}
  .res-row{display:flex;justify-content:space-around;margin:18px 0;font-size:.9rem;}
  .res-row .v{font-size:1.4rem;font-weight:700;display:block;}
  .res-note{font-size:.82rem;color:var(--dim);margin-bottom:18px;}
  /* 결과화면 버튼 — 2급 게임 5종의 BTNUNI 규격과 같게(2026-09-15, "UI 통일성 있어야 한다니까").
     한 줄에 하나씩, 폭 꽉 차게, 높이 52px, 알약 모양. 가로 2열이던 것을 세로로. */
  .btn-row{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px;}
  .btn-row a,.btn-row button{width:100%;box-sizing:border-box;min-height:52px;border-radius:50px;padding:13px 20px;
      font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:clamp(1rem,3.6vw,1.15rem);font-weight:600;
      display:flex;align-items:center;justify-content:center;gap:8px;
      border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;text-decoration:none;text-align:center;}
  .btn-row .primary{border:none;background:linear-gradient(90deg,var(--blue),var(--purple));color:#021;}
  .review-link{display:block;margin-top:10px;font-size:.84rem;color:var(--gold);text-decoration:none;}

  /* ── 게임 방법 튜토리얼 ── */
  .tut{display:none;position:fixed;inset:0;z-index:9999;flex-direction:column;background:var(--bg);}
  .tut.show{display:flex;animation:tutPop .25s ease;}
  @keyframes tutPop{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
  .tut-top{display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;}
  .tut-top .tt-title{font-weight:800;font-size:1.05rem;color:#fff;}
  .tut-top .tt-badge{font-size:.8rem;font-weight:800;color:#fff;background:var(--purple);border-radius:50px;padding:3px 12px;}
  .tut-top .tt-skip{margin-left:auto;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.75);
    border-radius:50px;padding:6px 14px;font-size:.8rem;cursor:pointer;}
  .tut-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:6px 16px 0;overflow-y:auto;}
  .tut-stage .plant{width:100%;max-width:480px;}
  /* 튜토리얼에서 눌러야 할 밸브를 금빛으로 가리킨다 */
  .tut .valve-g.tut-target .vbody{stroke:var(--gold);stroke-width:2.6;}
  .tut .valve-g.tut-target{animation:tutGlow 1s ease-in-out infinite;}
  @keyframes tutGlow{0%,100%{box-shadow:0 0 0 3px rgba(255,210,74,.4);}50%{box-shadow:0 0 0 7px rgba(255,210,74,.12);}}
  .tut-bubble{background:rgba(0,0,0,.35);border-top:1px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom));}
  .tut-bubble-text{font-size:.98rem;line-height:1.6;color:#e0e6ed;word-break:keep-all;text-align:center;}
  .tut-bubble-text b{color:var(--blue);}
  .tut-hint{text-align:center;font-weight:800;color:var(--gold);font-size:.92rem;margin-top:8px;}
  .tut-next{display:block;width:100%;margin-top:14px;padding:15px;border-radius:14px;border:2px solid rgba(255,255,255,.3);
    background:transparent;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;}

  /* ── TOP 랭킹(결과화면) ── */
  .rank-title{font-size:.72rem;color:rgba(255,255,255,.35);letter-spacing:2px;margin:18px 0 8px;text-align:center;}
  #my-rank-badge{display:none;font-size:.82rem;color:var(--blue);background:rgba(0,242,255,.1);border:1px solid rgba(0,242,255,.3);
    border-radius:50px;padding:6px 16px;margin:18px auto 8px;   /* 위 18px: 버튼에 바짝 붙어 있던 것을 띄움(2026-09-15 제보) */
    text-align:center;max-width:max-content;}
  #rank-box{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;max-height:180px;overflow-y:auto;padding:4px 0;text-align:left;}
  .rr-row{display:grid;grid-template-columns:34px 1fr 70px;gap:6px;padding:8px 12px;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.05);align-items:center;}
  .rr-row:last-child{border-bottom:none;}
  .rr-row.me{background:rgba(0,242,255,.08);}
  .rr-num{color:rgba(255,255,255,.35);font-weight:700;}
  .rr-name{color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* =========================================================================
 *  보조부문원가 배분 데이터 — 검산 완료.
 *  동력부 800,000원(수선부20%/절단부60%/조립부20%), 수선부 600,000원(동력부20%/절단부20%/조립부60%)
 *  직접배분법: 절단부 750,000 / 조립부 650,000 (합 1,400,000 = 원가 총액과 일치)
 *  단계배분법(동력부 먼저): 수선부 총액 760,000 → 절단부 670,000 / 조립부 730,000 (합 1,400,000)
 *  나누는 값이 3/4 아니면 1/4 뿐이라 전부 암산으로 풀린다(2026-09-16).
 * ========================================================================= */
/* 2026-09-16 사용자 지시: "원리만 알면 되게끔 계산은 엄청 간단하게 만들어줘.
   계산이 복잡하니까 암산으로는 못 풀겠어."
   전에는 900,000×(50/80)=562,500 처럼 암산이 불가능했다. 제조부문 비율을
   60:20 / 20:60 으로 맞춰 **나누는 값이 언제나 3/4 아니면 1/4** 이 되게 했다.
   두 보조부문의 제조부문 비율을 서로 뒤집어 놓은 이유는, 그래야 직접배분법과
   단계배분법의 답이 달라져서 "방법이 다르면 배분액도 달라진다"를 보여 줄 수 있다.
   (비율이 같으면 어떤 방법을 써도 결과가 똑같아 배울 것이 없다.) */
/* 비율은 **정수 퍼센트**로 둔다. 0.60 같은 소수로 두면 2진수로 딱 떨어지지 않아
   800,000×(0.60/0.80) 이 599,999.9999… 로 나온다. 화면은 Math.round 로 가려지지만
   합계 검증이 어긋나므로 처음부터 정수로 계산한다(2026-09-16). */
const DATA = {
  power:  { name:'동력부', cost:800000, to:{ repair:20, cut:60, assemble:20 } },
  repair: { name:'수선부', cost:600000, to:{ power:20,  cut:20, assemble:60 } },
};
const won = n => n.toLocaleString()+'원';

function directMethod(){
  const p=DATA.power.to, r=DATA.repair.to;
  const pSum=p.cut+p.assemble, rSum=r.cut+r.assemble;
  const powerToCut=DATA.power.cost*(p.cut/pSum), powerToAssemble=DATA.power.cost*(p.assemble/pSum);
  const repairToCut=DATA.repair.cost*(r.cut/rSum), repairToAssemble=DATA.repair.cost*(r.assemble/rSum);
  return { powerToCut, powerToAssemble, repairToCut, repairToAssemble,
           cut:powerToCut+repairToCut, assemble:powerToAssemble+repairToAssemble };
}
function stepMethod(){
  // 동력부가 먼저 배분(원래 비율 그대로, 수선부 포함) → 수선부는 그다음 배분(동력부로는 못 감, 제조부문에만)
  const power=DATA.power, repair=DATA.repair;
  const powerToRepair=power.cost*power.to.repair/100, powerToCut=power.cost*power.to.cut/100, powerToAssemble=power.cost*power.to.assemble/100;
  const repairTotal=repair.cost+powerToRepair;
  const rSum=repair.to.cut+repair.to.assemble;
  const repairToCut=repairTotal*(repair.to.cut/rSum), repairToAssemble=repairTotal*(repair.to.assemble/rSum);
  return { powerToRepair, powerToCut, powerToAssemble, repairTotal, repairToCut, repairToAssemble,
           cut:powerToCut+repairToCut, assemble:powerToAssemble+repairToAssemble };
}
const D = directMethod(), S = stepMethod();
// 자체 검산(총원가 불변 확인) — 어긋나면 콘솔에 바로 드러나게
console.assert(Math.round(D.cut+D.assemble)===1500000, '직접배분법 합계 오류', D);
console.assert(Math.round(S.cut+S.assemble)===1500000, '단계배분법 합계 오류', S);

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

      expl:`상호배분법은 보조부문끼리 주고받는 걸 <b>완전히</b> 반영해서 가장 정확해요. 다만 계산이 복잡해서(연립방정식) 실제 시험에는 개념 문제로 훨씬 자주 나와요.` },
  ],
};

let queue=[], qi=0, score=0, correctCnt=0;
function buildQueue(){
  queue=[];
  ROUNDS.forEach(r=>{
    let first=true;
    if(r.valvePuzzle){ queue.push({type:'valve', round:r, first}); first=false; }
    QUESTIONS[r.key].forEach(q=>{ queue.push({type:'quiz', round:r, q, first}); first=false; });
  });
}

function bindStart(){
  document.getElementById('start-btn').onclick=startQuiz;
  document.getElementById('guide-btn').onclick=()=>Tutorial.start();
}

function startQuiz(){
  /* 게임 중에는 배너를 내린다 — 다른 게임 5종과 같은 규칙(2026-09-15).
     실기기 제보: 자본의 제왕 게임방법·플레이 화면에 배너가 그대로 떠 있었다.
     hideAdPlaceholder/showAdPlaceholder 함수는 있는데 **아무도 안 불렀다.** */
  hideAdPlaceholder();
  buildQueue();
  qi=0; score=0; correctCnt=0;
  if(window.WrongNote) WrongNote.reset();
  document.getElementById('home').style.display='none';
  document.body.classList.remove('home-mode');   // 이제 상단 바를 보여 준다
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  showStep();
}

const totalQuizCount = ROUNDS.reduce((s,r)=>s+QUESTIONS[r.key].length,0);
function showStep(){
  const item=queue[qi];
  const quizIdx = queue.slice(0,qi+1).filter(x=>x.type==='quiz').length;
  document.getElementById('hud-prog').textContent = item.type==='valve' ? `밸브 ${ROUNDS.indexOf(item.round)+1}/${ROUNDS.length}` : `${quizIdx} / ${totalQuizCount}`;
  document.getElementById('hud-score').textContent=score.toLocaleString();
  document.getElementById('prog-fill').style.width=(qi/queue.length*100)+'%';
  if(item.type==='valve') renderValveStep(item.round);
  else renderQuizStep(item.q, item.first?item.round:null, item.round);
}

/* ── 밸브 퍼즐 화면 — SVG 배관도 ─────────────────────────────────────
   상자 네 개와 파이프 여섯 개가 **SVG 한 장** 안에 있다. viewBox 가 통째로
   늘어나므로 화면 폭이 어떻든 상자는 항상 같은 크기고, 절대 접히지 않는다.
   (전에는 밸브가 flex-wrap 카드라 좁으면 2+1 로 접혀 조립부만 길어졌다.)
   설계 근거: docs/배관의_방_재기획.md */

const VB = { w:360, h:262 };
const BOX = { w:104, h:62 };
const DEPT_POS = {           // 왼쪽 열 = 보조부문(원천), 오른쪽 열 = 제조부문(도착)
  power:   { x:6,   y:20,  cls:'support', icon:'🔵', name:'동력부' },
  repair:  { x:6,   y:180, cls:'support', icon:'🟣', name:'수선부' },
  cut:     { x:250, y:20,  cls:'making',  icon:'✂',  name:'절단부' },
  assemble:{ x:250, y:180, cls:'making',  icon:'🔩', name:'조립부' },
};

/* 파이프 6개. d 는 경로, (vx,vy) 는 밸브(파이프 한가운데 손잡이) 자리,
   ang 은 손잡이가 '열림'일 때 파이프와 나란해지도록 하는 각도다. */
const PIPES = [
  { id:'power-repair',    from:'power',  to:'repair',   pct:20,
    d:'M40,82 V180',                vx:40,  vy:104, ang:90, cross:true,
    lx:17,  ly:108, ax:40,  ay:172, arot:90 },
  { id:'repair-power',    from:'repair', to:'power',    pct:10,
    d:'M76,180 V82',                vx:76,  vy:158, ang:90, cross:true,
    lx:99,  ly:162, ax:76,  ay:90,  arot:-90 },
  { id:'power-cut',       from:'power',  to:'cut',      pct:50,
    d:'M110,36 H250',               vx:180, vy:36,  ang:0,
    lx:180, ly:22,  ax:242, ay:36,  arot:0 },
  { id:'power-assemble',  from:'power',  to:'assemble', pct:30,
    d:'M110,66 H165 V206 H250',     vx:165, vy:155, ang:90,
    lx:188, ly:159, ax:242, ay:206, arot:0 },
  { id:'repair-cut',      from:'repair', to:'cut',      pct:60,
    d:'M110,196 H210 V56 H250',     vx:210, vy:105, ang:90,
    lx:233, ly:109, ax:242, ay:56,  arot:0 },
  { id:'repair-assemble', from:'repair', to:'assemble', pct:30,
    d:'M110,226 H250',              vx:180, vy:226, ang:0,
    lx:146, ly:242, ax:242, ay:226, arot:0 },
];

/* 라운드별로 어떤 밸브를 잠글 수 있고, 무엇이 정답인가.
   여기 없는 파이프는 '고정'(자물쇠) — 탭하면 흔들리며 이유를 알려 준다. */
const VALVE_ROUNDS = {
  direct:{ closeable:['power-repair','repair-power'], goal:['power-repair','repair-power'],
           fixedMsg:'이 파이프는 제조부문으로 가는 길이라 항상 열려 있어요.' },
  step:  { closeable:['repair-power'],                goal:['repair-power'],
           fixedMsg:'1단계에서 동력부는 수선부까지 포함해 전부 배분해요. 이 파이프는 열어 둡니다.' },
};

/* 파이프에 적히는 비율은 DATA 에서 그대로 끌어온다 — 손으로 적어 두면
   원가·비율을 고칠 때 그림과 계산이 어긋난다(2026-09-16). */
PIPES.forEach(p => { p.pct = DATA[p.from].to[p.to]; });

let valveState = {};   // pipeId → 'open' | 'closed' | 'fixed'

/* 지금 열려 있는 파이프만으로 각 부문이 받는 금액을 계산한다.
   한 부문에서 나가는 열린 파이프들의 비율 합으로 다시 나눈다 —
   교차 파이프를 잠그면 분모가 줄어 제조부문 몫이 커지는 것이 눈에 보인다. */
function computeFlow(roundKey){
  const amt = { power:DATA.power.cost, repair:DATA.repair.cost, cut:0, assemble:0 };
  const sendFrom = (src, total) => {
    const outs = PIPES.filter(p => p.from===src && valveState[p.id]!=='closed');
    const sum = outs.reduce((a,p)=>a+p.pct, 0) || 1;
    const got = {};
    outs.forEach(p => { got[p.id] = total * p.pct / sum; });
    return got;
  };
  if(roundKey==='step'){
    // 1단계: 동력부가 원래 비율 그대로 전부 배분(수선부 포함) → 동력부는 0 이 된다
    const g1 = sendFrom('power', DATA.power.cost);
    amt.power = 0;
    amt.repair = DATA.repair.cost + (g1['power-repair']||0);
    amt.cut += g1['power-cut']||0;
    amt.assemble += g1['power-assemble']||0;
    // 2단계: 수선부가 (자기 원가 + 받은 것)을 배분
    const g2 = sendFrom('repair', amt.repair);
    amt.cut += g2['repair-cut']||0;
    amt.assemble += g2['repair-assemble']||0;
  } else {
    const gp = sendFrom('power',  DATA.power.cost);
    const gr = sendFrom('repair', DATA.repair.cost);
    amt.cut      += (gp['power-cut']||0)      + (gr['repair-cut']||0);
    amt.assemble += (gp['power-assemble']||0) + (gr['repair-assemble']||0);
  }
  return amt;
}

function boxSvg(key){
  const d = DEPT_POS[key];
  return `<rect class="dept-box ${d.cls}" x="${d.x}" y="${d.y}" width="${BOX.w}" height="${BOX.h}" rx="12"/>
    <text class="dept-name" x="${d.x+BOX.w/2}" y="${d.y+26}">${d.icon} ${d.name}</text>
    <text class="dept-amt" id="amt-${key}" x="${d.x+BOX.w/2}" y="${d.y+45}">0원</text>`;
}

function pipeSvg(p){
  const st = valveState[p.id];
  const on = st!=='closed';
  const handle = (st==='fixed')
    ? `<text class="vlock" x="${p.vx}" y="${p.vy+4}">🔒</text>`
    : `<line class="vhandle" x1="${p.vx-6}" y1="${p.vy}" x2="${p.vx+6}" y2="${p.vy}"
             transform="rotate(${p.ang} ${p.vx} ${p.vy})"/>`;
  return `<g class="pipe-g" data-pipe="${p.id}">
      <path class="pipe ${on?'on':'off'}" id="pipe-${p.id}" d="${p.d}"/>
      <path class="flow ${on?'':'hidden'}" id="flow-${p.id}" d="${p.d}"/>
      <polygon class="arrow ${on?'on':'off'}" id="arrow-${p.id}" points="0,-4.5 7,0 0,4.5"
               transform="translate(${p.ax} ${p.ay}) rotate(${p.arot})"/>
      <text class="pct-label ${on?'on':'off'}" id="pct-${p.id}" x="${p.lx}" y="${p.ly}">${on?p.pct+'%':'—'}</text>
      <g class="valve-g ${st}" id="valve-${p.id}" data-pipe="${p.id}">
        <circle class="vhit" cx="${p.vx}" cy="${p.vy}" r="26"/>
        <circle class="vbody" cx="${p.vx}" cy="${p.vy}" r="11"/>
        ${handle}
      </g>
    </g>`;
}

function plantSvg(round){
  const cfg = VALVE_ROUNDS[round.key];
  valveState = {};
  PIPES.forEach(p => { valveState[p.id] = cfg.closeable.includes(p.id) ? 'open' : 'fixed'; });
  return `<div class="plant">
    <svg viewBox="0 0 ${VB.w} ${VB.h}" role="img" aria-label="보조부문에서 제조부문으로 이어진 배관도">
      ${PIPES.map(pipeSvg).join('')}
      ${Object.keys(DEPT_POS).map(boxSvg).join('')}
    </svg>
  </div>`;
}

function paintAmounts(roundKey, animate){
  const amt = computeFlow(roundKey);
  Object.keys(DEPT_POS).forEach(k => {
    const el = document.getElementById('amt-'+k);
    if(!el) return;
    const v = Math.round(amt[k]);
    const before = el.textContent;
    el.textContent = won(v);
    el.classList.toggle('zero', v===0);
    if(animate && before!==el.textContent && (k==='cut'||k==='assemble')){
      el.classList.add('up');
      setTimeout(()=>el.classList.remove('up'), 900);
    }
  });
}

function setPipeVisual(id){
  const on = valveState[id]!=='closed';
  const pipe=document.getElementById('pipe-'+id), flow=document.getElementById('flow-'+id),
        pct=document.getElementById('pct-'+id), vg=document.getElementById('valve-'+id);
  const p = PIPES.find(x=>x.id===id);
  if(pipe){ pipe.classList.toggle('on', on); pipe.classList.toggle('off', !on); }
  if(flow) flow.classList.toggle('hidden', !on);
  const arw=document.getElementById('arrow-'+id);
  if(arw){ arw.classList.toggle('on', on); arw.classList.toggle('off', !on); }
  if(pct){ pct.textContent = on ? p.pct+'%' : '—'; pct.classList.toggle('on',on); pct.classList.toggle('off',!on); }
  if(vg){ vg.classList.toggle('open', valveState[id]==='open'); vg.classList.toggle('closed', valveState[id]==='closed'); }
}

function renderValveStep(round){
  document.getElementById('quiz-body').innerHTML = `
    <div class="round-badge">${round.badge}</div>
    <div class="round-title">${round.title}</div>
    <div class="round-desc">${round.desc}</div>
    ${plantSvg(round)}
    <div class="hint-box" id="valve-hint">${round.key==='direct'
      ? '👆 동력부↔수선부를 잇는 <b>교차 파이프 2개</b>의 동그란 손잡이를 눌러 잠가보세요.'
      : '👆 <b>수선부→동력부</b> 파이프의 손잡이를 눌러 잠그세요. 이미 배분이 끝난 부문으로는 다시 못 갑니다.'}</div>
    <div class="ok-box" id="valve-ok">${round.key==='direct'
      ? '✓ 교차 파이프를 다 잠갔어요! 이제 동력부·수선부 원가는 절단부·조립부로만 흘러갑니다. 잠그기 전보다 제조부문이 받는 금액이 <b>늘어난 것</b>을 보세요.'
      : '✓ 맞아요! 수선부는 자기 원가 600,000원 + 동력부한테 받은 160,000원 = <b>760,000원</b>을 절단부·조립부에만 나눕니다.'}</div>
    <div class="next-wrap"><button class="cta" id="valve-next-btn" disabled>다음 →</button></div>`;

  document.querySelectorAll('.valve-g').forEach(vg => {
    vg.addEventListener('click', () => onValveTap(vg.dataset.pipe, round));
  });
  paintAmounts(round.key, false);
  document.getElementById('valve-hint').classList.add('show');

  /* 라운드2 는 "동력부를 먼저 배분한다"가 핵심이라, 들어오자마자
     동력부가 비워지고 수선부가 불어나는 것을 눈으로 보여 준다. */
  if(round.key==='step'){
    const pw=document.getElementById('amt-power'), rp=document.getElementById('amt-repair');
    if(pw&&rp){
      pw.textContent=won(DATA.power.cost); pw.classList.remove('zero');
      rp.textContent=won(DATA.repair.cost);
      setTimeout(()=>{ paintAmounts('step', true); rp.classList.add('up');
                       setTimeout(()=>rp.classList.remove('up'), 1200); }, 700);
    }
  }
}

function onValveTap(id, round){
  const cfg = VALVE_ROUNDS[round.key];
  const vg = document.getElementById('valve-'+id);
  if(valveState[id]==='fixed'){          // 못 잠그는 파이프 — 막지 말고 이유를 알려 준다
    vg.classList.remove('shake'); void vg.getBBox();
    vg.classList.add('shake');
    setTimeout(()=>vg.classList.remove('shake'), 420);
    const h=document.getElementById('valve-hint');
    h.classList.add('show'); h.innerHTML='🔒 '+cfg.fixedMsg;
    return;
  }
  valveState[id] = (valveState[id]==='open') ? 'closed' : 'open';
  setPipeVisual(id);
  paintAmounts(round.key, true);
  checkValveDone(round);
}

function checkValveDone(round){
  const cfg = VALVE_ROUNDS[round.key];
  const done = cfg.goal.every(id => valveState[id]==='closed')
            && cfg.closeable.every(id => cfg.goal.includes(id) || valveState[id]==='open');
  document.getElementById('valve-hint').classList.toggle('show', !done);
  document.getElementById('valve-ok').classList.toggle('show', done);
  const btn=document.getElementById('valve-next-btn');
  btn.disabled = !done;
  if(done) btn.onclick=()=>{ qi++; showStep(); };
}

/* ── 참고 자료 — 확인퀴즈 문제만 보면 계산에 필요한 숫자가 안 보이던 문제 수정.
   문제 위에 그 라운드에서 실제로 필요한 원가·비율을 항상 띄운다(개념문제인 recip 라운드는 불필요). ── */
function refDataHtml(round){
  if(round.key==='direct'){
    return `<div class="ref-box">
      <b>🔵 동력부</b> ${won(DATA.power.cost)} — 수선 20 : 절단 60 : 조립 20<br>
      <b>🟣 수선부</b> ${won(DATA.repair.cost)} — 동력 20 : 절단 20 : 조립 60<br>
      <span style="color:var(--dim)">교차 파이프를 잠갔으니 서로에게 가는 몫은 빼고 다시 나눠요.</span>
    </div>`;
  }
  if(round.key==='step'){
    return `<div class="ref-box">
      <b>🔵 동력부</b> ${won(DATA.power.cost)} — 수선 20% : 절단 60% : 조립 20% (1단계는 <b>원래 비율 그대로</b>)<br>
      <b>🟣 수선부</b> 자기 원가 ${won(DATA.repair.cost)} + 동력부에게 받은 몫 — 절단 20 : 조립 60 → 분모 80
    </div>`;
  }
  return '';
}
/* ── 퀴즈(객관식) 화면 ── */
function renderQuizStep(q, introRound, round){
  const opts = q._shuffled || (q._shuffled = shuffle(q.opts.slice()));
  const header = introRound ? `
    <div class="round-badge">${introRound.badge}</div>
    <div class="round-title">${introRound.title}</div>
    <div class="round-desc">${introRound.desc}</div>` : '';
  document.getElementById('quiz-body').innerHTML = `
    ${header}
    <div class="qcard">
      ${refDataHtml(round)}
      <div class="qstem">${esc(q.q)}</div>
      <div class="opt-grid" id="opt-grid">
        ${opts.map(o=>`<button class="opt" data-v="${esc(String(o))}">${typeof o==='number'?won(o):esc(o)}</button>`).join('')}
      </div>
      <div class="expl" id="expl"></div>
      <div class="next-wrap" id="next-wrap" style="display:none"><button class="cta" id="next-btn"></button></div>
    </div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickAnswer(b,q));
}
function pickAnswer(btn,q){
  const val=btn.dataset.v;
  const correctVal=String(q.correct);
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===correctVal) b.classList.add('correct');
    else if(b.dataset.v===val) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const ok = val===correctVal;
  const expl=document.getElementById('expl');
  expl.innerHTML = (ok
    ? `<div class="verdict" style="color:var(--green)">✓ 정답!</div>${q.expl}`
    : `<div class="verdict" style="color:var(--red)">✗ 오답</div>${q.expl}`);
  expl.style.display='block';
  if(ok){ correctCnt++; score+=150; }
  else{
    if(window.WrongNote) WrongNote.add({ game:GAME_ID, key:q.q.slice(0,20), q:q.q,
      correct:(typeof q.correct==='number'?won(q.correct):q.correct), wrong:val, type:'보조부문배분' });
  }
  document.getElementById('hud-score').textContent=score.toLocaleString();
  const isLast = qi>=queue.length-1;
  document.getElementById('next-wrap').style.display='block';
  document.getElementById('next-btn').textContent = isLast ? '결과 보기 🏁' : '다음 →';
  document.getElementById('next-btn').onclick=()=>{ qi++; if(qi>=queue.length) endQuiz(); else showStep(); };
  expl.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function grade(rate){
  if(rate>=0.9) return '👑 배관의 달인';
  if(rate>=0.75) return '🥇 합격 안정권';
  if(rate>=0.6) return '🥈 합격 가시권';
  if(rate>=0.4) return '🥉 분발 필요';
  return '📋 기초 다지기';
}

async function endQuiz(){
  showAdPlaceholder();   // 결과화면에서는 다시 띄운다
  if(window.WrongNote) await WrongNote.flush(GAME_ID);
  const rate = totalQuizCount ? correctCnt/totalQuizCount : 0;
  const g = grade(rate);
  if(window.Growth) Growth.record({game:GAME_ID, score:score, grade:g, combo:0, correct:correctCnt});
  if(window.Growth) Growth.logPlay(GAME_ID);
  try{ await saveStageScore(score, g, correctCnt, totalQuizCount); }catch(e){}
  requestInterstitialIfNeeded(renderResult);
}

/* =========================================================================
 *  Tutorial — 직접배분법 교차 파이프 1개만 잠가보는 짧은 체험(퀴즈 없이)
 * ========================================================================= */
const TUT_STEPS = [
  { text:'보조부문원가를 제조부문에 나눠주는 <b>배관</b>을 밸브로 직접 잠그고 열면서 배분방법 차이를 익히는 게임이에요.', btn:'시작 ▶' },
  { text:'<b>직접배분법</b>은 보조부문끼리 주고받는 건 없는 셈 쳐요. 동력부에서 수선부로 내려가는 <b>교차 파이프</b>의 동그란 손잡이를 눌러 잠가보세요.', tap:true, hint:'👆 금빛 손잡이를 탭!' },
  { text:'맞아요! 파이프가 잠기면 흐름이 멈추고, 그만큼 <b>절단부·조립부가 받는 금액이 늘어나요</b>. 오른쪽 상자의 숫자가 바뀐 걸 보세요.', glow:true, btn:'다음 ▶' },
  { text:'그다음엔 계산 문제로 실제 배분액을 직접 확인해요. 오답이어도 바로 해설이 나오니 걱정 마세요.', btn:'다음 ▶' },
  { text:'직접배분법 → 단계배분법 → 상호배분법(개념) 순서로 이어져요. 준비되면 시작해볼까요?', btn:'시작하기 ▶', finish:true },
];
const Tutorial = (function(){
  let step=0, locked=false, timer=null;
  function el(id){ return document.getElementById(id); }
  const TUT_PIPE = 'power-repair';        // 튜토리얼에서 잠가 볼 교차 파이프
  function buildBoard(){
    // 본게임과 같은 함수로 그린다 — 배우고 들어갔을 때 화면이 똑같아야 한다
    el('tut-plant').innerHTML = plantSvg(ROUNDS[0]);
    paintAmounts('direct', false);
    document.querySelectorAll('#tut-plant .valve-g').forEach(vg => {
      vg.addEventListener('click', () => onTap(vg.dataset.pipe));
    });
  }
  function onTap(pipeId){
    const s=TUT_STEPS[step];
    if(locked || !s || !s.tap) return;
    if(pipeId !== TUT_PIPE){                 // 고정 파이프나 다른 밸브를 눌렀을 때
      const vg=el('valve-'+pipeId);
      if(vg){ vg.classList.remove('shake'); void vg.getBBox(); vg.classList.add('shake');
              setTimeout(()=>vg.classList.remove('shake'), 420); }
      el('tut-hint').style.display='block';
      el('tut-hint').textContent='👆 동력부 → 수선부 교차 파이프의 손잡이를 누르세요';
      return;
    }
    locked=true;
    valveState[TUT_PIPE]='closed';
    setPipeVisual(TUT_PIPE);
    paintAmounts('direct', true);
    timer=setTimeout(()=>{ timer=null; locked=false; go(step+1); }, 700);
  }
  function render(){
    const s=TUT_STEPS[step];
    el('tut-badge').textContent=(step+1)+'/'+TUT_STEPS.length;
    el('tut-text').innerHTML=s.text;
    document.querySelectorAll('#tut-plant .valve-g').forEach(vg =>
      vg.classList.toggle('tut-target', !!s.tap && vg.dataset.pipe===TUT_PIPE));
    const hint=el('tut-hint');
    if(s.hint){ hint.style.display='block'; hint.textContent=s.hint; } else hint.style.display='none';
    const btn=el('tut-next');
    if(s.btn){ btn.style.display='block'; btn.textContent=s.btn; } else btn.style.display='none';
  }
  function go(n){ step=n; if(step>=TUT_STEPS.length) return finish(); render(); }
  function nextBtn(){ if(TUT_STEPS[step].finish) return finish(); go(step+1); }
  function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }
  function start(){
    /* 게임 방법(튜토리얼) 중에도 배너를 내린다 — 실기기 제보(2026-09-15).
       닫을 때는 곧바로 되돌리지 않는다: finish() 는 close() 뒤에 게임을 시작하는데,
       거기서 show 를 해 버리면 게임 중에 배너가 다시 올라온다. 대신 시작화면으로
       돌아가는 경우만 되살리도록 startGame/startQuiz 쪽 hide 와 짝을 맞춰 뒀다. */
    if (typeof hideAdPlaceholder === 'function') hideAdPlaceholder(); clearTimer(); step=0; locked=false; buildBoard(); render(); el('tutorial').classList.add('show'); }
  function close(){
    if (typeof showAdPlaceholder === 'function') showAdPlaceholder(); clearTimer(); locked=false; el('tutorial').classList.remove('show'); }
  function finish(){ close(); }
  return { start, close, next:nextBtn };
})();

let _supaDb=null;
function supaClient(){
  if(_supaDb) return _supaDb;
  try{ if(window.supabase && supabase.createClient) _supaDb=supabase.createClient(SUPA_URL, SUPA_KEY); }catch(e){}

async function saveStageScore(score, gradeStr, correct, total){
  try{
    localStorage.setItem(S6_SAVE_KEY, JSON.stringify({
      cleared:true, score, grade:gradeStr, correct, total, playedAt:new Date().toISOString()
    }));
  }catch(e){}
  const name=(localStorage.getItem('hub_nickname')||'').trim();
  if(!name) return;
  const groupId=localStorage.getItem('hub_group_id') || null;
  const today=new Date().toISOString().split('T')[0];
  const rpcParams={ p_game_id:GAME_ID, p_name:name, p_score:score, p_grade:gradeStr, p_combo:0, p_correct:correct, p_date:today };
  if(groupId) rpcParams.p_group_id=groupId;
  try{ if(window.Auth){ const uid=await Auth.currentUid(); if(uid) rpcParams.p_uid=uid; } }catch(e){}
  const db=supaClient();
  if(!db) return;
  try{ const {error}=await db.rpc('upsert_score', rpcParams); if(error) console.warn('alloc_lv1 점수 저장 실패:', error); }
  catch(e){ console.warn('alloc_lv1 점수 저장 예외:', e); }
}

    <div class="btn-row">
      <button class="primary" onclick="location.reload()">↺ 다시 하기</button>

    </div>
    ${wrong>0?'<a class="review-link" href="review.html">오답노트에서 다시 보기 →</a>':''}
    <div id="my-rank-badge"></div>
    <div class="rank-title">🏆 TOP 랭킹</div>
    <div id="rank-box"><div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">불러오는 중...</div></div>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
  loadRanking();
}
async function loadRanking(){
  const box=document.getElementById('rank-box');
  const db=supaClient();
  if(!db){ box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">랭킹을 불러올 수 없습니다</div>'; return; }
  const groupId=localStorage.getItem('hub_group_id')||null;
  const me=(localStorage.getItem('hub_nickname')||'').trim();
  try{
    let q=db.from('scores').select('name,score').eq('game_id',GAME_ID).order('score',{ascending:false}).limit(15);
    if(groupId) q=q.eq('group_id',groupId);
    const {data,error}=await q;
    if(error) throw error;
    const list=data||[];
    box.innerHTML = list.length
      ? list.map((r,i)=>{
          const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'위';
          return `<div class="rr-row${r.name===me?' me':''}"><span class="rr-num">${medal}</span><span class="rr-name">${esc(r.name)}</span><span class="rr-score">${(r.score||0).toLocaleString()}</span></div>`;
        }).join('')
      : '<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">아직 기록이 없습니다</div>';
    if(me){
      const myRowQ = groupId ? db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).eq('group_id',groupId).maybeSingle()
                              : db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).maybeSingle();
      const {data:myRow}=await myRowQ;
      if(myRow && Number.isFinite(myRow.score)){
        let cq=db.from('scores').select('*',{count:'exact',head:true}).eq('game_id',GAME_ID).gt('score',myRow.score);
        if(groupId) cq=cq.eq('group_id',groupId);
        const {count}=await cq;
        const badge=document.getElementById('my-rank-badge');
        badge.textContent=`🎯 내 순위: ${((count||0)+1).toLocaleString()}위`;
        badge.style.display='block';
      }
    }
  }catch(e){
    box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">랭킹을 불러올 수 없습니다</div>';
  }
}

const AD_GAME_COUNT_KEY='hub_ad_game_count';
const AD_INTERSTITIAL_EVERY=10;
function incrementGameCount(){
  const n=parseInt(localStorage.getItem(AD_GAME_COUNT_KEY)||'0')+1;
  localStorage.setItem(AD_GAME_COUNT_KEY,String(n)); return n;
}
function requestInterstitialIfNeeded(afterFn){
  if(window.AdBridge && typeof AdBridge.isAdsRemoved==='function' && AdBridge.isAdsRemoved()){ afterFn&&afterFn(); return; }
  window._adAfterFn=afterFn;
  const count=incrementGameCount();
  if(count%AD_INTERSTITIAL_EVERY===0 && window.AdBridge && typeof AdBridge.showInterstitial==='function'){
    AdBridge.showInterstitial();
  } else { afterFn&&afterFn(); }
}
function onInterstitialClosed(){ if(window._adAfterFn){ const f=window._adAfterFn; window._adAfterFn=null; f(); } }
function onAdsRemoved(){}
function hideAdPlaceholder(){ if(window.AdBridge && typeof AdBridge.hide==='function') AdBridge.hide(); }
/* 짝이 없어서 결과화면에서 배너가 안 돌아왔다 — hide 만 있고 show 가 없었다(2026-09-15).
   게임 5종·stage3 에는 둘 다 있는데 여기 셋만 빠져 있었다. */
function showAdPlaceholder(){ if(window.AdBridge && typeof AdBridge.show==='function') AdBridge.show(); }
