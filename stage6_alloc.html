<style>
  :root{
    --bg:#020810; --card:#0c1626; --card2:#11203a; --line:rgba(255,255,255,.08);
    --blue:#00f2ff; --purple:#b44fff; --green:#2ecc71; --red:#ff2d78; --gold:#ffd24a;
    --pipe-on:#00f2ff; --pipe-off:#3a4658;
    --txt:#eaf2ff; --dim:rgba(234,242,255,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       padding:0 0 40px; min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;}
  @media (min-width:701px){
    body{background:
      radial-gradient(ellipse 50% 40% at 12% 10%, rgba(180,79,255,0.07), transparent 60%),
      radial-gradient(ellipse 45% 35% at 90% 90%, rgba(0,242,255,0.06), transparent 55%),
      var(--bg);
      display:flex; flex-direction:column; justify-content:center;}
    .wrap{padding-top:16px;max-width:820px;width:100%;}
  }
  .top{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .back{background:var(--card);border:1px solid var(--line);color:var(--txt);
        border-radius:12px;padding:9px 13px;font-size:.92rem;text-decoration:none;flex:none;}
  h1{font-size:1.15rem;margin:0;}
  h1 .sub{display:block;font-size:.72rem;color:var(--dim);font-weight:500;margin-top:3px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .panel h2{font-size:.92rem;margin:0 0 10px;color:var(--blue);}
  .panel p{font-size:.88rem;line-height:1.65;color:var(--dim);margin:0 0 8px;}
  .cta{display:block;width:100%;border:none;border-radius:14px;padding:15px;
       font-size:1.05rem;font-weight:700;color:#021;cursor:pointer;
       background:linear-gradient(90deg,var(--blue),var(--purple));margin-top:8px;}
  .cta:disabled{opacity:.45;}
  .guide-btn{display:block;width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;
    font-size:.9rem;font-weight:600;color:var(--dim);background:var(--card2);cursor:pointer;margin-top:8px;text-align:center;}

  #quiz{display:none;}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--dim);margin-bottom:10px;}
  .hud b{color:var(--gold);}
  .progress-track{height:6px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;margin-bottom:14px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .3s;}

  .round-badge{display:inline-block;font-family:ui-monospace,monospace;font-weight:700;font-size:.7rem;
    letter-spacing:.03em;padding:4px 10px;border-radius:6px;background:rgba(180,79,255,.15);color:var(--purple);

  .round-desc{font-size:.86rem;color:var(--dim);line-height:1.6;margin-bottom:14px;word-break:keep-all;}

  .tank-cost{font-family:ui-monospace,monospace;font-weight:700;color:var(--gold);font-size:.92rem;}
  .tank-cost.zero{color:rgba(255,255,255,.25);text-decoration:line-through;}
  .pipe-row{display:flex;gap:8px;flex-wrap:wrap;margin-left:14px;padding-left:14px;border-left:2px dashed var(--pipe-off);}
  .valve{position:relative;flex:1;min-width:96px;border:1.5px solid var(--pipe-off);border-radius:12px;

  .valve .vname{display:block;font-size:.78rem;color:var(--dim);}
  .valve .vamt{display:block;font-size:.72rem;font-family:ui-monospace,monospace;color:rgba(255,255,255,.35);margin-top:2px;}
  .valve.open{border-color:var(--pipe-on);background:rgba(0,242,255,.12);box-shadow:0 0 0 2px rgba(0,242,255,.15);}
  .valve.open .vname{color:var(--blue);font-weight:700;}
  .valve.open .vamt{color:var(--blue);}
  .valve.closed{opacity:.55;}
  .valve.closed::after{content:'✕';position:absolute;top:4px;right:6px;color:var(--red);font-size:.7rem;font-weight:900;}
  .valve.locked{cursor:default;}
  .valve.fixed-open{border-color:var(--green);background:rgba(46,204,113,.1);cursor:default;}
  .valve.fixed-open .vname{color:var(--green);}

  .hint-box{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,210,74,.08);
    border:1px solid rgba(255,210,74,.25);font-size:.84rem;color:var(--gold);line-height:1.55;display:none;}
  .hint-box.show{display:block;}
  .ok-box{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(46,204,113,.1);
    border:1px solid rgba(46,204,113,.3);font-size:.86rem;color:var(--green);line-height:1.55;display:none;font-weight:700;}
  .ok-box.show{display:block;}

  .ref-box{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:rgba(0,242,255,.06);
    border:1px solid rgba(0,242,255,.22);font-size:.82rem;color:#dff;line-height:1.7;}
  .ref-box b{color:var(--cy,#00f2ff);}

  .qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;}
  .qstem{font-size:1.0rem;line-height:1.6;word-break:keep-all;margin-bottom:14px;}
  .opt-grid{display:grid;gap:9px;}
  .opt{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;
    text-align:left;cursor:pointer;transition:.12s;color:var(--txt);font-size:.92rem;font-family:ui-monospace,monospace;}
  .opt:active{transform:scale(.98);}
  .opt[disabled]{cursor:default;}
  .opt.correct{border-color:var(--green);background:rgba(46,204,113,.18);}
  .opt.wrong{border-color:var(--red);background:rgba(255,45,120,.18);}
  .opt.dim{opacity:.35;}

  .expl{margin-top:14px;padding:14px;border-radius:13px;background:rgba(0,242,255,.07);
        border:1px solid rgba(0,242,255,.22);font-size:.88rem;line-height:1.6;display:none;}
  .expl .verdict{font-weight:700;margin-bottom:6px;font-size:.96rem;}
  .next-wrap{margin-top:14px;}

  #result{display:none;text-align:center;}
  #result .em{font-size:3rem;display:block;margin:8px 0;}
  #result .score{font-size:2.4rem;color:var(--gold);font-weight:800;}
  #result .grade{font-size:1.1rem;margin:6px 0 2px;}
  .res-row{display:flex;justify-content:space-around;margin:18px 0;font-size:.9rem;}
  .res-row .v{font-size:1.4rem;font-weight:700;display:block;}
  .res-note{font-size:.82rem;color:var(--dim);margin-bottom:18px;}
  .btn-row{display:flex;gap:10px;}
  .btn-row a,.btn-row button{flex:1;border-radius:13px;padding:13px;font-size:.92rem;font-weight:600;
      border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;text-decoration:none;text-align:center;}
  .btn-row .primary{border:none;background:linear-gradient(90deg,var(--blue),var(--purple));color:#021;}

  /* ── 게임 방법 튜토리얼 ── */
  .tut{display:none;position:fixed;inset:0;z-index:9999;flex-direction:column;background:var(--bg);}
  .tut.show{display:flex;animation:tutPop .25s ease;}
  @keyframes tutPop{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
  .tut-top{display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;}
  .tut-top .tt-title{font-weight:800;font-size:1.05rem;color:#fff;}
  .tut-top .tt-badge{font-size:.8rem;font-weight:800;color:#fff;background:var(--purple);border-radius:50px;padding:3px 12px;}
  .tut-top .tt-skip{margin-left:auto;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.75);
    border-radius:50px;padding:6px 14px;font-size:.8rem;cursor:pointer;}
  .tut-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:6px 16px 0;overflow-y:auto;}
  .tut-stage .plant{width:100%;max-width:480px;}
  .tut .valve.tut-target{position:relative;box-shadow:0 0 0 3px rgba(255,210,74,.4);animation:tutGlow 1s ease-in-out infinite;}
  @keyframes tutGlow{0%,100%{box-shadow:0 0 0 3px rgba(255,210,74,.4);}50%{box-shadow:0 0 0 7px rgba(255,210,74,.12);}}
  .tut-bubble{background:rgba(0,0,0,.35);border-top:1px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom));}
  .tut-bubble-text{font-size:.98rem;line-height:1.6;color:#e0e6ed;word-break:keep-all;text-align:center;}
  .tut-bubble-text b{color:var(--blue);}
  .tut-hint{text-align:center;font-weight:800;color:var(--gold);font-size:.92rem;margin-top:8px;}
  .tut-next{display:block;width:100%;margin-top:14px;padding:15px;border-radius:14px;border:2px solid rgba(255,255,255,.3);
    background:transparent;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;}

  /* ── TOP 랭킹(결과화면) ── */
  .rank-title{font-size:.72rem;color:rgba(255,255,255,.35);letter-spacing:2px;margin:18px 0 8px;text-align:center;}
  #my-rank-badge{display:none;font-size:.82rem;color:var(--blue);background:rgba(0,242,255,.1);border:1px solid rgba(0,242,255,.3);
    border-radius:50px;padding:6px 16px;margin:0 auto 8px;text-align:center;max-width:max-content;}
  #rank-box{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;max-height:180px;overflow-y:auto;padding:4px 0;text-align:left;}
  .rr-row{display:grid;grid-template-columns:34px 1fr 70px;gap:6px;padding:8px 12px;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.05);align-items:center;}
  .rr-row:last-child{border-bottom:none;}
  .rr-row.me{background:rgba(0,242,255,.08);}
  .rr-num{color:rgba(255,255,255,.35);font-weight:700;}
  .rr-name{color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rr-score{color:var(--gold);text-align:right;font-weight:700;}
</style>

      <p>파이프 밸브를 직접 잠그고 열면서 <b style="color:#fff">직접배분법 → 단계배분법 → 상호배분법(개념)</b> 순서로 차이를 몸으로 익혀봐요.</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){ if(!(localStorage.getItem('hub_nickname')||'').trim()){ location.replace('login.html'); } })();

const GAME_ID='alloc_lv1';

/* =========================================================================
 *  보조부문원가 배분 데이터 — 검산 완료.
 *  동력부 900,000원(수선부20%/절단부50%/조립부30%), 수선부 600,000원(동력부10%/절단부60%/조립부30%)
 *  직접배분법: 절단부 962,500 / 조립부 537,500 (합 1,500,000 = 원가 총액과 일치)
 *  단계배분법(동력부 먼저): 수선부 총액 780,000 → 절단부 970,000 / 조립부 530,000 (합 1,500,000)
 * ========================================================================= */
const DATA = {
  power:  { name:'동력부', cost:900000, to:{ repair:0.20, cut:0.50, assemble:0.30 } },
  repair: { name:'수선부', cost:600000, to:{ power:0.10,  cut:0.60, assemble:0.30 } },
};
const won = n => n.toLocaleString()+'원';

function directMethod(){
  const p=DATA.power.to, r=DATA.repair.to;
  const pSum=p.cut+p.assemble, rSum=r.cut+r.assemble;
  const powerToCut=DATA.power.cost*(p.cut/pSum), powerToAssemble=DATA.power.cost*(p.assemble/pSum);
  const repairToCut=DATA.repair.cost*(r.cut/rSum), repairToAssemble=DATA.repair.cost*(r.assemble/rSum);
  return { powerToCut, powerToAssemble, repairToCut, repairToAssemble,
           cut:powerToCut+repairToCut, assemble:powerToAssemble+repairToAssemble };
}
function stepMethod(){
  // 동력부가 먼저 배분(원래 비율 그대로, 수선부 포함) → 수선부는 그다음 배분(동력부로는 못 감, 제조부문에만)
  const power=DATA.power, repair=DATA.repair;
  const powerToRepair=power.cost*power.to.repair, powerToCut=power.cost*power.to.cut, powerToAssemble=power.cost*power.to.assemble;
  const repairTotal=repair.cost+powerToRepair;
  const rSum=repair.to.cut+repair.to.assemble;
  const repairToCut=repairTotal*(repair.to.cut/rSum), repairToAssemble=repairTotal*(repair.to.assemble/rSum);
  return { powerToRepair, powerToCut, powerToAssemble, repairTotal, repairToCut, repairToAssemble,
           cut:powerToCut+repairToCut, assemble:powerToAssemble+repairToAssemble };
}
const D = directMethod(), S = stepMethod();
// 자체 검산(총원가 불변 확인) — 어긋나면 콘솔에 바로 드러나게
console.assert(Math.round(D.cut+D.assemble)===1500000, '직접배분법 합계 오류', D);
console.assert(Math.round(S.cut+S.assemble)===1500000, '단계배분법 합계 오류', S);

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* =========================================================================
 *  라운드 정의 — ①밸브 퍼즐(직접배분법) ②밸브 퍼즐(단계배분법) ③개념 퀴즈(상호배분법)
 * ========================================================================= */
const ROUNDS = [
  {
    key:'direct', badge:'ROUND 1 · 직접배분법',
    title:'보조부문끼리는 없는 셈 친다',
    desc:'직접배분법은 보조부문 상호 간 용역수수를 <b style="color:#fff">전혀 반영하지 않아요</b>. 동력부↔수선부로 가는 파이프 2개를 잠가서, 제조부문(절단부·조립부)으로만 흐르게 만들어보세요.',
    valvePuzzle:true,
  },
  {
    key:'step', badge:'ROUND 2 · 단계배분법',
    title:'순서를 정해서 한 번씩만 배분한다',
    desc:'단계배분법은 배분 순서를 정해요. <b style="color:#fff">동력부를 먼저</b> 배분하면(수선부까지 포함해서 전부), 동력부는 다 비워지고 다시는 못 받아요. 그다음 수선부는 <b style="color:#fff">이미 끝난 동력부로는 못 가고</b> 제조부문에만 배분합니다.',
    valvePuzzle:true,
  },
  {
    key:'recip', badge:'ROUND 3 · 상호배분법(개념)',
    title:'서로 완전히 주고받는다',
    desc:'상호배분법은 보조부문끼리도 완전히 주고받는 걸 반영해요. 실제 시험에서는 <b style="color:#fff">복잡한 계산보다 "직접배분법·단계배분법과 어떻게 다른가"를 묻는 개념 문제</b>로 훨씬 자주 나와요.',
    valvePuzzle:false,
  },
];

const QUESTIONS = {
  direct:[
    { q:'절단부가 배분받는 보조부문원가 합계는?',
      opts:[962500, 810000, 900000, 1050000], correct:962500,
      expl:`동력부 900,000×(50/80)=562,500 + 수선부 600,000×(60/90)=400,000 = <b>962,500원</b>. 교차 파이프를 잠그고 남은 비율(절단:조립)로 다시 나눠야 해요.` },

let queue=[], qi=0, score=0, correctCnt=0;
function buildQueue(){
  queue=[];
  ROUNDS.forEach(r=>{
    let first=true;
    if(r.valvePuzzle){ queue.push({type:'valve', round:r, first}); first=false; }
    QUESTIONS[r.key].forEach(q=>{ queue.push({type:'quiz', round:r, q, first}); first=false; });
  });
}

function bindStart(){
  document.getElementById('start-btn').onclick=startQuiz;
  document.getElementById('guide-btn').onclick=()=>Tutorial.start();
}

function startQuiz(){
  buildQueue();
  qi=0; score=0; correctCnt=0;
  if(window.WrongNote) WrongNote.reset();
  document.getElementById('home').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  showStep();
}

const totalQuizCount = ROUNDS.reduce((s,r)=>s+QUESTIONS[r.key].length,0);
function showStep(){
  const item=queue[qi];
  const quizIdx = queue.slice(0,qi+1).filter(x=>x.type==='quiz').length;
  document.getElementById('hud-prog').textContent = item.type==='valve' ? `밸브 ${ROUNDS.indexOf(item.round)+1}/${ROUNDS.length}` : `${quizIdx} / ${totalQuizCount}`;
  document.getElementById('hud-score').textContent=score.toLocaleString();
  document.getElementById('prog-fill').style.width=(qi/queue.length*100)+'%';
  if(item.type==='valve') renderValveStep(item.round);
  else renderQuizStep(item.q, item.first?item.round:null, item.round);
}

/* ── 퀴즈(객관식) 화면 ── */
function renderQuizStep(q, introRound, round){
  const opts = q._shuffled || (q._shuffled = shuffle(q.opts.slice()));
  const header = introRound ? `
    <div class="round-badge">${introRound.badge}</div>
    <div class="round-title">${introRound.title}</div>
    <div class="round-desc">${introRound.desc}</div>` : '';
  document.getElementById('quiz-body').innerHTML = `
    ${header}
    <div class="qcard">
      ${refDataHtml(round)}
      <div class="qstem">${esc(q.q)}</div>
      <div class="opt-grid" id="opt-grid">
        ${opts.map(o=>`<button class="opt" data-v="${esc(String(o))}">${typeof o==='number'?won(o):esc(o)}</button>`).join('')}
      </div>
      <div class="expl" id="expl"></div>
      <div class="next-wrap" id="next-wrap" style="display:none"><button class="cta" id="next-btn"></button></div>
    </div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickAnswer(b,q));
}
function pickAnswer(btn,q){
  const val=btn.dataset.v;
  const correctVal=String(q.correct);
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===correctVal) b.classList.add('correct');
    else if(b.dataset.v===val) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const ok = val===correctVal;
  const expl=document.getElementById('expl');
  expl.innerHTML = (ok
    ? `<div class="verdict" style="color:var(--green)">✓ 정답!</div>${q.expl}`
    : `<div class="verdict" style="color:var(--red)">✗ 오답</div>${q.expl}`);
  expl.style.display='block';
  if(ok){ correctCnt++; score+=150; }
  else{
    if(window.WrongNote) WrongNote.add({ game:GAME_ID, key:q.q.slice(0,20), q:q.q,
      correct:(typeof q.correct==='number'?won(q.correct):q.correct), wrong:val, type:'보조부문배분' });
  }
  document.getElementById('hud-score').textContent=score.toLocaleString();
  const isLast = qi>=queue.length-1;
  document.getElementById('next-wrap').style.display='block';
  document.getElementById('next-btn').textContent = isLast ? '결과 보기 🏁' : '다음 →';
  document.getElementById('next-btn').onclick=()=>{ qi++; if(qi>=queue.length) endQuiz(); else showStep(); };
  expl.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function grade(rate){
  if(rate>=0.9) return '👑 배관의 달인';
  if(rate>=0.75) return '🥇 합격 안정권';
  if(rate>=0.6) return '🥈 합격 가시권';
  if(rate>=0.4) return '🥉 분발 필요';
  return '📋 기초 다지기';
}

async function endQuiz(){
  if(window.WrongNote) await WrongNote.flush(GAME_ID);
  const rate = totalQuizCount ? correctCnt/totalQuizCount : 0;
  const g = grade(rate);
  if(window.Growth) Growth.record({game:GAME_ID, score:score, grade:g, combo:0, correct:correctCnt});
  if(window.Growth) Growth.logPlay(GAME_ID);
  try{ await saveStageScore(score, g, correctCnt, totalQuizCount); }catch(e){}
  requestInterstitialIfNeeded(renderResult);
}

  { text:'직접배분법 → 단계배분법 → 상호배분법(개념) 순서로 이어져요. 준비되면 시작해볼까요?', btn:'시작하기 ▶', finish:true },
];
const Tutorial = (function(){
  let step=0, locked=false, timer=null;
  function el(id){ return document.getElementById(id); }
  function buildBoard(){
    el('tut-valves').innerHTML = `
      <div class="valve open" id="tut-valve-target"><span class="vname">→ 수선부</span><span class="vamt">교차</span></div>
      <div class="valve fixed-open"><span class="vname">→ 절단부</span><span class="vamt">고정</span></div>
      <div class="valve fixed-open"><span class="vname">→ 조립부</span><span class="vamt">고정</span></div>`;
    el('tut-valve-target').addEventListener('pointerdown', e=>{ e.preventDefault(); onTap(); });
  }
  function onTap(){
    const s=TUT_STEPS[step];
    if(locked || !s || !s.tap) return;
    locked=true;
    const v=el('tut-valve-target');
    v.classList.remove('open'); v.classList.add('closed');
    timer=setTimeout(()=>{ timer=null; locked=false; go(step+1); }, 600);
  }
  function render(){
    const s=TUT_STEPS[step];
    el('tut-badge').textContent=(step+1)+'/'+TUT_STEPS.length;
    el('tut-text').innerHTML=s.text;
    const target=el('tut-valve-target');
    if(target) target.classList.toggle('tut-target', !!s.tap);
    const hint=el('tut-hint');
    if(s.hint){ hint.style.display='block'; hint.textContent=s.hint; } else hint.style.display='none';
    const btn=el('tut-next');
    if(s.btn){ btn.style.display='block'; btn.textContent=s.btn; } else btn.style.display='none';
  }
  function go(n){ step=n; if(step>=TUT_STEPS.length) return finish(); render(); }
  function nextBtn(){ if(TUT_STEPS[step].finish) return finish(); go(step+1); }
  function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }
  function start(){ clearTimer(); step=0; locked=false; buildBoard(); render(); el('tutorial').classList.add('show'); }
  function close(){ clearTimer(); locked=false; el('tutorial').classList.remove('show'); }
  function finish(){ close(); }
  return { start, close, next:nextBtn };
})();

  const db=supaClient();
  if(!db) return;
  try{ const {error}=await db.rpc('upsert_score', rpcParams); if(error) console.warn('alloc_lv1 점수 저장 실패:', error); }
  catch(e){ console.warn('alloc_lv1 점수 저장 예외:', e); }
}
function renderResult(){
  const total=totalQuizCount, wrong=total-correctCnt;
  const rate=total?correctCnt/total:0;
  document.getElementById('quiz').style.display='none';
  const box=document.getElementById('result');
  box.style.display='block';
  box.innerHTML=`
    <span class="em">${rate>=0.6?'🎉':'💪'}</span>
    <div class="score">${score.toLocaleString()}점</div>
    <div class="grade">${grade(rate)}</div>
    <div class="res-row">
      <div>정답률<span class="v" style="color:var(--blue)">${Math.round(rate*100)}%</span></div>
      <div>맞힘<span class="v" style="color:var(--green)">${correctCnt}</span></div>
      <div>틀림<span class="v" style="color:var(--red)">${wrong}</span></div>
    </div>
    <div class="res-note">${wrong>0?`틀린 ${wrong}문제가 <b style="color:var(--gold)">오답노트</b>에 저장됐어요.`:'전부 맞혔어요! 완벽합니다 👏'}</div>
    <div class="btn-row">
      <button class="primary" onclick="location.reload()">다시 풀기</button>
      ${wrong>0?'<a href="review.html">오답노트 →</a>':'<a href="index_lv1.html">메인 →</a>'}
    </div>
    <div id="my-rank-badge"></div>
    <div class="rank-title">🏆 TOP 랭킹</div>
    <div id="rank-box"><div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">불러오는 중...</div></div>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
  loadRanking();
}
async function loadRanking(){
  const box=document.getElementById('rank-box');
  const db=supaClient();
  if(!db){ box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">랭킹을 불러올 수 없습니다</div>'; return; }
  const groupId=localStorage.getItem('hub_group_id')||null;
  const me=(localStorage.getItem('hub_nickname')||'').trim();
  try{
    let q=db.from('scores').select('name,score').eq('game_id',GAME_ID).order('score',{ascending:false}).limit(15);
    if(groupId) q=q.eq('group_id',groupId);
    const {data,error}=await q;
    if(error) throw error;
    const list=data||[];
    box.innerHTML = list.length
      ? list.map((r,i)=>{
          const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'위';
          return `<div class="rr-row${r.name===me?' me':''}"><span class="rr-num">${medal}</span><span class="rr-name">${esc(r.name)}</span><span class="rr-score">${(r.score||0).toLocaleString()}</span></div>`;
        }).join('')
      : '<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">아직 기록이 없습니다</div>';
    if(me){
      const myRowQ = groupId ? db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).eq('group_id',groupId).maybeSingle()
                              : db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).maybeSingle();
      const {data:myRow}=await myRowQ;
      if(myRow && Number.isFinite(myRow.score)){
        let cq=db.from('scores').select('*',{count:'exact',head:true}).eq('game_id',GAME_ID).gt('score',myRow.score);
        if(groupId) cq=cq.eq('group_id',groupId);
        const {count}=await cq;
        const badge=document.getElementById('my-rank-badge');
        badge.textContent=`🎯 내 순위: ${((count||0)+1).toLocaleString()}위`;
        badge.style.display='block';
      }
    }
  }catch(e){
    box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">랭킹을 불러올 수 없습니다</div>';
  }
}

const AD_GAME_COUNT_KEY='hub_ad_game_count';
const AD_INTERSTITIAL_EVERY=10;
function incrementGameCount(){
  const n=parseInt(localStorage.getItem(AD_GAME_COUNT_KEY)||'0')+1;
  localStorage.setItem(AD_GAME_COUNT_KEY,String(n)); return n;
}
function requestInterstitialIfNeeded(afterFn){
  if(window.AdBridge && typeof AdBridge.isAdsRemoved==='function' && AdBridge.isAdsRemoved()){ afterFn&&afterFn(); return; }
  window._adAfterFn=afterFn;
  const count=incrementGameCount();
  if(count%AD_INTERSTITIAL_EVERY===0 && window.AdBridge && typeof AdBridge.showInterstitial==='function'){
    AdBridge.showInterstitial();
  } else { afterFn&&afterFn(); }
}
function onInterstitialClosed(){ if(window._adAfterFn){ const f=window._adAfterFn; window._adAfterFn=null; f(); } }
function onAdsRemoved(){}
function hideAdPlaceholder(){ if(window.AdBridge && typeof AdBridge.hide==='function') AdBridge.hide(); }

bindStart();
</script>
