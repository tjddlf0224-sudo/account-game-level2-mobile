<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 저장소가 막힌 환경(프라이빗 브라우징·사이트데이터 차단)에서도 게임이 돌아가게 한다.
         **반드시 다른 스크립트보다 먼저** 로드돼야 한다 — 2026-09-16 검토에서
         이게 없으면 게임 5종이 시작조차 안 되는 것을 확인했다. -->
    <script src="safestore.js?v=36"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>자본의 제왕 — 전산회계 1급 스테이지 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 앱에서 하단 배너가 가릴 수 있는 최대 높이. JS(--ad-safe-h)가 안 걸려도
               이 값 덕분에 팝업은 항상 스크롤 여지를 갖는다(2026-09-14 패턴). */
            --ad-reserve: 96px;
            --bg-color: #1a1a1a;
            --window-bg: #222;
            --panel-bg: #2a2a35;
            --up-color: #ff4757;
            --down-color: #1e90ff;
            --neon-gold: #ffd700;
            --text-main: #ffffff;
            --folder-1: #ff9f43;
            --folder-2: #54a0ff;
            --folder-3: #5f27cd;
            --folder-4: #10ac84;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; /* 스크롤 방지 */
        }

        /* 게임 컨테이너 */
        .game-window {
            width: 1000px;
            height: 700px;
            background: var(--window-bg);
            border: 2px solid #555;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 헤더 — 2급 게임(game1~5)과 동일한 구조: 로고 + HUD 스탯 + 버튼 */
        header {
            display: flex; align-items: center;
            padding: max(8px,env(safe-area-inset-top)) 12px 8px;
            background: rgba(0,0,0,0.3); border-bottom: 1px solid #444;
            flex-shrink: 0; gap: 8px;
        }
        .logo { font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size: clamp(0.85rem,3.5vw,1.4rem); color: var(--neon-gold); flex-shrink: 0; display:flex; align-items:center; gap:6px; }
        /* min-width:0 이 없으면 flex 항목이 내용보다 작아지지 못해, 줄어드는 대신
           **옆 버튼을 화면 밖으로 밀어낸다**(2026-09-16 검토에서 잡힌 원인). */
        .hud { display: flex; gap: clamp(6px,2vw,20px); align-items: center; flex: 1 1 0; min-width: 0; justify-content: center; }
        .hud-stat { display: flex; flex-direction: column; align-items: center; min-width: 0; }
        .hud-label { font-size: clamp(0.55rem,1.8vw,0.7rem); color: rgba(255,255,255,0.4); font-weight: bold; letter-spacing: 1px; white-space: nowrap; }
        .hud-val { white-space: nowrap; }

        /* 좁은 폰에서 헤더가 넘치는 것 방지 — game4_factory 와 같은 규칙.
           2026-09-16 검토: 이 파일에는 이 블록이 **아예 없어서** 320~350px 에서
           '그만'·'홈' 버튼이 화면 밖으로 30px 밀려나 있었다. 자연 폭이 355px 이다. */
        @media(max-width:359px) {
            header { padding-left: 8px; padding-right: 8px; gap: 4px; }
            .header-btns { gap: 4px; }
            .quit-btn { padding: 0 8px; font-size: 0.75rem; }
            .hud { gap: clamp(4px,1.5vw,20px); }
            .logo { font-size: 0.8rem; gap: 4px; }
            .logo .icon { width: 16px; height: 16px; }
        }
        .hud-val { font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size: clamp(1.05rem,3.5vw,1.4rem); color: white; line-height: 1; }
        #hud-price{ color: var(--neon-gold); }
        #hud-day{ color: #7fd8ff; }
        .header-btns{ display:flex; gap:6px; align-items:center; flex-shrink:0; }
        .quit-btn{
            background:none; border:1.5px solid rgba(255,255,255,0.3); color:#ccc;
            border-radius:20px; padding:0 12px; height:36px; font-size:0.78rem;
            font-family:'Black Han Sans',sans-serif; cursor:pointer; white-space:nowrap;
        }
        .quit-btn:active{ transform:scale(0.94); }
        .icon{ display:block; }

        /* 메인 콘텐츠 영역 */
        .content-area {
            flex: 1;
            position: relative;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom)) 20px;
            overflow-y: auto;
            display: flex; flex-direction: column;
        }

        /* 화면 공통 */
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }

        /* 버튼 공통 */
        .btn-action {
            font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size: 1.2rem; border: none;
            border-radius: 8px; color: white; cursor: pointer; white-space: nowrap;
            transition: transform 0.1s, filter 0.2s;
        }
        .btn-action:active { transform: scale(0.96); }

        /* [0. 오프닝] */
        #screen-start { justify-content: center; align-items: center; text-align: center; }
        .start-btn { width:100%; height:52px; line-height:1.2; padding: 0 20px; border-radius:50px; font-size: 1.15rem; background: var(--up-color); margin-top: 0; }

        /* [1. 서류 정리] */
        #screen-class { align-items: center; justify-content: center; }
        #class-word {
            background: white; color: black; padding: 15px 40px;
            border-radius: 15px; font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size: 2rem;
            box-shadow: 0 0 20px var(--neon-gold); margin-bottom: 30px; text-align: center;
        }
        .folder-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            width: 100%; max-width: 900px;
        }
        .folder { cursor: pointer; transition: transform 0.2s; }
        .folder-tab { height: 10px; border-radius: 8px 8px 0 0; width: 40%; }
        .folder-body {
            height: 100px; border-radius: 0 8px 8px 8px;
            display: flex; align-items: center; justify-content: center;
            font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size: 1.2rem; color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5); padding: 5px; text-align: center;
        }

        /* [2. 대화창] — 보카바리스타의 대화 컷씬 패턴 참고: 배경 투명 캐릭터를
           대화창보다 위 레이어에 크게 걸쳐서 배치(비주얼노벨 방식) */
        .dialogue-wrapper {
            flex: 1; position: relative; display: flex; flex-direction: column;
            justify-content: flex-end; align-items: center; width: 100%; overflow: visible;
            padding-bottom: 28px;
        }
        /* ⚠ 가운데 정렬에 translate(-50%) 를 쓰지 않는다 (2026-09-15).
           translate 는 **자기 너비의 절반**을 옮기는 건데, 이미지가 아직 안 받아졌으면
           너비가 0 이라 하나도 안 옮겨진다. 그래서 캐릭터가 처음엔 화면 오른쪽에 붙어
           떴다가, 이미지가 도착해 너비가 잡히는 순간 가운데로 툭 튀었다(실기기 제보).
           left/right:0 + margin:auto 는 **너비를 몰라도** 가운데에 둔다.
           그래서 transform 은 등장 애니메이션(Y 이동)에만 쓴다. */
        .char-cutscene {
            position: absolute; left: 0; right: 0; margin-inline: auto; bottom: 215px;
            /* max-height 의 % 는 부모(.dialogue-wrapper, flex:1) 높이 기준인데 그 높이가
               한 프레임 늦게 잡히면 % 가 안 걸리고 max-width(84%=330px) 만 남아 **1.5배
               크게** 그려졌다가 줄어든다(boss.webp 는 700x700, 제자리 크기는 223px).
               dvh 상한을 같이 걸어 부모 높이를 몰라도 그 정도 크기를 넘지 않게 한다. */
            max-height: min(66%, 30dvh); max-width: 84%; width: auto; height: auto;
            object-fit: contain; object-position: bottom center;
            filter: drop-shadow(0 14px 24px rgba(0,0,0,0.55));
            pointer-events: none; z-index: 1;
            animation: charIn .42s cubic-bezier(.22,1,.36,1);
        }
        @keyframes charIn {
            from { opacity: 0; transform: translateY(26px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .dialogue-box {
            position: relative; z-index: 2;
            background: rgba(0,0,0,0.72); border: 2px solid var(--neon-gold);
            border-radius: 15px; padding: 20px; width: 100%; max-width: 800px;
            min-height: 150px; display: flex; flex-direction: column;
            cursor: pointer;
        }
        .char-name { font-family:'Black Han Sans','Noto Sans KR',sans-serif; color: var(--neon-gold); font-size: 1.3rem; margin-bottom: 10px; }
        .char-text { font-size: 1.1rem; line-height: 1.5; flex: 1; word-break: keep-all; }
        .next-arrow { text-align: right; color: #888; font-size: 0.8rem; margin-top: 10px; }

        /* [4. 분개 화면] */
        #screen-journal { flex-direction: row; gap: 15px; height: 100%; }
        .journal-left { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .journal-problem-box {
            background: #333; padding: 15px; border-radius: 10px;
            border-left: 5px solid var(--neon-gold); font-size: 1.15rem; line-height: 1.5; word-break: keep-all;
        }
        /* 계정과목 풀 — 카드를 손가락으로 끌어다 차변/대변 칸에 놓는 드래그 앤 드롭.
           (버튼 두 개를 카드마다 붙여놓는 방식은 버튼이 많아 지저분하다는 피드백으로 교체) */
        .account-pool {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            padding: 10px; background: #222; border-radius: 10px;
            overflow-y: auto; min-height: 100px; /* 모바일에서 최소 높이 */
        }
        .acc-card {
            background: #3d3d3d; border-radius: 8px; padding: 14px 8px;
            text-align: center; color: #ddd; font-size: 0.92rem; word-break: keep-all;
            cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
            border: 1.5px solid transparent; transition: opacity .12s;
        }
        .acc-card:active{ cursor: grabbing; }
        .acc-card.dragging{ opacity: 0.3; }
        .acc-ghost{
            position: fixed; z-index: 999; pointer-events: none;
            background: #4a4a4a; border: 2px solid var(--neon-gold); border-radius: 8px;
            padding: 12px 18px; color: #fff; font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size: 1rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); white-space: nowrap;
            transform: translate(-50%, -50%) scale(1.08);
        }

        .journal-right { flex: 1; display: flex; flex-direction: column; }
        .journal-board { display: flex; gap: 10px; flex: 1; margin-bottom: 10px; min-height: 150px; }
        .j-col {
            flex: 1; background: rgba(0,0,0,0.3); border: 2px solid #444; border-radius: 10px;
            display: flex; flex-direction: column; padding: 5px; transition: border-color .12s, background .12s;
        }
        .j-col.drop-hover{ border-color: var(--neon-gold); background: rgba(255,215,0,0.1); }
        .j-header { text-align: center; font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size: 1rem; padding: 5px; border-bottom: 1px solid #444; }
        .j-items { flex: 1; padding: 5px; gap: 5px; display: flex; flex-direction: column; overflow-y: auto; }
        .j-item-tag {
            background: #555; color: white; padding: 8px; border-radius: 5px;
            cursor: pointer; display: flex; justify-content: space-between; font-size: 0.9rem; align-items: center;
        }

        /* 시작화면에서는 상단 바를 감춘다(2026-09-16 UI 통일) */
        body.home-mode header { display: none; }
        /* 헤더가 갖고 있던 상단 세이프티 여백을 시작화면에서 대신 준다 —
           안 그러면 노치에 제목이 가린다(2026-09-16 실기기 제보). */
        body.home-mode .content-area { padding-top: calc(20px + env(safe-area-inset-top)); }

        /* 팝업 */
        .popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #252525; padding: 30px; border: 3px solid var(--neon-gold);
            border-radius: 20px; text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9); display: none; z-index: 100;
            /* 오답 해설이 들어가면서 내용이 길어졌다. max-height 가 없으면 팝업이
               화면 밖으로 밀려 '확인' 버튼을 누를 수 없다(2026-09-15).

               왜 배너 높이의 **2배**를 빼는가. 이 팝업은 top:50% + translateY(-50%) 로
               가운데 정렬돼 있어서, 높이를 h 만큼 줄이면 아래쪽은 h/2 만 올라온다.
               팝업 아래끝을 배너 위로 올리려면 배너 높이의 두 배를 빼야 한다. */
            max-height: calc(min(88vh, 88dvh) - 2 * max(var(--ad-banner-h, 0px),
                             var(--ad-safe-h, 0px), var(--ad-reserve))
                             - env(safe-area-inset-bottom, 0px));
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        /* '확인'을 아래에 붙박아 둔다 — 해설이 길어도 끝까지 스크롤하지 않고 넘어갈 수 있게.
           음수 margin 으로 팝업 안쪽 여백(30px)까지 덮어 뒤 글자가 비치지 않게 한다. */
        .popup-foot {
            position: sticky; bottom: -30px; z-index: 2;
            margin: 10px -30px -30px; padding: 12px 30px 30px;
            background: #252525;
        }

        /* ── 오답 해설 (2026-09-15 사용자 지시: "틀렸을 때 틀린 이유를 쉽게 자세하게.
              진짜 실력이 떨어지는 학생들이 게임을 한다고 생각하자") ──
           전에는 모범답안만 덩그러니 보여 줬다. 자기가 뭘 썼는지, 어디가 어떻게
           달랐는지, 왜 그런지가 다 빠져 있어서 못하는 학생일수록 배울 것이 없었다. */
        .ans-box { margin: 14px 0; padding: 13px 15px; border-radius: 10px; text-align: left; }
        .ans-box .ans-label { font-size: .82rem; font-weight: bold; margin-bottom: 6px; letter-spacing: .5px; }
        .ans-box .ans-line { font-size: .95rem; line-height: 1.75; }
        .ans-box .ans-line .side { display: inline-block; min-width: 3.4em; color: #aaa; }
        .ans-mine { background: #3a2626; border: 1px solid rgba(255,71,87,0.45); }
        .ans-mine .ans-label { color: #ff6b7a; }
        .ans-right { background: #263a2e; border: 1px solid rgba(16,172,132,0.5); }
        .ans-right .ans-label { color: #2ee6a8; }
        .diff-box { margin: 14px 0; padding: 13px 15px; border-radius: 10px; text-align: left;
            background: #33302180; border: 1px solid rgba(255,215,0,0.35); }
        .diff-box .diff-line { font-size: .94rem; line-height: 1.8; color: #ffe89a; }
        .diff-box .diff-line b { color: #fff; }
        .why-box { margin: 16px 0 4px; padding: 15px 16px; border-radius: 10px; text-align: left;
            background: #1e2a38; border: 1px solid rgba(84,160,255,0.4); }
        .why-box .why-label { color: #7ec0ff; font-size: .9rem; font-weight: bold; margin-bottom: 8px; }
        .why-box .why-text { font-size: .95rem; line-height: 1.8; color: #dce7f2; word-break: keep-all; }
        .why-box .why-text b { color: #ffd700; }
        .why-box .why-key { display: block; margin-top: 10px; padding-top: 10px;
            border-top: 1px dashed rgba(255,255,255,0.18); color: #9fe8c4; font-weight: bold; }

        /* 토스트(네이티브 alert 대체 — 모바일에서 덜 거슬리는 비차단 안내) */
        .toast-wrap{
            position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
            display:flex; flex-direction:column; gap:8px; align-items:center;
            z-index:200; pointer-events:none; width:92%; max-width:420px;
        }
        .toast{
            background:rgba(20,20,24,0.95); border:1px solid rgba(255,255,255,0.15);
            color:#fff; padding:10px 18px; border-radius:10px; font-size:0.92rem;
            box-shadow:0 4px 16px rgba(0,0,0,0.5); text-align:center;
            opacity:0; transform:translateY(8px); transition:opacity 0.2s, transform 0.2s;
            word-break:keep-all;
        }
        .toast.show{ opacity:1; transform:translateY(0); }
        .toast.err{ border-color:rgba(255,71,87,0.5); }
        .toast.ok{ border-color:rgba(0,230,118,0.5); }

        /* --- 모바일 반응형 미디어 쿼리 --- */
        @media (max-width: 768px) {
            .game-window {
                width: 100%; height: 100vh;
                border: none; border-radius: 0;
            }

            /* 콘텐츠 영역 패딩 축소 */
            .content-area { padding: 15px 15px calc(15px + env(safe-area-inset-bottom)) 15px; }

            /* 1. 폴더 게임: 2열 배치 */
            .folder-grid { grid-template-columns: 1fr 1fr; }

            /* 2. 대화창: 꽉 차게 */
            .char-cutscene { max-height:min(58%, 27dvh); bottom:200px; }   /* 좁은 화면도 같이 올린다(2026-09-15) */
            .dialogue-box { width: 100%; padding: 15px; }

            /* 3. 분개 화면: 상하 배치 — 차변/대변 칸은 보통 1~2줄만 들어가므로
               남는 세로 공간을 억지로 채우지 않고 내용만큼만 차지하게 한다. */
            #screen-journal { flex-direction: column; overflow-y: auto; }
            .journal-left { flex: none; height: auto; max-height: 45%; }
            .journal-right { flex: none; }
            .journal-board { flex: none; min-height: 110px; }
            .j-items { min-height: 60px; }
            .journal-problem-box { font-size: 1.02rem; padding: 10px; }
            .acc-card { padding: 11px 6px; font-size: 0.84rem; }
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes flash-highlight {
            0%, 100% { transform: scale(1); color: var(--neon-gold); }
            50% { transform: scale(1.3); color: #ff4757; text-shadow: 0 0 10px red; }
        }

        .blink-effect {
            animation: flash-highlight 0.5s infinite;
        }

        /* ── 게임 방법 튜토리얼 ── */
        .guide-btn{
            width:100%; height:52px; line-height:1.2; margin-top:0; background:transparent; border:1.5px solid rgba(255,255,255,0.25);
            color:#bbb; padding:0 20px; border-radius:50px; font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size:1rem; cursor:pointer;
        }
        .tut{ display:none; position:fixed; inset:0; z-index:9999; flex-direction:column; background:var(--bg-color); }
        .tut.show{ display:flex; animation:tutPop .25s ease; }
        @keyframes tutPop{ from{opacity:0;transform:scale(.97);} to{opacity:1;transform:scale(1);} }
        .tut-top{ display:flex; align-items:center; gap:9px; padding:calc(12px + env(safe-area-inset-top)) 18px 10px; }
        .tut-top .tt-title{ font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size:1.05rem; color:#fff; }

        const Sound = {

            /* AudioContext 가 없으면 ctx 를 null 로 둔다 — 아래 재생 함수들이
               null 을 걸러 효과음만 빠진다. 던지면 게임 시작이 멈춘다(2026-09-16). */
            init: function() {
                try {
                    if (!this.ctx) {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (e) { this.ctx = null; }
            },
            playTone: function(freq, type, duration, vol=0.1) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playClick: function() { this.playTone(800, 'sine', 0.1, 0.1); },
            playType: function() { this.playTone(600, 'square', 0.05, 0.03); },
            playSuccess: function() {
                setTimeout(() => this.playTone(523.25, 'sine', 0.2), 0);
                setTimeout(() => this.playTone(659.25, 'sine', 0.2), 100);
                setTimeout(() => this.playTone(783.99, 'sine', 0.4), 200);
            },
            playFail: function() {
                this.playTone(150, 'sawtooth', 0.4, 0.2);
            },
            playCash: function() {
                this.playTone(1200, 'square', 0.1, 0.1);
                setTimeout(() => this.playTone(2000, 'sine', 0.4, 0.1), 50);
            }
        };

           실기기 제보: 첫 대화에서 캐릭터가 "한 번 로딩 걸리고" 나서야 제자리에 왔다.
           둘 합쳐 136KB 뿐이라 페이지 로드 때 받아 두면 대화가 시작될 땐 이미 캐시에 있다.
           decode() 까지 해야 첫 페인트에서 디코딩으로 안 버벅인다. */
        (function preloadAvatars(){
            Object.values(AVATARS).forEach(function(a){
                var im = new Image();
                im.src = a.img;
                if (im.decode) im.decode().catch(function(){});   // 실패해도 무해
            });
        })();
        function avatarHtml(who){
            const a = AVATARS[who];
            /* decoding=async: 디코딩이 첫 페인트를 붙잡지 않게. 크기는 CSS 가 잡으므로
               width/height 속성은 주지 않는다(주면 max-height 비율이 어긋난다). */
            return `<img class="char-cutscene" src="${a.img}" alt="" decoding="async">`;
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function formatNum(n) { return n.toLocaleString(); }

        function updateDash() {
            document.getElementById('hud-price').innerText = formatNum(state.stockPrice);
            document.getElementById('work-score').innerText = state.score;
            document.getElementById('day-display').innerText = state.day;
        }

        // --- 나가기(허브로) ---
        async function exitGame(){
            if(await Ask.confirm('허브로 나갈까요? 지금까지의 진행 상황은 저장되지 않습니다.')){
                location.href = 'index_lv1.html';
            }
        }

        // --- 그만(중도 종료 → 지금까지 점수로 바로 결과화면) ---
        async function quitGame(){
            const midGame = !document.getElementById('screen-start').classList.contains('active')
                          && !document.getElementById('screen-ending').classList.contains('active');
            if(!midGame) return;
            if(await Ask.confirm('지금까지 점수로 결과를 볼까요? 남은 일정은 더 진행할 수 없어요.')) showEnding();
        }

        // --- 게임 시작 ---
        function startGame() {
            /* 게임 중에는 배너를 내린다 — 다른 게임 5종과 같은 규칙(2026-09-15).
               실기기 제보: 게임방법·플레이 화면에 배너가 그대로 떠 있었다.
               hide/showAdPlaceholder 함수는 있는데 **아무도 안 불렀다.** */
            hideAdPlaceholder();
            Sound.init();
            Sound.playSuccess();

            state.score = 0;
            state.classCorrect = 0;
            state.journalCorrect = 0;
            state.stockPrice = 10000;
            state.day = 0;

            state.gameList = shuffle([...scenarioPool]).slice(0, 5);

            updateDash();
            startIntro();
        }

        // --- 0. 도입부 — 왜 계정과목부터 분류하는지 짧게 설명 ---
        const introDialogue = [
            { char: "boss", text: "나팀장, 요즘 자본 관련 계정과목들이 장부에 뒤죽박죽 섞여 있더군. 결산 들어가기 전에 싹 정리해 줘." },
            { char: "me", text: "네, 사장님. 먼저 자본금·자본잉여금·자본조정·이익잉여금, 이렇게 성격별로 나눠서 정리하겠습니다." },
        ];
        let introMode = false;
        function startIntro() {
            introMode = true;
            dialogueIdx = 0;
            showScreen('screen-dialogue');
            renderDialogue(introDialogue[0]);
        }

        // --- 1. 분류 미니게임 ---
        let classIdx = 0;
        let currentClassPool = [];

        function startClassGame() {
            classIdx = 0;
            currentClassPool = shuffle([...classData]).slice(0, 5);
            showScreen('screen-class');
            loadClassProblem();
        }

        function loadClassProblem() {
            if (classIdx >= currentClassPool.length) {
                startMainScenario();
                return;
            }
            document.getElementById('class-word').innerText = currentClassPool[classIdx].w;
        }

        function checkClass(type) {
            if (currentClassPool[classIdx].t === type) {
                state.score += 10;
                state.classCorrect++;
                Sound.playClick();
                classIdx++;
                loadClassProblem();
            } else {
                Sound.playFail();
                showToast('땡! 틀렸습니다. 다시 골라보세요.', 'err');
            }
            updateDash();
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            /* 시작화면에서는 상단 바(DAY·평가·주가·그만)를 감춘다 — 아직 시작도 안 했는데
               보이면 어색하고, 2급 게임 5종은 시작화면이 전체를 덮어 안 보인다(2026-09-16). */
            document.body.classList.toggle('home-mode', id === 'screen-start');
        }

        // --- 2. 메인 시나리오 ---
        let dialogueIdx = 0;

        function startMainScenario() {
            if (state.day >= 5) {
                showEnding();
                return;
            }
            dialogueIdx = 0;
            const scene = state.gameList[state.day];
            updateDash();
            showScreen('screen-dialogue');
            renderDialogue(scene.dialogue[0]);
        }

        let typeTimer = null, typeToken = 0;   // 대사 타이핑 타이머(새 대사 시작 때 이전 것을 끊는다)
        function renderDialogue(line) {
            const charName = line.char === 'boss' ? '사장님' : '나회계';
            document.getElementById('char-name').innerText = charName;
            document.getElementById('char-face').innerHTML = avatarHtml(line.char);

            // [추가된 기능] 대사에 '위에 뜬 주가'라는 표현이 있으면 HUD 주가 표시 깜빡임!
            const tickerEl = document.getElementById('hud-price');
            if (line.text.includes("위에 뜬 주가")) {
                tickerEl.classList.add('blink-effect');
                // 3초 뒤에 효과 자동으로 끄기
                setTimeout(() => tickerEl.classList.remove('blink-effect'), 3000);
            }

            const textEl = document.getElementById('char-text');
            textEl.innerHTML = '';
            /* ⚠ 이전 대사의 타이핑 타이머를 멈춘다. 예전엔 안 멈췄다 — 대사가 다 나오기 전에 화면을 눌러
               넘기면 이전 대사의 남은 글자가 새 대사에 **섞여 들어갔다**(2026-09-21 실기기 제보:
               "네 , 들사어장가님기. 전먼에서 자싹본 긍정…"). 같은 요소에 두 타이머가 번갈아 글자를 붙이는 것이라
               두 대사가 글자 단위로 뒤섞인다. 타이머 id 로 끊고, 토큰으로 이미 예약된 콜백도 무효화한다. */
            clearTimeout(typeTimer);
            const myToken = ++typeToken;
            let i = 0;
            // 대사 속 %PRICE%는 실제 현재 주가(HUD와 동일 값)로 치환 — 하드코딩된
            // "지금 주가는 1만원인데" 같은 문구가 셔플된 시나리오 순서 때문에
            // 실제 HUD 숫자와 어긋나던 문제를 방지.
            const txt = line.text.replace(/%PRICE%/g, formatNum(state.stockPrice) + '원');

            // 모바일에서는 타이핑 효과가 너무 느리면 답답하므로 조금 빠르게
            function typeWriter() {
                if (myToken !== typeToken) return;   // 그 사이 다음 대사가 시작됐다
                if (i < txt.length) {
                    textEl.innerHTML += txt.charAt(i);
                    if(i % 3 === 0) Sound.playType();
                    i++;
                    typeTimer = setTimeout(typeWriter, 20); // 속도 향상
                }
            }
            typeWriter();
        }

        function nextDialogue() {
            Sound.playClick();
            dialogueIdx++;

            if (introMode) {
                if (dialogueIdx < introDialogue.length) {
                    renderDialogue(introDialogue[dialogueIdx]);
                } else {
                    introMode = false;
                    startClassGame();
                }
                return;
            }

            const scene = state.gameList[state.day];
            if (dialogueIdx < scene.dialogue.length) {
                renderDialogue(scene.dialogue[dialogueIdx]);
            } else {
                showJournalScreen();
            }
        }

        // --- 3. 분개 ---
        // 예전엔 상단 모드(차변/대변) 버튼을 먼저 눌러야 이후 계정과목 탭이 어느 쪽으로
        // 들어갈지 정해지는 구조였음 — 화면에 안 보이는 상태를 기억해야 해서, 모드
        // 전환을 깜빡하고 누르면 반대쪽에 조용히 들어가는 문제가 있었음. 계정과목
        // 카드마다 "차변으로/대변으로" 버튼을 항상 같이 보여줘서 탭할 때마다 목적지를
        // 명시적으로 고르도록 변경(전수조사 결과 반영).
        let journalOpts = [];
        function showJournalScreen() {
            const scene = state.gameList[state.day];
            showScreen('screen-journal');

            document.getElementById('journal-problem-desc').innerText = "[문제] " + scene.desc;

            state.userJournal = { dr: [], cr: [] };
            updateJournalUI();

            journalOpts = shuffle([...scene.options]);
            renderAccountPool();
        }

        function renderAccountPool() {
            const poolEl = document.getElementById('account-pool');
            poolEl.innerHTML = '';
            const placed = new Set([...state.userJournal.dr, ...state.userJournal.cr]);
            journalOpts.forEach(opt => {
                if (placed.has(opt)) return; // 이미 배치된 계정과목은 풀에서 숨김
                const card = document.createElement('div');
                card.className = 'acc-card';
                card.textContent = opt;
                bindAccountDrag(card, opt);
                poolEl.appendChild(card);
            });
        }

        // --- 계정과목 카드를 손가락/마우스로 끌어다 차변·대변 칸에 놓는 드래그 앤 드롭 ---
        function drCol(){ return document.getElementById('list-dr').closest('.j-col'); }
        function crCol(){ return document.getElementById('list-cr').closest('.j-col'); }
        function zoneAtPoint(x, y){
            const d = drCol().getBoundingClientRect();
            if (x>=d.left && x<=d.right && y>=d.top && y<=d.bottom) return 'dr';
            const c = crCol().getBoundingClientRect();
            if (x>=c.left && x<=c.right && y>=c.top && y<=c.bottom) return 'cr';
            return null;
        }
        function setDropHover(zone){
            drCol().classList.toggle('drop-hover', zone==='dr');
            crCol().classList.toggle('drop-hover', zone==='cr');
        }
        function bindAccountDrag(card, accName){
            let ghost = null;
            function onDown(e){
                e.preventDefault();
                card.setPointerCapture(e.pointerId);
                card.classList.add('dragging');
                ghost = document.createElement('div');
                ghost.className = 'acc-ghost';
                ghost.textContent = accName;
                document.body.appendChild(ghost);
                placeGhost(e.clientX, e.clientY);
                card.addEventListener('pointermove', onMove);
                card.addEventListener('pointerup', onUp);
                card.addEventListener('pointercancel', onUp);
            }
            function placeGhost(x, y){ ghost.style.left = x+'px'; ghost.style.top = y+'px'; }
            function onMove(e){
                placeGhost(e.clientX, e.clientY);
                setDropHover(zoneAtPoint(e.clientX, e.clientY));
            }
            function onUp(e){
                card.removeEventListener('pointermove', onMove);
                card.removeEventListener('pointerup', onUp);
                card.removeEventListener('pointercancel', onUp);
                card.classList.remove('dragging');
                setDropHover(null);
                if (ghost) { ghost.remove(); ghost = null; }
                const zone = zoneAtPoint(e.clientX, e.clientY);
                if (zone) addAccount(accName, zone);
            }
            card.addEventListener('pointerdown', onDown);
        }

        function addAccount(accName, mode) {
            Sound.playClick();
            const targetList = state.userJournal[mode];
            if (!targetList.includes(accName)) {
                targetList.push(accName);
                updateJournalUI();
                renderAccountPool();
            }
        }

        function removeAccount(mode, idx) {
            Sound.playClick();
            state.userJournal[mode].splice(idx, 1);
            updateJournalUI();
            renderAccountPool();
        }

        function updateJournalUI() {
            const drListEl = document.getElementById('list-dr');
            const crListEl = document.getElementById('list-cr');

            drListEl.innerHTML = '';
            crListEl.innerHTML = '';

            state.userJournal.dr.forEach((item, idx) => {
                drListEl.innerHTML += `<div class="j-item-tag" onclick="removeAccount('dr', ${idx})">${item} <span>✕</span></div>`;
            });
            state.userJournal.cr.forEach((item, idx) => {
                crListEl.innerHTML += `<div class="j-item-tag" onclick="removeAccount('cr', ${idx})">${item} <span>✕</span></div>`;
            });
        }

        function submitJournal() {
            const scene = state.gameList[state.day];
            const u = state.userJournal;
            const a = scene.answer;

            if (u.dr.length === 0 || u.cr.length === 0) {
                Sound.playFail();
                return showToast('차변과 대변을 모두 채워주세요.', 'err');
            }

            // slice() 없이 sort() 하면 scene.answer 가 제자리에서 바뀌어 다음 판까지 순서가 남는다
            const uDrStr = JSON.stringify(u.dr.slice().sort());
            const aDrStr = JSON.stringify(a.dr.slice().sort());
            const uCrStr = JSON.stringify(u.cr.slice().sort());
            const aCrStr = JSON.stringify(a.cr.slice().sort());

            const isCorrect = (uDrStr === aDrStr && uCrStr === aCrStr);

            if (isCorrect) {
                state.score += 20;
                state.journalCorrect++;
                Sound.playSuccess();
            } else {
                Sound.playFail();
            }

            showResult(isCorrect);
        }

        // --- 결과 ---

        /* ── 오답 해설 (2026-09-15) ────────────────────────────────────────
           사용자 지시: "틀렸을 때 틀린 이유를 쉽게 자세하게 써줘. 진짜 실력이
           떨어지는 학생들이 게임을 한다고 생각하자."
           전에는 모범답안만 보여 줬다. 자기가 뭘 썼는지, 어디가 어떻게 달랐는지,
           왜 그런지가 전부 빠져 있어서 못하는 학생일수록 배울 것이 없었다. */

        // 받침에 따라 조사를 고른다 — "자기주식을 / 현금을" 처럼 어색하지 않게
        function josa(word, withJong, withoutJong) {
            if (!word) return withJong;
            const c = word.charCodeAt(word.length - 1);
            if (c < 0xAC00 || c > 0xD7A3) return withJong;      // 한글이 아니면 기본값
            return ((c - 0xAC00) % 28) ? withJong : withoutJong;
        }
        function accList(arr) { return arr && arr.length ? arr.join(', ') : '(비어 있음)'; }

        function answerBox(cls, label, dr, cr) {
            return `<div class="ans-box ${cls}">
                        <div class="ans-label">${label}</div>
                        <div class="ans-line"><span class="side">[차변]</span>${accList(dr)}</div>
                        <div class="ans-line"><span class="side">[대변]</span>${accList(cr)}</div>
                    </div>`;
        }

        // 무엇이 어떻게 달랐는지 콕 집어 준다 — 빠뜨린 것 / 잘못 넣은 것
        function diffBox(u, a) {
            const lines = [];
            const mine = [...u.dr, ...u.cr].slice().sort().join('|');
            const ans  = [...a.dr, ...a.cr].slice().sort().join('|');

            if (mine === ans) {
                // 가장 흔한 실수라 따로 짚어 준다
                lines.push('계정과목은 <b>전부 맞게</b> 골랐어요! 그런데 <b>차변과 대변 자리가 서로 바뀌었습니다.</b>');
            } else {
                const miss = (list, side) => {
                    if (!list.length) return;
                    const t = list.join(', ');
                    lines.push(`<b>${side}</b>에 <b>${t}</b>${josa(list[list.length-1], '이', '가')} 빠졌어요.`);
                };
                const extra = (list, side) => {
                    if (!list.length) return;
                    const t = list.join(', ');
                    lines.push(`<b>${side}</b>에 넣은 <b>${t}</b>${josa(list[list.length-1], '은', '는')} 이 거래에 쓰지 않아요.`);
                };
                miss(a.dr.filter(x => !u.dr.includes(x)), '차변');
                miss(a.cr.filter(x => !u.cr.includes(x)), '대변');
                extra(u.dr.filter(x => !a.dr.includes(x)), '차변');
                extra(u.cr.filter(x => !a.cr.includes(x)), '대변');
            }
            if (!lines.length) return '';
            return `<div class="diff-box">${lines.map(l => `<div class="diff-line">· ${l}</div>`).join('')}</div>`;
        }

        function whyBox(scene) {
            if (!scene.why) return '';
            const key = scene.whyKey ? `<span class="why-key">👉 ${scene.whyKey}</span>` : '';
            return `<div class="why-box">
                        <div class="why-label">💡 왜 그럴까요?</div>
                        <div class="why-text">${scene.why}${key}</div>
                    </div>`;
        }

        function showResult(isCorrect) {
            const scene = state.gameList[state.day];
            const oldPrice = state.stockPrice;

            // 오답일 경우 페널티 적용
            let finalEffect = isCorrect ? scene.effect : (scene.effect > 0 ? 0 : scene.effect * 1.2);

            state.stockPrice = Math.floor(oldPrice * (1 + finalEffect));
            state.day++;

            const title = isCorrect ? "결재 승인" : "결재 반려";
            const titleColor = isCorrect ? "var(--folder-4)" : "var(--up-color)";
            const color = finalEffect > 0 ? "var(--up-color)" : (finalEffect < 0 ? "var(--down-color)" : "white");
            const move = finalEffect > 0 ? "급등" : (finalEffect < 0 ? "하락" : "보합");

            let msg = isCorrect ? "완벽합니다! 업무 점수 +20" : "장부가 틀렸습니다. 어디가 달랐는지 같이 볼까요?";

            if (!isCorrect) {
                const u = state.userJournal, a = scene.answer;
                msg += answerBox('ans-mine',  '내가 쓴 답', u.dr, u.cr);
                msg += answerBox('ans-right', '정답 (모범 답안)', a.dr, a.cr);
                msg += diffBox(u, a);
                msg += whyBox(scene);
            }

            msg += "<hr style='border-color:#444; margin:20px 0;'>";
            msg += `시장 반응: <span style="color:${color}; font-weight:bold;">${move}</span> (${(finalEffect*100).toFixed(1)}%)<br>`;
            msg += `주가: ${formatNum(oldPrice)} -> ${formatNum(state.stockPrice)}`;

            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-title').style.color = titleColor;
            document.getElementById('popup-msg').innerHTML = msg;
            const pop = document.getElementById('popup');
            pop.style.display = 'block';
            pop.scrollTop = 0;   // 해설이 길어 스크롤이 생긴다 — 항상 맨 위부터 보이게

            updateDash();
        }

        function closePopup() {
            Sound.playClick();
            document.getElementById('popup').style.display = 'none';
            startMainScenario();
        }

        // --- 엔딩 --- (등급은 gradeForCapitalScore()로 통일 — 아래 저장에 쓰는 등급과 화면에 보이는
        // 등급이 서로 다른 문구였던 걸 하나로 정리)
        function showEnding() {
            showAdPlaceholder();   // 결과화면에서는 다시 띄운다
            requestInterstitialIfNeeded(async function(){
                Sound.playSuccess();
                showScreen('screen-ending');

                document.getElementById('end-score').innerText = state.score;

                const rank = gradeForCapitalScore(state.score);
                document.getElementById('end-rank').innerText = rank;

                // 저장이 끝나기 전에 랭킹을 조회하면 방금 낸 내 점수가 목록에 안 보이는
                // 레이스 컨디션이 생김(stage4/5는 처음부터 await로 순서를 보장했었음) — await로 순서 고정.
                try{ await saveStageScore(state.score, rank); }catch(e){}
                try{ loadRanking(); }catch(e){}
            });
        }

        /* =========================================================================
         *  Tutorial — 이 게임의 두 메커닉(① 계정과목 분류 탭, ② 분개 드래그앤드롭)을
         *  각각 실제 조작으로 한 번씩 체험시키는 인터랙티브 미니 튜토리얼.
         *  game4_factory.html Tutorial 엔진과 같은 톤(단계별 말풍선+타겟 하이라이트)이되,
         *  이 게임은 메커닉이 두 가지라 스텝마다 mode로 분기해서 그에 맞는 데모 UI를 그림.
         * ========================================================================= */
        const TUT_STEPS = [
          { mode:'text', text:'이 스테이지는 두 단계로 진행돼요. 먼저 계정과목을 성격별로 <b>분류</b>하고,<br>그 다음 실제 거래를 보고 <b>분개</b>를 완성합니다. 하나씩 같이 해볼까요?', btn:'시작 ▶' },
          { mode:'classify', text:'"보통주 자본금"은 회사가 최초로 받은 출자금이니 <b>자본금</b> 폴더예요.<br>빛나는 폴더를 눌러보세요.', tap:'capital', hint:'👆 빛나는 폴더를 탭!' },
          { mode:'classify', text:'정답! 이런 식으로 5개 계정과목을 성격별 폴더에 분류하면 다음 단계로 넘어가요.', glow:true, btn:'다음 ▶' },
          { mode:'drag', card:'현금', zone:'dr', dr:[], cr:[],
            text:'이제 <b>분개</b>예요. 화면은 위에서부터 <b>거래 → 계정과목 카드 → 차변·대변 칸 → 결재 상신</b> 순서예요.<br>판매대금으로 <b>현금을 받았으니</b> 자산이 늘어 <b>차변</b>에 옵니다.',
            hint:'👆 "현금" 카드를 차변 칸으로 드래그!',
            wrongZone:'앗, <b>현금이 늘었으니(자산 증가)</b> 차변이에요. 왼쪽 칸으로 옮겨 보세요.' },
          { mode:'drag', card:'상품매출', zone:'cr', dr:['현금'], cr:[],
            text:'차변을 채웠으면 <b>대변</b>도 채워야 해요.<br>상품을 팔아 <b>수익이 생겼으니</b> <b>상품매출</b>은 대변입니다.',
            hint:'👆 "상품매출" 카드를 대변 칸으로 드래그!',
            wrongZone:'앗, <b>수익이 생기면 대변</b>이에요. 오른쪽 칸으로 옮겨 보세요.' },
          { mode:'submit', dr:['현금'], cr:['상품매출'],
            text:'차변·대변이 모두 찼어요. 이제 <b>결재 상신</b>을 눌러야 채점됩니다.<br>틀리면 사장님이 반려하면서 <b>내가 쓴 답·정답·왜 그런지</b>까지 알려주니 걱정 마세요.',
            hint:'👆 "결재 상신"을 눌러 보세요' },
          { mode:'text', text:'맞힌 만큼 회사 주가도 오르고 업무 점수도 쌓여요. 준비됐으면 실제 업무를 시작해볼까요?', btn:'업무 시작 ▶', finish:true },
        ];
        const Tutorial = (function(){
          let step=0, locked=false, timer=null;
          const FOLDERS=[['capital','자본금','var(--folder-1)'],['surplus','자본잉여금','var(--folder-2)'],['adjust','자본조정','var(--folder-3)'],['retained','이익잉여금','var(--folder-4)']];
          function el(id){ return document.getElementById(id); }

          function buildClassify(){
            const grid=el('tut-folder-grid');
            grid.innerHTML = FOLDERS.map(([t,label,color])=>
              `<div class="folder" data-type="${t}"><div class="folder-tab" style="background:${color}"></div><div class="folder-body" style="background:${color}">${label}</div></div>`
            ).join('');
            grid.querySelectorAll('.folder').forEach(f=>f.addEventListener('pointerdown', e=>{ e.preventDefault(); onFolderTap(f.dataset.type, f); }));
          }
          function onFolderTap(type, f){
            const s=TUT_STEPS[step];
            if(locked || s.mode!=='classify' || !s.tap) return;
            if(type!==s.tap){
              locked=true;
              el('tut-text').innerHTML='앗, 그건 아니에요. 회사가 처음 받은 출자금은 <b>자본금</b> 폴더예요.';
              el('tut-hint').style.display='block'; el('tut-hint').textContent='👆 다시 골라 보세요';
              timer=setTimeout(()=>{ timer=null; locked=false; render(); }, 1400);
              return;
            }
            locked=true;
            f.style.outline='3px solid #2ecc71';
            timer=setTimeout(()=>{ timer=null; locked=false; go(step+1); }, 550);
          }

          /* 분개 연습판. 실제 게임(#screen-journal)과 **같은 계정과목 풀**을 쓴다 —
             전에는 "현금" 한 장만 1열로 놓여 있어서 실제 화면과 달랐다.
             각 단계가 화면의 완성된 상태(dr/cr)를 통째로 들고 있어, 건너뛰기→재진입해도
             같은 그림이 나온다(game1·game2 튜토리얼과 같은 방식). */
          const TUT_ACCOUNTS = ['현금', '상품매출', '외상매출금', '자본금'];

          function buildDrag(s){
            el('tut-list-dr').innerHTML = (s.dr || []).map(a => `<div class="j-item-tag">${a} <span>✕</span></div>`).join('');
            el('tut-list-cr').innerHTML = (s.cr || []).map(a => `<div class="j-item-tag">${a} <span>✕</span></div>`).join('');
            const placed = new Set([...(s.dr || []), ...(s.cr || [])]);
            const pool = el('tut-account-pool');
            pool.innerHTML = '';
            TUT_ACCOUNTS.forEach(name => {
              if (placed.has(name)) return;               // 이미 배치된 카드는 실제 게임처럼 풀에서 사라진다
              const card = document.createElement('div');
              card.className = 'acc-card';
              if (s.card === name) card.classList.add('tut-target');
              else if (s.mode === 'drag') card.classList.add('tut-dim');
              card.textContent = name;
              bindTutDrag(card, name);
              pool.appendChild(card);
            });
            const sb = el('tut-submit');
            sb.classList.toggle('tut-target', s.mode === 'submit');
            sb.style.opacity = (s.mode === 'submit') ? '1' : '0.45';
          }

          function tutZoneAt(x,y){
            const d=el('tut-dr-col').getBoundingClientRect();
            if(x>=d.left&&x<=d.right&&y>=d.top&&y<=d.bottom) return 'dr';
            const c=el('tut-cr-col').getBoundingClientRect();
            if(x>=c.left&&x<=c.right&&y>=c.top&&y<=c.bottom) return 'cr';
            return null;
          }

          function bindTutDrag(card, name){
            function onDown(e){
              e.preventDefault();
              card.setPointerCapture(e.pointerId);
              card.classList.add('dragging');
              card.addEventListener('pointermove', onMove);
              card.addEventListener('pointerup', onUp);
              card.addEventListener('pointercancel', onUp);
            }
            function onMove(e){
              const zone=tutZoneAt(e.clientX, e.clientY);
              el('tut-dr-col').classList.toggle('drop-hover', zone==='dr');
              el('tut-cr-col').classList.toggle('drop-hover', zone==='cr');
            }
            function onUp(e){
              card.removeEventListener('pointermove', onMove);
              card.removeEventListener('pointerup', onUp);
              card.removeEventListener('pointercancel', onUp);
              card.classList.remove('dragging');
              el('tut-dr-col').classList.remove('drop-hover');
              el('tut-cr-col').classList.remove('drop-hover');
              const zone=tutZoneAt(e.clientX, e.clientY);
              const s=TUT_STEPS[step];
              if(!s || s.mode!=='drag' || locked || !zone) return;

              if(name !== s.card){            // 순서를 알려 주되 막지는 않는다
                el('tut-text').innerHTML = `지금은 <b>${s.card}</b> 카드를 옮길 차례예요.`;
                el('tut-hint').style.display='block'; el('tut-hint').textContent = s.hint;
                return;
              }
              if(zone === s.zone){
                locked=true;
                const list = (zone==='dr') ? 'tut-list-dr' : 'tut-list-cr';
                el(list).innerHTML += `<div class="j-item-tag">${name} <span>✕</span></div>`;
                card.remove();
                try { Sound.playSuccess(); } catch(err) {}
                timer=setTimeout(()=>{ timer=null; locked=false; go(step+1); }, 550);
              } else {
                try { Sound.playFail(); } catch(err) {}
                el('tut-text').innerHTML = s.wrongZone || '앗, 반대쪽 칸이에요.';
                el('tut-hint').style.display='block'; el('tut-hint').textContent = s.hint;
              }
            }
            card.addEventListener('pointerdown', onDown);
          }

          // '결재 상신'까지 실제로 눌러 보게 한다 — 전에는 버튼이 튜토리얼에 없었다
          function bindSubmit(){
            if (bindSubmit._done) return;
            bindSubmit._done = true;
            el('tut-submit').addEventListener('pointerdown', function(e){
              e.preventDefault();
              const s=TUT_STEPS[step];
              if(locked || !s || s.mode!=='submit') return;
              locked=true;
              try { Sound.playSuccess(); } catch(err) {}
              el('tut-text').innerHTML='완벽해요! 이렇게 <b>결재 상신</b>을 올리면 채점됩니다.';
              el('tut-hint').style.display='none';
              timer=setTimeout(()=>{ timer=null; locked=false; go(step+1); }, 900);
            });
          }

          function render(){
            const s=TUT_STEPS[step];
            el('tut-badge').textContent=(step+1)+'/'+TUT_STEPS.length;
            el('tut-text').innerHTML=s.text;
            el('tut-classify').style.display = s.mode==='classify' ? 'block' : 'none';
            el('tut-drag').style.display = (s.mode==='drag' || s.mode==='submit') ? 'block' : 'none';
            if(s.mode==='classify'){
              el('tut-folder-grid').querySelectorAll('.folder').forEach(f=>{
                f.classList.remove('tut-target','tut-dim'); f.style.outline='';
                if(s.tap){ if(f.dataset.type===s.tap) f.classList.add('tut-target'); else f.classList.add('tut-dim'); }
              });
            }
            const hint=el('tut-hint');
            if(s.hint){ hint.style.display='block'; hint.textContent=s.hint; } else hint.style.display='none';
            const btn=el('tut-next');
            if(s.btn){ btn.style.display='block'; btn.textContent=s.btn; } else btn.style.display='none';
          }

          function go(n){
            step=n; if(step>=TUT_STEPS.length) return finish();
            const s=TUT_STEPS[step];
            if(s.mode==='classify' && !el('tut-folder-grid').children.length) buildClassify();
            if(s.mode==='drag' || s.mode==='submit') buildDrag(s);
            render();
          }
          function nextBtn(){ if(TUT_STEPS[step].finish) return finish(); go(step+1); }
          function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }
          function start(){
            /* 게임 방법(튜토리얼) 중에도 배너를 내린다 — 실기기 제보(2026-09-15).
               닫을 때는 곧바로 되돌리지 않는다: finish() 는 close() 뒤에 게임을 시작하는데,
               거기서 show 를 해 버리면 게임 중에 배너가 다시 올라온다. 대신 시작화면으로
               돌아가는 경우만 되살리도록 startGame/startQuiz 쪽 hide 와 짝을 맞춰 뒀다. */
            if (typeof hideAdPlaceholder === 'function') hideAdPlaceholder();
            clearTimer(); step=0; locked=false;
            buildClassify(); bindSubmit();
            render();
            el('tutorial').classList.add('show');
          }
          function close(){
            if (typeof showAdPlaceholder === 'function') showAdPlaceholder(); clearTimer(); locked=false; el('tutorial').classList.remove('show'); }
          function finish(){ close(); }
          return { start, close, next:nextBtn };
        })();
    </script>

    <script>
        /* =========================================================================
         *  스테이지3 허브 연동 — stage1_cost.html의 P6 패턴과 동일:
         *  로컬 진행 저장(lv1_s3_progress, 허브 노드맵용) + Supabase(game_id:'capital_lv1')
         * ========================================================================= */
        const SUPA_URL='https://pjagaulfivafamhhiveg.supabase.co';
        const SUPA_KEY='sb_publishable_yck2tAKApEjVSJOJMVSXuQ_AGaNatuI';
        const GAME_ID='capital_lv1';
        const S3_SAVE_KEY='lv1_s3_progress';
        let _supaDb=null;
        function supaClient(){
          if(_supaDb) return _supaDb;
          try{ if(window.supabase && supabase.createClient) _supaDb=supabase.createClient(SUPA_URL, SUPA_KEY); }catch(e){}
          return _supaDb;
        }
        function gradeForCapitalScore(score){
          // 만점 150(분류 5×10 + 분개 5×20) 기준
          if(score>=140) return '👑 전설의 CFO';
          if(score>=110) return '🥇 우수';
          if(score>=70)  return '🥈 합격';
          return '🥉 재도전 권장';
        }
        async function saveStageScore(score, rank){
          try{
            localStorage.setItem(S3_SAVE_KEY, JSON.stringify({
              cleared:true, score, rank, finalStockPrice:state.stockPrice,
              classCorrect:state.classCorrect, journalCorrect:state.journalCorrect,
              playedAt:new Date().toISOString()
            }));
          }catch(e){}

          const name=(localStorage.getItem('hub_nickname')||'').trim();
          if(!name) return;                          // 로그인 안 된 상태(로컬 테스트 등)면 스킵
          const correct = state.classCorrect + state.journalCorrect;
          const grade = gradeForCapitalScore(score);
          const groupId = localStorage.getItem('hub_group_id') || null;
          const today = new Date().toISOString().split('T')[0];
          const rpcParams={ p_game_id:GAME_ID, p_name:name, p_score:score, p_grade:grade, p_combo:0, p_correct:correct, p_date:today };
          if(groupId) rpcParams.p_group_id=groupId;
          try{ if(window.Auth){ const uid=await Auth.currentUid(); if(uid) rpcParams.p_uid=uid; } }catch(e){}
          if(window.Growth) Growth.record({ game:GAME_ID, name, score, grade, combo:0, correct });
          if(window.Growth) Growth.logPlay(GAME_ID);
          const db=supaClient();
          if(!db) return;
          try{ const {error}=await db.rpc('upsert_score', rpcParams); if(error) console.warn('capital_lv1 점수 저장 실패:', error); }
          catch(e){ console.warn('capital_lv1 점수 저장 예외:', e); }
        }

        function escHtml(s){ return String(s==null?'':s).replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
        /* ── TOP 랭킹(stage1_cost.html ResultScreen.loadRanking 패턴 이식) ── */
        async function loadRanking(){
          const box=document.getElementById('rank-box');
          const db=supaClient();
          if(!db){ box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">랭킹을 불러올 수 없습니다</div>'; return; }
          const groupId=localStorage.getItem('hub_group_id')||null;
          const me=(localStorage.getItem('hub_nickname')||'').trim();
          try{
            let q=db.from('scores').select('name,score').eq('game_id',GAME_ID).order('score',{ascending:false}).limit(15);
            if(groupId) q=q.eq('group_id',groupId);
            const {data,error}=await q;
            if(error) throw error;
            const list=data||[];
            box.innerHTML = '<div class="rank-hdr">🏆 TOP 랭킹</div>' + (list.length
              ? list.map((r,i)=>{
                  const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'위';
                  return `<div class="rr-row${r.name===me?' me':''}"><span class="rr-num">${medal}</span><span class="rr-name">${escHtml(r.name)}</span><span class="rr-score">${(r.score||0).toLocaleString()}</span></div>`;
                }).join('')
              : '<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">아직 기록이 없습니다</div>');
            if(me){
              const myRowQ = groupId ? db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).eq('group_id',groupId).maybeSingle()
                                      : db.from('scores').select('score').eq('game_id',GAME_ID).eq('name',me).maybeSingle();
              const {data:myRow}=await myRowQ;
              if(myRow && Number.isFinite(myRow.score)){
                let cq=db.from('scores').select('*',{count:'exact',head:true}).eq('game_id',GAME_ID).gt('score',myRow.score);
                if(groupId) cq=cq.eq('group_id',groupId);
                const {count}=await cq;
                const badge=document.getElementById('my-rank-badge');
                badge.textContent=`🎯 내 순위: ${((count||0)+1).toLocaleString()}위`;
                badge.style.display='block';
              }
            }
          }catch(e){
            box.innerHTML='<div style="padding:22px;color:rgba(255,255,255,.3);font-size:.8rem;text-align:center;">랭킹을 불러올 수 없습니다</div>';
          }
        }
    </script>

    <script>
        /* =========================================================================
         *  광고 시스템 — 2급 게임(game4_factory.html 등)과 동일 패턴.
         *  AdBridge는 capacitor-bridge.js(네이티브 앱에서만 로드)가 주입 — 웹 배포판은
         *  window.AdBridge 자체가 없어 항상 즉시 afterFn()으로 열린다(웹은 원래도 이랬음).
         * ========================================================================= */
        const AD_GAME_COUNT_KEY='hub_ad_game_count';
        const AD_INTERSTITIAL_EVERY=10; // N번마다 전면 광고
        function incrementGameCount(){
          const n=(parseInt(localStorage.getItem(AD_GAME_COUNT_KEY)||'0'))+1;
          localStorage.setItem(AD_GAME_COUNT_KEY, String(n));
          return n;
        }
        function requestInterstitialIfNeeded(afterFn){
          if(window.AdBridge && typeof AdBridge.isAdsRemoved==='function' && AdBridge.isAdsRemoved()){ afterFn&&afterFn(); return; }
          window._adAfterFn=afterFn;
          const count=incrementGameCount();
          if(count%AD_INTERSTITIAL_EVERY===0 && window.AdBridge){
            AdBridge.showInterstitial();
          } else {
            /* 광고를 안 띄우고 넘어가는 길 — 예약해 둔 함수를 **반드시 지우고** 부른다.
               안 지우면 뒤늦은 광고 닫힘 신호에 지난 함수가 한 번 더 불린다(2026-09-16). */
            window._adAfterFn = null;
            afterFn&&afterFn();
          }
        }
        function onAdsRemoved(){}
        function onInterstitialClosed(){ if(window._adAfterFn){ const f=window._adAfterFn; window._adAfterFn=null; f(); } }
        function hideAdPlaceholder(){ if(window.AdBridge) AdBridge.hide(); }
        function showAdPlaceholder(){ if(window.AdBridge) AdBridge.show(); }
    </script>
