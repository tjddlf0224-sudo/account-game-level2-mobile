<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자본의 제왕 — 전산회계 1급 스테이지 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --window-bg: #222;
            --panel-bg: #2a2a35;
            --up-color: #ff4757;
            --down-color: #1e90ff;
            --neon-gold: #ffd700;
            --text-main: #ffffff;
            --folder-1: #ff9f43;
            --folder-2: #54a0ff;
            --folder-3: #5f27cd;
            --folder-4: #10ac84;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; /* 스크롤 방지 */
        }

        /* 게임 컨테이너 */
        .game-window {
            width: 1000px;
            height: 700px;
            background: var(--window-bg);
            border: 2px solid #555;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 헤더 — 2급 게임(game1~5)과 동일한 구조: 로고 + HUD 스탯 + 버튼 */
        header {
            display: flex; align-items: center;
            padding: max(8px,env(safe-area-inset-top)) 12px 8px;
            background: rgba(0,0,0,0.3); border-bottom: 1px solid #444;
            flex-shrink: 0; gap: 8px;
        }
        .logo { font-family: 'Jua'; font-size: clamp(0.85rem,3.5vw,1.4rem); color: var(--neon-gold); flex-shrink: 0; display:flex; align-items:center; gap:6px; }
        .logo .stage-tag{ display:block; font-family:'Noto Sans KR',sans-serif; font-size:0.62rem; color:rgba(255,255,255,0.4); letter-spacing:0.03em; font-weight:400; }
        .hud { display: flex; gap: clamp(6px,2vw,20px); align-items: center; flex: 1; justify-content: center; }
        .hud-stat { display: flex; flex-direction: column; align-items: center; min-width: 40px; }
        .hud-label { font-size: clamp(0.55rem,1.8vw,0.7rem); color: rgba(255,255,255,0.4); font-weight: bold; letter-spacing: 1px; }
        .hud-val { font-family: 'Jua'; font-size: clamp(1.05rem,3.5vw,1.4rem); color: white; line-height: 1; }
        #hud-price{ color: var(--neon-gold); }
        #hud-day{ color: #7fd8ff; }
        .exit-btn{
            width:40px; height:40px; border-radius:50%; flex-shrink:0;
            background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
            color:#ccc; display:flex; align-items:center; justify-content:center;
            cursor:pointer;
        }
        .exit-btn:active{ transform:scale(0.92); }
        .icon{ display:block; }

        /* 메인 콘텐츠 영역 */
        .content-area {
            flex: 1;
            position: relative;
            padding: 20px;
            overflow-y: auto;
            display: flex; flex-direction: column;
        }

        /* 화면 공통 */
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }

        /* 버튼 공통 */
        .btn-action {
            font-family: 'Jua'; font-size: 1.2rem; border: none;
            border-radius: 8px; color: white; cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }
        .btn-action:active { transform: scale(0.96); }

        /* [0. 오프닝] */
        #screen-start { justify-content: center; align-items: center; text-align: center; }
        .start-btn { padding: 15px 40px; font-size: 1.4rem; background: var(--up-color); margin-top: 30px; }

        /* [1. 서류 정리] */
        #screen-class { align-items: center; justify-content: center; }
        #class-word {
            background: white; color: black; padding: 15px 40px;
            border-radius: 15px; font-family:'Jua'; font-size: 2rem;
            box-shadow: 0 0 20px var(--neon-gold); margin-bottom: 30px; text-align: center;
        }
        .folder-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            width: 100%; max-width: 900px;
        }
        .folder { cursor: pointer; transition: transform 0.2s; }
        .folder-tab { height: 10px; border-radius: 8px 8px 0 0; width: 40%; }
        .folder-body {
            height: 100px; border-radius: 0 8px 8px 8px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Jua'; font-size: 1.2rem; color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5); padding: 5px; text-align: center;
        }

        /* [2. 대화창] */
        .dialogue-wrapper {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%;
        }
        .char-img { margin-bottom: 15px; animation: bounce 2s infinite; }
        .char-avatar { width:88px; height:88px; border-radius:50%; object-fit:cover; display:block; box-shadow:0 4px 18px rgba(0,0,0,0.4); border:2px solid rgba(255,255,255,0.15); }
        .dialogue-box {
            background: rgba(0,0,0,0.6); border: 2px solid var(--neon-gold);
            border-radius: 15px; padding: 20px; width: 100%; max-width: 800px;
            min-height: 150px; display: flex; flex-direction: column;
            cursor: pointer;
        }
        .char-name { font-family: 'Jua'; color: var(--neon-gold); font-size: 1.3rem; margin-bottom: 10px; }
        .char-text { font-size: 1.1rem; line-height: 1.5; flex: 1; word-break: keep-all; }
        .next-arrow { text-align: right; color: #888; font-size: 0.8rem; margin-top: 10px; }

        /* [4. 분개 화면] */
        #screen-journal { flex-direction: row; gap: 15px; height: 100%; }
        .journal-left { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .journal-problem-box {
            background: #333; padding: 15px; border-radius: 10px;
            border-left: 5px solid var(--neon-gold); font-size: 1.15rem; line-height: 1.5; word-break: keep-all;
        }
        /* 계정과목 풀 — 카드를 손가락으로 끌어다 차변/대변 칸에 놓는 드래그 앤 드롭.
           (버튼 두 개를 카드마다 붙여놓는 방식은 버튼이 많아 지저분하다는 피드백으로 교체) */
        .account-pool {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            padding: 10px; background: #222; border-radius: 10px;
            overflow-y: auto; min-height: 100px; /* 모바일에서 최소 높이 */
        }
        .acc-card {
            background: #3d3d3d; border-radius: 8px; padding: 14px 8px;
            text-align: center; color: #ddd; font-size: 0.92rem; word-break: keep-all;
            cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
            border: 1.5px solid transparent; transition: opacity .12s;
        }
        .acc-card:active{ cursor: grabbing; }
        .acc-card.dragging{ opacity: 0.3; }
        .acc-ghost{
            position: fixed; z-index: 999; pointer-events: none;
            background: #4a4a4a; border: 2px solid var(--neon-gold); border-radius: 8px;
            padding: 12px 18px; color: #fff; font-family: 'Jua'; font-size: 1rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); white-space: nowrap;
            transform: translate(-50%, -50%) scale(1.08);
        }

        .journal-right { flex: 1; display: flex; flex-direction: column; }
        .journal-board { display: flex; gap: 10px; flex: 1; margin-bottom: 10px; min-height: 150px; }
        .j-col {
            flex: 1; background: rgba(0,0,0,0.3); border: 2px solid #444; border-radius: 10px;
            display: flex; flex-direction: column; padding: 5px; transition: border-color .12s, background .12s;
        }
        .j-col.drop-hover{ border-color: var(--neon-gold); background: rgba(255,215,0,0.1); }
        .j-header { text-align: center; font-family: 'Jua'; font-size: 1rem; padding: 5px; border-bottom: 1px solid #444; }
        .j-items { flex: 1; padding: 5px; gap: 5px; display: flex; flex-direction: column; overflow-y: auto; }
        .j-item-tag {
            background: #555; color: white; padding: 8px; border-radius: 5px;
            cursor: pointer; display: flex; justify-content: space-between; font-size: 0.9rem; align-items: center;
        }

        /* 팝업 */
        .popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #252525; padding: 30px; border: 3px solid var(--neon-gold);
            border-radius: 20px; text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9); display: none; z-index: 100;
        }

        /* 토스트(네이티브 alert 대체 — 모바일에서 덜 거슬리는 비차단 안내) */
        .toast-wrap{
            position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
            display:flex; flex-direction:column; gap:8px; align-items:center;
            z-index:200; pointer-events:none; width:92%; max-width:420px;
        }
        .toast{
            background:rgba(20,20,24,0.95); border:1px solid rgba(255,255,255,0.15);
            color:#fff; padding:10px 18px; border-radius:10px; font-size:0.92rem;
            box-shadow:0 4px 16px rgba(0,0,0,0.5); text-align:center;
            opacity:0; transform:translateY(8px); transition:opacity 0.2s, transform 0.2s;
            word-break:keep-all;
        }
        .toast.show{ opacity:1; transform:translateY(0); }
        .toast.err{ border-color:rgba(255,71,87,0.5); }
        .toast.ok{ border-color:rgba(0,230,118,0.5); }

        /* --- 모바일 반응형 미디어 쿼리 --- */
        @media (max-width: 768px) {
            .game-window {
                width: 100%; height: 100vh;
                border: none; border-radius: 0;
            }

            /* 콘텐츠 영역 패딩 축소 */
            .content-area { padding: 15px; }

            /* 1. 폴더 게임: 2열 배치 */
            .folder-grid { grid-template-columns: 1fr 1fr; }

            /* 2. 대화창: 꽉 차게 */
            .char-avatar { width:64px; height:64px; font-size:1.2rem; }
            .dialogue-box { width: 100%; padding: 15px; }

            /* 3. 분개 화면: 상하 배치 */
            #screen-journal { flex-direction: column; overflow-y: auto; }
            .journal-left { flex: none; height: auto; max-height: 45%; }
            .journal-right { flex: 1; min-height: 250px; }
            .journal-problem-box { font-size: 1.02rem; padding: 10px; }
            .acc-card { padding: 11px 6px; font-size: 0.84rem; }
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes flash-highlight {
            0%, 100% { transform: scale(1); color: var(--neon-gold); }
            50% { transform: scale(1.3); color: #ff4757; text-shadow: 0 0 10px red; }
        }

        .blink-effect {
            animation: flash-highlight 0.5s infinite;
        }
    </style>
</head>
<body>

    <div class="game-window">
        <header>
            <div class="logo">
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M4 20V9l4 3 4-6 4 6 4-3v11"/></svg>
                <div>자본의 제왕
                    <span class="stage-tag">STAGE 3 · (주)미래전자 재무팀장</span>
                </div>
            </div>
            <div class="hud">
                <div class="hud-stat"><span class="hud-label">DAY</span><span class="hud-val" id="day-display">0</span></div>
                <div class="hud-stat"><span class="hud-label">평가</span><span class="hud-val" id="work-score">0</span></div>
                <div class="hud-stat"><span class="hud-label">주가</span><span class="hud-val" id="hud-price">10,000</span></div>
            </div>
            <button class="exit-btn" onclick="exitGame()" title="허브로 나가기">
                <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
        </header>

        <div class="content-area">

            <div id="screen-start" class="screen active">
                <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="var(--neon-gold)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:20px; filter:drop-shadow(0 0 12px rgba(255,215,0,0.5));"><path d="M3 20h18M4 20V9l4 3 4-6 4 6 4-3v11"/></svg>
                <h1 style="font-family: 'Jua'; font-size: 3rem; color: var(--neon-gold); margin: 0; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);">자본의 제왕</h1>
                <p style="color: #aaa; margin-top: 20px; font-size: 1rem; line-height: 1.5; padding: 0 20px;">
                    당신은 (주)미래전자의 재무팀장입니다.<br>
                    정확한 회계 처리로 회사를 성장시키세요.
                </p>
                <button class="btn-action start-btn" onclick="startGame()">업무 시작</button>
            </div>

            <div id="screen-class" class="screen">
                <h3 style="font-family:'Jua'; color:#888; margin-bottom: 20px; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
                    계정과목 분류하기
                </h3>
                <div id="class-word">단어</div>

                <div class="folder-grid">
                    <div class="folder" onclick="checkClass('capital')">
                        <div class="folder-tab" style="background:var(--folder-1)"></div>
                        <div class="folder-body" style="background:var(--folder-1)">자본금</div>
                    </div>
                    <div class="folder" onclick="checkClass('surplus')">
                        <div class="folder-tab" style="background:var(--folder-2)"></div>
                        <div class="folder-body" style="background:var(--folder-2)">자본잉여금</div>
                    </div>
                    <div class="folder" onclick="checkClass('adjust')">
                        <div class="folder-tab" style="background:var(--folder-3)"></div>
                        <div class="folder-body" style="background:var(--folder-3)">자본조정</div>
                    </div>
                    <div class="folder" onclick="checkClass('retained')">
                        <div class="folder-tab" style="background:var(--folder-4)"></div>
                        <div class="folder-body" style="background:var(--folder-4)">이익잉여금</div>
                    </div>
                </div>
            </div>

            <div id="screen-dialogue" class="screen" onclick="nextDialogue()">
                <div class="dialogue-wrapper">
                    <div class="char-img" id="char-face"></div>
                    <div class="dialogue-box">
                        <div class="char-name" id="char-name">사장님</div>
                        <div class="char-text" id="char-text"></div>
                        <div class="next-arrow">▼ 터치하여 계속</div>
                    </div>
                </div>
            </div>

            <div id="screen-journal" class="screen">
                <div class="journal-left">
                    <div id="journal-problem-desc" class="journal-problem-box">문제 내용</div>

                    <div class="account-pool" id="account-pool">
                        </div>
                </div>

                <div class="journal-right">
                    <div class="journal-board">
                        <div class="j-col" style="border-color:#d63031;">
                            <div class="j-header" style="color:#ff7675">차변</div>
                            <div class="j-items" id="list-dr"></div>
                        </div>
                        <div class="j-col" style="border-color:#0984e3;">
                            <div class="j-header" style="color:#74b9ff">대변</div>
                            <div class="j-items" id="list-cr"></div>
                        </div>
                    </div>
                    <button class="btn-action" style="background:var(--neon-gold); color:black; padding:15px; font-weight:bold; flex-shrink:0;" onclick="submitJournal()">결재 상신</button>
                </div>
            </div>

            <div id="screen-ending" class="screen" style="justify-content:center; align-items:center; text-align:center;">
                <h1 style="color:var(--neon-gold); font-size:2.5rem; margin-bottom:20px;">최종 보고서</h1>
                <div style="background:#2a2a35; padding:30px; border-radius:20px; width:90%; max-width:500px;">
                    <p style="font-size:1rem; color:#aaa;">(주)미래전자 2024 회계연도</p>
                    <hr style="border-color:#444; margin:15px 0;">
                    <p style="font-size:1.2rem; margin:10px 0;">최종 직급<br><span id="end-rank" style="font-weight:bold; color:white; font-size:1.5rem;"></span></p>
                    <p style="font-size:1.2rem; margin:10px 0;">최종 주가<br><span id="end-asset" style="color:var(--neon-gold); font-weight:bold; font-size:1.5rem;"></span></p>
                    <p style="font-size:1.2rem; margin:10px 0;">업무 평가<br><span id="end-score" style="font-weight:bold; font-size:1.5rem;"></span>점</p>
                </div>
                <div style="display:flex; gap:12px; margin-top:30px;">
                    <button class="btn-action" style="background:#555; padding:15px 30px;" onclick="location.reload()">처음부터 다시</button>
                    <button class="btn-action" style="background:var(--neon-gold); color:#000; padding:15px 30px;" onclick="location.href='index_lv1.html'">허브로 돌아가기</button>
                </div>
            </div>

        </div>

        <div id="popup" class="popup">
            <h2 id="popup-title" style="margin-top:0; color:var(--neon-gold); font-size:1.8rem;">결과</h2>
            <div id="popup-msg" style="line-height:1.5; font-size: 1rem; margin: 20px 0; color:#ddd; text-align:left;"></div>
            <button class="btn-action" style="padding:12px 30px; background: var(--neon-gold); color: black; font-weight: bold; width:100%;" onclick="closePopup()">확인</button>
        </div>

        <div class="toast-wrap" id="toast-wrap"></div>

    </div>

    <script>
        // --- 🔊 사운드 엔진 ---
        const Sound = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone: function(freq, type, duration, vol=0.1) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playClick: function() { this.playTone(800, 'sine', 0.1, 0.1); },
            playType: function() { this.playTone(600, 'square', 0.05, 0.03); },
            playSuccess: function() {
                setTimeout(() => this.playTone(523.25, 'sine', 0.2), 0);
                setTimeout(() => this.playTone(659.25, 'sine', 0.2), 100);
                setTimeout(() => this.playTone(783.99, 'sine', 0.4), 200);
            },
            playFail: function() {
                this.playTone(150, 'sawtooth', 0.4, 0.2);
            },
            playCash: function() {
                this.playTone(1200, 'square', 0.1, 0.1);
                setTimeout(() => this.playTone(2000, 'sine', 0.4, 0.1), 50);
            }
        };

        // --- 🔔 토스트(네이티브 alert 대체) ---
        function showToast(msg, kind){
            const wrap = document.getElementById('toast-wrap');
            const el = document.createElement('div');
            el.className = 'toast' + (kind ? ' '+kind : '');
            el.textContent = msg;
            wrap.appendChild(el);
            requestAnimationFrame(()=>el.classList.add('show'));
            setTimeout(()=>{
                el.classList.remove('show');
                setTimeout(()=>el.remove(), 250);
            }, 1600);
        }

        // --- 데이터 ---
        const scenarioPool = [
            {
                id: 1,
                title: "자본금 확충 (할증발행)",
                dialogue: [
                    { char: "boss", text: "나팀장! 우리 회사 요즘 잘나가지? 주가가 1만원이 넘었어!" },
                    { char: "me", text: "네, 시장 반응이 뜨겁습니다. 이참에 투자를 받을까요?" },
                    { char: "boss", text: "좋아! 1만 2천원에 신주를 발행해! 비싸게 자금을 당겨오자고." },
                ],

        // 들어갈지 정해지는 구조였음 — 화면에 안 보이는 상태를 기억해야 해서, 모드
        // 전환을 깜빡하고 누르면 반대쪽에 조용히 들어가는 문제가 있었음. 계정과목

        // 명시적으로 고르도록 변경(전수조사 결과 반영).
        let journalOpts = [];
        function showJournalScreen() {
            const scene = state.gameList[state.day];
            showScreen('screen-journal');

            document.getElementById('journal-problem-desc').innerText = "[문제] " + scene.desc;

        function renderAccountPool() {
            const poolEl = document.getElementById('account-pool');
            poolEl.innerHTML = '';
            const placed = new Set([...state.userJournal.dr, ...state.userJournal.cr]);
            journalOpts.forEach(opt => {
                if (placed.has(opt)) return; // 이미 배치된 계정과목은 풀에서 숨김
                const card = document.createElement('div');
                card.className = 'acc-card';
                card.textContent = opt;
                bindAccountDrag(card, opt);
                poolEl.appendChild(card);
            });
        }

        // --- 계정과목 카드를 손가락/마우스로 끌어다 차변·대변 칸에 놓는 드래그 앤 드롭 ---
        function drCol(){ return document.getElementById('list-dr').closest('.j-col'); }
        function crCol(){ return document.getElementById('list-cr').closest('.j-col'); }
        function zoneAtPoint(x, y){
            const d = drCol().getBoundingClientRect();
            if (x>=d.left && x<=d.right && y>=d.top && y<=d.bottom) return 'dr';
            const c = crCol().getBoundingClientRect();
            if (x>=c.left && x<=c.right && y>=c.top && y<=c.bottom) return 'cr';
            return null;
        }
        function setDropHover(zone){
            drCol().classList.toggle('drop-hover', zone==='dr');
            crCol().classList.toggle('drop-hover', zone==='cr');
        }
        function bindAccountDrag(card, accName){
            let ghost = null;
            function onDown(e){
                e.preventDefault();
                card.setPointerCapture(e.pointerId);
                card.classList.add('dragging');
                ghost = document.createElement('div');
                ghost.className = 'acc-ghost';
                ghost.textContent = accName;
                document.body.appendChild(ghost);
                placeGhost(e.clientX, e.clientY);
                card.addEventListener('pointermove', onMove);
                card.addEventListener('pointerup', onUp);
                card.addEventListener('pointercancel', onUp);
            }
            function placeGhost(x, y){ ghost.style.left = x+'px'; ghost.style.top = y+'px'; }
            function onMove(e){
                placeGhost(e.clientX, e.clientY);
                setDropHover(zoneAtPoint(e.clientX, e.clientY));
            }
            function onUp(e){
                card.removeEventListener('pointermove', onMove);
                card.removeEventListener('pointerup', onUp);
                card.removeEventListener('pointercancel', onUp);
                card.classList.remove('dragging');
                setDropHover(null);
                if (ghost) { ghost.remove(); ghost = null; }
                const zone = zoneAtPoint(e.clientX, e.clientY);
                if (zone) addAccount(accName, zone);
            }
            card.addEventListener('pointerdown', onDown);
        }

        function addAccount(accName, mode) {
            Sound.playClick();
            const targetList = state.userJournal[mode];
            if (!targetList.includes(accName)) {
                targetList.push(accName);
                updateJournalUI();
                renderAccountPool();
            }
        }

        function removeAccount(mode, idx) {
            Sound.playClick();
            state.userJournal[mode].splice(idx, 1);
            updateJournalUI();
            renderAccountPool();

        function updateJournalUI() {
            const drListEl = document.getElementById('list-dr');
            const crListEl = document.getElementById('list-cr');

            drListEl.innerHTML = '';
            crListEl.innerHTML = '';

            state.userJournal.dr.forEach((item, idx) => {
                drListEl.innerHTML += `<div class="j-item-tag" onclick="removeAccount('dr', ${idx})">${item} <span>✕</span></div>`;
            });
            state.userJournal.cr.forEach((item, idx) => {
                crListEl.innerHTML += `<div class="j-item-tag" onclick="removeAccount('cr', ${idx})">${item} <span>✕</span></div>`;
            });
        }

        function submitJournal() {
            const scene = state.gameList[state.day];
            const u = state.userJournal;
            const a = scene.answer;

            if (u.dr.length === 0 || u.cr.length === 0) {
                Sound.playFail();
                return showToast('차변과 대변을 모두 채워주세요.', 'err');
            }

            const uDrStr = JSON.stringify(u.dr.sort());
            const aDrStr = JSON.stringify(a.dr.sort());
            const uCrStr = JSON.stringify(u.cr.sort());
            const aCrStr = JSON.stringify(a.cr.sort());

            const isCorrect = (uDrStr === aDrStr && uCrStr === aCrStr);

            if (isCorrect) {
                state.score += 20;
                state.journalCorrect++;
                Sound.playSuccess();
            } else {
                Sound.playFail();
            }

            showResult(isCorrect);
        }

        // --- 결과 ---

        function showResult(isCorrect) {
            const scene = state.gameList[state.day];
            const oldPrice = state.stockPrice;

            // 오답일 경우 페널티 적용
            let finalEffect = isCorrect ? scene.effect : (scene.effect > 0 ? 0 : scene.effect * 1.2);

            state.stockPrice = Math.floor(oldPrice * (1 + finalEffect));
            state.day++;

            const title = isCorrect ? "결재 승인" : "결재 반려";
            const titleColor = isCorrect ? "var(--folder-4)" : "var(--up-color)";
            const color = finalEffect > 0 ? "var(--up-color)" : (finalEffect < 0 ? "var(--down-color)" : "white");
            const move = finalEffect > 0 ? "급등" : (finalEffect < 0 ? "하락" : "보합");

            let msg = isCorrect ? "완벽합니다! 업무 점수 +20" : "장부가 틀렸습니다...";

            if (!isCorrect) {
                msg += `<div style="background:#444; margin:15px 0; padding:15px; border-radius:10px; text-align:left;">
                            <div style="color:var(--neon-gold); font-size:0.9rem; margin-bottom:5px; font-weight:bold;">정답 (모범 답안)</div>
                            <div style="font-size:0.9rem;">[차변] ${scene.answer.dr.join(', ')}</div>
                            <div style="font-size:0.9rem;">[대변] ${scene.answer.cr.join(', ')}</div>
                        </div>`;
            }

            msg += "<hr style='border-color:#444; margin:20px 0;'>";
            msg += `시장 반응: <span style="color:${color}; font-weight:bold;">${move}</span> (${(finalEffect*100).toFixed(1)}%)<br>`;
            msg += `주가: ${formatNum(oldPrice)} -> ${formatNum(state.stockPrice)}`;

            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-title').style.color = titleColor;
            document.getElementById('popup-msg').innerHTML = msg;
            document.getElementById('popup').style.display = 'block';

            updateDash();
        }

        function closePopup() {
            Sound.playClick();
            document.getElementById('popup').style.display = 'none';
            startMainScenario();
        }

        // --- 엔딩 --- (등급은 gradeForCapitalScore()로 통일 — 아래 저장에 쓰는 등급과 화면에 보이는
        // 등급이 서로 다른 문구였던 걸 하나로 정리)
        function showEnding() {
            requestInterstitialIfNeeded(function(){
                Sound.playSuccess();
                showScreen('screen-ending');

                document.getElementById('end-score').innerText = state.score;
                document.getElementById('end-asset').innerText = formatNum(state.stockPrice) + "원";

                const rank = gradeForCapitalScore(state.score);
                document.getElementById('end-rank').innerText = rank;

                try{ saveStageScore(state.score, rank); }catch(e){}
            });
        }
    </script>

    <script>
        /* =========================================================================
         *  스테이지3 허브 연동 — stage1_cost.html의 P6 패턴과 동일:
         *  로컬 진행 저장(lv1_s3_progress, 허브 노드맵용) + Supabase(game_id:'capital_lv1')
         * ========================================================================= */
        const SUPA_URL='https://pjagaulfivafamhhiveg.supabase.co';
        const SUPA_KEY='sb_publishable_yck2tAKApEjVSJOJMVSXuQ_AGaNatuI';
        const GAME_ID='capital_lv1';
        const S3_SAVE_KEY='lv1_s3_progress';
        let _supaDb=null;
        function supaClient(){
          if(_supaDb) return _supaDb;
          try{ if(window.supabase && supabase.createClient) _supaDb=supabase.createClient(SUPA_URL, SUPA_KEY); }catch(e){}
          return _supaDb;
        }
        function gradeForCapitalScore(score){
          // 만점 150(분류 5×10 + 분개 5×20) 기준
          if(score>=140) return '👑 전설의 CFO';
          if(score>=110) return '🥇 우수';
          if(score>=70)  return '🥈 합격';
          return '🥉 재도전 권장';
        }
        async function saveStageScore(score, rank){
          try{
            localStorage.setItem(S3_SAVE_KEY, JSON.stringify({
              cleared:true, score, rank, finalStockPrice:state.stockPrice,
              classCorrect:state.classCorrect, journalCorrect:state.journalCorrect,
              playedAt:new Date().toISOString()
            }));
          }catch(e){}

          const name=(localStorage.getItem('hub_nickname')||'').trim();
          if(!name) return;                          // 로그인 안 된 상태(로컬 테스트 등)면 스킵
          const correct = state.classCorrect + state.journalCorrect;
          const grade = gradeForCapitalScore(score);
          const groupId = localStorage.getItem('hub_group_id') || null;
          const today = new Date().toISOString().split('T')[0];
          const rpcParams={ p_game_id:GAME_ID, p_name:name, p_score:score, p_grade:grade, p_combo:0, p_correct:correct, p_date:today };
          if(groupId) rpcParams.p_group_id=groupId;
          try{ if(window.Auth){ const uid=await Auth.currentUid(); if(uid) rpcParams.p_uid=uid; } }catch(e){}
          if(window.Growth) Growth.record({ game:GAME_ID, name, score, grade, combo:0, correct });
          const db=supaClient();
          if(!db) return;
          try{ const {error}=await db.rpc('upsert_score', rpcParams); if(error) console.warn('capital_lv1 점수 저장 실패:', error); }
          catch(e){ console.warn('capital_lv1 점수 저장 예외:', e); }
        }
    </script>

    <script>
        /* =========================================================================
         *  광고 시스템 — 2급 게임(game4_factory.html 등)과 동일 패턴.
         *  window.AdBridge 자체가 없어 항상 즉시 afterFn()으로 열린다(웹은 원래도 이랬음).
         * ========================================================================= */
        const AD_GAME_COUNT_KEY='hub_ad_game_count';
        const AD_INTERSTITIAL_EVERY=10; // N번마다 전면 광고
        function incrementGameCount(){
          const n=(parseInt(localStorage.getItem(AD_GAME_COUNT_KEY)||'0'))+1;
          localStorage.setItem(AD_GAME_COUNT_KEY, String(n));
          return n;
        }
        function requestInterstitialIfNeeded(afterFn){
          if(window.AdBridge && typeof AdBridge.isAdsRemoved==='function' && AdBridge.isAdsRemoved()){ afterFn&&afterFn(); return; }
          window._adAfterFn=afterFn;
          const count=incrementGameCount();
          if(count%AD_INTERSTITIAL_EVERY===0 && window.AdBridge){
            AdBridge.showInterstitial();
          } else {
            afterFn&&afterFn();
          }
        }
        function onAdsRemoved(){}
        function onInterstitialClosed(){ if(window._adAfterFn){ const f=window._adAfterFn; window._adAfterFn=null; f(); } }
        function hideAdPlaceholder(){ if(window.AdBridge) AdBridge.hide(); }
        function showAdPlaceholder(){ if(window.AdBridge) AdBridge.show(); }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="growth.js"></script>
</body>
